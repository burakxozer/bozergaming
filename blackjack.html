<meta charset="utf-8" />

<title>Blackjack Royale · Bözer Gaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
/* =====================================================================
   Bözer Royale — görünüm: zümrüt keçe, siyah ve altın, sıcak ışık
   ===================================================================== */
:root {
  --ink: #f4ecd8;
  --muted: #b9ae95;
  --line: rgba(216, 178, 93, .28);
  --line-2: rgba(216, 178, 93, .55);
  --gold: #d8b25d;
  --gold-hi: #f3d892;
  --gold-lo: #8a6420;
  --black: #050605;
  --panel: rgba(10, 11, 9, .9);
  --win: #74e3a6;
  --lose: #ff8f80;
  --push: #f3d892;
  --bb: #8cc8ff;
  --display: 'Cinzel', Georgia, serif;
  --ui: 'Manrope', 'Segoe UI', system-ui, sans-serif;
  /* ortak masa katmanı (bg-table.css) renkleri */
  --t-bg: #070807;
  --t-panel: rgba(255, 255, 255, .04);
  --t-panel-2: rgba(0, 0, 0, .45);
  --t-sheet: linear-gradient(180deg, #161511, #0b0b09);
  --t-line: rgba(216, 178, 93, .24);
  --t-line-2: rgba(216, 178, 93, .5);
  --t-text: #f4ecd8;
  --t-muted: #b9ae95;
  --t-accent: #d8b25d;
  --t-accent-hi: #f3d892;
  --t-primary: linear-gradient(180deg, #f6dd98, #c99a3d 55%, #9c7427);
  --t-primary-ink: #231505;
  --t-btn: linear-gradient(180deg, #23211b, #12110e);
  --t-font: var(--ui);
  --t-head: var(--display);
  --t-display: var(--display);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--black);
  color: var(--ink);
  font-family: var(--ui);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }

/* =====================================================================
   LOBİ
   ===================================================================== */
.bj-lobby {
  position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  background:
    radial-gradient(ellipse 70% 40% at 50% -6%, rgba(255, 214, 140, .14), transparent 70%),
    radial-gradient(ellipse 90% 60% at 50% 115%, rgba(16, 92, 60, .35), transparent 70%),
    var(--black);
}
.lb-head { max-width: 1180px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.lb-brand { display: flex; align-items: center; gap: 14px; }
.lb-mark {
  width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 20px;
  color: #1e1404; background: radial-gradient(circle at 35% 30%, #fff1c2, #d8b25d 45%, #8a6420); box-shadow: 0 0 0 3px #0b0b09, 0 0 0 4px rgba(216, 178, 93, .6), 0 10px 26px rgba(0, 0, 0, .6);
}
.lb-brand h1 { margin: 0; font-family: var(--display); font-size: clamp(24px, 3.4vw, 34px); letter-spacing: .06em; color: var(--gold-hi); }
.lb-brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.lb-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lb-bal { font-weight: 800; color: var(--gold-hi); padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: rgba(0, 0, 0, .35); }
.lb-econ { max-width: 1180px; margin: 0 auto 12px; }
.lb-econ:empty { display: none; }
.bj-lobby:has(.lb-econ .t-econ) .lb-bal { display: none; }
.lb-tiers { max-width: 1180px; margin: 0 auto 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.lb-tier { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .025); display: flex; flex-direction: column; gap: 2px; }
.lb-tier b { font-family: var(--display); letter-spacing: .08em; }
.lb-tier span { font-size: 13px; color: var(--muted); }
.lb-tier.bronze b { color: #e2a477; }
.lb-tier.silver b { color: #d9dee6; }
.lb-tier.gold b { color: var(--gold-hi); }
.lb-body { max-width: 1180px; margin: 0 auto; }
.lb-sec h2 { font-family: var(--display); font-size: 17px; letter-spacing: .1em; color: var(--gold); margin: 26px 0 10px; font-weight: 700; }
.lb-none, .lb-loading { color: var(--muted); margin: 6px 0; }
.lb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 14px; }
.lb-card {
  position: relative; padding: 14px 16px 14px; border-radius: 16px; overflow: hidden;
  background: linear-gradient(180deg, rgba(18, 74, 50, .55), rgba(8, 26, 18, .85) 46%, #0b0c0a);
  border: 1px solid var(--line); box-shadow: 0 14px 30px rgba(0, 0, 0, .45);
}
.lb-card::before { content: ''; position: absolute; inset: 0 0 auto; height: 3px; background: var(--tierc, var(--gold)); opacity: .85; }
.lb-card.bronze { --tierc: linear-gradient(90deg, #7a4a28, #e2a477, #7a4a28); }
.lb-card.silver { --tierc: linear-gradient(90deg, #6d727b, #e7ebf1, #6d727b); }
.lb-card.gold { --tierc: linear-gradient(90deg, #8a6420, #f3d892, #8a6420); }
.lbc-top { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.lbc-tier { font-family: var(--display); font-weight: 700; letter-spacing: .1em; color: var(--gold-hi); }
.lb-card.bronze .lbc-tier { color: #e2a477; }
.lb-card.silver .lbc-tier { color: #e2e6ec; }
.lbc-max { color: var(--muted); }
.lbc-priv { margin-left: auto; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.lb-card h3 { margin: 6px 0 2px; font-size: 19px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbc-owner { margin: 0; font-size: 13px; color: var(--muted); }
.lbc-pots { display: flex; gap: 5px; margin: 12px 0 8px; }
.lbc-pots i { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(216, 178, 93, .45); background: rgba(0, 0, 0, .25); }
.lbc-pots i.on { background: radial-gradient(circle at 35% 30%, #f3d892, #b88a35); border-color: #f3d892; box-shadow: 0 0 10px rgba(243, 216, 146, .35); }
.lbc-meta { display: grid; grid-template-columns: repeat(4, auto); gap: 2px 14px; margin: 0; justify-content: start; }
.lbc-meta div { display: flex; flex-direction: column; }
.lbc-meta dt { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.lbc-meta dd { margin: 0; font-weight: 800; }
.lbc-streak { display: flex; gap: 3px; align-items: center; height: 22px; }
.lbc-streak i { width: 8px; height: 8px; border-radius: 50%; background: rgba(216, 178, 93, .25); }
.lbc-streak i.on { background: var(--gold-hi); box-shadow: 0 0 6px var(--gold); }
.lbc-state { margin: 10px 0 12px; font-size: 13px; color: var(--ink); opacity: .85; min-height: 18px; }
.lbc-btns { display: flex; gap: 8px; align-items: center; }
.lbc-btns .t-btn { flex: 1; }
.lbc-nospec { font-size: 12px; color: var(--muted); flex: 1; text-align: center; }
.lbc-need { margin: 8px 0 0; font-size: 12px; color: var(--lose); }
.lb-empty { max-width: 460px; margin: 18vh auto 0; text-align: center; }
.lb-empty h1 { font-family: var(--display); color: var(--gold-hi); letter-spacing: .06em; }
.lb-empty p { color: var(--muted); line-height: 1.55; }
.tier-seg button { display: flex; flex-direction: column; gap: 1px; line-height: 1.2; }
.tier-seg small { font-size: 11px; opacity: .75; }
.sp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }

/* =====================================================================
   MASA EKRANI
   ===================================================================== */
.bj-view { position: fixed; inset: 0; display: flex; flex-direction: column; }
.bj-hud {
  position: relative; z-index: 6; flex: none; display: flex; align-items: center; gap: 10px; min-height: 52px;
  padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left));
  background: linear-gradient(180deg, rgba(5, 6, 5, .96), rgba(5, 6, 5, .78)); border-bottom: 1px solid var(--line);
}
.hud-btn {
  flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, .03);
  color: var(--gold-hi); font-size: 20px; line-height: 1; display: grid; place-items: center;
}
.hud-btn:hover { border-color: var(--line-2); background: rgba(216, 178, 93, .08); }
.hud-t { min-width: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.hud-t b { font-weight: 800; font-size: 15px; max-width: 26vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud-t small { color: var(--muted); font-size: 12px; }
.tier { font-family: var(--display); font-size: 11px; letter-spacing: .1em; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--gold-hi); white-space: nowrap; }
.tier.bronze { color: #e2a477; }
.tier.silver { color: #e2e6ec; }
.hud-jp { margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); background: rgba(0, 0, 0, .4); }
.hud-jp small { font-family: var(--display); font-size: 11px; letter-spacing: .14em; color: var(--gold); }
.hud-jp b { font-weight: 800; color: var(--gold-hi); font-size: 14px; }
.jp-dots { display: flex; gap: 4px; }
.jp-dots i { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(216, 178, 93, .5); background: rgba(0, 0, 0, .4); }
.jp-dots i.on { background: radial-gradient(circle at 35% 30%, #fff1c2, #d8b25d 60%, #8a6420); border-color: #fff1c2; box-shadow: 0 0 8px rgba(243, 216, 146, .6); }
.hud-r { display: flex; align-items: center; gap: 8px; }
.hud-bal { font-weight: 800; color: var(--gold-hi); white-space: nowrap; }
.hud-bal small { font-weight: 600; color: var(--muted); }
.hud-view { font-size: 13px; color: var(--muted); white-space: nowrap; }

.bj-scene {
  position: relative; flex: 1; min-height: 0; overflow: hidden;
  background:
    radial-gradient(ellipse 55% 50% at 50% 0%, rgba(255, 214, 140, .15), transparent 72%),
    radial-gradient(ellipse at 50% 120%, #0a1a12 0, #050605 62%);
}
.bj-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.bj-room { position: absolute; inset: 0 0 50% 0; pointer-events: none; opacity: .5;
  background:
    radial-gradient(circle at 12% 18%, rgba(255, 196, 110, .2) 0 16px, transparent 42px),
    radial-gradient(circle at 23% 7%, rgba(255, 222, 160, .12) 0 9px, transparent 26px),
    radial-gradient(circle at 81% 14%, rgba(255, 196, 110, .16) 0 15px, transparent 38px),
    radial-gradient(circle at 91% 5%, rgba(255, 222, 160, .1) 0 9px, transparent 24px),
    radial-gradient(circle at 66% 8%, rgba(255, 196, 110, .1) 0 7px, transparent 22px),
    radial-gradient(circle at 35% 12%, rgba(255, 196, 110, .1) 0 7px, transparent 20px); }
html[data-q='high'] .bj-room { filter: blur(2px); }
.bj-table, .bj-props, .bj-glow, .bj-spots, .bj-chiplayer, .bj-cardlayer, .bj-badges, .bj-center, .bj-fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.bj-props, .bj-glow, .bj-spots, .bj-chiplayer, .bj-cardlayer, .bj-badges, .bj-center, .bj-fx { pointer-events: none; }
.bj-spots > .seat > * { pointer-events: auto; }
.bj-dealer { position: absolute; z-index: 1; pointer-events: none; }
.bj-dealer .dl-svg { width: 100%; height: auto; display: block; overflow: visible; }
.bj-table { z-index: 2; pointer-events: none; }
.bj-props { z-index: 3; }
.bj-glow { z-index: 4; }
.bj-spots { z-index: 5; }
.bj-chiplayer { z-index: 6; }
.bj-cardlayer { z-index: 7; }
.bj-badges { z-index: 8; }
.bj-center { z-index: 10; }
.bj-fx { z-index: 11; }
.bj-stage { --cw: 80px; }

/* ---------------- kartlar ---------------- */
.cd { position: absolute; left: 0; top: 0; width: var(--cw); height: calc(var(--cw) * 1.4); transform-origin: 50% 50%; will-change: transform; perspective: 900px; }
.cd-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .42s cubic-bezier(.3, .7, .2, 1); }
.cd-f, .cd-b { position: absolute; inset: 0; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 7%; transition: filter .35s; }
html[data-q='high'] .cd-f, html[data-q='high'] .cd-b { filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .5)); }
html[data-q='mid'] .cd-f, html[data-q='mid'] .cd-b { box-shadow: 0 2px 5px rgba(0, 0, 0, .45); }
html[data-q='high'] .cd.flying .cd-f, html[data-q='high'] .cd.flying .cd-b { filter: drop-shadow(0 18px 14px rgba(0, 0, 0, .42)); }
.cd-b { transform: rotateY(180deg); }
.cd.down .cd-in { transform: rotateY(180deg); }
/* kaybeden / batan el: kartlar griye döner (referanstaki gibi) */
.cd.dim .cd-f { filter: grayscale(1) brightness(.58) contrast(.92); }
html[data-q='high'] .cd.dim .cd-f { filter: grayscale(1) brightness(.58) contrast(.92) drop-shadow(0 3px 4px rgba(0, 0, 0, .5)); }
.cd.reveal { animation: bjReveal .7s cubic-bezier(.3, .8, .3, 1); }
html[data-q='high'] .cd.reveal .cd-f { filter: drop-shadow(0 0 16px rgba(255, 220, 140, .85)); }
.cd.cutcard { z-index: 30; }
@keyframes bjReveal { 0% { scale: 1; } 38% { scale: 1.16; } 100% { scale: 1; } }

/* ---------------- fişler ---------------- */
.bj-stack { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
.bj-stack .chips { position: absolute; left: -24px; top: -24px; width: 48px; height: 48px; }
.chip { position: absolute; left: 0; top: 0; width: 48px; height: 48px; transform: translateY(calc(var(--i) * -4px)); }
html[data-q='high'] .chip { filter: drop-shadow(0 2px 1px rgba(0, 0, 0, .55)); }
.bj-stack.sm .chips { left: -18px; top: -18px; }
.bj-stack.sm .chips, .bj-stack.sm .chip { width: 36px; height: 36px; }
.bj-stack.sm .chip { transform: translateY(calc(var(--i) * -3px)); }
.stv { position: absolute; left: 0; top: 26px; transform: translateX(-50%); font-size: 15px; font-weight: 800; color: var(--gold-hi); text-shadow: 0 1px 3px #000, 0 0 8px #000; white-space: nowrap; }
.bj-stack.sm .stv { top: 20px; font-size: 12px; }
.bj-stack.pending .chips { opacity: .62; }
.bj-stack.pending::before { content: ''; position: absolute; left: -32px; top: -32px; width: 64px; height: 64px; border-radius: 50%; border: 1.5px dashed rgba(243, 216, 146, .75); animation: bjSpin 6s linear infinite; }
.bj-stack.bbst { cursor: pointer; }
.bj-stack.bbst .chips { pointer-events: auto; }
.bj-stack.bbst .chips::after { content: 'BB'; position: absolute; left: 50%; top: -14px; transform: translateX(-50%); font-size: 10px; font-weight: 900; letter-spacing: .08em; color: #06223c; background: var(--bb); padding: 0 5px; border-radius: 99px; }
.bj-stack.bbst .stv { color: var(--bb); }
.bj-stack.ins .stv { color: #e6d3ff; }
.bj-stack.ins .chips::after { content: 'SİG.'; position: absolute; left: 50%; top: -14px; transform: translateX(-50%); font-size: 9px; font-weight: 900; color: #2b1640; background: #e6d3ff; padding: 0 5px; border-radius: 99px; }
.bj-stack.pay .stv { color: var(--win); }

/* ---------------- masa nesneleri ---------------- */
.bj-shoe { position: absolute; width: 150px; height: 64px; transform: translate(-50%, -50%) rotate(-8deg); }
.shoe-body { position: absolute; inset: 0; border-radius: 10px 22px 22px 10px;
  background: linear-gradient(180deg, #2e2620, #120d0a 60%, #231a14); box-shadow: 0 10px 18px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .12); }
.shoe-stack { position: absolute; left: 22px; right: 26px; top: 10px; bottom: 10px; border-radius: 3px; transition: right .5s;
  background: repeating-linear-gradient(90deg, #f3ecdc 0 2px, #cfc5ae 2px 3px); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3); }
.shoe-cut { position: absolute; top: 7px; bottom: 7px; width: 4px; left: 40%; border-radius: 2px; background: #ef4a2a; box-shadow: 0 0 6px rgba(255, 90, 50, .6); transition: left .5s; }
.shoe-mouth { position: absolute; left: -2px; top: 6px; bottom: 6px; width: 16px; border-radius: 8px 3px 3px 8px; background: linear-gradient(90deg, #0b0806, #3a2c22); }
.shoe-count { position: absolute; left: 50%; top: 100%; margin-top: 6px; transform: translateX(-50%) rotate(8deg); font-size: 13px; color: var(--muted); white-space: nowrap; letter-spacing: .04em; }
.bj-discard { position: absolute; width: 112px; height: 62px; transform: translate(-50%, -50%) rotate(6deg); }
.disc-tray { position: absolute; inset: 0; border-radius: 8px; background: linear-gradient(180deg, rgba(20, 16, 12, .85), rgba(6, 5, 4, .9));
  box-shadow: 0 8px 14px rgba(0, 0, 0, .55), inset 0 0 0 2px rgba(216, 178, 93, .35); }
.disc-stack { position: absolute; left: 14px; right: 14px; bottom: 10px; border-radius: 3px; height: 4px;
  background: repeating-linear-gradient(180deg, #e9e1cd 0 2px, #b9ae95 2px 3px); box-shadow: 0 -1px 0 rgba(0, 0, 0, .4); transition: height .4s; }
.bj-tray { position: absolute; width: 300px; height: 40px; transform: translate(-50%, -50%); display: flex; gap: 2px; padding: 5px 8px;
  border-radius: 8px; background: linear-gradient(180deg, #1b1410, #0c0907); box-shadow: inset 0 2px 6px rgba(0, 0, 0, .7), 0 1px 0 rgba(216, 178, 93, .35); }
.bj-tray i { flex: 1; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--c) 0 5px, rgba(255, 255, 255, .55) 5px 6px, var(--c) 6px 11px);
  box-shadow: inset 0 -6px 8px rgba(0, 0, 0, .45); }

/* ---------------- koltuklar ---------------- */
.seat { position: absolute; left: 0; top: 0; }
.seat-no { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-size: 18px; color: rgba(216, 178, 93, .45); }
.seat-sit {
  position: absolute; transform: translate(-50%, -50%); width: 92px; height: 92px; border-radius: 50%; border: 1.5px solid rgba(243, 216, 146, .75);
  background: radial-gradient(circle, rgba(243, 216, 146, .18), rgba(6, 30, 20, .3) 70%); color: var(--gold-hi);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; transition: transform .15s, box-shadow .2s, background .2s;
}
.seat-sit b { font-weight: 800; letter-spacing: .16em; font-size: 15px; }
.seat-sit small { font-family: var(--display); font-size: 11px; letter-spacing: .12em; opacity: .7; }
.seat-sit:hover { transform: translate(-50%, -50%) scale(1.06); box-shadow: 0 0 26px rgba(243, 216, 146, .35); background: radial-gradient(circle, rgba(243, 216, 146, .28), rgba(6, 30, 20, .3) 70%); }
.seat-hit {
  position: absolute; transform: translate(-50%, -50%); width: 108px; height: 108px; border-radius: 50%; border: 1.5px dashed transparent; background: transparent;
  display: grid; place-items: center; transition: border-color .2s, background .2s;
}
.seat-hit span { position: absolute; top: 100%; margin-top: -6px; font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--gold-hi); text-shadow: 0 1px 3px #000; white-space: nowrap; }
.seat-hit.mine { border-color: rgba(243, 216, 146, .8); background: radial-gradient(circle, rgba(243, 216, 146, .14), transparent 70%); animation: bjPulse 1.8s ease-in-out infinite; }
.seat-hit.bbt { border-color: rgba(140, 200, 255, .5); }
.seat-hit.bbt span { color: var(--bb); }
.seat-hit:hover { background: radial-gradient(circle, rgba(243, 216, 146, .22), transparent 70%); }
.seat-plate { position: absolute; display: flex; align-items: center; gap: 8px; transform: translate(-50%, -50%); white-space: nowrap; }
.seat-plate.rev { flex-direction: row-reverse; transform: translate(calc(-100% + 29px), -50%); }
.seat-plate.rev .seat-who { align-items: flex-end; text-align: right; }
.seat-av { position: relative; width: 58px; height: 58px; padding: 0; border-radius: 50%; border: 0; background: none; box-shadow: 0 8px 16px rgba(0, 0, 0, .6); display: grid; place-items: center; }
.seat-av .t-av { --s: 56px !important; }
.seat-av .ring { position: absolute; inset: -8px; width: 74px; height: 74px; transform: rotate(-90deg); pointer-events: none; }
.seat-av .ring circle { fill: none; stroke: var(--gold-hi); stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 176; stroke-dashoffset: 0; filter: drop-shadow(0 0 5px rgba(243, 216, 146, .9)); }
.seat-pn { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); font: 800 10px/1.35 var(--ui); letter-spacing: .08em; padding: 0 6px; border-radius: 99px; background: #0b0c09; color: var(--gold-hi); border: 1px solid rgba(216, 178, 93, .6); }
.seat-plate.mine .seat-pn { background: var(--gold-hi); color: #1d1404; }
.seat-plate.turn .seat-av { box-shadow: 0 0 0 3px rgba(243, 216, 146, .3), 0 0 30px rgba(243, 216, 146, .75); }
.seat-plate.off { opacity: .55; }
.seat-who { display: flex; flex-direction: column; line-height: 1.18; padding: 4px 10px 5px 9px; border-radius: 10px; background: rgba(3, 9, 6, .6); text-shadow: 0 1px 3px #000; }
.seat-name { font-weight: 800; font-size: 16px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
.seat-name em { font-style: normal; font-size: 10px; letter-spacing: .1em; color: #1d1404; background: var(--gold-hi); padding: 0 5px; border-radius: 4px; margin-left: 4px; vertical-align: 2px; }
.seat-sub { font-size: 12.5px; color: var(--muted); }

.auto-dot { font-style: normal; margin-left: 5px; color: #6be39c; text-shadow: 0 0 8px rgba(80, 220, 140, .8); }
.seat-kalk { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; padding: 4px 8px; border-radius: 99px; border: 1px solid var(--line); background: rgba(0, 0, 0, .55); color: var(--muted); }
.seat-kalk:hover { color: var(--ink); border-color: var(--line-2); }

/* ---------------- sıra vurgusu ve el parıltıları ---------------- */
.hand-glow { position: absolute; transform: translate(-50%, -50%); border-radius: 46%; background: radial-gradient(closest-side, rgba(255, 220, 130, .78), rgba(255, 190, 70, .34) 55%, rgba(255, 170, 40, 0) 100%); animation: bjGlow 1.6s ease-in-out infinite; }
.hand-glow.mine { background: radial-gradient(closest-side, rgba(255, 236, 160, .95), rgba(255, 200, 80, .45) 55%, rgba(255, 170, 40, 0) 100%); }
.spot-hl { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 3px solid #ffd77a; box-shadow: 0 0 18px 4px rgba(255, 205, 110, .6), inset 0 0 16px rgba(255, 205, 110, .45); animation: bjRingPulse 1.4s ease-in-out infinite; }
.hand-flash { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; }
.hand-flash.bust { background: radial-gradient(closest-side, rgba(255, 70, 50, .65), rgba(255, 70, 50, .15) 60%, transparent); }
.hand-flash.bj { background: radial-gradient(closest-side, rgba(255, 232, 150, .85), rgba(255, 200, 90, .25) 60%, transparent); }
.turn-arrow { position: absolute; width: 0; height: 0; transform: translate(-50%, -100%); border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 18px solid #ffd77a; filter: drop-shadow(0 0 8px rgba(255, 210, 110, .9)); animation: bjBob .9s ease-in-out infinite; }
@keyframes bjGlow { 0%, 100% { opacity: .7; scale: .96; } 50% { opacity: 1; scale: 1.04; } }
@keyframes bjRingPulse { 0%, 100% { opacity: .75; scale: .97; } 50% { opacity: 1; scale: 1.04; } }
@keyframes bjBob { 0%, 100% { translate: 0 -6px; } 50% { translate: 0 2px; } }

/* ---------------- rozetler: el toplamı, sonuç etiketi, ön hamle ---------------- */
.tot {
  position: absolute; transform: translate(-50%, -50%); min-width: 40px; height: 40px; padding: 0 9px; border-radius: 99px; display: grid; place-items: center;
  font: 800 20px/1 var(--ui); color: #fff; background: radial-gradient(circle at 35% 30%, #34342f, #060606 72%); border: 2px solid rgba(243, 216, 146, .85);
  box-shadow: 0 6px 14px rgba(0, 0, 0, .55); white-space: nowrap; font-variant-numeric: tabular-nums; animation: bjPopIn .3s cubic-bezier(.2, 1.4, .4, 1) both;
}
.tot.soft { font-size: 17px; }
.tot.bj { background: linear-gradient(180deg, #fff1c4, #dcaa42 60%, #a8781f); color: #2a1a04; border-color: #fff6d8; }
.tot.bust { background: linear-gradient(180deg, #e2402f, #7d0f0a); border-color: #ffb3a6; }
.tot.turn { box-shadow: 0 0 0 3px rgba(255, 215, 122, .4), 0 0 22px rgba(255, 215, 122, .85); }
.tot.dl { font-size: 21px; }
.pretag { position: absolute; transform: translate(-50%, -100%); font-size: 11px; font-weight: 800; letter-spacing: .08em; padding: 3px 9px; border-radius: 99px; white-space: nowrap;
  color: #1f1604; background: linear-gradient(180deg, #f3d892, #c99a3d); box-shadow: 0 4px 12px rgba(0, 0, 0, .5); }
.res {
  position: absolute; transform: translate(-50%, -50%) rotate(-4deg); display: flex; flex-direction: column; align-items: center; padding: 4px 14px 5px; border-radius: 10px;
  font-family: var(--display); font-weight: 800; letter-spacing: .06em; white-space: nowrap; box-shadow: 0 10px 22px rgba(0, 0, 0, .55); animation: bjStamp .5s cubic-bezier(.2, 1.5, .4, 1) both;
}
.res b { font-size: 17px; line-height: 1.1; }
.res em { font: 800 14px/1.1 var(--ui); font-style: normal; }
.res.win { background: linear-gradient(180deg, #3fd380, #12854a); color: #fff; border: 2px solid #c2ffdc; }
.res.bj { background: linear-gradient(180deg, #fff2c0, #e1ae47 55%, #a87828); color: #2a1a04; border: 2px solid #fff6dc; }
.res.push { background: linear-gradient(180deg, #dfe4ea, #8d97a5); color: #14181f; border: 2px solid #f4f7fb; }
.res.lose { background: linear-gradient(180deg, #d63d2e, #7c120c); color: #fff; border: 2px solid #ffb8ad; }
.netall { position: absolute; transform: translate(-50%, -50%); font-weight: 800; font-size: 13px; padding: 2px 9px; border-radius: 99px; background: rgba(0, 0, 0, .72); white-space: nowrap; }
.netall.win { color: var(--win); }
.netall.lose { color: var(--lose); }
@keyframes bjStamp { from { opacity: 0; transform: translate(-50%, -50%) rotate(-4deg) scale(1.9); } to { opacity: 1; transform: translate(-50%, -50%) rotate(-4deg) scale(1); } }
@keyframes bjPopIn { from { opacity: 0; scale: .5; } to { opacity: 1; scale: 1; } }

/* ---------------- krupiye mesaj kartı ---------------- */
.bj-center { width: 100%; }
.dmsg {
  position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 14px; width: max-content; max-width: 600px; padding: 10px 16px 10px 10px; border-radius: 20px;
  background: linear-gradient(180deg, rgba(16, 18, 14, .95), rgba(5, 6, 5, .95)); border: 1px solid rgba(216, 178, 93, .55);
  box-shadow: 0 16px 40px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .06); text-align: left;
}
.dmsg-av { flex: none; width: 62px; height: 62px; border-radius: 50%; overflow: hidden; border: 2px solid var(--gold); background: radial-gradient(circle at 50% 30%, #3a4a3e, #0b130e 75%); box-shadow: 0 0 0 3px rgba(0, 0, 0, .45); }
.dmsg-av svg { display: block; width: 100%; height: 100%; }
.dmsg-t { min-width: 0; }
.dmsg-t small { display: block; font-size: 11.5px; font-weight: 800; color: var(--gold); letter-spacing: .04em; }
.dmsg-t strong { display: block; font-family: var(--display); font-size: 20px; line-height: 1.2; color: var(--gold-hi); }
.dmsg-t span { display: block; margin-top: 2px; font-size: 14px; line-height: 1.4; color: var(--muted); }
.dmsg-time { position: relative; flex: none; width: 54px; height: 54px; }
.dmsg-time svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dmsg-time circle { fill: none; stroke-width: 4; }
.dmsg-time .bg { stroke: rgba(255, 255, 255, .1); }
.dmsg-time .fg { stroke: var(--gold-hi); stroke-dasharray: 119.4; stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s; }
.dmsg-time b { position: absolute; inset: 0; display: grid; place-items: center; font: 800 22px var(--ui); color: #fff; font-variant-numeric: tabular-nums; }
.dmsg-time.urgent .fg { stroke: #ff6b55; }
.dmsg-time.urgent b { color: #ffd2c8; }
.dmsg.bubble { transform: translate(0, -50%); }
.dmsg.bubble::before { content: ''; position: absolute; left: -9px; top: 50%; width: 16px; height: 16px; margin-top: -8px; transform: rotate(45deg); background: #0f110d; border-left: 1px solid rgba(216, 178, 93, .55); border-bottom: 1px solid rgba(216, 178, 93, .55); }
.dmsg.hero { padding: 14px 22px 14px 14px; gap: 18px; }
.dmsg.hero .dmsg-av { width: 82px; height: 82px; }
.dmsg.hero .dmsg-t strong { font-size: 26px; }
.dmsg.hero .dmsg-time { width: 74px; height: 74px; }
.dmsg.hero .dmsg-time b { font-size: 32px; }
.dmsg.t-wait .dmsg-t strong { font-family: var(--ui); font-weight: 800; font-size: 19px; color: var(--ink); }
.dmsg.t-me { border-color: #ffd77a; box-shadow: 0 0 0 2px rgba(255, 215, 122, .25), 0 0 34px rgba(255, 215, 122, .35), 0 16px 40px rgba(0, 0, 0, .55); }
.dmsg.t-good .dmsg-t strong { color: #8ff0b6; }

/* ---------------- sonuç şeridi ---------------- */
.res-panel {
  position: absolute; left: 50%; top: 520px; transform: translate(-50%, -50%); min-width: 320px; padding: 12px 36px 14px; border-radius: 18px; text-align: center;
  background: radial-gradient(ellipse at 50% 0%, rgba(243, 216, 146, .22), transparent 70%), linear-gradient(180deg, rgba(14, 16, 12, .94), rgba(4, 5, 4, .94)); border: 1px solid var(--line-2);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .6); animation: bjPop .5s cubic-bezier(.2, 1.3, .4, 1) both;
}
.bj-stage[data-layout='port'] .res-panel { top: 560px; min-width: 420px; }
.bj-stage[data-layout='port'] .res-panel strong { font-size: 50px; }
.bj-stage[data-layout='port'] .res-panel b { font-size: 32px; }
.res-panel strong { display: block; font-family: var(--display); font-size: 40px; letter-spacing: .08em; line-height: 1.05; }
.res-panel b { display: block; margin-top: 4px; font-size: 26px; }
.res-panel small { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }
.res-panel.win strong, .res-panel.blackjack strong { background: linear-gradient(180deg, #fff3cc, #e3bc62 55%, #a97e2c); -webkit-background-clip: text; background-clip: text; color: transparent; }
.res-panel.win b, .res-panel.blackjack b { color: var(--win); }
.res-panel.lose strong, .res-panel.surrender strong { color: #e6d9c4; }

.res-panel.push strong, .res-panel.refund strong { color: var(--push); font-size: 32px; }
.res-panel.out { animation: bjFadeOut .4s ease forwards; }

/* ---------------- bantlar, parçacıklar, uçan yazılar ---------------- */
.banner { position: absolute; transform: translate(-50%, -50%) rotate(-2deg); text-align: center; z-index: 5; animation: bjBanner .6s cubic-bezier(.2, 1.4, .4, 1) both; }
.banner strong {
  position: relative; display: block; font-family: var(--display); font-weight: 800; font-size: 66px; letter-spacing: .04em; line-height: 1; white-space: nowrap;
  background: linear-gradient(180deg, #fff7d1 0%, #ffd36a 36%, #ff8a1f 62%, #c2260f 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #4a0d04) drop-shadow(0 0 20px rgba(255, 140, 40, .7));
}
.banner small { position: relative; display: inline-block; margin-top: 10px; padding: 4px 14px; border-radius: 99px; font: 800 15px var(--ui); color: #ffe9b8; background: rgba(40, 8, 4, .8); border: 1px solid rgba(255, 160, 80, .5); }
.banner .bn-rays { position: absolute; left: 50%; top: 50%; width: 560px; height: 560px; margin: -280px 0 0 -280px; background: repeating-conic-gradient(from 0deg, rgba(255, 190, 80, .22) 0 8deg, transparent 8deg 20deg);
  -webkit-mask: radial-gradient(circle, #000 0, transparent 62%); mask: radial-gradient(circle, #000 0, transparent 62%); animation: bjSpin 9s linear infinite; }
.banner.bj strong { font-size: 56px; background: linear-gradient(180deg, #fffbe6, #f6d77d 45%, #c99236 75%, #8a5a14); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 3px 0 #3a2404) drop-shadow(0 0 22px rgba(255, 214, 110, .8)); }
.banner.bj small { color: #2a1a04; background: linear-gradient(180deg, #fff1c4, #dcaa42); border-color: #fff6d8; }
.banner.dbj strong { font-size: 52px; background: linear-gradient(180deg, #ffffff, #c9d3e6 50%, #7d899f); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 3px 0 #1a2030) drop-shadow(0 0 18px rgba(170, 190, 230, .6)); }
.banner.dbj small { color: #e6ecf8; background: rgba(12, 16, 26, .85); border-color: rgba(170, 190, 230, .5); }
.banner.dbj .bn-rays { background: repeating-conic-gradient(from 0deg, rgba(180, 200, 240, .16) 0 8deg, transparent 8deg 20deg); }
.banner.out { animation: bjFadeOut .4s ease forwards; }
@keyframes bjBanner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.3) rotate(-8deg); } 60% { opacity: 1; transform: translate(-50%, -50%) scale(.94) rotate(0deg); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-2deg); } }
.pt { position: absolute; width: 12px; height: 12px; border-radius: 50%; }
.pt.spark { width: 15px; height: 15px; background: radial-gradient(circle, #fff 0 18%, #ffe08a 42%, rgba(255, 190, 60, 0) 70%); }
.pt.coin { width: 17px; height: 17px; background: radial-gradient(circle at 35% 30%, #fff6c8, #e6b748 45%, #9c6c1c); box-shadow: inset 0 0 0 2px rgba(120, 80, 20, .5); }
.pt.ember { width: 14px; height: 14px; background: radial-gradient(circle, #fff3c4 0 15%, #ff9b2e 45%, rgba(220, 40, 10, 0) 72%); }
.fx-float { position: absolute; font: 900 30px var(--ui); color: #8ff0b6; text-shadow: 0 2px 0 #08311a, 0 0 14px rgba(80, 230, 150, .6); white-space: nowrap; }

/* ---------------- jackpot ---------------- */
.jp-wrap { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: auto; }
.jp-rays { position: absolute; inset: -20%; background: repeating-conic-gradient(from 0deg at 50% 45%, rgba(255, 220, 140, .14) 0 6deg, transparent 6deg 18deg); animation: bjSpin 18s linear infinite;
  -webkit-mask: radial-gradient(circle at 50% 45%, #000 0, transparent 60%); mask: radial-gradient(circle at 50% 45%, #000 0, transparent 60%); }
.jp-confetti { position: absolute; inset: 0; width: 100%; height: 100%; }
.jp-card { position: relative; min-width: 460px; max-width: 760px; padding: 22px 30px; border-radius: 22px; text-align: center; background: linear-gradient(180deg, rgba(30, 22, 8, .95), rgba(8, 7, 5, .96));
  border: 2px solid var(--gold); box-shadow: 0 0 0 6px rgba(0, 0, 0, .5), 0 0 80px rgba(243, 216, 146, .45); animation: bjPop .7s cubic-bezier(.2, 1.3, .4, 1) both; }
.jp-card small { font-size: 13px; letter-spacing: .2em; color: var(--gold); font-weight: 800; }
.jp-card h2 { margin: 6px 0 10px; font-family: var(--display); font-size: 46px; line-height: 1.02; letter-spacing: .06em;
  background: linear-gradient(180deg, #fff6d6, #f0cf7a 50%, #b88a35); -webkit-background-clip: text; background-clip: text; color: transparent; }
.jp-mine { font-size: 18px; margin: 0 0 8px; }
.jp-mine b { color: var(--win); }
.jp-card ul { list-style: none; margin: 0; padding: 0; text-align: left; display: grid; grid-template-columns: 1fr; column-gap: 22px; }
.jp-card ul.many { grid-template-columns: 1fr 1fr; }
.jp-card li { display: flex; justify-content: space-between; gap: 14px; padding: 5px 2px; border-bottom: 1px solid rgba(216, 178, 93, .15); font-size: 15px; }
.jp-card li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jp-card li em { font-style: normal; font-size: 12px; color: var(--muted); margin-left: 6px; }
.jp-card li b { color: var(--gold-hi); }
.jp-total { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.jp-wrap.out { animation: bjFadeOut .6s ease forwards; }

.gift-fly { position: absolute; left: 0; top: 0; width: 80px; height: 80px; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .6)); }
.fx-tag { position: absolute; transform: translateX(-50%); font-size: 12px; font-weight: 800; letter-spacing: .08em; padding: 4px 10px; border-radius: 99px; color: #fff3ea; background: #a91c10; box-shadow: 0 6px 16px rgba(0, 0, 0, .5); white-space: nowrap; animation: bjFade .3s ease both; }

/* =====================================================================
   KONTROL PANELİ — ikonlu aksiyon çubuğu, gerçek fişlerle bahis çubuğu
   ===================================================================== */
.bj-controls {
  position: relative; z-index: 6; flex: none; display: flex; align-items: center; gap: 14px; min-height: 100px;
  padding: 10px max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  background: radial-gradient(ellipse 60% 120% at 50% 120%, rgba(216, 178, 93, .12), transparent 70%), linear-gradient(0deg, #040504, rgba(10, 11, 9, .95));
  border-top: 1px solid var(--line);
}
.bj-controls.busy .ctl-main { opacity: .7; }
.ctl-main { flex: 1; min-width: 0; display: flex; justify-content: center; }
.ctl-status { margin: 0; color: var(--muted); font-size: 15px; text-align: center; }
.ctl-res { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; justify-content: center; animation: bjPopIn .35s cubic-bezier(.2, 1.4, .4, 1) both; }
.ctl-res span { font-family: var(--display); font-size: 15px; letter-spacing: .08em; color: var(--muted); }
.ctl-res b { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
.ctl-res.win b { color: var(--win); text-shadow: 0 0 18px rgba(116, 227, 166, .45); }
.ctl-res.lose b { color: var(--lose); }
.ctl-res.push b { color: var(--push); }
.ctl-res small { color: var(--muted); font-size: 13px; }
.ctl-bet { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
.chip-row { display: flex; gap: 12px; padding: 0 4px; }
.pchip { position: relative; width: 66px; height: 66px; padding: 0; border: 0; border-radius: 50%; background: none; transition: transform .16s cubic-bezier(.3, 1.4, .5, 1), filter .2s; filter: drop-shadow(0 6px 5px rgba(0, 0, 0, .6)); }
.pchip svg { display: block; width: 100%; height: 100%; }
.pchip:hover:not(:disabled) { transform: translateY(-4px); }
.pchip.sel { transform: translateY(-9px) scale(1.06); filter: drop-shadow(0 0 12px rgba(255, 215, 122, .85)) drop-shadow(0 10px 8px rgba(0, 0, 0, .55)); }
.pchip.sel::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid #ffd77a; box-shadow: 0 0 12px rgba(255, 215, 122, .7); }
.pchip:disabled { opacity: .3; filter: grayscale(.8); }
.cbtn {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 78px; min-height: 58px; padding: 7px 10px; border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, .1); background: linear-gradient(180deg, #24251f, #11120f); color: var(--ink); font-size: 12px; font-weight: 800; letter-spacing: .06em;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), inset 0 -3px 0 rgba(0, 0, 0, .35), 0 8px 18px rgba(0, 0, 0, .45); transition: transform .12s, box-shadow .2s;
}
.cbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cbtn:hover:not(:disabled) { transform: translateY(-2px); }
.cbtn.go { background: linear-gradient(180deg, #f6dd98, #c99a3d 55%, #9c7427); color: #231505; border-color: #ffe9b0; }
.cbtn:disabled { opacity: .32; }
.ctl-info { display: flex; flex-direction: column; gap: 3px; min-width: 170px; max-width: 360px; }
.ctl-info small { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.mybet { display: inline-flex; align-items: center; gap: 6px; margin-right: 10px; font-weight: 800; }
.mybet em { font-style: normal; font-size: 10.5px; letter-spacing: .08em; padding: 0 6px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--gold-hi); }
.mybet.ok { color: var(--win); }
.bbt { color: var(--bb); letter-spacing: .12em; font-size: 13px; }
.ctl-btns { display: flex; gap: 8px; }
.ctl-ins { display: flex; flex-direction: column; gap: 8px; }
.ins-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.ins-row b { color: var(--gold-hi); }
.ctl-act { width: min(840px, 100%); display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.ctl-top { display: flex; align-items: center; gap: 14px; }
.ctl-who { margin: 0; flex: none; font-weight: 700; color: var(--muted); font-size: 14px; letter-spacing: .02em; }
.ctl-who b { color: var(--gold-hi); font-weight: 800; }
.ctl-who .ctl-sum { color: #fff; font-weight: 800; }
.ctl-who small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.premode .ctl-top { flex-wrap: wrap; justify-content: center; text-align: center; }
.tbar { flex: 1; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.tbar i { display: block; height: 100%; transform-origin: 0 50%; background: linear-gradient(90deg, #ff6a50, #f3d892 35%, #74e3a6); box-shadow: 0 0 10px rgba(243, 216, 146, .6); transition: transform .25s linear; }
.act-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.act {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 66px; padding: 6px 4px; border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, .1); background: linear-gradient(180deg, #25261f, #121310); color: var(--ink);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), inset 0 -3px 0 rgba(0, 0, 0, .35), 0 8px 18px rgba(0, 0, 0, .45); transition: transform .12s, box-shadow .2s, filter .2s;
}
.act i { display: block; width: 26px; height: 26px; color: var(--ac, var(--gold-hi)); }
.act i svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.act b { font-size: 12.5px; font-weight: 800; letter-spacing: .08em; }
.act kbd { position: absolute; right: 8px; top: 6px; font: 600 10px var(--ui); color: rgba(255, 255, 255, .45); }
.act.a-hit { --ac: #e8f6ff; background: linear-gradient(180deg, #2a7fc6, #134a7e 70%, #0d355c); border-color: #8fd0ff; }
.act.a-stand { --ac: #fff0ec; background: linear-gradient(180deg, #c23b2e, #7c1a12 70%, #5b120c); border-color: #ff9c8a; }
.act.a-double { --ac: #ffe08a; }
.act.a-split { --ac: #cdb8ff; }
.act.a-surrender { --ac: #d8d2c4; }
.act:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.12); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 0 18px rgba(255, 215, 122, .25), 0 10px 20px rgba(0, 0, 0, .5); }
.act:active:not(:disabled) { transform: translateY(1px); }
.act:disabled { opacity: .28; filter: grayscale(.6); }
.act.ghost { background: rgba(0, 0, 0, .35); border-style: dashed; border-color: rgba(255, 255, 255, .22); box-shadow: none; }
.act.ghost.on { border-style: solid; border-color: #ffd77a; background: linear-gradient(180deg, rgba(243, 216, 146, .24), rgba(243, 216, 146, .06)); box-shadow: 0 0 0 1px #ffd77a, 0 0 18px rgba(243, 216, 146, .35); }
.act em { position: absolute; left: 50%; top: -9px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 3px; font-style: normal; font-size: 9.5px; font-weight: 900; letter-spacing: .1em; padding: 1px 7px 1px 4px; border-radius: 99px; background: #ffd77a; color: #1d1404; white-space: nowrap; }
.act em svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 3; }
.pre-tabs { display: flex; gap: 6px; justify-content: center; }
.pre-tabs button { padding: 3px 12px; border-radius: 99px; border: 1px solid var(--line); background: transparent; font-size: 12px; font-weight: 800; }
.pre-tabs button[aria-pressed='true'] { background: var(--gold-hi); color: #1d1404; }
.ar-group { display: flex; flex-direction: column; gap: 6px; }
.ar {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(255, 255, 255, .35);
  background: rgba(255, 255, 255, .03); color: #dcdcd6; font-size: 11px; font-weight: 800; letter-spacing: .1em;
}
.ar i { font-style: normal; font-size: 16px; line-height: 1; }
.ar em { font-style: normal; font-size: 10px; opacity: .75; }
.ar.on { color: #7cf0ad; border-color: rgba(110, 230, 160, .7); background: rgba(40, 140, 85, .2); box-shadow: 0 0 14px rgba(80, 220, 140, .35); }
.ar.on::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #7cf0ad; box-shadow: 0 0 8px #7cf0ad; }

/* =====================================================================
   SOHBET VE PANELLER
   ===================================================================== */
.bj-chat {
  position: fixed; right: 0; top: 0; bottom: 0; z-index: 40; width: min(360px, 92vw); display: flex; flex-direction: column;
  background: linear-gradient(180deg, #12110e, #090908); border-left: 1px solid var(--line); box-shadow: -18px 0 40px rgba(0, 0, 0, .55);
  padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); animation: bjSlide .25s ease both;
}
.bj-chat header { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.bj-chat header b { flex: 1; font-family: var(--display); letter-spacing: .08em; color: var(--gold-hi); }
.cm-hb { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); font-size: 12.5px; font-weight: 700; }
.cm-hb svg, .hud-ic svg, .cm-lock svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cm-hb:hover { border-color: var(--line-2); background: rgba(216, 178, 93, .08); }
.cm-lock { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.cm-lock svg { flex: none; color: var(--gold); }
.cm-lock span { flex: 1; line-height: 1.35; }
.cm-lock b { color: var(--gold-hi); }
.cm.emo-line { grid-template-columns: auto 1fr auto; align-items: center; }
.cm.emo-line img { width: 44px; height: 44px; grid-column: 2; justify-self: start; }
.cm.emo-line time { grid-column: 3; }
.cm-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.cm { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; padding: 7px 10px; border-radius: 12px; background: rgba(255, 255, 255, .04); }
.cm.me { background: rgba(216, 178, 93, .1); }
.cm-who { justify-self: start; padding: 0; border: 0; background: none; font-weight: 800; font-size: 13px; color: var(--gold-hi); }
.cm p { grid-column: 1 / -1; margin: 0; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
.cm time { grid-row: 1; grid-column: 2; font-size: 11px; color: var(--muted); }
.cm.gift-line { grid-template-columns: 40px 1fr auto; align-items: center; background: linear-gradient(90deg, rgba(216, 178, 93, .14), rgba(216, 178, 93, .03)); }
.cm.gift-line img { width: 38px; height: 38px; }
.cm.gift-line span { font-size: 13px; }
.cm.gift-line time { grid-column: 3; grid-row: 1; }
.cm-empty { color: var(--muted); text-align: center; margin-top: 20px; }
.cm-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.cm-form input { flex: 1; min-width: 0; }

.menu-list { display: flex; flex-direction: column; gap: 6px; }
.menu-list button { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); font-weight: 700; }
.menu-list button:hover { border-color: var(--line-2); background: rgba(216, 178, 93, .08); }
.menu-list button.danger { color: var(--lose); }
.set-row { display: grid; grid-template-columns: 1fr 1.4fr 36px; align-items: center; gap: 10px; padding: 6px 0; }
.set-row output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.set-row input[type='range'] { accent-color: var(--gold); width: 100%; }
.set-row input[type='checkbox'] { justify-self: start; width: 20px; height: 20px; accent-color: var(--gold); }
.hist { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.hist li { padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .035); border: 1px solid rgba(216, 178, 93, .12); }
.hr-top { display: flex; align-items: baseline; gap: 10px; }
.hr-top span { color: var(--muted); font-size: 12px; }
.hr-top em { margin-left: auto; font-style: normal; font-weight: 800; }
.hr-top em.win { color: var(--win); }
.hr-top em.lose { color: var(--lose); }
.hr-body { margin-top: 4px; font-size: 14px; line-height: 1.5; }
.hr-dl { margin-top: 2px; font-size: 12px; color: var(--muted); }
.hb-tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); margin-right: 4px; color: var(--gold-hi); }
.st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.st-it { padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .035); border: 1px solid rgba(216, 178, 93, .14); }
.st-it small { display: block; color: var(--muted); font-size: 12px; }
.st-it b { font-size: 20px; }
.st-it.win b { color: var(--win); }
.st-it.lose b { color: var(--lose); }
.st-it.gold b { color: var(--gold-hi); }
.rules p { margin: 0 0 10px; line-height: 1.55; font-size: 14.5px; }
.rules b { color: var(--gold-hi); }
.inv-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 50vh; overflow: auto; }
.inv-row { display: flex; align-items: center; gap: 10px; }
.inv-row span { flex: 1; display: flex; flex-direction: column; }
.inv-row small { color: var(--muted); font-size: 12px; }
.pl-card { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.pl-card small { display: block; color: var(--muted); }
.bb-list { list-style: none; margin: 0; padding: 0; }
.bb-list li { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; padding: 8px 0; border-bottom: 1px solid rgba(216, 178, 93, .12); }
.bb-list small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.gift-h { margin: 14px 0 6px; font-family: var(--display); color: var(--gold); letter-spacing: .1em; font-size: 14px; }
.gift-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.gift { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); }
.gift img { width: 56px; height: 56px; }
.gift span { font-size: 12.5px; font-weight: 700; text-align: center; }
.gift b { font-size: 12px; color: var(--gold-hi); }
.gift:hover:not(:disabled) { border-color: var(--line-2); background: rgba(216, 178, 93, .08); }
.gift:disabled { opacity: .4; }

/* =====================================================================
   ANİMASYONLAR
   ===================================================================== */
@keyframes bjRing { to { stroke-dashoffset: 176; } }
@keyframes bjSpin { to { transform: rotate(360deg); } }
@keyframes bjPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(243, 216, 146, 0); } 50% { box-shadow: 0 0 22px 2px rgba(243, 216, 146, .25); } }
@keyframes bjPop { from { opacity: 0; transform: translate(-50%, -50%) scale(.7); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes bjFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes bjFadeOut { to { opacity: 0; } }
@keyframes bjSlide { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.jp-card { animation-name: bjPopC; }
@keyframes bjPopC { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
html[data-q='low'] .seat-hit.mine, html[data-q='low'] .bj-stack.pending::before, html[data-q='low'] .jp-rays,
html[data-q='low'] .hand-glow, html[data-q='low'] .spot-hl, html[data-q='low'] .turn-arrow, html[data-q='low'] .banner .bn-rays { animation: none; }
@media (prefers-reduced-motion: reduce) {
  .seat-hit.mine, .bj-stack.pending::before, .jp-rays, .hand-glow, .spot-hl, .turn-arrow, .banner .bn-rays, .res, .tot, .ctl-res { animation: none; }
  .cd-in { transition: none; }
}

/* =====================================================================
   MOBİL
   ===================================================================== */
@media (max-width: 760px) {
  .hud-jp small { display: none; }
  .hud-t b { max-width: 34vw; font-size: 14px; }
  .hud-t small, .hud-view { display: none; }
  .bj-controls { flex-direction: column-reverse; align-items: stretch; gap: 8px; min-height: 0; padding-top: 8px; }
  .ar-group { flex-direction: row; justify-content: center; flex-wrap: wrap; }
  .ctl-bet { gap: 10px; }
  .ctl-info { min-width: 0; max-width: none; flex: 1 1 100%; text-align: center; order: 3; }
  .pchip { width: 54px; height: 54px; }
  .ctl-bet .chip-row { order: -1; flex: 1 1 100%; justify-content: center; }
  .cbtn { flex: 1; min-width: 0; min-height: 42px; padding: 5px 4px; font-size: 11.5px; flex-direction: row; gap: 6px; border-radius: 12px; }
  .cbtn svg { width: 18px; height: 18px; }
  .ctl-info { gap: 1px; }
  .ctl-info small { font-size: 11.5px; }
  .bj-controls { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  .act-row { gap: 6px; }
  .act { min-height: 58px; border-radius: 14px; padding: 6px 2px; }
  .act i { width: 22px; height: 22px; }
  .act b { font-size: 10.5px; letter-spacing: .03em; }
  .act kbd { display: none; }
  .ctl-top { gap: 10px; }
  .ctl-who { font-size: 13px; }
  .hud-ic { width: 34px; height: 34px; }
  .bj-chat { top: auto; left: 0; right: 0; width: auto; height: 62vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; animation-name: bjUp; }
  .lb-tiers { grid-template-columns: 1fr; }
  .lb-head { align-items: flex-start; }
  .jp-card { min-width: 0; width: 90%; }
}
@keyframes bjUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 480px) {
  .bj-hud { gap: 6px; padding-left: max(6px, env(safe-area-inset-left)); padding-right: max(6px, env(safe-area-inset-right)); }
  .hud-t { min-width: 0; overflow: hidden; }
  .hud-jp .jp-dots { display: none; }
  .hud-btn { width: 34px; height: 34px; font-size: 18px; }
  .hud-t { flex: 1; flex-direction: column; gap: 0; align-items: flex-start; }
  .hud-t b { max-width: 30vw; font-size: 13px; }
  .hud-t .tier { font-size: 9.5px; padding: 1px 6px; }
  .hud-jp { margin: 0; padding: 4px 8px; gap: 5px; }
  .jp-dots i { width: 8px; height: 8px; }
  .hud-jp b { font-size: 12px; }
  .hud-bal { font-size: 13px; }
  .hud-r { gap: 5px; }
}
@media (max-height: 500px) and (orientation: landscape) {
  .bj-hud { min-height: 40px; padding-top: max(3px, env(safe-area-inset-top)); padding-bottom: 3px; }
  .hud-btn { width: 32px; height: 32px; font-size: 17px; }
  .pchip { width: 44px; height: 44px; font-size: 13px; }
  .act { min-height: 44px; }
  .act i { width: 18px; height: 18px; }
  .ctl-info small { display: none; }
  .cbtn { min-height: 40px; }
}

/* ---------------- v3.2: elin altındaki karar düğmeleri ----------------
   H = Kart (mavi) · S = Dur (kırmızı) · D = İkiye katla (yeşil) · SP = Böl (sarı).
   Sırası gelen elde hemen uygulanır; sırası gelmemiş elde ön karar olur, kırmızı X ile iptal edilir. */
.bj-acts { position: absolute; inset: 0; pointer-events: none; z-index: 9; }
.hacts { --g: calc(var(--hb, 40px) * .14); position: absolute; transform: translate(-50%, 0); display: flex; align-items: center; gap: var(--g);
  padding: var(--g); border-radius: calc(var(--hb, 40px) * .36); pointer-events: auto;
  background: linear-gradient(180deg, rgba(14, 22, 18, .9), rgba(6, 10, 8, .92)); border: 1px solid rgba(233, 207, 140, .38);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08); animation: bjActsIn .22s ease-out both; }
.hacts.turn { border-color: rgba(255, 214, 102, .95); box-shadow: 0 0 0 2px rgba(255, 214, 102, .35), 0 0 22px rgba(255, 200, 80, .55), 0 8px 20px rgba(0, 0, 0, .55); animation: bjActsIn .22s ease-out both, bjActsPulse 1.4s ease-in-out .3s infinite; }
.hacts.sm { --hb2: calc(var(--hb, 40px) * .8); }
.ha { width: var(--hb2, var(--hb, 40px)); height: var(--hb2, var(--hb, 40px)); display: inline-grid; place-items: center; padding: 0; cursor: pointer;
  border-radius: calc(var(--hb2, var(--hb, 40px)) * .26); border: 1px solid rgba(255, 255, 255, .42);
  font: 900 calc(var(--hb2, var(--hb, 40px)) * .44)/1 var(--ui); letter-spacing: -.02em; color: #fff; text-shadow: 0 1px 1px rgba(0, 0, 0, .45);

  transition: transform .12s ease, filter .12s ease; }

.ha.a-hit { background: linear-gradient(180deg, #5aa2ff, #1f62dc); }
