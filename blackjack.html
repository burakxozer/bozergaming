    else if (s.leaving) sub = '<span class="warn">Tur sonunda kalkacak</span>';
    else if (s.bet) sub = `${fmt(s.bet)} BP${s.bet_status === 'pending' ? (s.confirmed ? ' · onaylı' : '') : ''}`;
    else if (ctx.betting) sub = 'Bahis bekleniyor';
    else sub = mine ? 'Sıradaki tur' : '';
    const auto = myState && myState.auto ? '<i class="auto-dot" title="Auto Rebet açık">↻</i>' : '';
    const side = g.spot.x < this.L.cx - 2 ? ' sl' : g.spot.x > this.L.cx + 2 ? ' sr' : ' sc';
    h += `<div class="seat-plate${side}${mine ? ' mine' : ''}${turn ? ' turn' : ''}${s.conn === 'disconnected' ? ' off' : ''}${g.plate.rev ? ' rev' : ''}" style="${plate}">
      <button type="button" class="seat-av" data-act="avatar" data-seat="${s.no}" aria-label="${esc(s.user.name)} profili">${av}${turn ? '<svg class="ring" viewBox="0 0 60 60"><circle cx="30" cy="30" r="28"/></svg>' : ''}<span class="seat-pn">P${s.no}</span></button>
      <span class="seat-who"><b class="seat-name">${esc(s.user.name)}${mine ? ' <em>SEN</em>' : ''}${auto}</b><small class="seat-sub">${sub}</small></span>
      ${mine && !ctx.spectatorOnly ? `<button type="button" class="seat-kalk" data-act="${s.leaving ? 'unstand' : 'stand'}" data-seat="${s.no}" title="${s.leaving ? 'Kalkmaktan vazgeç' : 'Bu pozisyondan kalk'}">${s.leaving ? 'VAZGEÇ' : 'KALK'}</button>` : ''}
    </div>`;
    return h;
  };
  Scene.prototype.syncSeats = function (st, ctx) {
    (st.seats || []).forEach((s) => {
      let el = this.lSpots.querySelector(`[data-sn="${s.no}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'seat';
        el.dataset.sn = s.no;
        this.lSpots.appendChild(el);
      }
      const html = this.seatHTML(s, ctx);
      if (this.seatSig[s.no] !== html) {
        el.innerHTML = html;
        this.seatSig[s.no] = html;
      }
      const ring = el.querySelector('.ring circle');
      if (ring && ctx.turnDeadline) {
        const left = Math.max(0, ctx.turnDeadline - this.now());
        if (el._dl !== ctx.turnDeadline) {
          el._dl = ctx.turnDeadline;
          ring.style.animation = 'none';
          void ring.getBoundingClientRect();
          ring.style.strokeDashoffset = String(176 * (1 - left / TURN_MS));
          ring.style.animation = `bjRing ${left}ms linear forwards`;
        }
      }
    });
  };

  /* ---------------- sıra vurgusu: elin arkasında altın ışık, bahis halkası, ok ---------------- */
  Scene.prototype.syncTurn = function (st, ctx) {
    let h = '';
    if (st.state === 'PLAYER_TURNS' && st.turn) {
      const s = (st.seats || []).find((x) => x.no === st.turn.seat);
      const hands = (s && s.hands) || [];
      const i = hands.findIndex((x) => x.id === st.turn.hand);
      if (s && i >= 0) {
        const hd = hands[i];
        const b = this.handBox(s.no - 1, hands.length, i, hd.cards.length);
        const g = this.geo[s.no - 1];
        const mine = ctx.myId && st.turn.user === ctx.myId;
        h += `<div class="hand-glow${mine ? ' mine' : ''}" style="left:${b.cx}px;top:${b.cy}px;width:${b.w + 70}px;height:${b.h + 64}px"></div>`;
        h += `<div class="spot-hl${mine ? ' mine' : ''}" style="left:${g.spot.x}px;top:${g.spot.y}px"></div>`;
      }
    }
    if (this._glow !== h) {
      this.lGlow.innerHTML = h;
      this._glow = h;
    }
  };

  /* ---------------- rozetler (el toplamı, sonuç etiketi, ön hamle, ok) ----------------
     Kartları hâlâ havada olan elin rozeti, kartlar inince görünür; battı / blackjack /
     krupiye battı efektleri de o anda (ilk görünüşte) oynar. */
  Scene.prototype.badgesSoon = function () {
    clearTimeout(this._bT);
    this._bT = setTimeout(() => {
      if (!this.st) return;
      const ctx = this.hooks.ctx ? this.hooks.ctx(this.st, this.me) : {};
      this.fxLive = this.ready;
      this.syncBadges(this.st, ctx);
    }, 40);
  };
  Scene.prototype.syncBadges = function (st, ctx) {
    let h = '';
    const rk = st.round ? st.round.id : '';
    if (this._totRound !== rk) {
      this._tot = {};
      this._totRound = rk;
    }
    this._tot = this._tot || {};
    // havadaki kartı olan elin rozeti bu çizimde yok: önceki toplamı korunur (inince değiştiyse "pop")
    const tot = Object.assign({}, this._tot);
    const pre = {};
    ((ctx.me && ctx.me.pre) || []).forEach((p) => p.action && (pre[p.hand] = p.action));
    const settled = st.round && st.round.settled;
    const rid = st.round ? st.round.id : '';
    const flying = new Set();
    this.cards.forEach((c) => c.flying && flying.add(c.seat === 0 ? 'dealer' : c.hand));
    const fire = [];
    (st.seats || []).forEach((s) => {
      const hands = s.hands || [];
      hands.forEach((hd, i) => {
        if (!hd.cards.length || flying.has(hd.id)) return;
        const b = this.handBox(s.no - 1, hands.length, i, hd.cards.length);
        const first = this.cardPos(s.no - 1, hands.length, i, 0, hd.cards.length);
        const w = this.cw * first.sc;
        const tx = b.x0 - 6;
        const ty = b.y0 + 4;
        let cls = 'tot';
        let txt = String(hd.total);
        if (hd.st === 'blackjack') {
          cls += ' bj';
          txt = 'BJ';
        } else if (hd.total > 21) cls += ' bust';
        else if (hd.soft && hd.total <= 21 && hd.st !== 'stood' && !hd.out) {
          cls += ' soft';
          txt = `${hd.total - 10}/${hd.total}`;
        }
        if (ctx.turnHand === hd.id) cls += ' turn';
        if (this.fxLive && this._tot[hd.id] != null && this._tot[hd.id] !== txt) cls += ' pop';
        tot[hd.id] = txt;
        h += `<span class="${cls}" style="left:${tx}px;top:${ty}px">${txt}</span>`;
        if (ctx.turnHand === hd.id && st.state === 'PLAYER_TURNS') h += `<span class="turn-arrow" style="left:${b.cx}px;top:${b.y0 - 18}px" aria-hidden="true"></span>`;
        if (pre[hd.id] && hd.st === 'waiting' && !ctx.handActs) h += `<span class="pretag" style="left:${b.cx}px;top:${b.y0 - 22}px">${PRE_LABEL[pre[hd.id]]} · BEKLEMEDE</span>`;
        // sonuç etiketi: tur bitince sonuç; bitmeden önce battı / blackjack / teslim hemen görünür
        let res = null;
        if (hd.out && settled) {
          const net = hd.pay - hd.bet;
          const o = hd.out;
          const bust = o === 'lose' && hd.total > 21;
          res = {
            cls: o === 'blackjack' ? 'bj' : o === 'win' ? 'win' : o === 'push' ? 'push' : 'lose',
            label: bust ? 'BATTI' : OUT_LABEL[o],
            amt: o === 'push' ? 'iade' : sgn(net),
          };
        } else if (hd.st === 'bust') res = { cls: 'lose', label: 'BATTI', amt: '' };
        else if (hd.st === 'blackjack') res = { cls: 'bj', label: 'BLACKJACK', amt: '' };
        else if (hd.st === 'surrendered') res = { cls: 'lose', label: 'TESLİM', amt: '' };
        // etiket elin alt kısmında: kartların köşe yazıları (sayı/renk) açık kalır
        if (res) h += `<span class="res ${res.cls}" style="left:${b.cx}px;top:${b.y1 - w * RATIO * 0.2}px"><b>${res.label}</b>${res.amt ? `<em>${res.amt}</em>` : ''}</span>`;
        if (hd.st === 'bust' || hd.st === 'blackjack') fire.push({ key: hd.st + ':' + hd.id, kind: hd.st, hand: hd.id, box: b, mine: !!(s.user && ctx.myId && s.user.id === ctx.myId) });
      });
      if (s.net != null && hands.length > 1 && settled) {
        const g = this.geo[s.no - 1];
        h += `<span class="netall ${s.net > 0 ? 'win' : s.net < 0 ? 'lose' : 'push'}" style="left:${g.spot.x}px;top:${g.spot.y + 48}px">Toplam ${sgn(s.net)} BP</span>`;
      }
    });
    if (st.dealer && st.dealer.cards.length && !flying.has('dealer')) {
      const d = st.dealer;
      const n = d.cards.length;
      const p0 = this.dealerPos(0, n);
      let cls = 'tot dl';
      let txt = d.total;
      if (d.bj) {
        cls += ' bj';
        txt = 'BJ';
      } else if (d.total > 21) cls += ' bust';
      if (this.fxLive && this._tot.dealer != null && this._tot.dealer !== String(txt)) cls += ' pop';
      tot.dealer = String(txt);
      h += `<span class="${cls}" style="left:${p0.x - this.dcw * 0.5 - 8}px;top:${p0.y - this.dcw * RATIO * 0.5 + 6}px">${txt}</span>`;
      if (!d.hidden && d.total > 21) fire.push({ key: 'dbust:' + rid, kind: 'dbust', total: d.total });
      else if (!d.hidden && d.bj) fire.push({ key: 'dbj:' + rid, kind: 'dbj' });
    }
    // "pop" yalnız değiştiği çizimde: aynı rozet bir sonraki çizimde sınıfsız (yeniden oynamaz)
    if (this._badges !== h) {
      this.lBadges.innerHTML = h;
      this._badges = h.replace(/ pop"/g, '"');
    }
    this._tot = tot;
    fire.forEach((f) => {
      if (this.shown.has(f.key)) return;
      this.shown.add(f.key);
      if (this.fxLive) this.fxEvent(f);
    });
  };
  /* ---------------- el altı karar düğmeleri (v3.2) ---------------- */
  // v3.3: harf yerine kelime — Hit (kart al), Stand (dur), 2x (iki kat), Split (böl)
  const HA = {
    hit: { k: 'Hit', t: 'Kart al (Hit)' },
    stand: { k: 'Stand', t: 'Dur (Stand)' },
    double: { k: '2x', t: 'İki kat (Double)' },
    split: { k: 'Split', t: 'Böl (Split)' },
    surrender: { k: 'Pes', t: 'Pes et' },
  };
  Scene.prototype.syncActs = function (st, ctx) {
    let h = '';
    if (ctx.handActs) {
      const flying = new Set();
      this.cards.forEach((c) => c.flying && flying.add(c.hand));
      (st.seats || []).forEach((s) => {
        const hands = s.hands || [];
        hands.forEach((hd, i) => {
          if (hd.cards.length < 2 || flying.has(hd.id)) return;
          const x = ctx.handActs(s, hd, hands.length);
          if (!x) return;
          const b = this.handBox(s.no - 1, hands.length, i, hd.cards.length);
          const small = hands.length > 1 ? ' sm' : '';
          const top = b.y1 - Math.min(18, (b.y1 - b.y0) * 0.12);
          const lbl = (a) => `${HA[a].t}${x.mode === 'pre' ? ' — sıran gelince uygulanır' : ''}`;
          let inner;
          if (x.pre && HA[x.pre]) {
            inner = `<span class="ha on a-${x.pre}" title="${HA[x.pre].t}">${HA[x.pre].k}</span><span class="ha-wait">sırada</span>`
              + `<button type="button" class="ha-x" data-ha="x" data-hand="${hd.id}" data-mode="pre" title="Ön kararı iptal et" aria-label="${HA[x.pre].t} ön kararını iptal et">`
              + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>';
          } else {
            inner = x.acts
              .map((a) => `<button type="button" class="ha a-${a}" data-ha="${a}" data-hand="${hd.id}" data-mode="${x.mode}" title="${lbl(a)}" aria-label="${lbl(a)}">${HA[a].k}</button>`)
              .join('');
          }
          h += `<div class="hacts ${x.mode}${small}${x.pre ? ' has-pre' : ''}" data-hand="${hd.id}" style="left:${b.cx}px;top:${top}px">${inner}</div>`;
        });
      });
    }
    if (this._acts !== h) {
      this.lActs.innerHTML = h;
      this._acts = h;
    }
  };
  /** Rozet ilk kez görününce oynayan efektler */
  Scene.prototype.fxEvent = function (f) {
    if (f.kind === 'bust') {
      if (f.mine) SND.play('bust');
      if (!this.calm())
        this.cards.forEach((c) => {
          if (c.hand === f.hand) c.el.animate([{ translate: '0 0' }, { translate: '-8px 0' }, { translate: '7px 0' }, { translate: '-4px 0' }, { translate: '0 0' }], { duration: 400, easing: 'ease-out' });
        });
      this.flash(f.box, 'bust');
    } else if (f.kind === 'blackjack') {
      this.burst(f.box.cx, f.box.cy, { n: 20, kind: 'spark', spread: 110 });
      this.flash(f.box, 'bj');
      if (f.mine) {
        SND.play('blackjack');
        this.banner('bj', 'BLACKJACK!', '3:2 ödeme', { x: Math.max(260, Math.min(this.L.W - 260, f.box.cx)), y: Math.max(150, f.box.y0 - 46) });
      }
    } else if (f.kind === 'dbust') {
      this.later(this.dur(380), () => {
        SND.play('dealerBust');
        this.banner('dbust', 'KRUPİYE BATTI', `${f.total} · ayakta kalan eller kazanır`);
      });
    } else if (f.kind === 'dbj') {
      this.later(this.dur(420), () => {
        SND.play('lose');
        this.banner('dbj', 'KRUPİYE BLACKJACK', 'Sigorta 2:1 öder');
      });
    }
  };

  /* ---------------- krupiye mesaj kartı (portre + metin + geri sayım) ---------------- */
  Scene.prototype.syncCenter = function (st, ctx) {
    let title = '';
    let sub = '';
    let timer = 0;
    let total = 0;
    let mode = 'bubble';
    let tone = '';
    const dl = st.deadline ? st.deadline - this.now() : 0;
    const nameOf = (no) => {
      const s = (st.seats || []).find((x) => x.no === no);
      return s && s.user ? s.user.name : 'P' + no;
    };
    switch (st.state) {
      case 'WAITING_FOR_PLAYERS':
        title = 'Oyunun başlaması için en az 2 aktif pot gereklidir.';
        sub = 'İkinci bir oyuncunun oturmasını bekleyin veya boş bir pozisyonda ikinci potunuzu açın.';
        mode = 'hero';
        tone = 'wait';
        break;
      case 'BETTING_OPEN':
        title = 'Bahislerinizi koyun';
        sub = ctx.hasSeat ? (st.side_bets ? 'Fişe dokun, bahsini kur, Hazır’a bas. Yan bahis: yuvadaki PP / 21+3.' : 'Fişe dokun, bahsini kur, Hazır’a bas.') : ctx.canBB ? 'Bir oyuncunun bahis alanına dokunarak Bet Behind yapabilirsin.' : 'Oyuncular bahislerini koyuyor.';
        timer = dl;
        total = 15000;
        mode = 'hero';
        tone = 'bet';
        break;
      case 'BETTING_LOCKED':
        title = 'Bahisler kapandı.';
        sub = 'İyi şanslar!';
        break;
      case 'INITIAL_DEAL':
        title = 'Kartlar dağıtılıyor.';
        break;
      case 'INSURANCE_WINDOW':
        title = 'Sigorta ister misiniz?';
        sub = 'Açık kartım As. Sigorta ana bahsin yarısıdır, 2:1 öder.';
        timer = dl;
        total = 10000;
        tone = 'bet';
        break;
      case 'DEALER_PEEK':
        title = 'Blackjack kontrolü…';
        sub = 'Kapalı karta bakıyorum.';
        break;
      case 'PLAYER_TURNS':
        if (st.turn) {
          const mine = ctx.myId && st.turn.user === ctx.myId;
          title = mine ? 'Sıra sende!' : `Sıra: ${nameOf(st.turn.seat)}`;
          sub = `P${st.turn.seat}${(() => {
            const s = (st.seats || []).find((x) => x.no === st.turn.seat);
            return s && (s.hands || []).length > 1 ? ' · el ' + ((s.hands.find((x) => x.id === st.turn.hand) || {}).i + 1) : '';
          })()} · kararını bekliyorum`;
          timer = st.turn.deadline ? st.turn.deadline - this.now() : 0;
          total = TURN_MS;
          tone = mine ? 'me' : '';
        }
        break;
      case 'DEALER_TURN': {
        const d = st.dealer || { cards: [] };
        if (d.total > 21) {
          title = 'Krupiye battı!';
          sub = 'Ayakta kalan eller kazanır.';
          tone = 'good';
        } else if (d.total >= 17) {
          title = `Krupiye ${d.total} ile duruyor.`;
        } else {
          title = `Krupiye ${d.total || ''} · kart çekiyor`;
          sub = '16 ve altında kart çekerim, 17’de dururum.';
        }
        break;
      }
      case 'SETTLEMENT':
      case 'RESULT_DISPLAY':
        title = st.round && st.round.cancelled ? 'Tur iptal edildi.' : 'Sonuçlar';
        sub = st.round && st.round.cancelled ? 'Bahisler iade edildi.' : 'Yeni tur birazdan başlıyor.';
        break;
      case 'SHOE_RESHUFFLE':
        title = 'Yeni sabot hazırlanıyor';
        sub = 'Sekiz deste karıştırılıyor, kesme kartı yerleştiriliyor ve ilk üç kart yakılıyor.';
        mode = 'hero';
        tone = 'wait';
        break;
      case 'PAUSED':
        title = 'Masa duraklatıldı';
        sub = 'Yönetici masayı kısa süreliğine durdurdu.';
        mode = 'hero';
        tone = 'wait';
        break;
      case 'CLOSED':
        title = 'Masa kapandı';
        mode = 'hero';
        tone = 'wait';
        break;
      default:
        break;
    }
    if (st.status === 'closing' && !title) sub = 'Masa bu turdan sonra kapanacak.';
    const m = this.msg;
    const secs = Math.max(0, Math.ceil(timer / 1000));
    const key = `${this.layout}|${mode}|${tone}|${title}|${sub}|${this.noDealer ? 'nd' : ''}`;
    if (this._msgKey !== key) {
      this._msgKey = key;
      if (!title && !sub) m.el.hidden = true;
      else {
        m.el.hidden = false;
        m.el.className = 'dmsg ' + mode + (tone ? ' t-' + tone : '');
        const L = this.L;
        if (mode === 'hero' || this.noDealer) {
          m.el.style.left = L.cx + 'px';
          m.el.style.top = (st.dealer && st.dealer.cards && st.dealer.cards.length ? L.dcards.y + this.dcw * 0.95 : L.msg) + 'px';
        } else {
          m.el.style.left = L.bubble.x + 'px';
          m.el.style.top = L.bubble.y + 'px';
        }
        m.title.textContent = title;
        m.sub.textContent = sub;
        m.sub.hidden = !sub;
        const tx = mode === 'hero' || this.noDealer ? '-50%' : '0';
        if (!this.calm()) m.el.animate([{ opacity: 0, transform: `translate(${tx},-50%) scale(.94)` }, { opacity: 1, transform: `translate(${tx},-50%) scale(1)` }], { duration: 240, easing: 'ease-out' });
      }
    }
    const showT = timer > 0 && total > 0;
    m.time.hidden = !showT;
    if (showT) {
      if (m.num.textContent !== String(secs)) m.num.textContent = String(secs);
      m.ring.style.strokeDashoffset = String(119.4 * (1 - Math.min(1, timer / total)));
      m.time.classList.toggle('urgent', secs <= 5);
    }
  };

  /* ---------------- sabot ve atık tepsisi ---------------- */
  Scene.prototype.syncShoe = function (st) {
    const sh = st.shoe;
    const box = this.lProps;
    const stack = box.querySelector('.shoe-stack');
    const cut = box.querySelector('.shoe-cut');
    const cnt = box.querySelector('.shoe-count');
    const disc = box.querySelector('.disc-stack');
    if (!sh || !stack) return;
    const left = sh.left;
    const frac = Math.max(0.04, left / sh.total);
    stack.style.right = 26 + (1 - frac) * 88 + 'px';
    cut.style.display = sh.cut ? 'none' : '';
    if (!sh.cut) {
      const toCut = sh.to_cut;
      const pos = left ? toCut / left : 0;
      cut.style.left = 22 + pos * (frac * 102) + 'px';
    }
    cnt.textContent = `${fmt(left)} kart${sh.cut ? ' · kesme kartı çıktı' : ''}`;
    disc.style.height = Math.max(3, Math.min(40, (sh.discard / sh.total) * 52)) + 'px';
    if (sh.cut && this._cutFor !== sh.no && this.ready) {
      this._cutFor = sh.no;
      this.cutCardAnim();
    } else if (sh.cut) this._cutFor = sh.no;
  };
  Scene.prototype.cutCardAnim = function () {
    if (this.opt('reduced')) return;

    el.innerHTML = '<div class="cd-in"><svg class="cd-f" viewBox="0 0 250 350"><use href="#bjc-cut"/></svg></div>';
    this.lFx.appendChild(el);
    const c = { el };
    this.place(c, sp.x, sp.y, -20, 0.7, 0);
    this.flyCard(c, { x: sp.x, y: sp.y, rot: -20, sc: 0.7 }, { x: sp.x - 20, y: sp.y + 76, rot: -8, sc: 0.85 }, this.dur(640), { lift: 30 });
    const tag = document.createElement('div');
    tag.className = 'fx-tag';
    tag.style.left = sp.x - 20 + 'px';
    tag.style.top = sp.y + 150 + 'px';
    tag.textContent = 'KESME KARTI · bu turdan sonra yeni sabot';
    this.lFx.appendChild(tag);
    this.later(5200, () => {
      el.remove();
      tag.remove();
    });
  };
  /* Karıştırma: krupiye desteleri karıştırır, kesme kartı girer, 3 kart yakılır */
  Scene.prototype.shuffleAnim = function () {
    if (this._shuffling) return;
    this._shuffling = true;
    SND.play('shuffle');
    this.dealer.shuffle(5).then(() => {
      this._shuffling = false;
    });
    if (this.opt('reduced')) return;
    const sp = this.shoePoint();
    const dp = this.discardPoint();
    this.later(3300, () => {
      // kesme kartı sabota girer
      const el = document.createElement('div');
      el.className = 'cd cutcard';
      el.innerHTML = '<div class="cd-in"><svg class="cd-f" viewBox="0 0 250 350"><use href="#bjc-cut"/></svg></div>';
      this.lFx.appendChild(el);
      const c = { el };
      this.flyCard(c, { x: this.L.cx, y: this.L.dcards.y, rot: 0, sc: 0.9 }, { x: sp.x + 40, y: sp.y, rot: -8, sc: 0.5 }, this.dur(720), { lift: 40 });
      this.later(this.dur(740), () => el.remove());
    });
    for (let i = 0; i < 3; i++) {
      this.later(4600 + i * 520, () => {
        const c = { el: cardEl('??') };
        this.lFx.appendChild(c.el);
        c.el.classList.add('down');
        SND.play('deal');
        this.flyCard(c, sp, { x: dp.x, y: dp.y - i * 2, rot: 86, sc: 0.6 }, this.dur(600), { lift: 50, spin: 0 });
        this.later(this.dur(620) + 200, () => c.el.remove());
      });
    }
  };

  /* ---------------- sonuç şeridi ve jackpot ---------------- */
  /** Kendi sonucum: net tutar kontrol çubuğunda yazılır; masada kazanınca avatara ödeme ve kıvılcım gelir.
   *  Masanın ortasına ayrıca panel çıkmaz (kartları ve etiketleri kapatmasın). */
  Scene.prototype.showResult = function (kind) {
    if (kind === 'blackjack' && !this.calm()) this.dealer.celebrate();
  };
  Scene.prototype.jackpot = function (jp, myId) {
    const el = document.createElement('div');
    el.className = 'jp-wrap';
    const mine = (jp.awards || []).filter((a) => a.user === myId).reduce((a, x) => a + x.bp, 0);
    const byUser = {};
    (jp.awards || []).forEach((a) => {
      const k = a.user + ':' + a.type;
      byUser[k] = byUser[k] || { name: a.name, bp: 0, type: a.type, pots: 0 };
      byUser[k].bp += a.bp;
      byUser[k].pots++;
    });
    const rows = Object.values(byUser)
      .map((u) => `<li><span>${esc(u.name)}${u.type === 'spectator' ? ' <em>Bet Behind</em>' : u.pots > 1 ? ` <em>${u.pots} pot</em>` : ''}</span><b>+${fmt(u.bp)} BP</b></li>`)
      .join('');
    el.innerHTML = `<div class="jp-rays"></div><canvas class="jp-confetti"></canvas>
      <div class="jp-card"><small>5 TUR ÜST ÜSTE 7/7</small><h2>BÖZER ROYALE<br>JACKPOT</h2>
      ${mine ? `<p class="jp-mine">Hesabına <b>+${fmt(mine)} BP</b> yatırıldı</p>` : ''}
      <ul class="${Object.keys(byUser).length > 6 ? 'many' : ''}">${rows}</ul><p class="jp-total">Toplam dağıtılan: ${fmt(jp.total)} BP</p></div>`;
    this.lFx.appendChild(el);
    SND.play('jackpot');
    this.dealer.celebrate();
    if (!this.opt('reduced')) this.confetti(el.querySelector('canvas'));
    this.later(10500, () => {
      el.classList.add('out');
      this.later(600, () => el.remove());
    });
  };
  Scene.prototype.confetti = function (cv) {
    const L = this.L;
    cv.width = L.W;
    cv.height = L.H;
    const ctx = cv.getContext('2d');
    const n = this.opt('quality') === 'low' ? 70 : 180;
    const cols = ['#f3d892', '#c99a3e', '#fff4cf', '#e5b85a', '#9c6f22'];
    const P = [];
    for (let i = 0; i < n; i++) {
      P.push({ x: Math.random() * L.W, y: -Math.random() * L.H * 0.6, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3.5, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.25, w: 6 + Math.random() * 8, h: 3 + Math.random() * 5, c: cols[i % cols.length] });
    }
    const t0 = performance.now();
    const step = (t) => {
      if (!cv.isConnected || t - t0 > 9000) return;
      ctx.clearRect(0, 0, L.W, L.H);
      P.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.r += p.vr;
        if (p.y > L.H + 20) {
          p.y = -20;
          p.x = Math.random() * L.W;
        }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)));
        ctx.restore();
      });
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };

  /** Elin arkasında kısa parıltı (battı: kırmızı, blackjack: altın) */
  Scene.prototype.flash = function (b, kind) {
    if (this.calm()) return;
    const el = document.createElement('div');
    el.className = 'hand-flash ' + kind;
    el.style.left = b.cx + 'px';
    el.style.top = b.cy + 'px';
    el.style.width = b.w + 90 + 'px';
    el.style.height = b.h + 80 + 'px';
    this.lGlow.appendChild(el);
    el.animate([{ opacity: 0 }, { opacity: 1, offset: 0.25 }, { opacity: 0 }], { duration: 1100, easing: 'ease-out' }).onfinish = () => el.remove();
  };

  /* ---------------- ana eşitleme ---------------- */
  Scene.prototype.update = function (st, me, instant) {
    const prev = this.st;
    this.st = st;
    this.me = me || {};
    // v3.4.1: fiş yığınları masanın fişiyle (koyduğun fişler aynen görünür)
    if (C.setUnit) C.setUnit(st.chip || ((st.bets || []).slice().sort((a, b) => a - b)[0]) || 0);
    const ctx = this.hooks.ctx ? this.hooks.ctx(st, this.me) : {};
    const rid = st.round ? st.round.id : null;
    if (rid !== this.roundId) {
      // yeni tur ya da tur yok: eski kartlar toplanır
      this.roundId = rid;
      this.settledFor = null;
      this.shown.clear();
      this.sideRev = {};
    }
    const live = this.ready && !instant;
    this.fxLive = live;
    this.setSkin(st.skin, st.side_bets);
    if (st.state === 'SHOE_RESHUFFLE' && prev && prev.state !== 'SHOE_RESHUFFLE' && live) this.shuffleAnim();
    this.syncCards(st, instant || !this.ready);
    this.syncStacks(st, instant || !this.ready);
    this.syncSide(st, ctx);
    this.syncSeats(st, ctx);
    this.syncTurn(st, ctx);
    this.syncBadges(st, ctx);
    this.syncActs(st, ctx);
    this.syncCenter(st, ctx);
    this.syncShoe(st);
    // krupiye bakışı: sırası gelen pozisyon
    if (st.turn) {
      const g = this.geo[st.turn.seat - 1];
      this.dealer.lookAt((g.spot.x - this.L.cx) / (this.L.W * 0.4));
    } else this.dealer.lookAt(0);
    // sonuç
    if (st.round && st.round.settled && !st.round.cancelled && this.settledFor !== st.round.id) {
      this.settledFor = st.round.id;
      const anyWin = (st.seats || []).some((s) => (s.hands || []).some((h) => h.out === 'win' || h.out === 'blackjack'));
      const anyBJ = (st.seats || []).some((s) => (s.hands || []).some((h) => h.out === 'blackjack'));
      if (live) {
        this.settleAnim(st, ctx.myId);
        this.dealer.mood(anyWin ? 'smile' : 'neutral');
        if (anyBJ && !st.round.jackpot) this.dealer.celebrate();
        this.later(5200, () => this.dealer.mood('neutral'));
        if (this.hooks.onSettled) this.hooks.onSettled(st);
        if (st.round.jackpot && st.jp) this.later(1200, () => this.jackpot(st.jp, ctx.myId));
      } else {
        this.stacks.forEach((s) => s.el.remove());
        this.stacks.clear();
      }
    }
    this.ready = true;
  };
  /* Saniyede dört kez: geri sayımlar */
  Scene.prototype.tick = function () {
    if (!this.st) return;
    const ctx = this.hooks.ctx ? this.hooks.ctx(this.st, this.me) : {};
    this.syncCenter(this.st, ctx);
  };
  Scene.prototype.reset = function () {
    this.timers.forEach(clearTimeout);
    this.timers = [];
    this.cards.forEach((c) => c.el.remove());
    this.cards.clear();
    this.stacks.forEach((s) => s.el.remove());
    this.stacks.clear();
    this.lSpots.innerHTML = '';
    this.lBadges.innerHTML = '';
    this.lGlow.innerHTML = '';
    this.msg.el.hidden = true;
    this.lFx.innerHTML = '';
    if (this.lSide) this.lSide.innerHTML = '';
    if (this.sideEls) this.sideEls.clear();
    this.sideRev = {};
    this.dealEnd = 0;
    this.seatSig = [];
    this._badges = '';
    this._acts = '';
    this._glow = '';
    this._msgKey = '';
    this.st = null;
    this.roundId = null;
    this.settledFor = null;
    this.settling = false;
    this.shown.clear();
    clearTimeout(this._bT);
    this.ready = false;
  };

  window.BJScene = { create: (root, hooks) => new Scene(root, hooks), OUT_LABEL, PRE_LABEL };
})();

        clock.off = clock.n ? clock.off * 0.5 + off * 0.5 : off;
        clock.rtt = Math.min(clock.rtt, rtt);
      }
      clock.n++;
    }
    return r;
  }

  /* Masa seviyeleri panelden yönetilir. v3.3: fiş değeri + en düşük / en yüksek bahis (bahis fiş katlarıyla) */
  const TIER_DEF = {
    bronze: { min_balance: 0, chip: 10, min_bet: 10, max_bet: 50, jp_seat: 200, jp_spec: 100, side_max: 20 },
    silver: { min_balance: 0, chip: 20, min_bet: 20, max_bet: 100, jp_seat: 300, jp_spec: 200, side_max: 40 },
    gold: { min_balance: 4000, chip: 50, min_bet: 50, max_bet: 300, jp_seat: 400, jp_spec: 300, side_max: 100 },
  };
  const tiersCfg = () => Object.assign({}, TIER_DEF, (G.lobby && G.lobby.tiers) || {});
  /** Seviyenin fişi ve sınırları (eski kayıt biçimi — bahis listesi — da okunur) */
  function tierLim(k) {
    const c = tiersCfg()[k] || {};
    const b = (c.bets || []).slice().sort((x, y) => x - y);
    const chip = c.chip || b[0] || 10;
    const min = Math.max(chip, c.min_bet || b[0] || chip);
    return { chip, min, max: Math.max(min, c.max_bet || b[b.length - 1] || min), need: c.min_balance || 0, side: Math.max(chip, c.side_max || chip * 2) };
  }
  function betsText(k) {
    const L = tierLim(k);
    return L.min === L.max ? `${fmt(L.min)} BP` : `${fmt(L.min)}–${fmt(L.max)} BP`;
  }
  function tiersStrip() {
    return ['bronze', 'silver', 'gold']
      .map((k) => {
        const L = tierLim(k);
        return `<div class="lb-tier ${k}"><b>${TIER[k]}</b><span>${betsText(k)} · fiş ${fmt(L.chip)} · ${L.need > 0 ? `oturmak için ${fmt(L.need)} BP` : 'giriş şartı yok'}</span></div>`;

      .join('');
  }
  function createSheet() {

    const tierOk = (k) => bal >= tierLim(k).need;

      const L = tierLim(k);
      return `${betsText(k)} · fiş ${fmt(L.chip)}${L.need > 0 ? ` · ${fmt(L.need)}+ BP` : ''}`;

        <div class="t-field"><span class="t-lab">Masa seviyesi</span><div class="t-seg tier-seg" data-seg="tier">

        </div></div>
        <div class="t-field"><span class="t-lab">Kimler görsün?</span><div class="t-seg" data-seg="vis"><button type="button" data-v="public" aria-pressed="true">Herkes</button><button type="button" data-v="private" aria-pressed="false">Özel (arkadaşlarım)</button></div></div>
        <div class="t-field"><span class="t-lab">İzleyiciler</span><div class="t-seg" data-seg="spec"><button type="button" data-v="1" aria-pressed="true">İzleyebilir, Bet Behind yapabilir</button><button type="button" data-v="0" aria-pressed="false">Kapalı</button></div></div>
        <label class="side-check"><input type="checkbox" name="side" checked><span class="sc-box" aria-hidden="true"></span><span class="sc-t"><b>Yan bahisler: Perfect Pairs ve 21+3</b><small>Oyuncular ana bahsin yanına isteğe bağlı yan bahis koyabilir. Perfect Pairs 25:1'e, 21+3 100:1'e kadar öder.</small></span></label>
        <p class="t-note">Masa açılınca sekiz deste karıştırılır, kesme kartı yerleştirilir ve ilk üç kart yakılır. Oyun en az iki aktif pot olunca başlar.</p>
      </form>`,
      actions: [
        { label: 'Vazgeç' },
        {
          label: 'Masayı aç',
          kind: 'primary',
          onClick: async (wrap, btn) => {

            btn.disabled = true;
            try {
              const r = await rpc('bg_bj_create', { p_name: f.name.value, p_tier: seg('tier'), p_visibility: seg('vis'), p_spectators: seg('spec') === '1', p_side: !!f.side.checked });
              openTable(r.id, false, true);
            } catch (err) {
              toast(errText(err), 'err');
              btn.disabled = false;
              return false;
            }
          },
        },
      ],
    });
    sh.body.addEventListener('click', (e) => {
      const b = e.target.closest('[data-seg] button');
      if (!b || b.disabled) return;
      $$('button', b.parentNode).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));

  /* =====================================================================
     MASA
     ===================================================================== */
  async function openTable(id, watch, wantSit, first) {
    clearInterval(G.lobbyTimer);
    G.view = 'table';
    G.tableId = id;
    G.v = -1;
    G.st = null;
    G.me = null;
    G.wantSit = !!wantSit;
    G.chat = { open: false, list: [], unread: 0, last: 0 };
    G.seenNotice = new Set();
    G.fcSeen = null;
    $('#lobby').hidden = true;
    $('#table').hidden = false;
    $('#chat').hidden = true;
    if (!G.scene) {
      G.scene = window.BJScene.create($('#scene'), {
        now,
        opt: (k) => (k === 'quality' ? opts.quality : opts[k]),
        ctx: sceneCtx,
        onSeat: onSeatAct,
        onSettled,
        onHandAct,
        onSide,
      });
      G.scene.dealer.setReduced(opts.reduced || opts.quality === 'low');
      G.scene.setNoDealer(noDealer());
      // v3.4.1: masadaki yan bahis yuvasına dokun → o yan bahse fiş ekle
      $('#scene').addEventListener('click', (e) => {
        const sp = e.target.closest('.sp.tap');
        if (!sp) return;
        e.stopPropagation();
        const no = +sp.dataset.seat;
        const k = sp.dataset.kind;
        if (!no || (k !== 'pp' && k !== 't3')) return;
        const r = sp.getBoundingClientRect();
        if (bumpSide(no, k, 'chip') && G.scene.tossChip) G.scene.tossChip(no, { x: r.left + r.width / 2, y: r.top + r.height + 40 }, betLim().chip, k);
      }, true);
      $('#hud').addEventListener('click', onHud);
      $('#controls').addEventListener('click', onControls);
      // kontrol paneli büyüyüp küçüldükçe masa yeniden sığdırılır
      if (window.ResizeObserver) new ResizeObserver(() => G.scene && G.view === 'table' && fitScene()).observe($('#scene'));
    } else G.scene.reset();
    fitScene();
    try {
      const r = first || (await rpc('bg_bj_sync', { p_table: id, p_ver: null, p_session: SESSION }));
      apply(r);
    } catch (e) {
      toast(errText(e), 'err');
      openLobby();
      return;
    }
    T.setRoute('masa=' + id + (watch ? '&izle=1' : ''));
    subscribe(id);
    loadChat();
    schedule();
  }
  function leaveTableView() {
    unsubscribe();
    clearTimeout(G.syncTimer);
    clearTimeout(G.dlTimer);
    clearInterval(G.tickTimer);
    G.tableId = null;
    if (G.scene) G.scene.reset();
    paintHostChat();
  }
  function fitScene() {
    const box = $('#scene');
    const w = box.clientWidth;
    const h = box.clientHeight;
    const port = h > w * 1.08;
    G.scene.setLayout(port ? 'port' : 'land');
    G.scene.fit(w, h);
  }

  /** Sunucu yanıtını uygula: {state, me, now} ya da {same, me} */
  function apply(r) {
    if (!r) return;
    if (r.me) G.me = r.me;
    if (r.state && (r.state.v > G.v || G.v < 0)) {
      const prev = G.st;
      G.st = r.state;
      G.v = r.state.v;
      onState(prev, G.st);
    } else if (r.me) {
      renderControls();
      renderHud();
      if (G.st) G.scene.update(viewState(), G.me);
    }
    notices();
  }
  function onState(prev, st) {
    if (st.status === 'closed' || st.state === 'CLOSED') {
      G.scene.update(st, G.me);
      toast('Masa kapandı.', 'info');
      setTimeout(() => G.view === 'table' && G.tableId === st.id && openLobby(), 2200);
      return;
    }
    // v3.3: bahis aşaması bitince ya da tur değişince gönderilmemiş (iyimser) bahisler bırakılır
    if (st.state !== 'BETTING_OPEN' || (prev && prev.round && st.round && prev.round.id !== st.round.id)) dropOpt();
    // yeni bahis turu ana bahisle başlar (yan bahis ana bahisten sonra konur)
    if (st.state === 'BETTING_OPEN' && (!prev || prev.state !== 'BETTING_OPEN')) G.betKind = 'main';
    G.scene.update(viewState(), G.me);
    renderHud();
    renderControls();
    turnSounds(prev, st);
    sitePresence(st.id);
    playing();
    // masaya katıl dendiyse ilk boş pozisyonu öner
    if (G.wantSit && G.me && !(G.me.seats || []).length) {
      G.wantSit = false;
      if (st.status === 'open' && G.me.eligible) toast('Oturmak için boş bir pozisyondaki OTUR alanına dokun.', 'info');
    }
    schedule();
  }
  /** Oynuyorken (bu turda bahsim var) site aktif süreyi sayar; izleyerek boşta beklemek sayılmaz */
  let lastAct = 0;
  function playing(force) {
    const id = myId();
    const st = G.st;
    const inRound = st && st.round && !st.round.settled && (st.seats || []).some((s) => s.user && s.user.id === id && s.bet);
    if (!force && !inRound) return;
    if (Date.now() - lastAct < 20000) return;
    lastAct = Date.now();
    if (T.activity) T.activity();
  }
  /** Bir kullanıcının (ya da koltuğun) avatar öğesi: hediye ve emoji efektleri buradan başlar */
  function seatAvatar(uid, seat) {
    if (!G.scene || !G.st || G.view !== 'table') return null;
    let no = seat != null && seat !== '' && !isNaN(+seat) ? +seat : null;
    if (no != null) {
      const s = G.st.seats.find((x) => x.no === no);
      if (!s || !s.user || (uid && s.user.id !== uid)) no = null;
    }
    if (no == null) {
      const s = (G.st.seats || []).find((x) => x.user && x.user.id === uid);
      no = s ? s.no : null;
    }
    return no ? G.scene.avatarEl(no) : null;
  }
  function sitePresence(id) {
    try {
      const B = T.site();
      if (B && B.presence) B.presence.set('blackjack', id || null);
    } catch (e) {}
  }

  /* ---------------- eşitleme döngüsü ---------------- */
  let syncing = false;
  G.debugSync = () => ({ syncing, busy: !!G.busy, rt: !!G.rtOk, v: G.v, timer: !!G.syncTimer });
  async function syncNow(full) {
    if (!G.tableId || syncing) return;
    syncing = true;
    const id = G.tableId;
    try {
      const r = await rpc('bg_bj_sync', { p_table: id, p_ver: full ? null : G.v, p_session: SESSION });
      if (G.tableId === id) apply(r);
    } catch (e) {
      if (/göremezsin/i.test(errText(e))) {
        toast('Bu masaya artık erişimin yok.', 'err');
        openLobby();
      }
    } finally {
      syncing = false;
    }
  }
  /** Kendi kendine ilerleyen motor: süre dolunca biri sunucuyu dürter (masadaki herkes) */
  function schedule() {
    clearTimeout(G.syncTimer);
    clearTimeout(G.dlTimer);
    if (!G.tableId) return;
    const seated = G.me && (G.me.seats || []).length > 0;
    G.syncTimer = setTimeout(() => {
      syncNow();
      schedule();
    }, G.rtOk ? (seated ? 5000 : 7000) : 2200);
    const st = G.st;
    if (st && st.deadline) {
      const ms = st.deadline - now() + (seated ? 60 : 160) + Math.random() * (seated ? 120 : 600);
      if (ms < 60000) G.dlTimer = setTimeout(() => syncNow(), Math.max(40, ms));
    } else if (st && st.state === 'WAITING_FOR_PLAYERS') {
      G.dlTimer = setTimeout(() => syncNow(), 3000);
    }
    clearInterval(G.tickTimer);
    G.tickTimer = setInterval(tick, 250);
  }
  let lastTickSec = -1;
  function tick() {
    if (!G.st || !G.scene) return;
    G.scene.tick();
    const st = G.st;
    // kendi sıramda son 5 saniye: tik sesi; kontroldeki süre çubuğu
    const bar = $('#controls .tbar i');
    if (bar && st.deadline) {
      const left = Math.max(0, st.deadline - now());
      bar.style.transform = `scaleX(${Math.min(1, left / 15600)})`;
      const s = Math.ceil(left / 1000);
      if (myTurnHand() && s <= 5 && s > 0 && s !== lastTickSec) {
        lastTickSec = s;
        SND.play('tick', s <= 3);
      }
    }
  }

  /* ---------------- gerçek zamanlı ---------------- */
  function subscribe(id) {
    unsubscribe();
    const B = T.site();
    if (!B || !B.api || !B.api.channel) return;
    try {
      G.rt = B.api
        .channel('bj-' + id.slice(0, 8) + '-' + rid())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'blackjack_live', filter: 'table_id=eq.' + id }, (p) => {
          if (G.dead) return;
          const st = p.new && p.new.state;
          if (!st || G.tableId !== id || st.v <= G.v) return;
          const prev = G.st;
          G.st = st;
          G.v = st.v;
          onState(prev, st);
          // kişisel bilgiler (bakiye, ön hamle, bildirim) için hafif eşitleme
          clearTimeout(G.meT);
          G.meT = setTimeout(() => syncNow(), 260 + Math.random() * 200);
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'blackjack_chat', filter: 'table_id=eq.' + id }, (p) => !G.dead && p.new && onChatRow(p.new))
        .subscribe((s) => {
          G.rtOk = s === 'SUBSCRIBED';
          schedule();
        });
    } catch (e) {
      G.rt = null;
    }
  }
  // v3.2: çerçeve kapanınca (masadan lobiye/başka sayfaya geçiş) kanal ana sayfadan kaldırılır;
  // aksi halde eski çerçeve olay almaya devam ediyordu
  window.addEventListener('pagehide', () => {
    G.dead = true;
    unsubscribe();
  });
  function unsubscribe() {
    if (G.rt) {
      try {
        G.rt.unsubscribe();
        const B = T.site();
        if (B && B.api && B.api.removeChannel) B.api.removeChannel(G.rt);
      } catch (e) {}
    }
    G.rt = null;
    G.rtOk = false;
  }

  /* =====================================================================
     SAHNE BAĞLAMI VE KOLTUK İŞLEMLERİ
     ===================================================================== */
  function myId() {
    return (G.me && G.me.id) || (T.me() && T.me().id) || null;
  }
  function sceneCtx(st, me) {
    const id = myId();
    const mine = (me && me.seats) || [];
    return {
      myId: id,
      me: me || {},
      hasSeat: mine.length > 0,
      canSit: st.status === 'open' && mine.length < 2 && me && me.eligible !== false,
      canBB: st.state === 'BETTING_OPEN' && st.spectators && !mine.length,
      betting: st.state === 'BETTING_OPEN',
      sideTap: st.state === 'BETTING_OPEN' && !!st.side_bets,
      turnSeat: st.turn ? st.turn.seat : null,
      turnHand: st.turn ? st.turn.hand : null,
      turnDeadline: st.turn ? st.turn.deadline : null,
      avatar: (u, size) => T.avatar(u, size),
      handActs: (s, hd, n) => handActs(st, me, s, hd, n),
    };
  }
  /* v3.2: elin altındaki karar düğmeleri (Hit / Stand / 2x / Split). Sırası gelmemiş elimde ön karar olarak
     saklanır (kırmızı X ile iptal). Döner: { mode, acts, pre } ya da null */
  const PRE_STATES = ['INITIAL_DEAL', 'INSURANCE_WINDOW', 'DEALER_PEEK', 'PLAYER_TURNS'];
  const HAND_ACTS = ['hit', 'stand', 'double', 'split'];
  function handActs(st, me, s, hd, n) {
    const id = myId();
    if (!s.user || !id || s.user.id !== id || hd.cards.length < 2) return null;
    const x = { seat: s.no, h: hd, n };
    // v3.3: sırası gelen elde kararlar alttaki çubuktan verilir; şerit yalnız sırası gelmemiş ellerde (ön seçim)
    if (st.state === 'PLAYER_TURNS' && st.turn && st.turn.hand === hd.id) return null;
    if (!PRE_STATES.includes(st.state) || hd.st !== 'waiting') return null;
    const pre = (((me && me.pre) || []).find((p) => p.hand === hd.id) || {}).action || null;
    return { mode: 'pre', acts: HAND_ACTS.filter((a) => legal(x, a)), pre };
  }
  function onHandAct(hand, a, mode) {
    if (mode === 'turn') {
      const x = myTurnHand();
      if (x && x.h.id === hand && a) doAction(a);
      return;
    }
    G.preHand = hand;
    setPreFor(hand, a);
  }
  /* queue: true → önceki istek sürerken gelen tıklama kaybolmaz, sırayla gönderilir (art arda bahis) */
  async function call(name, args, okMsg, queue) {
    if (G.busy && !queue) return null;
    while (G.busy) await G.busyP;
    G.busy = true;
    let done;
    G.busyP = new Promise((r) => (done = r));
    $('#controls').classList.add('busy');
    try {
      const r = await rpc(name, Object.assign({ p_table: G.tableId }, args));
      apply(r);
      if (okMsg) toast(okMsg, 'good');
      return r;
    } catch (e) {
      toast(errText(e), 'err');
      syncNow(true);
      return null;
    } finally {
      G.busy = false;
      $('#controls').classList.remove('busy');
      done();
    }
  }
  function onSeatAct(act, seat) {
    const st = G.st;
    if (!st) return;
    if (act === 'sit') {
      SND.play('click');
      call('bg_bj_sit', { p_seat: seat, p_session: SESSION });
    } else if (act === 'bet') bumpBet(seat, 'chip');
    else if (act === 'bb') bbBump(seat, 'chip');
    else if (act === 'stand') {
      const inPlay = mySeatInPlay(seat);
      T.confirm(`P${seat} pozisyonundan kalk`, inPlay ? 'Bu elin sonunda kalkılacak. Devam eden elin bahsi geri alınmaz, sonuç normal şekilde hesaplanır.' : 'Pozisyon boşalır ve başka bir oyuncu oturabilir. Bu pozisyonun Auto Rebet ayarı kapanır.', 'Kalk', 'danger').then(
        (ok) => ok && call('bg_bj_stand_up', { p_seat: seat, p_undo: false }, inPlay ? 'Bu elin sonunda kalkılacak.' : null),
      );
    } else if (act === 'unstand') call('bg_bj_stand_up', { p_seat: seat, p_undo: true });
    else if (act === 'avatar') {
      const s = st.seats.find((x) => x.no === seat);
      if (s && s.user) showPlayer(s.user, seat);
    } else if (act === 'bblist') bbList(seat);
  }
  function mySeatInPlay(seat) {
    const s = G.st && G.st.seats.find((x) => x.no === seat);
    return !!(s && s.bet_status === 'placed' && G.st.round && !G.st.round.settled);
  }
  /* ---------------- v3.3 bahis: fiş katları (en düşük – en yüksek), iyimser gösterim ----------------
     Fişe ya da pozisyona her dokunuş bir fiş ekler; değer ekranda hemen görünür, sunucuya kısa bir
     beklemeden sonra tek istekle gider (art arda dokunuşlar kaybolmaz, ekran takılmaz). */
  function betLim() {
    const st = G.st || {};
    const bets = (st.bets || []).slice().sort((a, b) => a - b);
    const chip = st.chip || bets[0] || 10;
    const min = st.min_bet || bets[0] || chip;
    let max = st.max_bet || bets[bets.length - 1] || min;
    if (G.me && G.me.max_bet) max = Math.min(max, G.me.max_bet);
    return { chip, min, max: Math.max(min, max) };
  }
  const mySeatNos = () => ((G.me && G.me.seats) || []).map((s) => s.no);
  /** Masanın sınırları içinde ve fiş adımında mı (ör. son bahsi tekrarlarken) */
  function betValid(v) {
    const L = betLim();
    return !!v && v >= L.min && v <= L.max && (v - L.min) % L.chip === 0;
  }
  /** Pozisyonun (iyimser) bahsi */
  function seatBet(no) {
    if (G.opt[no] != null) return G.opt[no];
    const s = G.st && (G.st.seats || []).find((x) => x.no === no);
    return (s && s.bet) || 0;
  }
  /** Fişin gideceği pozisyon: son dokunulan, yoksa bahsi olmayan, yoksa ilk pozisyonum */
  function betTarget() {
    const mine = mySeatNos();
    if (!mine.length) return null;
    if (G.betSeat && mine.includes(G.betSeat)) return G.betSeat;
    return mine.find((n) => !seatBet(n)) || mine[0];
  }
  /** Bahsi değiştir: how = 'chip' (bir fiş ekle) | 'max' | 'clear' | sayı */
  function bumpBet(no, how) {
    const st = G.st;
    if (!st || st.state !== 'BETTING_OPEN' || !mySeatNos().includes(no)) return;
    const L = betLim();
    const cur = seatBet(no);
    let next = how === 'clear' ? 0 : how === 'max' ? L.max : typeof how === 'number' ? how : cur ? cur + L.chip : L.min;
    if (next > L.max) {
      if (cur >= L.max) {
        toast(`Bu masada en yüksek bahis ${fmt(L.max)} BP.`, 'info');
        return;
      }
      next = L.max;
    }
    if (next) {
      const other = mySeatNos().reduce((a, n) => {
        const x = seatSide(n);
        return a + (n !== no ? seatBet(n) : 0) + (seatBet(n) ? x.pp + x.t3 : 0);
      }, 0);
      const room = ((G.me && G.me.balance) || 0) - other;
      if (next > room) {
        const fit = room >= L.min ? L.min + Math.floor((room - L.min) / L.chip) * L.chip : 0;
        if (!fit || fit <= cur) {
          toast('BP bakiyen bu bahis için yetmiyor.', 'err');
          return;
        }
        next = fit;
      }
    }
    G.betSeat = no;
    if (next === cur) return false;
    G.opt[no] = next;
    // ana bahis kalkınca yan bahisler de kalkar (sunucu satırı siler)
    if (!next) {
      clearTimeout(G.optSideT[no]);
      delete G.optSide[no];
    }
    playing(true);
    SND.play(next > cur ? 'chip' : 'click', 1);
    if (navigator.vibrate) navigator.vibrate(8);
    paint();
    clearTimeout(G.optT[no]);
    G.optT[no] = setTimeout(() => flushBet(no), 240);
    return next > cur;
  }
  async function flushBet(no) {
    clearTimeout(G.optT[no]);
    const amount = G.opt[no];
    if (amount == null) return true;
    const p = (async () => {
      const r = await call('bg_bj_bet', { p_seat: no, p_amount: amount }, null, true);
      if (G.opt[no] === amount || !r) delete G.opt[no];
      paint();
      return !!r;
    })();
    G.optP[no] = p;
    try {
      return await p;
    } finally {
      if (G.optP[no] === p) delete G.optP[no];
    }
  }
  async function flushBets() {
    let ok = true;
    for (const no of Object.keys(G.opt).map(Number)) ok = (await flushBet(no)) && ok;
    for (const no of Object.keys(G.optSide).map(Number)) ok = (await flushSide(no)) && ok;
    return ok;
  }
  function dropOpt() {
    Object.keys(G.optT).forEach((k) => clearTimeout(G.optT[k]));
    Object.keys(G.optSideT).forEach((k) => clearTimeout(G.optSideT[k]));
    G.opt = {};
    G.optT = {};
    G.optSide = {};
    G.optSideT = {};
  }

  /* ---------------- v3.4 yan bahisler: Perfect Pairs ve 21+3 ----------------
     Ana bahsi olan pozisyona, masanın fişiyle (fiş – yan bahis sınırı). Alttaki "Ana bahis / Perfect Pairs /
     21+3" seçimi fişin, Max'ın ve bahis alanına dokunuşun hangi bahse gideceğini belirler. */
  const SIDE_LBL = { pp: 'Perfect Pairs', t3: '21+3' };
  const sideOn = () => !!(G.st && G.st.side_bets);
  function sideLim() {
    const L = betLim();
    return { chip: L.chip, max: Math.max(L.chip, (G.st && G.st.side_max) || L.chip * 2) };
  }
  /** Pozisyonun (iyimser) yan bahisleri */
  function seatSide(no) {
    const o = G.optSide[no];
    const s = G.st && (G.st.seats || []).find((x) => x.no === no);
    const sd = (s && s.side) || {};
    const live = !sd.st || sd.st === 'none';
    return { pp: o ? o.pp : live ? sd.pp || 0 : 0, t3: o ? o.t3 : live ? sd.t3 || 0 : 0 };
  }
  function sideValid(v) {
    const S = sideLim();
    return !!v && v >= S.chip && v <= S.max && v % S.chip === 0;
  }
  /** Yan bahsi değiştir: how = 'chip' | 'max' | 'clear' | sayı */
  function bumpSide(no, kind, how, quiet) {
    const st = G.st;
    if (!st || st.state !== 'BETTING_OPEN' || !mySeatNos().includes(no) || !sideOn()) return false;
    if (!seatBet(no)) {
      toast('Yan bahis için önce bu pozisyona ana bahsini koy.', 'info');
      return false;
    }
    const S = sideLim();
    const cur = seatSide(no);
    const was = cur[kind];
    let next = how === 'clear' ? 0 : how === 'max' ? S.max : typeof how === 'number' ? how : was + S.chip;
    if (next > S.max) {
      if (was >= S.max) {
        toast(`${SIDE_LBL[kind]} bu masada en fazla ${fmt(S.max)} BP.`, 'info');
        return false;
      }
      next = S.max;
    }
    if (next > was) {
      const used = mySeatNos().reduce((a, n) => {
        const x = seatSide(n);
        return a + seatBet(n) + x.pp + x.t3;
      }, 0) - was;
      const room = ((G.me && G.me.balance) || 0) - used;
      if (next > room) {
        const fit = Math.floor(room / S.chip) * S.chip;
        if (fit <= was) {
          toast('BP bakiyen bu yan bahis için yetmiyor.', 'err');
          return false;
        }
        next = fit;
      }
    }
    G.betSeat = no;
    if (next === was) return false;
    G.optSide[no] = Object.assign({}, cur, { [kind]: next });
    playing(true);
    if (!quiet) {
      SND.play(next > was ? 'chip' : 'click', 1);
      if (navigator.vibrate) navigator.vibrate(8);
    }
    paint();
    clearTimeout(G.optSideT[no]);
    G.optSideT[no] = setTimeout(() => flushSide(no), 260);
    return next > was;
  }
  async function flushSide(no) {
    clearTimeout(G.optSideT[no]);
    if (!G.optSide[no]) return true;
    // yan bahis ana bahsin satırına yazılır: yoldaki ana bahis beklenir, bekleyen ana bahis önce gider
    if (G.optP[no]) await G.optP[no];
    if (G.opt[no] != null && !(await flushBet(no))) return false;
    const cur = G.optSide[no];
    if (!cur) return true;
    const r = await call('bg_bj_side', { p_seat: no, p_pp: cur.pp, p_t3: cur.t3 }, null, true);
    if (G.optSide[no] === cur || !r) delete G.optSide[no];
    paint();
    return !!r;
  }
  /** Ekrana çizilen durum: bahis aşamasında gönderilmeyi bekleyen bahisler işlenmiş kopya */
  function viewState() {
    const st = G.st;
    if (!st || st.state !== 'BETTING_OPEN' || (!Object.keys(G.opt).length && !Object.keys(G.optSide).length)) return st;
    return Object.assign({}, st, {
      seats: (st.seats || []).map((s) => {
        let x = s;
        if (G.opt[s.no] != null && G.opt[s.no] !== s.bet) x = Object.assign({}, x, { bet: G.opt[s.no] || 0, confirmed: false, bet_status: G.opt[s.no] ? 'pending' : null });
        const o = G.optSide[s.no];
        if (!x.bet && x.side) x = Object.assign({}, x, { side: null });
        else if (x.bet && o) x = Object.assign({}, x, { confirmed: false, side: o.pp || o.t3 ? { pp: o.pp, t3: o.t3, st: 'none' } : null });
        return x;
      }),
    });
  }
  function paint() {
    if (!G.st || !G.scene) return;
    G.scene.update(viewState(), G.me);
    renderControls();
  }
  /** Bet Behind: izleyici tek pozisyona oynar; fiş ekler (sıralı istek, en güncel tutardan) */
  function bbBump(seat, how) {
    const st = G.st;
    if (!st || st.state !== 'BETTING_OPEN') return;
    if (!st.spectators) return toast('Bu masada izleyici bahsi kapalı.', 'err');
    const cur = G.me && G.me.bb && G.me.bb.status === 'PENDING' ? G.me.bb : null;
    if (cur && seat != null && cur.seat !== seat) {
      toast(`Bu turda P${cur.seat} pozisyonuna Bet Behind yaptın. Bir turda tek pozisyona oynanır.`, 'err');
      return;
    }
    const to = seat != null ? seat : cur ? cur.seat : null;
    if (to == null) return toast('Önce Bet Behind yapacağın oyuncunun bahis alanına dokun.', 'info');
    const L = betLim();
    const now0 = cur ? cur.amount : 0;
    let next = how === 'clear' ? 0 : how === 'max' ? L.max : now0 ? now0 + L.chip : L.min;
    if (next > L.max) {
      if (now0 >= L.max) return toast(`Bu masada en yüksek bahis ${fmt(L.max)} BP.`, 'info');
      next = L.max;
    }
    if (next > ((G.me && G.me.balance) || 0)) return toast('BP bakiyen bu bahis için yetmiyor.', 'err');
    SND.play(next > now0 ? 'chip' : 'click', 2);
    call('bg_bj_bet_behind', { p_seat: to, p_amount: next }, null, true);
  }

  /* =====================================================================
     ALT KARAR ÇUBUĞU (v3.3) — örnek oyundaki gibi kararlar alttan verilir:
     PES ET · İKİ KAT · BÖL · DUR · KART AL. Sırası gelmemiş elde aynı düğmeler
     ön seçimdir (onay işareti; tekrar dokununca kalkar). Yatay telefonda
     düğmeler masanın iki alt köşesine yerleşir, masa tam genişlikte kalır.
     ===================================================================== */
  function myHands() {
    const id = myId();
    const out = [];
    (G.st && G.st.seats || []).forEach((s) => {
      if (s.user && s.user.id === id) (s.hands || []).forEach((h) => out.push({ seat: s.no, h, n: s.hands.length }));
    });
    return out;
  }
  function myTurnHand() {
    const st = G.st;
    if (!st || st.state !== 'PLAYER_TURNS' || !st.turn || st.turn.user !== myId()) return null;
    return myHands().find((x) => x.h.id === st.turn.hand) || null;
  }
  function legal(x, a) {
    const h = x.h;
    const bal = (G.me && G.me.balance) || 0;
    if (a === 'hit' || a === 'stand') return true;
    const two = h.cards.length === 2;
    const v = (c) => ('TJQK'.includes(c[0]) ? 10 : c[0] === 'A' ? 1 : +c[0]);
    const splitAces = h.split && h.cards[0] && h.cards[0][0] === 'A';
    if (a === 'double') return two && !splitAces && bal >= h.bet;
    if (a === 'split') return two && v(h.cards[0]) === v(h.cards[1]) && x.n < 4 && !splitAces && bal >= h.bet;
    if (a === 'surrender') return two && !h.split;
    return false;
  }
  const sumTxt = (h) => (h.soft && h.total < 21 ? `${h.total - 10}/${h.total}` : String(h.total));
  /** Karar düğmesi: yuvarlak simge + yazı; ön seçimde onay halkası */
  function abtn(a, label, k, o) {
    return `<button type="button" class="ab a-${a}${o.on ? ' on' : ''}" ${o.pre ? `data-pre="${a}" aria-pressed="${!!o.on}"` : `data-act="${a}"`} ${o.ok ? '' : 'disabled'} aria-label="${label}${o.pre ? (o.on ? ', ön seçim, kaldırmak için dokun' : ', ön seçim') : ''}">`
      + `<span class="ab-d"><i>${AICON[a]}</i>${o.pre ? `<em class="ab-chk">${ic.check}</em>` : ''}</span><b>${label}</b>${o.pre ? '' : `<kbd>${k}</kbd>`}</button>`;
  }
  function sbtn(attr, icon, label, o) {
    o = o || {};
    return `<button type="button" class="ab sb${o.cls ? ' ' + o.cls : ''}" ${attr} ${o.ok === false ? 'disabled' : ''} aria-label="${o.aria || label}"><span class="ab-d"><i>${icon}</i></span><b>${label}</b></button>`;
  }
  function dock(mode, info, left, right, center, extra) {
    return `<div class="dock" data-mode="${mode}">${info ? `<div class="dk-info">${info}</div>` : ''}`
      + `<div class="dk-bar"><div class="dk-l">${left || ''}</div>${center != null ? `<div class="dk-c">${center}</div>` : ''}<div class="dk-r">${right || ''}</div></div>${extra || ''}</div>`;
  }
  function arPills(mySeats) {
    return mySeats.length
      ? `<span class="ar-group">${mySeats
          .map((s) => `<button type="button" class="ar${s.auto ? ' on' : ''}" data-ar="${s.no}" aria-pressed="${!!s.auto}" title="Auto Rebet: her tur aynı bahsi kendiliğinden koyar${s.last_bet ? ' (son bahis ' + s.last_bet + ' BP)' : ''}"><i>↻</i><span>Auto Rebet</span>${mySeats.length > 1 ? `<em>P${s.no}</em>` : ''}</button>`)
          .join('')}</span>`
      : '';
  }
  function chipBtn(L, label) {
    return `<button type="button" class="pchip big" data-chip aria-label="${label}"><svg viewBox="0 0 100 100" aria-hidden="true">${window.BJCards.chipSVG(L.chip)}</svg><span class="pc-plus">+${fmt(L.chip)}</span></button>`;
  }
  function renderControls() {
    const box = $('#controls');
    const st = G.st;
    const me = G.me || {};
    if (!st) {
      box.innerHTML = '';
      box._html = '';
      return;
    }
    const mySeats = me.seats || [];
    const L = betLim();
    const turn = myTurnHand();
    let html;
    if (st.state === 'BETTING_OPEN' && mySeats.length) {
      const tgt = betTarget();
      const amt = seatBet(tgt);
      const anyBet = mySeats.some((s) => seatBet(s.no));
      const allOk = mySeats.every((s) => {
        const x = st.seats.find((y) => y.no === s.no) || {};
        return !seatBet(s.no) || (x.confirmed && G.opt[s.no] == null && !G.optSide[s.no]);
      });
      const canRebet = mySeats.some((s) => !seatBet(s.no) && betValid(s.last_bet));
      const side = sideOn();
      G.betKind = 'main';
      const kind = 'main';
      const sd = seatSide(tgt);
      const S = sideLim();
      const tabs = mySeats.length > 1
        ? `<span class="dk-tabs">${mySeats.map((s) => {
            const x = st.seats.find((y) => y.no === s.no) || {};
            const b = seatBet(s.no);
            return `<button type="button" data-bs="${s.no}" aria-pressed="${s.no === tgt}"><em>P${s.no}</em>${b ? fmt(b) + (x.confirmed && G.opt[s.no] == null ? ' ✓' : '') : '—'}</button>`;
          }).join('')}</span>`
        : '';
      // v3.4.1: yan bahisler kendi sayaçlarında: dokun → fiş ekle, × → temizle (masadaki yuvaya dokunmak da ekler)
      const hasMain = !!amt;
      const sideRow = side
        ? `<span class="sbk-row" role="group" aria-label="Yan bahisler">${[['pp', 'PP', 'Perfect Pairs: ilk iki kartın çift (6:1 · 12:1 · 25:1)'], ['t3', '21+3', '21+3: iki kartın ve krupiyenin açık kartı (5:1 – 100:1)']]
            .map(([k, sh, tip]) => `<span class="sbk sbk-${k}${sd[k] ? ' on' : ''}${hasMain ? '' : ' off'}"><button type="button" class="sbk-add" data-sb="${k}" title="${tip}" aria-label="${SIDE_LBL[k]} için ${fmt(S.chip)} BP ekle"${hasMain ? '' : ' aria-disabled="true"'}><i>${sh}</i><b>${sd[k] ? fmt(sd[k]) : '+' + fmt(S.chip)}</b></button>${sd[k] ? `<button type="button" class="sbk-x" data-sbx="${k}" aria-label="${SIDE_LBL[k]} temizle">×</button>` : ''}</span>`)
            .join('')}<small class="sbk-cap">yan bahis · en fazla ${fmt(S.max)}</small></span>`
        : '';
      const allReadyHint = mySeats.length && anyBet ? (allOk ? 'Hazırsın. Herkes hazırsa süre 3 sn’ye iner.' : 'Bahsini koy ve Hazır’a bas; herkes hazırsa 3 sn kalır.') : 'Fişe dokun, bahsini kur, Hazır’a bas.';
      const who = `<p class="dk-who${side ? ' has-kind' : ''}"><b>Bahis</b><span class="dk-amt">${fmt(amt)} BP</span><small>${fmt(L.min)}–${fmt(L.max)} BP · fiş ${fmt(L.chip)} · ${allReadyHint}</small></p>`;
      const info = `${who}${sideRow}${tabs}${arPills(mySeats)}`;
      const maxOk = amt < L.max;
      html = dock(
        'bet',
        info,
        sbtn('data-clear', ic.clear, 'Temizle', { ok: anyBet }) + sbtn('data-rebet', ic.redo, 'Tekrarla', { ok: canRebet, aria: 'Son bahsini tekrarla' }),
        sbtn('data-max', ic.max, 'Max', { ok: maxOk, aria: `En yüksek bahis (${fmt(L.max)} BP)` }) + sbtn('data-confirm', ic.check, allOk && anyBet ? 'Hazırsın' : 'Hazır', { ok: anyBet && !allOk, cls: 'go' + (allOk && anyBet ? ' done' : '') }),
        chipBtn(L, `${fmt(L.chip)} BP fiş ekle`),
      );
    } else if (st.state === 'BETTING_OPEN' && st.spectators && !mySeats.length) {
      const bb = me.bb && me.bb.status === 'PENDING' ? me.bb : null;
      const info = `<p class="dk-who"><b class="bbt">Bet Behind</b><span class="dk-amt">${bb ? `P${bb.seat} · ${fmt(bb.amount)} BP` : 'pozisyon seç'}</span><small>${bb ? 'Ana oyuncunun bütün kararlarını (Double, Split dahil) takip eder.' : 'Bir oyuncunun bahis alanına dokun; fiş her dokunuşta eklenir.'}</small></p>`;
      html = dock(
        'bb',
        info,
        sbtn('data-bbclear', ic.clear, 'Kaldır', { ok: !!bb }),
        sbtn('data-bbmax', ic.max, 'Max', { ok: !!bb && bb.amount < L.max }),
        chipBtn(L, `Bet Behind'a ${fmt(L.chip)} BP ekle`),
      );
    } else if (st.state === 'INSURANCE_WINDOW' && mySeats.length) {
      const open = (st.seats || []).filter((s) => s.user && s.user.id === myId() && s.bet_status === 'placed' && !s.ins_decided);
      if (open.length) {
        const s0 = open[0];
        html = dock(
          'ins',
          `<p class="dk-who"><b>Sigorta?</b><span>P${s0.no} · ${fmt(s0.bet / 2)} BP</span><small>Krupiyenin açık kartı As. Krupiye blackjack yaparsa sigorta 2:1 öder.</small></p>`,
          sbtn(`data-ins="${s0.no}" data-take="0"`, ic.clear, 'Alma'),
          sbtn(`data-ins="${s0.no}" data-take="1"`, ic.shield, 'Sigorta al', { cls: 'go' }),
          null,
        );
      } else html = dock('wait', null, '', '', `<p class="ctl-status">Diğer oyuncuların sigorta kararı bekleniyor…</p>`);
    } else if (turn) {
      const info = `<p class="dk-who"><b>Sıra sende</b><span>P${turn.seat}${turn.n > 1 ? ' · el ' + (turn.h.i + 1) : ''}</span><em class="dk-sum">${sumTxt(turn.h)}</em></p>${handRead(turn)}`;
      const b = (row) => row.map(([a, l, k]) => abtn(a, l, k, { ok: legal(turn, a) })).join('');
      html = dock('turn', info, b(ACT.slice(0, 3)), b(ACT.slice(3)), null, '<div class="tbar" aria-hidden="true"><i></i></div>');
    } else {
      const waiting = ['INITIAL_DEAL', 'INSURANCE_WINDOW', 'DEALER_PEEK', 'PLAYER_TURNS'].includes(st.state)
        ? myHands().filter((x) => x.h.st === 'waiting' && x.h.cards.length >= 2)
        : [];
      if (waiting.length) {
        if (!waiting.some((x) => x.h.id === G.preHand)) G.preHand = waiting[0].h.id;
        const x = waiting.find((y) => y.h.id === G.preHand);
        const cur = ((me.pre || []).find((p) => p.hand === x.h.id) || {}).action || null;
        const tabs = waiting.length > 1
          ? `<span class="dk-tabs">${waiting.map((y) => `<button type="button" data-ph="${y.h.id}" aria-pressed="${y.h.id === x.h.id}">P${y.seat}${y.n > 1 ? '·' + (y.h.i + 1) : ''}<em>${sumTxt(y.h)}</em></button>`).join('')}</span>`
          : '';
        const info = `<p class="dk-who"><b>Ön seçim</b><span>P${x.seat}${x.n > 1 ? ' · el ' + (x.h.i + 1) : ''}</span><em class="dk-sum">${sumTxt(x.h)}</em><small>${cur ? 'Sıran gelince uygulanır. Kaldırmak için yeniden dokun.' : 'Sıran gelmeden seç; sıran gelince uygulanır.'}</small></p>${tabs}`;
        const b = (row) => row.map(([a, l, k]) => abtn(a, l, k, { ok: legal(x, a), pre: true, on: cur === a })).join('');
        html = dock('pre', info, b(ACT.slice(0, 3)), b(ACT.slice(3)), null);
      } else if (st.state === 'RESULT_DISPLAY' && st.round && st.round.settled && !st.round.cancelled && myRoundNet() != null) {
        const n = myRoundNet();
        html = dock('res', arPills(mySeats), '', '', `<div class="ctl-res ${n > 0 ? 'win' : n < 0 ? 'lose' : 'push'}"><span>Bu tur</span><b>${sgn(n)} BP</b><small>Yeni tur birazdan başlıyor.</small></div>`);
      } else html = dock('wait', mySeats.length ? arPills(mySeats) : null, '', '', `<p class="ctl-status">${esc(statusLine(st))}</p>`);
    }
    if (box._html !== html) {
      box.innerHTML = html;
      box._html = html;
      const bar = $('.tbar i', box);
      if (bar && st.deadline) bar.style.transform = `scaleX(${Math.min(1, Math.max(0, st.deadline - now()) / 15600)})`;
    }
    box.dataset.mode = (box.firstElementChild && box.firstElementChild.dataset.mode) || '';
  }
  /** Bu turdaki net sonucum (pozisyonlarım + Bet Behind); turda yoksam null */
  function myRoundNet() {
    const id = myId();
    let net = null;
    (G.st.seats || []).forEach((s) => {
      if (s.user && s.user.id === id && s.net != null) net = (net || 0) + s.net;
    });
    const bb = G.me && G.me.bb;
    if (bb && bb.status && bb.status.startsWith('SETTLED_')) net = (net || 0) + (bb.payout - bb.total);
    return net;
  }
  /** Elimin büyük yazılı özeti: kartlar, toplam ve krupiyenin açık kartı */
  function handRead(x) {
    const red = (c) => c[1] === 'H' || c[1] === 'D';
    const lab = (c) => (c[0] === 'T' ? '10' : c[0]) + ({ S: '♠', H: '♥', D: '♦', C: '♣' })[c[1]];
    const d = G.st && G.st.dealer && G.st.dealer.cards[0];
    return `<div class="hand-read">${d ? `<span class="mc-dl">Krupiye</span><span class="mc${red(d) ? ' r' : ''}">${lab(d)}</span><span class="mc-dl">Sen</span>` : ''}${x.h.cards
      .map((c) => `<span class="mc${red(c) ? ' r' : ''}">${lab(c)}</span>`)
      .join('')}</div>`;
  }
  function statusLine(st) {
    const me = G.me || {};
    const mySeats = me.seats || [];
    if (st.state === 'WAITING_FOR_PLAYERS') return mySeats.length ? 'İkinci aktif pot bekleniyor.' : me.eligible === false ? `Bu masada oturmak için ${fmt(st.min_balance)} BP gerekli. İzleyici olarak devam ediyorsun.` : 'Boş bir pozisyona oturarak oyuna katılabilirsin.';
    if (st.state === 'BETTING_OPEN') return st.spectators ? 'Bahisler açık.' : 'Bahisler açık. Bu masada izleyici bahsi kapalı.';
    if (st.state === 'PLAYER_TURNS' && st.turn) {
      const s = st.seats.find((x) => x.no === st.turn.seat);
      return `${s && s.user ? s.user.name : 'P' + st.turn.seat} oynuyor (P${st.turn.seat}).`;
    }
    if (st.state === 'DEALER_TURN') return 'Krupiye oynuyor.';
    if (st.state === 'RESULT_DISPLAY') return 'Sonuçlar. Yeni tur birazdan başlıyor.';
    if (st.state === 'SHOE_RESHUFFLE') return 'Yeni sabot hazırlanıyor.';
    if (st.state === 'PAUSED') return 'Masa duraklatıldı.';
    if (st.state === 'INSURANCE_WINDOW') return 'Sigorta kararları bekleniyor.';
    return STATE_TXT[st.state] || '';
  }
  async function onControls(e) {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    const st = G.st;
    const me = G.me || {};
    if (!st) return;
    if (b.hasAttribute('data-chip')) {
      b.classList.remove('tap');
      void b.offsetWidth;
      b.classList.add('tap');
      if ((me.seats || []).length) {
        const no = betTarget();
        const r = b.getBoundingClientRect();
        const up = bumpBet(no, 'chip');
        if (up && G.scene.tossChip) G.scene.tossChip(no, { x: r.left + r.width / 2, y: r.top + r.height / 2 }, betLim().chip, 'main');
        return;
      }
      return bbBump(null, 'chip');
    }
    if (b.dataset.bs) {
      G.betSeat = +b.dataset.bs;
      SND.play('click');
      return renderControls();
    }
    if (b.dataset.sb) {
      const no = betTarget();
      if (!seatBet(no)) return toast('Yan bahis için önce ana bahsini koy.', 'info');
      const r = b.getBoundingClientRect();
      if (bumpSide(no, b.dataset.sb, 'chip') && G.scene.tossChip) G.scene.tossChip(no, { x: r.left + r.width / 2, y: r.top + r.height / 2 }, sideLim().chip, b.dataset.sb);
      return;
    }
    if (b.dataset.sbx) return bumpSide(betTarget(), b.dataset.sbx, 'clear');
    if (b.hasAttribute('data-max')) return bumpBet(betTarget(), 'max');
    if (b.hasAttribute('data-bbmax')) return bbBump(null, 'max');
    if (b.hasAttribute('data-clear')) {
      for (const s of me.seats || []) if (seatBet(s.no)) bumpBet(s.no, 'clear');
      return;
    }
    if (b.hasAttribute('data-confirm')) {
      SND.play('chipsStack');
      if (navigator.vibrate) navigator.vibrate(14);
      if (!(await flushBets())) return;
      return call('bg_bj_bet_confirm', {}, null, true);
    }
    if (b.hasAttribute('data-rebet')) {
      // son bahsi (yan bahisleriyle birlikte), bahsi olmayan pozisyonlara tekrar koy
      (me.seats || []).forEach((s) => {
        if (seatBet(s.no) || !betValid(s.last_bet)) return;
        bumpBet(s.no, s.last_bet);
        if (!sideOn() || !seatBet(s.no)) return;
        if (sideValid(s.last_pp)) bumpSide(s.no, 'pp', s.last_pp, true);
        if (sideValid(s.last_t3)) bumpSide(s.no, 't3', s.last_t3, true);
      });
      return;
    }
    if (b.hasAttribute('data-bbclear')) return call('bg_bj_bet_behind', { p_seat: me.bb.seat, p_amount: 0 });
    if (b.dataset.ar) {
      const s = (me.seats || []).find((x) => x.no === +b.dataset.ar);
      SND.play('click');
      return call('bg_bj_auto_rebet', { p_seat: +b.dataset.ar, p_on: !(s && s.auto) });
    }
    if (b.dataset.ins) {
      SND.play(b.dataset.take === '1' ? 'chip' : 'click');
      return call('bg_bj_insurance', { p_seat: +b.dataset.ins, p_take: b.dataset.take === '1' });
    }
    if (b.dataset.act) return doAction(b.dataset.act);
    if (b.dataset.ph) {
      G.preHand = +b.dataset.ph;
      SND.play('click');
      return renderControls();
    }
    if (b.dataset.pre) return setPre(b.dataset.pre);
  }
  function doAction(a) {
    const x = myTurnHand();
    if (!x || !legal(x, a) || G.busy) return;
    playing(true);
    SND.play(a === 'double' || a === 'split' ? 'chipsStack' : 'click');
    if (navigator.vibrate) navigator.vibrate(12);
    const btn = $(`#controls [data-act="${a}"]`);
    if (btn) btn.classList.add('fired');
    call('bg_bj_act', { p_hand: x.h.id, p_action: a, p_req: rid() });
  }
  function setPre(a) {
    const cur = (((G.me || {}).pre || []).find((p) => p.hand === G.preHand) || {});
    return setPreFor(G.preHand, cur.action === a ? null : a);
  }
  /** Bir elin ön kararı: a = hamle, null = iptal */
  async function setPreFor(hand, a) {
    const me = G.me || {};
    const cur = ((me.pre || []).find((p) => p.hand === hand) || {});
    const next = a || null;
    if ((cur.action || null) === next) return;
    const rev = Math.max(G.preRev[hand] || 0, cur.rev || 0) + 1;
    G.preRev[hand] = rev;
    // iyimser gösterim: sunucu onaylayana kadar seçim görünür
    me.pre = (me.pre || []).filter((p) => p.hand !== hand).concat(next ? [{ hand, action: next, rev }] : []);
    renderControls();
    G.scene.update(viewState(), G.me);
    SND.play('click');
    try {
      const r = await rpc('bg_bj_preaction', { p_table: G.tableId, p_hand: hand, p_action: next, p_rev: rev });
      if (G.preRev[hand] === rev) apply(r);
    } catch (e) {
      toast(errText(e), 'err');
      syncNow(true);
    }
  }
  function onKey(e) {
    if (G.view !== 'table' || e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toUpperCase();
    const a = ACT.find((x) => x[2] === k);
    if (a && myTurnHand()) {
      e.preventDefault();
      doAction(a[0]);
    }
  }
  function turnSounds(prev, st) {
    const t = myTurnHand();
    const key = t ? t.h.id + ':' + t.h.cards.length : '';
    if (key && key !== G.lastTurnKey) {
      SND.play('turn');
      if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
    }
    G.lastTurnKey = key;
    if (prev && prev.state !== 'BETTING_OPEN' && st.state === 'BETTING_OPEN' && (G.me && G.me.seats || []).length) SND.play('turn');
  }

  /* v3.4: kendi yan bahis sonucum (dağıtımdan hemen sonra) */
  const SIDE_RES = { perfect: 'Mükemmel çift', colored: 'Renkli çift', mixed: 'Karışık çift', suited_trips: 'Aynı türden üçlü',
                     straight_flush: 'Sıralı floş', trips: 'Üçlü', straight: 'Kent', flush: 'Floş' };
  function onSide(s, sd, live) {
    if (!live || !s.user || s.user.id !== myId()) return;
    const won = [];
    if (sd.pp_pay > 0) won.push(`Perfect Pairs: ${SIDE_RES[sd.pp_r] || ''} ${sd.pp_pay / sd.pp - 1}:1 (+${fmt(sd.pp_pay - sd.pp)} BP)`);
    if (sd.t3_pay > 0) won.push(`21+3: ${SIDE_RES[sd.t3_r] || ''} ${sd.t3_pay / sd.t3 - 1}:1 (+${fmt(sd.t3_pay - sd.t3)} BP)`);
    if (won.length) toast(`P${s.no} yan bahis kazandı! ${won.join(' · ')}`, 'good');
  }
  /* ---------------- sonuç paneli (kendi sonucum) ---------------- */
  function onSettled(st) {
    const id = myId();
    let net = 0;
    let n = 0;
    let bj = false;
    let outs = [];
    st.seats.forEach((s) => {
      if (!s.user || s.user.id !== id || s.net == null) return;
      net += s.net;
      n++;
      (s.hands || []).forEach((h) => {
        outs.push(h.out);
        if (h.out === 'blackjack') bj = true;
      });
    });
    let kind = null;
    // v3.4: yan bahis oynandıysa sonuç net kazanca göre (ana el kaybedip yan bahis kazandırmış olabilir)
    const side = st.seats.some((s) => s.user && s.user.id === id && s.side && s.side.st === 'settled');
    if (n) {
      if (outs.length === 1 && !side) kind = outs[0] === 'blackjack' ? 'blackjack' : outs[0];
      else kind = bj && net > 0 ? 'blackjack' : net > 0 ? 'win' : net < 0 ? 'lose' : 'push';
    }
    const bb = G.me && G.me.bb;
    if (!n && bb && bb.status && bb.status !== 'PENDING') {
      if (bb.status === 'REFUNDED_INSUFFICIENT_BP') {
        kind = 'refund';
        net = 0;
      } else if (bb.status.startsWith('SETTLED_')) {
        net = bb.payout - bb.total;
        kind = bb.status === 'SETTLED_WIN' ? 'win' : bb.status === 'SETTLED_PUSH' ? 'push' : bb.status === 'SETTLED_SURRENDER' ? 'surrender' : 'lose';
      }
    }
    if (!kind) return;
    setTimeout(() => {
      G.scene.showResult(kind, net, n > 1 ? `${n} pot toplamı${side ? ', yan bahisler dahil' : ''}` : side ? 'Yan bahisler dahil' : bb && !n ? `Bet Behind · P${bb.seat}` : '');
      SND.play(kind === 'blackjack' ? 'blackjack' : kind === 'win' ? 'win' : kind === 'push' || kind === 'refund' ? 'push' : 'lose');
    }, 900);
  }

  /* ---------------- bildirimler ---------------- */
  function notices() {
    const list = (G.me && G.me.notices) || [];
    list.forEach((n) => {
      if (G.seenNotice.has(n.id)) return;
      G.seenNotice.add(n.id);
      if (G.seenNotice.size <= list.length && !G.noticeReady) return;
      const d = n.data || {};
      const map = {
        autorebet_skip: d.why === 'tier' ? `P${d.seat}: Auto Rebet ${d.amount} BP bahsi BP seviyene uymadığı için konmadı.` : `P${d.seat}: Bakiye yetersiz, Auto Rebet ${d.amount} BP bahsi konmadı.`,
        autorebet_off: `P${d.seat}: Bağlantı koptuğu için Auto Rebet kapandı.`,
        bet_dropped: `P${d.seat}: ${d.amount} BP bahis tahsil edilemediği için tura alınmadı.`,
        bb_refund: `Bet Behind: ana oyuncunun ${d.kind === 'split' ? 'bölme' : 'ikiye katlama'} kararını takip edecek BP yetmedi. Bu turdaki bütün Bet Behind bahislerin (${d.amount} BP) iade edildi.`,
        bb_dropped: d.why === 'seat_left' ? `P${d.seat} oyuncusu kalktığı için Bet Behind bahsin kaldırıldı.` : `P${d.seat} bu turda oynamadığı için Bet Behind bahsin alınmadı.`,
        pre_invalid: `Ön hamlen uygulanamadı: ${d.why || ''} Şimdi karar ver.`,
        leave: d.why === 'balance' ? `P${d.seat}: BP bakiyen bu masanın eşiğinin altına düştü, pozisyondan kalktın. İzlemeye devam edebilirsin.` : d.why === 'disconnected' ? `P${d.seat}: Uzun süre bağlantı olmadığı için pozisyon boşaltıldı.` : null,
        side_dropped: `P${d.seat}: BP bakiyen yetmediği için yan bahsin alınmadı; ana bahsin oynuyor.`,
      };
      const txt = map[n.type];
      if (txt) toast(txt, n.type === 'leave' || n.type === 'bb_refund' ? 'err' : 'info');
    });
    G.noticeReady = true;
    // v3.4: arkadaşlarla her 10 elde Friend Coins (masaya girerken görülen eski kayıt bildirilmez)
    const fc = G.me && G.me.fc;
    const fid = fc ? fc.id : 0;
    if (G.fcSeen === null) G.fcSeen = fid;
    else if (fid && fid !== G.fcSeen) {
      G.fcSeen = fid;
      if (fc.amount > 0) toast(`🤝 Arkadaşlarınla oynadığın eller için +${fmt(fc.amount)} Friend Coins`, 'good');
    }
  }

  /* =====================================================================
     ÜST ÇUBUK
     ===================================================================== */
  function renderHud() {
    const st = G.st;
    const me = G.me || {};
    if (!st) return;
    const jp = st.jackpot || { streak: 0, need: 5 };
    const dots = Array.from({ length: jp.need }, (_, i) => `<i class="${i < jp.streak ? 'on' : ''}"></i>`).join('');
    const html = `
      <button type="button" class="hud-btn" data-lobby aria-label="Lobiye dön">‹</button>

      <div class="hud-jp" title="Yedi pot aynı turda kazanırsa seri ilerler; 5 tur üst üste olunca jackpot: pot başına ${st.jackpot.seat_reward} BP, Bet Behind izleyicisine ${st.jackpot.spec_reward} BP">
        <small>JACKPOT STREAK</small><span class="jp-dots">${dots}</span><b>${jp.streak}/${jp.need}</b></div>
