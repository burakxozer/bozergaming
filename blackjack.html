    if (G.scene) G.scene.dealer.setReduced(opts.reduced || opts.quality === 'low');
  };

  /* ---------------- sunucu saati ---------------- */
  const clock = { off: 0, rtt: Infinity, n: 0 };
  const now = () => Date.now() + clock.off;
  async function rpc(name, args) {
    const t0 = Date.now();
    const r = await T.rpc(name, args || {});
    const t1 = Date.now();
    if (r && typeof r === 'object' && typeof r.now === 'number') {
      const rtt = t1 - t0;
      const off = r.now - (t0 + t1) / 2;
      if (!clock.n || rtt <= clock.rtt * 1.5) {
        clock.off = clock.n ? clock.off * 0.5 + off * 0.5 : off;
        clock.rtt = Math.min(clock.rtt, rtt);
      }
      clock.n++;
    }
    return r;
  }
  const errText = (e) => (e && e.message) || 'İşlem yapılamadı. Bağlantını kontrol et.';
  const toast = (text, kind) => T.toast(text, kind);

  /* ---------------- genel durum ---------------- */
  const G = {
    view: null,
    tableId: null,
    st: null,
    me: null,
    v: -1,
    scene: null,
    chip: Number(localStorage.getItem('bj.chip') || 10),
    busy: false,
    preRev: {},
    seenNotice: new Set(),
    chat: { open: false, list: [], unread: 0, last: 0 },
    gifts: null,
    lobbyTimer: null,
    syncTimer: null,
    dlTimer: null,
    rt: null,
    rtOk: false,
    lastTurnKey: '',
  };
  window.BJApp = G;

  /* =====================================================================
     AÇILIŞ
     ===================================================================== */
  function boot() {
    document.documentElement.dataset.q = opts.quality;
    if (!T.inSite()) {
      $('#lobby').hidden = false;
      $('#lobby').innerHTML = `<div class="lb-empty"><h1>Blackjack Royale</h1><p>Bu oyun Bözer Gaming sitesinin içinden açılır ve çevrim içi oynanır.</p><a class="t-btn is-primary" href="index.html#/oyun/blackjack">Bözer Gaming’e git</a></div>`;
      return;
    }
    if (!T.authed()) {
      $('#lobby').hidden = false;
      $('#lobby').innerHTML = `<div class="lb-empty"><h1>Blackjack Royale</h1><p>Blackjack Royale gerçek oyuncularla çevrim içi oynanır. Bahisler Bözer Points (BP) ile yapılır.</p><button class="t-btn is-primary" type="button" data-login>Giriş yap</button></div>`;
      $('[data-login]').addEventListener('click', () => T.goLogin());
      return;
    }
    const want = T.params.masa;
    if (want) openTable(want, T.params.izle === '1');
    else openLobby();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        if (G.view === 'table') syncNow();
        else if (G.view === 'lobby') loadLobby();
        SND.suspend(false);
      } else SND.suspend(true);
    });
    window.addEventListener('resize', () => G.scene && fitScene());
    window.addEventListener('keydown', onKey);
    // sitenin üst çubuğundaki masa sohbeti düğmesi bunu çağırır
    T.chat = { toggle: () => toggleChat() };
  }

  /* =====================================================================
     LOBİ
     ===================================================================== */
  function openLobby() {
    leaveTableView();
    G.view = 'lobby';
    $('#table').hidden = true;
    const box = $('#lobby');
    box.hidden = false;
    box.innerHTML = `
      <header class="lb-head">
        <div class="lb-brand"><span class="lb-mark">BR</span><div><h1>Blackjack Royale</h1><p>8 deste · krupiye soft 17'de durur · Blackjack 3:2</p></div></div>
        <div class="lb-actions">
          <span class="lb-bal" title="Bözer Points">— BP</span>
          <button type="button" class="t-btn" data-hist>Geçmiş</button>
          <button type="button" class="t-btn" data-stats>İstatistik</button>
          <button type="button" class="t-btn is-primary" data-create>Masa oluştur</button>
        </div>
      </header>
      <div class="lb-tiers">
        <div class="lb-tier bronze"><b>Bronze</b><span>10 BP masası · giriş eşiği yok</span></div>
        <div class="lb-tier silver"><b>Silver</b><span>10–20 BP · en az 4.000 BP</span></div>
        <div class="lb-tier gold"><b>Gold</b><span>10–100 BP · en az 8.000 BP</span></div>
      </div>
      <div class="lb-body"><p class="lb-loading">Masalar yükleniyor…</p></div>`;
    $('[data-create]', box).addEventListener('click', createSheet);
    $('[data-hist]', box).addEventListener('click', historySheet);
    $('[data-stats]', box).addEventListener('click', () => statsSheet());
    box.addEventListener('click', onLobbyClick);
    T.setRoute('');
    sitePresence(null);
    loadLobby();
    clearInterval(G.lobbyTimer);
    G.lobbyTimer = setInterval(() => document.visibilityState === 'visible' && G.view === 'lobby' && loadLobby(), 8000);
  }
  async function loadLobby() {
    const box = $('#lobby');
    let d;
    try {
      d = await rpc('bg_bj_lobby');
    } catch (e) {
      $('.lb-body', box).innerHTML = `<p class="lb-loading">${esc(errText(e))}</p>`;
      return;
    }
    G.lobby = d;
    $('.lb-bal', box).textContent = fmt(d.me.balance) + ' BP';
    const all = d.tables || [];
    const mine = all.filter((t) => t.mine || t.seated);
    const friends = all.filter((t) => !t.mine && !t.seated && (t.friends > 0 || t.owner_friend));
    const active = all.filter((t) => !mine.includes(t) && !friends.includes(t) && t.pots >= 2);
    const open = all.filter((t) => !mine.includes(t) && !friends.includes(t) && !active.includes(t));
    const sec = (title, list, emptyTxt) =>
      `<section class="lb-sec"><h2>${title}</h2>${list.length ? `<div class="lb-grid">${list.map(card).join('')}</div>` : `<p class="lb-none">${emptyTxt}</p>`}</section>`;
    $('.lb-body', box).innerHTML =
      (mine.length ? sec('Masalarım', mine, '') : '') +
      sec('Arkadaşlarımın masaları', friends, 'Arkadaşlarının açtığı ya da oturduğu masa yok.') +
      sec('Aktif masalar', active, 'Şu an oyun süren masa yok.') +
      sec('Açık masalar', open, 'Açık masa yok. İlk masayı sen aç.');
  }
  function card(t) {
    const streak = Array.from({ length: 5 }, (_, i) => `<i class="${i < t.streak ? 'on' : ''}"></i>`).join('');
    const can = t.eligible;
    const full = t.free.length === 0;
    return `<article class="lb-card ${t.tier}">
      <div class="lbc-top"><span class="lbc-tier">${TIER[t.tier]}</span><span class="lbc-max">en fazla ${t.max_bet} BP</span>${t.visibility === 'private' ? '<span class="lbc-priv">Özel</span>' : ''}</div>
      <h3>${esc(t.name)}</h3>
      <p class="lbc-owner">Masa sahibi: ${esc(t.owner || '—')}</p>
      <div class="lbc-pots" aria-label="${t.pots} / 7 pot dolu">${Array.from({ length: 7 }, (_, i) => `<i class="${i < t.pots ? 'on' : ''}"></i>`).join('')}</div>
      <dl class="lbc-meta"><div><dt>Oyuncu</dt><dd>${t.players}</dd></div><div><dt>Pot</dt><dd>${t.pots}/7</dd></div><div><dt>İzleyici</dt><dd>${t.viewers}</dd></div><div><dt>Seri</dt><dd class="lbc-streak">${streak}</dd></div></dl>
      <p class="lbc-state">${esc(STATE_TXT[t.state] || t.state)}${t.status === 'paused' ? ' · duraklatıldı' : ''}${t.friend_names && t.friend_names.length ? ` · ${esc(t.friend_names.slice(0, 2).join(', '))} masada` : ''}</p>
      <div class="lbc-btns">
        ${t.seated ? `<button type="button" class="t-btn is-primary" data-open="${t.id}">Masaya dön</button>` : `
        <button type="button" class="t-btn is-primary" data-join="${t.id}" ${!can || full ? 'disabled' : ''} title="${!can ? 'Bu masa için en az ' + fmt(t.min_balance) + ' BP gerekli' : full ? 'Boş pozisyon yok' : ''}">Masaya katıl</button>
        ${t.spectators ? `<button type="button" class="t-btn" data-watch="${t.id}">İzle</button>` : '<span class="lbc-nospec">İzleyiciye kapalı</span>'}`}
      </div>
      ${!can && !t.seated ? `<p class="lbc-need">Oturmak için ${fmt(t.min_balance)} BP gerekli${t.spectators ? ', izleyebilirsin.' : '.'}</p>` : ''}
    </article>`;
  }
  async function onLobbyClick(e) {
    const b = e.target.closest('[data-open],[data-join],[data-watch]');
    if (!b) return;
    const id = b.dataset.open || b.dataset.join || b.dataset.watch;
    const t = (G.lobby && G.lobby.tables || []).find((x) => x.id === id);
    if (b.dataset.join && t && !t.spectators) {
      // izleyiciye kapalı masa: önce pozisyon seçilir
      seatPicker(t);
      return;
    }
    openTable(id, !!b.dataset.watch, !!b.dataset.join);
  }
  function seatPicker(t) {
    const sh = T.sheet({
      title: 'Pozisyon seç',
      body: `<p class="t-text">${esc(t.name)} izleyiciye kapalı. Oynamak için boş bir pozisyon seç.</p><div class="sp-grid">${Array.from({ length: 7 }, (_, i) => i + 1)
        .map((n) => `<button type="button" class="t-btn${t.free.includes(n) ? '' : ' is-ghost'}" data-n="${n}" ${t.free.includes(n) ? '' : 'disabled'}>P${n}</button>`)
        .join('')}</div>`,
    });
    sh.body.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-n]');
      if (!b) return;
      b.disabled = true;
      try {
        const r = await rpc('bg_bj_sit', { p_table: t.id, p_seat: +b.dataset.n, p_session: SESSION });
        sh.close();
        openTable(t.id, false, false, r);
      } catch (err) {
        toast(errText(err), 'err');
        b.disabled = false;
      }
    });
  }
  function createSheet() {
    const bal = (G.lobby && G.lobby.me.balance) || 0;
    const tierOk = (k) => bal >= ({ bronze: 0, silver: 4000, gold: 8000 })[k];
    const def = tierOk('gold') ? 'gold' : tierOk('silver') ? 'silver' : 'bronze';
    const sh = T.sheet({
      title: 'Masa oluştur',
      body: `<form class="t-form" onsubmit="return false">
        <label class="t-field"><span class="t-lab">Masa adı</span><input class="t-input" name="name" maxlength="40" placeholder="${esc((T.myName() || 'Bözer') + ' masası')}"></label>
        <div class="t-field"><span class="t-lab">Masa seviyesi</span><div class="t-seg tier-seg" data-seg="tier">
          ${['bronze', 'silver', 'gold'].map((k) => `<button type="button" data-v="${k}" aria-pressed="${k === def}" ${tierOk(k) ? '' : 'disabled'}><b>${TIER[k]}</b><small>${k === 'bronze' ? '10 BP' : k === 'silver' ? '10–20 BP · 4.000+' : '10–100 BP · 8.000+'}</small></button>`).join('')}
        </div></div>
        <div class="t-field"><span class="t-lab">Kimler görsün?</span><div class="t-seg" data-seg="vis"><button type="button" data-v="public" aria-pressed="true">Herkes</button><button type="button" data-v="private" aria-pressed="false">Özel (arkadaşlarım)</button></div></div>
        <div class="t-field"><span class="t-lab">İzleyiciler</span><div class="t-seg" data-seg="spec"><button type="button" data-v="1" aria-pressed="true">İzleyebilir, Bet Behind yapabilir</button><button type="button" data-v="0" aria-pressed="false">Kapalı</button></div></div>
        <p class="t-note">Masa açılınca sekiz deste karıştırılır, kesme kartı yerleştirilir ve ilk üç kart yakılır. Oyun en az iki aktif pot olunca başlar.</p>
      </form>`,
      actions: [
        { label: 'Vazgeç' },
        {
          label: 'Masayı aç',
          kind: 'primary',
          onClick: async (wrap, btn) => {
            const f = $('form', wrap);
            const seg = (k) => $(`[data-seg="${k}"] [aria-pressed="true"]`, f).dataset.v;
            btn.disabled = true;
            try {
              const r = await rpc('bg_bj_create', { p_name: f.name.value, p_tier: seg('tier'), p_visibility: seg('vis'), p_spectators: seg('spec') === '1' });
              openTable(r.id, false, true);
            } catch (err) {
              toast(errText(err), 'err');
              btn.disabled = false;
              return false;
            }
          },
        },
      ],
    });
    sh.body.addEventListener('click', (e) => {
      const b = e.target.closest('[data-seg] button');
      if (!b || b.disabled) return;
      $$('button', b.parentNode).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    });
  }

  /* =====================================================================
     MASA
     ===================================================================== */
  async function openTable(id, watch, wantSit, first) {
    clearInterval(G.lobbyTimer);
    G.view = 'table';
    G.tableId = id;
    G.v = -1;
    G.st = null;
    G.me = null;
    G.wantSit = !!wantSit;
    G.chat = { open: false, list: [], unread: 0, last: 0 };
    G.seenNotice = new Set();
    $('#lobby').hidden = true;
    $('#table').hidden = false;
    $('#chat').hidden = true;
    if (!G.scene) {
      G.scene = window.BJScene.create($('#scene'), {
        now,
        opt: (k) => (k === 'quality' ? opts.quality : opts[k]),
        ctx: sceneCtx,
        onSeat: onSeatAct,
        onSettled,
      });
      G.scene.dealer.setReduced(opts.reduced || opts.quality === 'low');
      $('#hud').addEventListener('click', onHud);
      $('#controls').addEventListener('click', onControls);
      // kontrol paneli büyüyüp küçüldükçe masa yeniden sığdırılır
      if (window.ResizeObserver) new ResizeObserver(() => G.scene && G.view === 'table' && fitScene()).observe($('#scene'));
    } else G.scene.reset();
    fitScene();
    try {
      const r = first || (await rpc('bg_bj_sync', { p_table: id, p_ver: null, p_session: SESSION }));
      apply(r);
    } catch (e) {
      toast(errText(e), 'err');
      openLobby();
      return;
    }
    T.setRoute('masa=' + id + (watch ? '&izle=1' : ''));
    subscribe(id);
    loadChat();
    schedule();
  }
  function leaveTableView() {
    unsubscribe();
    clearTimeout(G.syncTimer);
    clearTimeout(G.dlTimer);
    clearInterval(G.tickTimer);
    G.tableId = null;
    if (G.scene) G.scene.reset();
    paintHostChat();
  }
  function fitScene() {
    const box = $('#scene');
    const w = box.clientWidth;
    const h = box.clientHeight;
    const port = h > w * 1.08;
    G.scene.setLayout(port ? 'port' : 'land');
    G.scene.fit(w, h);
  }

  /** Sunucu yanıtını uygula: {state, me, now} ya da {same, me} */
  function apply(r) {
    if (!r) return;
    if (r.me) G.me = r.me;
    if (r.state && (r.state.v > G.v || G.v < 0)) {
      const prev = G.st;
      G.st = r.state;
      G.v = r.state.v;
      onState(prev, G.st);
    } else if (r.me) {
      renderControls();
      renderHud();
      if (G.st) G.scene.update(G.st, G.me);
    }
    notices();
  }
  function onState(prev, st) {
    if (st.status === 'closed' || st.state === 'CLOSED') {
      G.scene.update(st, G.me);
      toast('Masa kapandı.', 'info');
      setTimeout(() => G.view === 'table' && G.tableId === st.id && openLobby(), 2200);
      return;
    }
    G.scene.update(st, G.me);
    renderHud();
    renderControls();
    turnSounds(prev, st);
    sitePresence(st.id);
    // masaya katıl dendiyse ilk boş pozisyonu öner
    if (G.wantSit && G.me && !(G.me.seats || []).length) {
      G.wantSit = false;
      if (st.status === 'open' && G.me.eligible) toast('Oturmak için boş bir pozisyondaki OTUR alanına dokun.', 'info');
    }
    schedule();
  }
  function sitePresence(id) {
    try {
      const B = T.site();
      if (B && B.presence) B.presence.set('blackjack', id || null);
    } catch (e) {}
  }

  /* ---------------- eşitleme döngüsü ---------------- */
  let syncing = false;
  async function syncNow(full) {
    if (!G.tableId || syncing) return;
    syncing = true;
    const id = G.tableId;
    try {
      const r = await rpc('bg_bj_sync', { p_table: id, p_ver: full ? null : G.v, p_session: SESSION });
      if (G.tableId === id) apply(r);
    } catch (e) {
      if (/göremezsin/i.test(errText(e))) {
        toast('Bu masaya artık erişimin yok.', 'err');
        openLobby();
      }
    } finally {
      syncing = false;
    }
  }
  /** Kendi kendine ilerleyen motor: süre dolunca biri sunucuyu dürter (masadaki herkes) */
  function schedule() {
    clearTimeout(G.syncTimer);
    clearTimeout(G.dlTimer);
    if (!G.tableId) return;
    const seated = G.me && (G.me.seats || []).length > 0;
    G.syncTimer = setTimeout(() => {
      syncNow();
      schedule();
    }, G.rtOk ? (seated ? 5000 : 7000) : 2200);
    const st = G.st;
    if (st && st.deadline) {
      const ms = st.deadline - now() + (seated ? 60 : 160) + Math.random() * (seated ? 120 : 600);
      if (ms < 60000) G.dlTimer = setTimeout(() => syncNow(), Math.max(40, ms));
    } else if (st && st.state === 'WAITING_FOR_PLAYERS') {
      G.dlTimer = setTimeout(() => syncNow(), 3000);
    }
    clearInterval(G.tickTimer);
    G.tickTimer = setInterval(tick, 250);
  }
  let lastTickSec = -1;
  function tick() {
    if (!G.st || !G.scene) return;
    G.scene.tick();
    const st = G.st;
    // kendi sıramda son 5 saniye: tik sesi; kontroldeki süre çubuğu
    const bar = $('#controls .tbar i');
    if (bar && st.deadline) {
      const left = Math.max(0, st.deadline - now());
      bar.style.transform = `scaleX(${Math.min(1, left / 15600)})`;
      const s = Math.ceil(left / 1000);
      if (myTurnHand() && s <= 5 && s > 0 && s !== lastTickSec) {
        lastTickSec = s;
        SND.play('tick', s <= 3);
      }
    }
  }

  /* ---------------- gerçek zamanlı ---------------- */
  function subscribe(id) {
    unsubscribe();
    const B = T.site();
    if (!B || !B.api || !B.api.channel) return;
    try {
      G.rt = B.api
        .channel('bj-' + id.slice(0, 8) + '-' + rid())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'blackjack_live', filter: 'table_id=eq.' + id }, (p) => {
          const st = p.new && p.new.state;
          if (!st || G.tableId !== id || st.v <= G.v) return;
          const prev = G.st;
          G.st = st;
          G.v = st.v;
          onState(prev, st);
          // kişisel bilgiler (bakiye, ön hamle, bildirim) için hafif eşitleme
          clearTimeout(G.meT);
          G.meT = setTimeout(() => syncNow(), 260 + Math.random() * 200);
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'blackjack_chat', filter: 'table_id=eq.' + id }, (p) => p.new && onChatRow(p.new))
        .subscribe((s) => {
          G.rtOk = s === 'SUBSCRIBED';
          schedule();
        });
    } catch (e) {
      G.rt = null;
    }
  }
  function unsubscribe() {
    if (G.rt) {
      try {
        G.rt.unsubscribe();
        const B = T.site();
        if (B && B.api && B.api.removeChannel) B.api.removeChannel(G.rt);
      } catch (e) {}
    }
    G.rt = null;
    G.rtOk = false;
  }

  /* =====================================================================
     SAHNE BAĞLAMI VE KOLTUK İŞLEMLERİ
     ===================================================================== */
  function myId() {
    return (G.me && G.me.id) || (T.me() && T.me().id) || null;
  }
  function sceneCtx(st, me) {
    const id = myId();
    const mine = (me && me.seats) || [];
    return {
      myId: id,
      me: me || {},
      hasSeat: mine.length > 0,
      canSit: st.status === 'open' && mine.length < 2 && me && me.eligible !== false,
      canBB: st.state === 'BETTING_OPEN' && st.spectators && !mine.length,
      betting: st.state === 'BETTING_OPEN',
      turnSeat: st.turn ? st.turn.seat : null,
      turnHand: st.turn ? st.turn.hand : null,
      turnDeadline: st.turn ? st.turn.deadline : null,
      avatar: (u, size) => T.avatar(u, size),
    };
  }
  async function call(name, args, okMsg) {
    if (G.busy) return null;
    G.busy = true;
    $('#controls').classList.add('busy');
    try {
      const r = await rpc(name, Object.assign({ p_table: G.tableId }, args));
      apply(r);
      if (okMsg) toast(okMsg, 'good');
      return r;
    } catch (e) {
      toast(errText(e), 'err');
      syncNow(true);
      return null;
    } finally {
      G.busy = false;
      $('#controls').classList.remove('busy');
    }
  }
  function onSeatAct(act, seat) {
    const st = G.st;
    if (!st) return;
    if (act === 'sit') {
      SND.play('click');
      call('bg_bj_sit', { p_seat: seat, p_session: SESSION });
    } else if (act === 'bet') placeBet(seat, G.chip);
    else if (act === 'bb') placeBB(seat, G.chip);
    else if (act === 'stand') {
      const inPlay = mySeatInPlay(seat);
      T.confirm(`P${seat} pozisyonundan kalk`, inPlay ? 'Bu elin sonunda kalkılacak. Devam eden elin bahsi geri alınmaz, sonuç normal şekilde hesaplanır.' : 'Pozisyon boşalır ve başka bir oyuncu oturabilir. Bu pozisyonun Auto Rebet ayarı kapanır.', 'Kalk', 'danger').then(
        (ok) => ok && call('bg_bj_stand_up', { p_seat: seat, p_undo: false }, inPlay ? 'Bu elin sonunda kalkılacak.' : null),
      );
    } else if (act === 'unstand') call('bg_bj_stand_up', { p_seat: seat, p_undo: true });
    else if (act === 'avatar') {
      const s = st.seats.find((x) => x.no === seat);
      if (s && s.user) playerSheet(s.user, seat);
    } else if (act === 'bblist') bbList(seat);
  }
  function mySeatInPlay(seat) {
    const s = G.st && G.st.seats.find((x) => x.no === seat);
    return !!(s && s.bet_status === 'placed' && G.st.round && !G.st.round.settled);
  }
  function allowedBets() {
    const st = G.st;
    const me = G.me || {};
    return (st.bets || []).filter((b) => b <= st.max_bet && b <= (me.max_bet || 10));
  }
  function placeBet(seat, amount) {
    if (!allowedBets().includes(amount)) {
      toast(`BP seviyen bu masada en fazla ${Math.max(...allowedBets(), 10)} BP bahse izin veriyor.`, 'err');
      return;
    }
    SND.play('chip', 2);
    call('bg_bj_bet', { p_seat: seat, p_amount: amount });
  }
  function placeBB(seat, amount) {
    const st = G.st;
    if (!st.spectators) return toast('Bu masada izleyici bahsi kapalı.', 'err');
    if (!allowedBets().includes(amount)) {
      toast(`BP seviyen en fazla ${Math.max(...allowedBets(), 10)} BP Bet Behind'a izin veriyor.`, 'err');
      return;
    }
    const cur = G.me && G.me.bb;
    if (cur && cur.status === 'PENDING' && cur.seat !== seat) {
      toast(`Bu turda P${cur.seat} pozisyonuna Bet Behind yaptın. Bir turda tek pozisyona oynanır.`, 'err');
      return;
    }
    SND.play('chip', 2);
    call('bg_bj_bet_behind', { p_seat: seat, p_amount: amount });
  }

  /* =====================================================================
     KONTROL PANELİ
     ===================================================================== */
  function myHands() {
    const id = myId();
    const out = [];
    (G.st && G.st.seats || []).forEach((s) => {
      if (s.user && s.user.id === id) (s.hands || []).forEach((h) => out.push({ seat: s.no, h, n: s.hands.length }));
    });
    return out;
  }
  function myTurnHand() {
    const st = G.st;
    if (!st || st.state !== 'PLAYER_TURNS' || !st.turn || st.turn.user !== myId()) return null;
    return myHands().find((x) => x.h.id === st.turn.hand) || null;
  }
  function legal(x, a) {
    const h = x.h;
    const bal = (G.me && G.me.balance) || 0;
    if (a === 'hit' || a === 'stand') return true;
    const two = h.cards.length === 2;
    const v = (c) => ('TJQK'.includes(c[0]) ? 10 : c[0] === 'A' ? 1 : +c[0]);
    const splitAces = h.split && h.cards[0] && h.cards[0][0] === 'A';
    if (a === 'double') return two && !splitAces && bal >= h.bet;
    if (a === 'split') return two && v(h.cards[0]) === v(h.cards[1]) && x.n < 4 && !splitAces && bal >= h.bet;
    if (a === 'surrender') return two && !h.split;
    return false;
  }
  function renderControls() {
    const box = $('#controls');
    const st = G.st;
    const me = G.me || {};
    if (!st) {
      box.innerHTML = '';
      return;
    }
    const mySeats = me.seats || [];
    let main = '';
    let side = '';
    // Auto Rebet: pozisyon başına küçük kontrol
    if (mySeats.length && st.status !== 'closed') {
      side = `<div class="ar-group">${mySeats
        .map((s) => `<button type="button" class="ar${s.auto ? ' on' : ''}" data-ar="${s.no}" aria-pressed="${!!s.auto}" title="Auto Rebet${s.last_bet ? ' · son bahis ' + s.last_bet + ' BP' : ''}"><i>↻</i><span>AUTO REBET</span>${mySeats.length > 1 ? `<em>P${s.no}</em>` : ''}</button>`)
        .join('')}</div>`;
    }
    const chipRow = (label) => {
      const ok = allowedBets();
      if (!ok.includes(G.chip)) G.chip = ok[ok.length - 1] || 10;
      return `<div class="chip-row" role="group" aria-label="${label}">${(st.bets || [])
        .map((b) => `<button type="button" class="pchip c${b}${G.chip === b ? ' sel' : ''}" data-chip="${b}" ${ok.includes(b) ? '' : 'disabled'} aria-pressed="${G.chip === b}"><span>${b}</span></button>`)
        .join('')}</div>`;
    };
    const turn = myTurnHand();
    if (st.state === 'BETTING_OPEN' && mySeats.length) {
      const seatsInfo = mySeats
        .map((s) => {
          const seat = st.seats.find((x) => x.no === s.no) || {};
          return `<span class="mybet${seat.confirmed ? ' ok' : ''}">P${s.no}: ${seat.bet ? fmt(seat.bet) + ' BP' + (seat.confirmed ? ' ✓' : '') : 'bahis yok'}</span>`;
        })
        .join('');
      const anyBet = mySeats.some((s) => (st.seats.find((x) => x.no === s.no) || {}).bet);
      const allOk = mySeats.every((s) => {
        const x = st.seats.find((y) => y.no === s.no) || {};
        return !x.bet || x.confirmed;
      });
      main = `<div class="ctl-bet">${chipRow('Bahis miktarı')}<div class="ctl-info">${seatsInfo}<small>${mySeats.length > 1 ? 'Fişi seç, sonra bahis koyacağın pozisyona dokun.' : 'Fişe dokununca bahis pozisyonuna konur.'}</small></div>
        <div class="ctl-btns"><button type="button" class="t-btn" data-clear ${anyBet ? '' : 'disabled'}>Temizle</button><button type="button" class="t-btn is-primary" data-confirm ${anyBet && !allOk ? '' : 'disabled'}>Onayla</button></div></div>`;
    } else if (st.state === 'BETTING_OPEN' && st.spectators && !mySeats.length) {
      const bb = me.bb && me.bb.status === 'PENDING' ? me.bb : null;
      main = `<div class="ctl-bet">${chipRow('Bet Behind miktarı')}<div class="ctl-info"><b class="bbt">BET BEHIND</b><small>${bb ? `P${bb.seat} pozisyonunda ${fmt(bb.amount)} BP. Ana oyuncunun bütün kararlarını (Double, Split dahil) takip eder.` : 'Bir oyuncunun bahis alanına dokun. Bet Behind, oyuncunun Double ve Split kararlarını zorunlu takip eder; ek bahis karşılanamazsa o turdaki bahislerin iade edilir.'}</small></div>
        <div class="ctl-btns">${bb ? '<button type="button" class="t-btn" data-bbclear>Kaldır</button>' : ''}</div></div>`;
    } else if (st.state === 'INSURANCE_WINDOW' && mySeats.length) {
      const open = (st.seats || []).filter((s) => s.user && s.user.id === myId() && s.bet_status === 'placed' && !s.ins_decided);
      main = open.length
        ? `<div class="ctl-ins">${open.map((s) => `<div class="ins-row"><span>P${s.no} için sigorta (${fmt(s.bet / 2)} BP)?</span><button type="button" class="t-btn is-primary" data-ins="${s.no}" data-take="1">Sigorta al</button><button type="button" class="t-btn" data-ins="${s.no}" data-take="0">Alma</button></div>`).join('')}</div>`
        : '<p class="ctl-status">Diğer oyuncuların sigorta kararı bekleniyor…</p>';
    } else if (turn) {
      const left = Math.max(0, st.deadline - now());
      main = `<div class="ctl-act">${handRead(turn)}<div class="tbar"><i style="transform:scaleX(${Math.min(1, left / 15600)})"></i></div>
        <p class="ctl-who">Sıra sende · P${turn.seat}${turn.n > 1 ? ' · el ' + (turn.h.i + 1) : ''} · ${turn.h.soft && turn.h.total < 21 ? turn.h.total - 10 + '/' + turn.h.total : turn.h.total}</p>
        <div class="act-row">${ACT.map(([a, l, k]) => `<button type="button" class="act a-${a}" data-act="${a}" ${legal(turn, a) ? '' : 'disabled'}><b>${l}</b><kbd>${k}</kbd></button>`).join('')}</div></div>`;
    } else {
      // ön hamle: sırası gelmemiş ellerim
      const waiting = ['INITIAL_DEAL', 'INSURANCE_WINDOW', 'DEALER_PEEK', 'PLAYER_TURNS'].includes(st.state)
        ? myHands().filter((x) => x.h.st === 'waiting' && x.h.cards.length >= 2)
        : [];
      if (waiting.length) {
        if (!waiting.some((x) => x.h.id === G.preHand)) G.preHand = waiting[0].h.id;
        const x = waiting.find((y) => y.h.id === G.preHand);
        const cur = ((me.pre || []).find((p) => p.hand === x.h.id) || {}).action || null;
        main = `<div class="ctl-act premode">${handRead(x)}
          <p class="ctl-who">Ön hamle${waiting.length > 1 ? '' : ` · P${x.seat}${x.n > 1 ? ' el ' + (x.h.i + 1) : ''}`}<small>Sıran gelince uygulanır; o ana kadar değiştirebilir ya da iptal edebilirsin.</small></p>
          ${waiting.length > 1 ? `<div class="pre-tabs">${waiting.map((y) => `<button type="button" data-ph="${y.h.id}" aria-pressed="${y.h.id === x.h.id}">P${y.seat}${y.n > 1 ? '·' + (y.h.i + 1) : ''}</button>`).join('')}</div>` : ''}
          <div class="act-row">${ACT.map(([a, l]) => `<button type="button" class="act ghost a-${a}${cur === a ? ' on' : ''}" data-pre="${a}" ${legal(x, a) ? '' : 'disabled'}><b>${l}</b>${cur === a ? '<em>BEKLEMEDE</em>' : ''}</button>`).join('')}</div></div>`;
      } else main = `<p class="ctl-status">${esc(statusLine(st))}</p>`;
    }
    const html = `<div class="ctl-main">${main}</div>${side}`;
    if (box._html !== html) {
      box.innerHTML = html;
      box._html = html;
    }
  }
  /** Elimin büyük yazılı özeti: kartlar, toplam ve krupiyenin açık kartı */
  function handRead(x) {
    const red = (c) => c[1] === 'H' || c[1] === 'D';
    const lab = (c) => (c[0] === 'T' ? '10' : c[0]) + ({ S: '♠', H: '♥', D: '♦', C: '♣' })[c[1]];
    const d = G.st && G.st.dealer && G.st.dealer.cards[0];
    return `<div class="hand-read">${d ? `<span class="mc-dl">Krupiye</span><span class="mc${red(d) ? ' r' : ''}">${lab(d)}</span><span class="mc-dl"> · Sen</span>` : ''}${x.h.cards
      .map((c) => `<span class="mc${red(c) ? ' r' : ''}">${lab(c)}</span>`)
      .join('')}<b class="mc-eq">= ${x.h.soft && x.h.total < 21 ? x.h.total - 10 + '/' + x.h.total : x.h.total}</b></div>`;
  }
  function statusLine(st) {
    const me = G.me || {};
    const mySeats = me.seats || [];
    if (st.state === 'WAITING_FOR_PLAYERS') return mySeats.length ? 'İkinci aktif pot bekleniyor.' : me.eligible === false ? `Bu masada oturmak için ${fmt(st.min_balance)} BP gerekli. İzleyici olarak devam ediyorsun.` : 'Boş bir pozisyona oturarak oyuna katılabilirsin.';
    if (st.state === 'BETTING_OPEN') return st.spectators ? 'Bahisler açık.' : 'Bahisler açık. Bu masada izleyici bahsi kapalı.';
    if (st.state === 'PLAYER_TURNS' && st.turn) {
      const s = st.seats.find((x) => x.no === st.turn.seat);
      return `${s && s.user ? s.user.name : 'P' + st.turn.seat} oynuyor (P${st.turn.seat}).`;
    }
    if (st.state === 'DEALER_TURN') return 'Krupiye oynuyor.';
    if (st.state === 'RESULT_DISPLAY') return 'Sonuçlar. Yeni tur birazdan başlıyor.';
    if (st.state === 'SHOE_RESHUFFLE') return 'Yeni sabot hazırlanıyor.';
    if (st.state === 'PAUSED') return 'Masa duraklatıldı.';
    if (st.state === 'INSURANCE_WINDOW') return 'Sigorta kararları bekleniyor.';
    return STATE_TXT[st.state] || '';
  }
  async function onControls(e) {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    const st = G.st;
    const me = G.me || {};
    if (b.dataset.chip) {
      G.chip = +b.dataset.chip;
      localStorage.setItem('bj.chip', G.chip);
      SND.play('chip');
      const mySeats = me.seats || [];
      if (st.state === 'BETTING_OPEN' && mySeats.length === 1) placeBet(mySeats[0].no, G.chip);
      else if (st.state === 'BETTING_OPEN' && !mySeats.length && me.bb && me.bb.status === 'PENDING') placeBB(me.bb.seat, G.chip);
      else renderControls();
      return;
    }
    if (b.hasAttribute('data-clear')) {
      for (const s of me.seats || []) {
        const x = st.seats.find((y) => y.no === s.no);
        if (x && x.bet) await call('bg_bj_bet', { p_seat: s.no, p_amount: 0 });
      }
      return;
    }
    if (b.hasAttribute('data-confirm')) {
      SND.play('chipsStack');
      return call('bg_bj_bet_confirm', {});
    }
    if (b.hasAttribute('data-bbclear')) return call('bg_bj_bet_behind', { p_seat: me.bb.seat, p_amount: 0 });
    if (b.dataset.ar) {
      const s = (me.seats || []).find((x) => x.no === +b.dataset.ar);
      SND.play('click');
      return call('bg_bj_auto_rebet', { p_seat: +b.dataset.ar, p_on: !(s && s.auto) });
    }
    if (b.dataset.ins) {
      SND.play(b.dataset.take === '1' ? 'chip' : 'click');
      return call('bg_bj_insurance', { p_seat: +b.dataset.ins, p_take: b.dataset.take === '1' });
    }
    if (b.dataset.act) return doAction(b.dataset.act);
    if (b.dataset.ph) {
      G.preHand = +b.dataset.ph;
      return renderControls();
    }
    if (b.dataset.pre) return setPre(b.dataset.pre);
  }
  function doAction(a) {
    const x = myTurnHand();
    if (!x || !legal(x, a)) return;
    SND.play(a === 'double' || a === 'split' ? 'chipsStack' : 'click');
    if (navigator.vibrate) navigator.vibrate(12);
    call('bg_bj_act', { p_hand: x.h.id, p_action: a, p_req: rid() });
  }
  async function setPre(a) {
    const me = G.me || {};
    const hand = G.preHand;
    const cur = ((me.pre || []).find((p) => p.hand === hand) || {});
    const next = cur.action === a ? null : a;
    const rev = Math.max(G.preRev[hand] || 0, cur.rev || 0) + 1;
    G.preRev[hand] = rev;
    // iyimser gösterim: sunucu onaylayana kadar seçim görünür
    me.pre = (me.pre || []).filter((p) => p.hand !== hand).concat(next ? [{ hand, action: next, rev }] : []);
    renderControls();
    G.scene.update(G.st, G.me);
    SND.play('click');
    try {
      const r = await rpc('bg_bj_preaction', { p_table: G.tableId, p_hand: hand, p_action: next, p_rev: rev });
      if (G.preRev[hand] === rev) apply(r);
    } catch (e) {
      toast(errText(e), 'err');
      syncNow(true);
    }
  }
  function onKey(e) {
    if (G.view !== 'table' || e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toUpperCase();
    const a = ACT.find((x) => x[2] === k);
    if (a && myTurnHand()) {
      e.preventDefault();
      doAction(a[0]);
    }
  }
  function turnSounds(prev, st) {
    const t = myTurnHand();
    const key = t ? t.h.id + ':' + t.h.cards.length : '';
    if (key && key !== G.lastTurnKey) {
      SND.play('turn');
      if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
    }
    G.lastTurnKey = key;
    if (prev && prev.state !== 'BETTING_OPEN' && st.state === 'BETTING_OPEN' && (G.me && G.me.seats || []).length) SND.play('turn');
  }

  /* ---------------- sonuç paneli (kendi sonucum) ---------------- */
  function onSettled(st) {
    const id = myId();
    let net = 0;
    let n = 0;
    let bj = false;
    let outs = [];
    st.seats.forEach((s) => {
      if (!s.user || s.user.id !== id || s.net == null) return;
      net += s.net;
      n++;
      (s.hands || []).forEach((h) => {
        outs.push(h.out);
        if (h.out === 'blackjack') bj = true;
      });
    });
    let kind = null;
    if (n) {
      if (outs.length === 1) kind = outs[0] === 'blackjack' ? 'blackjack' : outs[0];
      else kind = bj && net > 0 ? 'blackjack' : net > 0 ? 'win' : net < 0 ? 'lose' : 'push';
    }
    const bb = G.me && G.me.bb;
    if (!n && bb && bb.status && bb.status !== 'PENDING') {
      if (bb.status === 'REFUNDED_INSUFFICIENT_BP') {
        kind = 'refund';
        net = 0;
      } else if (bb.status.startsWith('SETTLED_')) {
        net = bb.payout - bb.total;
        kind = bb.status === 'SETTLED_WIN' ? 'win' : bb.status === 'SETTLED_PUSH' ? 'push' : bb.status === 'SETTLED_SURRENDER' ? 'surrender' : 'lose';
      }
    }
    if (!kind) return;
    setTimeout(() => {
      G.scene.showResult(kind, net, n > 1 ? `${n} pot toplamı` : bb && !n ? `Bet Behind · P${bb.seat}` : '');
      SND.play(kind === 'blackjack' ? 'blackjack' : kind === 'win' ? 'win' : kind === 'push' || kind === 'refund' ? 'push' : 'lose');
    }, 900);
  }

  /* ---------------- bildirimler ---------------- */
  function notices() {
    const list = (G.me && G.me.notices) || [];
    list.forEach((n) => {
      if (G.seenNotice.has(n.id)) return;
      G.seenNotice.add(n.id);
      if (G.seenNotice.size <= list.length && !G.noticeReady) return;
      const d = n.data || {};
      const map = {
        autorebet_skip: d.why === 'tier' ? `P${d.seat}: Auto Rebet ${d.amount} BP bahsi BP seviyene uymadığı için konmadı.` : `P${d.seat}: Bakiye yetersiz, Auto Rebet ${d.amount} BP bahsi konmadı.`,
        autorebet_off: `P${d.seat}: Bağlantı koptuğu için Auto Rebet kapandı.`,
        bet_dropped: `P${d.seat}: ${d.amount} BP bahis tahsil edilemediği için tura alınmadı.`,
        bb_refund: `Bet Behind: ana oyuncunun ${d.kind === 'split' ? 'bölme' : 'ikiye katlama'} kararını takip edecek BP yetmedi. Bu turdaki bütün Bet Behind bahislerin (${d.amount} BP) iade edildi.`,
        bb_dropped: d.why === 'seat_left' ? `P${d.seat} oyuncusu kalktığı için Bet Behind bahsin kaldırıldı.` : `P${d.seat} bu turda oynamadığı için Bet Behind bahsin alınmadı.`,
        pre_invalid: `Ön hamlen uygulanamadı: ${d.why || ''} Şimdi karar ver.`,
        leave: d.why === 'balance' ? `P${d.seat}: BP bakiyen bu masanın eşiğinin altına düştü, pozisyondan kalktın. İzlemeye devam edebilirsin.` : d.why === 'disconnected' ? `P${d.seat}: Uzun süre bağlantı olmadığı için pozisyon boşaltıldı.` : null,
      };
      const txt = map[n.type];
      if (txt) toast(txt, n.type === 'leave' || n.type === 'bb_refund' ? 'err' : 'info');
    });
    G.noticeReady = true;
  }

  /* =====================================================================
     ÜST ÇUBUK
     ===================================================================== */
  function renderHud() {
    const st = G.st;
    const me = G.me || {};
    if (!st) return;
    const jp = st.jackpot || { streak: 0, need: 5 };
    const dots = Array.from({ length: jp.need }, (_, i) => `<i class="${i < jp.streak ? 'on' : ''}"></i>`).join('');
    const html = `
      <button type="button" class="hud-btn" data-lobby aria-label="Lobiye dön">‹</button>
      <div class="hud-t"><b>${esc(st.name)}</b><span class="tier ${st.tier}">${TIER[st.tier]} · ${st.max_bet} BP</span>${st.round ? `<small>Tur ${st.round.no}</small>` : ''}</div>
      <div class="hud-jp" title="Yedi pot aynı turda kazanırsa seri ilerler; 5 tur üst üste olunca jackpot: pot başına ${st.jackpot.seat_reward} BP, Bet Behind izleyicisine ${st.jackpot.spec_reward} BP">
        <small>JACKPOT STREAK</small><span class="jp-dots">${dots}</span><b>${jp.streak}/${jp.need}</b></div>
      <div class="hud-r">
        <span class="hud-bal" title="BP bakiyen">${fmt(me.balance)} <small>BP</small></span>
        <span class="hud-view" title="İzleyiciler">👁 ${st.viewers || 0}</span>
        ${T.site() && T.site().host ? '' : '<button type="button" class="hud-btn" data-chat aria-label="Masa sohbeti">💬</button>'}
        <button type="button" class="hud-btn" data-menu aria-label="Menü">⋯</button>
      </div>`;
    const hud = $('#hud');
    if (hud._html !== html) {
      hud.innerHTML = html;
      hud._html = html;
    }
  }
  function onHud(e) {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-lobby')) return backToLobby();
    if (b.hasAttribute('data-chat')) return toggleChat();
    if (b.hasAttribute('data-menu')) return menuSheet();
  }
  async function backToLobby() {
    const seats = (G.me && G.me.seats) || [];
    if (seats.length) {
      const inPlay = seats.some((s) => mySeatInPlay(s.no));
      const ok = await T.confirm('Masadan ayrıl', inPlay ? 'Devam eden elin tamamlanır ve sonra pozisyonların boşalır. Bütün Auto Rebet ayarların kapanır.' : 'Pozisyonların boşalır ve bütün Auto Rebet ayarların kapanır.', 'Ayrıl', 'danger');
      if (!ok) return;
      try {
        await rpc('bg_bj_leave', { p_table: G.tableId });
      } catch (e) {}
    } else {
      rpc('bg_bj_leave', { p_table: G.tableId }).catch(() => {});
    }
    openLobby();
  }
  /* Tam ekran: sitenin içindeyken site katmanıyla birlikte (üst ve alt çubuklar gizlenir) */
  function fsHost() {
    try {
      const B = T.site();
      return B && B.host && B.host.fullscreen ? B.host : null;
    } catch (e) {
      return null;
    }
  }
  function fsSupported() {
    return !!(fsHost() || document.fullscreenEnabled || document.webkitFullscreenEnabled);
  }
  function fsOn() {
    const h = fsHost();
    if (h && h.isFull) return h.isFull();
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function toggleFull() {
    const h = fsHost();
    if (h) return h.fullscreen();
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  }

  function menuSheet() {
    const st = G.st;
    const owner = st && st.owner && st.owner.id === myId();
    const sh = T.sheet({
      title: st ? st.name : 'Menü',
      body: `<div class="menu-list">
        <button type="button" data-m="invite">Arkadaşını davet et</button>
        <button type="button" data-m="chat">Masa sohbeti</button>
        <button type="button" data-m="hist">Oyun geçmişim</button>
        <button type="button" data-m="stats">İstatistiklerim</button>
        <button type="button" data-m="rules">Kurallar</button>
        <button type="button" data-m="settings">Ses ve görüntü</button>
        ${fsSupported() ? `<button type="button" data-m="full">${fsOn() ? 'Tam ekrandan çık' : 'Tam ekran'}</button>` : ''}
        ${owner ? '<button type="button" data-m="close" class="danger">Masayı kapat</button>' : ''}
        <button type="button" data-m="leave" class="danger">Masadan ayrıl</button>
      </div>`,
    });
    sh.body.addEventListener('click', (e) => {
      const b = e.target.closest('[data-m]');
      if (!b) return;
      sh.close();
      const m = b.dataset.m;
      if (m === 'invite') inviteSheet();
      else if (m === 'chat') toggleChat(true);
      else if (m === 'hist') historySheet();
      else if (m === 'stats') statsSheet();
      else if (m === 'rules') rulesSheet();
      else if (m === 'settings') settingsSheet();
      else if (m === 'full') toggleFull();
      else if (m === 'leave') backToLobby();
      else if (m === 'close')
        T.confirm('Masayı kapat', 'Devam eden tur varsa tamamlanır, sonra masa kapanır. Bütün oyuncular lobiye döner.', 'Kapat', 'danger').then((ok) => ok && call('bg_bj_close', {}, 'Masa kapanıyor.'));
    });
  }

  /* ---------------- ayarlar ---------------- */
  function settingsSheet() {
    const a = SND.get();
    const range = (k, label) => `<label class="set-row"><span>${label}</span><input type="range" min="0" max="100" value="${Math.round(a[k] * 100)}" data-vol="${k}"><output>${Math.round(a[k] * 100)}</output></label>`;
    const seg = (k, list) => `<div class="t-seg" data-opt="${k}">${list.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${String(opts[k]) === String(v)}">${l}</button>`).join('')}</div>`;
    const sh = T.sheet({
      title: 'Ses ve görüntü',
      body: `<div class="t-form">
        <label class="set-row"><span>Ses</span><input type="checkbox" data-on ${a.on ? 'checked' : ''}></label>
        ${range('master', 'Genel ses')}${range('fx', 'Efektler')}${range('dealer', 'Krupiye (kart sesleri)')}${range('amb', 'Ortam sesi')}
        <div class="t-field"><span class="t-lab">Görüntü kalitesi</span>${seg('quality', [['high', 'Yüksek'], ['mid', 'Dengeli'], ['low', 'Düşük güç']])}</div>
        <div class="t-field"><span class="t-lab">Animasyon hızı</span>${seg('fast', [[false, 'Normal'], [true, 'Hızlı']])}</div>
        <div class="t-field"><span class="t-lab">Hareket</span>${seg('reduced', [[false, 'Tam animasyon'], [true, 'Azaltılmış']])}</div>
      </div>`,
      actions: [{ label: 'Tamam', kind: 'primary' }],
    });
    sh.body.addEventListener('input', (e) => {
      const r = e.target.closest('[data-vol]');
      if (r) {
        r.nextElementSibling.textContent = r.value;
        SND.set({ [r.dataset.vol]: r.value / 100 });
      }
      const c = e.target.closest('[data-on]');
      if (c) SND.set({ on: c.checked });
    });
    sh.body.addEventListener('click', (e) => {
      const b = e.target.closest('[data-opt] button');
      if (!b) return;
      const k = b.parentNode.dataset.opt;
      $$('button', b.parentNode).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      opts[k] = b.dataset.v === 'true' ? true : b.dataset.v === 'false' ? false : b.dataset.v;
      saveOpts();
    });
  }

  /* ---------------- geçmiş ve istatistik ---------------- */
  const OUT_TR = { win: 'Kazandı', lose: 'Kaybetti', push: 'Berabere', blackjack: 'Blackjack', surrender: 'Teslim' };
  const cardsTxt = (arr) => (arr || []).map((c) => (c[0] === 'T' ? '10' : c[0]) + ({ S: '♠', H: '♥', D: '♦', C: '♣' })[c[1]]).join(' ');
  async function historySheet() {
    const sh = T.sheet({ title: 'Oyun geçmişim', wide: true, body: '<p class="t-text">Yükleniyor…</p>' });
    let before = null;
    const load = async (append) => {
      let list;
      try {
        list = await rpc('bg_bj_history', { p_before: before, p_limit: 30 });
      } catch (e) {
        sh.body.innerHTML = `<p class="t-text">${esc(errText(e))}</p>`;
        return;
      }
      const rows = (list || []).map((h) => {
        const s = h.summary || {};
        const when = new Date(h.created_at).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        let body = '';
        if (h.role === 'behind') {
          body = s.status === 'REFUNDED_INSUFFICIENT_BP'
            ? `<span class="hb-tag">Bet Behind</span> BP yetmediği için ${fmt(s.refunded)} BP iade edildi (berabere sayılmaz)`
            : `<span class="hb-tag">Bet Behind · P${h.seat_id}${s.player ? ' · ' + esc(s.player) : ''}</span> ${(s.hands || []).map((x) => `${cardsTxt(x.cards)} → ${OUT_TR[x.outcome] || ''}`).join(' · ')}`;
        } else {
          body = `<span class="hb-tag">P${h.seat_id} · ${fmt(s.bet)} BP</span> ${(s.hands || []).map((x) => `${cardsTxt(x.cards)} (${x.total}) → ${OUT_TR[x.outcome] || ''}${x.doubled ? ' ×2' : ''}`).join(' · ')}${s.insurance ? ` · sigorta ${s.insurance_result === 'win' ? 'kazandı' : 'kaybetti'}` : ''}`;
        }
        return `<li><div class="hr-top"><b>${esc(s.table || '')}</b><span>Tur ${s.round || ''} · ${when}</span><em class="${h.net > 0 ? 'win' : h.net < 0 ? 'lose' : ''}">${sgn(h.net)} BP</em></div>
          <div class="hr-body">${body}</div><div class="hr-dl">Krupiye: ${cardsTxt(s.dealer)} (${s.dealer_total ?? ''}) · Oynanan: ${fmt(h.wagered)} BP</div></li>`;
      });
      if (!append) sh.body.innerHTML = rows.length ? '<ul class="hist"></ul><button type="button" class="t-btn" data-more>Daha eski</button>' : '<p class="t-text">Henüz oynanmış bir el yok.</p>';
      const ul = $('.hist', sh.body);
      if (ul) ul.insertAdjacentHTML('beforeend', rows.join(''));
      const more = $('[data-more]', sh.body);
      if (more) more.hidden = !list || list.length < 30;
      if (list && list.length) before = list[list.length - 1].id;
    };
    sh.body.addEventListener('click', (e) => e.target.closest('[data-more]') && load(true));
    load(false);
  }
  async function statsSheet(user, name) {
    const sh = T.sheet({ title: user ? `${name} · istatistikler` : 'İstatistiklerim', body: '<p class="t-text">Yükleniyor…</p>' });
    try {
      const s = await rpc('bg_bj_stats', { p_user: user || null });
      const it = (l, v, c) => `<div class="st-it${c ? ' ' + c : ''}"><small>${l}</small><b>${v}</b></div>`;
      const net = s.net_bp || 0;
      sh.body.innerHTML = `<div class="st-grid">
        ${it('Oynanan el', fmt(s.hands_played))}${it('Kazanılan', fmt(s.hands_won))}${it('Kaybedilen', fmt(s.hands_lost))}${it('Berabere', fmt(s.pushes))}
        ${it('Blackjack', fmt(s.blackjacks))}${it('Double', fmt(s.doubles))}${it('Split', fmt(s.splits))}${it('Teslim', fmt(s.surrenders))}
        ${it('Jackpot', fmt(s.jackpots_won), 'gold')}${it('Toplam bahis', fmt(s.total_wagered_bp) + ' BP')}${it('Net', sgn(net) + ' BP', net > 0 ? 'win' : net < 0 ? 'lose' : '')}${it('En yüksek tek el', '+' + fmt(s.best_hand_win_bp) + ' BP')}
        ${it('Bet Behind turu', fmt(s.bet_behind_rounds))}${it('Bet Behind net', sgn(s.bet_behind_net_bp || 0) + ' BP')}
      </div>`;
    } catch (e) {
      sh.body.innerHTML = `<p class="t-text">${esc(errText(e))}</p>`;
    }
  }
  function rulesSheet() {
    T.sheet({
      title: 'Blackjack Royale kuralları',
      wide: true,
      body: `<div class="rules">
        <p><b>Amaç:</b> 21'i geçmeden krupiyeden yüksek toplam yapmak. As 1 ya da 11, J-Q-K 10 sayılır.</p>
        <p><b>Sabot:</b> 8 deste (416 kart). Kesme kartı sondan 73–83 kart geride; çıkınca tur tamamlanır, sonra yeni sabot karıştırılır ve ilk 3 kart yakılır. Deste her elde karıştırılmaz.</p>
        <p><b>Krupiye:</b> 16 ve altında kart çeker, soft 17 dahil 17'de durur. Açık kartı As ya da 10 değerindeyse blackjack kontrolü yapar (American hole card).</p>
        <p><b>Ödemeler:</b> galibiyet 1:1, doğal blackjack 3:2, beraberlikte bahis iade, teslimde yarısı iade. Sigorta (krupiye As açınca) ana bahsin yarısıdır, 2:1 öder.</p>
        <p><b>Hamleler:</b> Kart, Dur, İkiye katla (ilk iki kartta, tek kart verilir), Böl (eşit değerli iki kart, en fazla 4 el; bölünmüş aslara tek kart, tekrar bölünmez; bölmeden sonra ikiye katlama serbest, teslim yok), Teslim (geç teslim, ilk iki kartta). Hamle süresi 15 saniye; süre dolarsa DUR uygulanır.</p>
        <p><b>Ön hamle:</b> Sıran gelmeden kararını seçebilir, değiştirebilir ya da iptal edebilirsin. Sıra gelince son seçim uygulanır; KART yalnızca bir kart demektir. Geçersizleşen ön hamle uygulanmaz, karar süresi verilir.</p>
        <p><b>Masalar:</b> Bronze en fazla 10 BP · Silver en fazla 20 BP (güncel bakiye en az 4.000 BP) · Gold en fazla 100 BP (en az 8.000 BP). Bahis seviyesi güncel bakiyene göre: 4.000 altı 10 BP, 4.000–7.999 20 BP, 8.000 ve üstü 100 BP. Bir masada en fazla 2 pozisyon. Oyun en az 2 aktif potla başlar.</p>
        <p><b>Bet Behind:</b> İzleyici bahis aşamasında bir oyuncunun arkasına 10/20/100 BP koyar (turda tek pozisyon). Ana oyuncunun bütün kararlarını takip eder; Double ve Split'te aynı tutarda ek bahis zorunlu alınır. Ek bahis karşılanamazsa o turdaki bütün Bet Behind bahislerin iade edilir.</p>
        <p><b>Auto Rebet:</b> Açık pozisyonda her yeni bahis turunda son bahsi bir kez koyar. Bakiye yetmezse bahis koymaz. Pozisyondan kalkınca, masadan ayrılınca ya da bağlantı kopunca kapanır.</p>
        <p><b>Jackpot:</b> Yedi potun yedisi de aynı turda kazanır ve bu 5 tur üst üste olursa jackpot: pot başına Bronze 200, Silver 300, Gold 400 BP; geçerli Bet Behind'ı olan izleyiciye 100 / 200 / 300 BP. Beraberlik, kayıp, teslim, boş pot ya da pot sahibinin değişmesi seriyi sıfırlar; kesme kartı sıfırlamaz.</p>
      </div>`,
      actions: [{ label: 'Kapat', kind: 'primary' }],
    });
  }

  /* ---------------- davet ---------------- */
  function inviteLink() {
    try {
      const pl = window.parent.location;
      return pl.origin + pl.pathname + '#/oyun/blackjack?masa=' + G.tableId;
    } catch (e) {
      return location.href;
    }
  }
  async function inviteSheet() {
    const link = inviteLink();
    const sh = T.sheet({
      title: 'Arkadaşını davet et',
      body: `<div class="t-copy"><input class="t-input" readonly value="${esc(link)}" aria-label="Davet bağlantısı"><button type="button" class="t-btn is-primary" data-copy>Kopyala</button></div>
        <p class="t-note">${G.st && G.st.visibility === 'private' ? 'Özel masa: yalnızca arkadaşların ve masadakilerin arkadaşları görebilir.' : 'Herkese açık masa.'}</p>
        <div class="inv-list"><p class="t-text">Arkadaşlar yükleniyor…</p></div>`,
    });
    $('[data-copy]', sh.body).addEventListener('click', async (e) => {
      let ok = false;
      try {
        await (window.parent.navigator.clipboard || navigator.clipboard).writeText(link);
        ok = true;
      } catch (err) {
        $('input', sh.body).select();
      }
      e.target.textContent = ok ? 'Kopyalandı' : 'Seçildi, kopyala';
    });
    let fr = [];
    try {
      fr = ((await rpc('bg_friends')) || []).filter((f) => f.relation === 'friend');
    } catch (e) {}
    const box = $('.inv-list', sh.body);
    box.innerHTML = fr.length
      ? fr.map((f) => `<div class="inv-row">${T.avatar({ name: f.full_name || f.username, avatar_url: f.avatar_url }, 36)}<span><b>${esc(f.full_name || f.username)}</b><small>${f.online ? (f.game === 'blackjack' ? 'Blackjack Royale’de' : 'Çevrim içi') : 'Çevrim dışı'}</small></span><button type="button" class="t-btn" data-inv="${f.user_id}">Davet et</button></div>`).join('')
      : '<p class="t-text">Davet edebileceğin arkadaşın yok. Bağlantıyı paylaşabilirsin.</p>';
    box.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-inv]');
      if (!b) return;
      b.disabled = true;
      try {
        await rpc('bg_send_message', { p_to: b.dataset.inv, p_body: `[[davet:blackjack:${G.tableId}]] ${G.st ? G.st.name : 'Blackjack'} masasına gel` });
        b.textContent = 'Gönderildi';
      } catch (err) {
        toast(errText(err), 'err');
        b.disabled = false;
      }
    });
  }

  /* ---------------- oyuncu kartı, Bet Behind listesi ---------------- */
  function playerSheet(u, seat) {
    const mine = u.id === myId();
    const friend = T.isFriend(u.id);
    const sh = T.sheet({
      title: u.name,
      body: `<div class="pl-card">${T.avatar({ name: u.name, avatar_url: u.avatar }, 64)}<div><b>${esc(u.name)}</b><small>@${esc(u.username || '')}${seat ? ' · P' + seat : ''}</small></div></div>
        <div class="menu-list">${mine ? '' : '<button type="button" data-g>Hediye gönder</button>'}${mine || friend ? '<button type="button" data-s>İstatistikler</button>' : ''}</div>`,
    });
    sh.body.addEventListener('click', (e) => {
      if (e.target.closest('[data-g]')) {
        sh.close();
        giftSheet(u);
      } else if (e.target.closest('[data-s]')) {
        sh.close();
        statsSheet(mine ? null : u.id, u.name);
      }
    });
  }
  function bbList(seat) {
    const s = G.st && G.st.seats.find((x) => x.no === seat);
    if (!s || !s.bb) return;
    const st = { PENDING: 'bekliyor', ACTIVE: 'aktif', FOLLOWING: 'takipte', SETTLED_WIN: 'kazandı', SETTLED_LOSE: 'kaybetti', SETTLED_PUSH: 'berabere', SETTLED_SURRENDER: 'teslim' };
    T.sheet({
      title: `P${seat} · Bet Behind ${fmt(s.bb.total)} BP`,
      body: `<ul class="bb-list">${(s.bb.list || []).map((x) => `<li><span>${esc(x.name)}</span><b>${fmt(x.amount)} BP</b><small>${st[x.status] || ''}${x.payout ? ' · ' + fmt(x.payout) + ' BP ödendi' : ''}</small></li>`).join('')}</ul>`,
      actions: [{ label: 'Kapat' }],
    });
  }

  /* =====================================================================
     HEDİYELER
     ===================================================================== */
  const giftSrc = (code, x) => `assets/gifts/${code}${x === 2 ? '@2x' : ''}.webp`;
  const giftImg = (code) => `<img src="${giftSrc(code)}" srcset="${giftSrc(code, 2)} 2x" alt="" loading="lazy">`;
  async function giftSheet(u) {
    if (!G.gifts) {
      try {
        G.gifts = await rpc('bg_gift_catalog');
      } catch (e) {
        return toast(errText(e), 'err');
      }
    }
    const TIERS = { standart: 'Standart', ozel: 'Özel', premium: 'Premium', saka: 'Şaka' };
    const groups = {};
    G.gifts.forEach((g) => (groups[g.tier] = groups[g.tier] || []).push(g));
    const sh = T.sheet({
      title: `${u.name} için hediye`,
      wide: true,
      body: `<p class="t-note">Hediye sembolik bir jesttir: BP'si senden düşer, alıcıya BP geçmez. Masadaki herkes görür. Bakiyen: ${fmt(G.me && G.me.balance)} BP</p>
        ${Object.keys(TIERS).filter((k) => groups[k]).map((k) => `<h4 class="gift-h">${TIERS[k]}</h4><div class="gift-grid">${groups[k].map((g) => `<button type="button" class="gift" data-gift="${g.code}" ${G.me && G.me.balance < g.price ? 'disabled' : ''}>${giftImg(g.code)}<span>${esc(g.name)}</span><b>${fmt(g.price)} BP</b></button>`).join('')}</div>`).join('')}`,
    });
    sh.body.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-gift]');
      if (!b || b.disabled) return;
      $$('[data-gift]', sh.body).forEach((x) => (x.disabled = true));
      try {
        const r = await rpc('bg_gift_send', { p_to: u.id, p_code: b.dataset.gift, p_game: 'blackjack', p_table: G.tableId, p_req: rid() });
        if (G.me) G.me.balance = r.balance;
        renderHud();
        sh.close();
        toast('Hediye gönderildi.', 'good');
      } catch (err) {
        toast(errText(err), 'err');
        $$('[data-gift]', sh.body).forEach((x) => (x.disabled = false));
      }
    });
  }

  /* =====================================================================
     SOHBET
     ===================================================================== */
  async function loadChat() {
    const id = G.tableId;
    try {
      const list = await rpc('bg_bj_chat_list', { p_table: id, p_after: 0 });
      if (G.tableId !== id) return;
      G.chat.list = list || [];
      G.chat.last = G.chat.list.length ? G.chat.list[G.chat.list.length - 1].id : 0;
      renderChat();
    } catch (e) {}
    paintHostChat();
  }
  function onChatRow(row) {
    if (row.id <= G.chat.last) return;
    G.chat.last = row.id;
    const st = G.st;
    const seatOf = (uid) => {
      const s = st && st.seats.find((x) => x.user && x.user.id === uid);
      return s ? s.no : null;
    };
    const name = (() => {
      const s = st && st.seats.find((x) => x.user && x.user.id === row.user_id);
      return s ? s.user.name : row.user_id === myId() ? T.myName() : 'İzleyici';
    })();
    const item = Object.assign({ name }, row);
    G.chat.list.push(item);
    if (G.chat.list.length > 120) G.chat.list.shift();
    const m = /^\[\[gift:([a-z_]+):([0-9a-f-]{36})\]\]/.exec(row.body || '');
    if (m && G.scene) G.scene.flyGift(giftSrc(m[1], 2), seatOf(row.user_id), seatOf(m[2]));
    if (!G.chat.open && row.user_id !== myId()) {
      G.chat.unread++;
      if (!m) SND.play('message');
    }
    renderChat();
    paintHostChat();
    // ad bilinmiyorsa listeyi tazele
    if (name === 'İzleyici') loadChatNames();
  }
  let namesT = null;
  function loadChatNames() {
    clearTimeout(namesT);
    namesT = setTimeout(async () => {
      try {
        const list = await rpc('bg_bj_chat_list', { p_table: G.tableId, p_after: 0 });
        G.chat.list = list || [];
        renderChat();
      } catch (e) {}
    }, 600);
  }
  function chatLine(m) {
    const g = /^\[\[gift:([a-z_]+):([0-9a-f-]{36})\]\]\s*(.*)$/.exec(m.body || '');
    const when = new Date(m.created_at || Date.now()).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    if (g) return `<li class="cm gift-line">${giftImg(g[1])}<span><b>${esc(m.name)}</b> → ${esc(g[3])}</span><time>${when}</time></li>`;
    return `<li class="cm${m.user_id === myId() ? ' me' : ''}"><button type="button" class="cm-who" data-u="${m.user_id}" data-n="${esc(m.name)}">${esc(m.name)}</button><p>${esc(m.body)}</p><time>${when}</time></li>`;
  }
  function renderChat() {
    const box = $('#chat');
    if (!G.chat.open) return;
    if (!box.innerHTML) {
      box.innerHTML = `<header><b>Masa sohbeti</b><button type="button" class="hud-btn" data-cx aria-label="Kapat">×</button></header>
        <ul class="cm-list"></ul>
        <form class="cm-form"><input class="t-input" maxlength="300" placeholder="Masaya yaz…" aria-label="Mesaj"><button class="t-btn is-primary" type="submit">Gönder</button></form>`;
      $('[data-cx]', box).addEventListener('click', () => toggleChat(false));
      $('form', box).addEventListener('submit', sendChat);
      $('.cm-list', box).addEventListener('click', (e) => {
        const b = e.target.closest('[data-u]');
        if (b && b.dataset.u !== myId()) playerSheet({ id: b.dataset.u, name: b.dataset.n }, null);
      });
    }
    const ul = $('.cm-list', box);
    const atEnd = ul.scrollHeight - ul.scrollTop - ul.clientHeight < 60;
    ul.innerHTML = G.chat.list.length ? G.chat.list.map(chatLine).join('') : '<li class="cm-empty">Masaya ilk mesajı sen yaz.</li>';
    if (atEnd) ul.scrollTop = ul.scrollHeight;
  }
  async function sendChat(e) {
    e.preventDefault();
    const inp = $('#chat input');
    const body = inp.value.trim();
    if (!body) return;
    inp.value = '';
    try {
      await rpc('bg_bj_chat_send', { p_table: G.tableId, p_body: body });
    } catch (err) {
      toast(errText(err), 'err');
      inp.value = body;
    }
  }
  function toggleChat(force) {
    if (G.view !== 'table') return;
    G.chat.open = typeof force === 'boolean' ? force : !G.chat.open;
    const box = $('#chat');
    box.hidden = !G.chat.open;
    if (G.chat.open) {
      G.chat.unread = 0;
      renderChat();
      const ul = $('.cm-list', box);
      if (ul) ul.scrollTop = ul.scrollHeight;
      setTimeout(() => {
        const i = $('#chat input');
        if (i && !/Mobi|Android/i.test(navigator.userAgent)) i.focus();
      }, 50);
    }
    paintHostChat();
    setTimeout(() => G.scene && fitScene(), 30);
  }
  function paintHostChat() {
    try {
      const B = T.site();
      if (B && B.host && typeof B.host.tableChat === 'function') B.host.tableChat(G.view === 'table' && !!G.tableId, G.chat.unread);
    } catch (e) {}
  }

  window.addEventListener('DOMContentLoaded', boot);
})();
