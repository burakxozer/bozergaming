.ha.a-surrender { background: linear-gradient(180deg, #a3a8b4, #5f6573); }
.ha.on { cursor: default; box-shadow: 0 0 0 2px #fff, 0 0 14px rgba(255, 255, 255, .55), inset 0 -3px 0 rgba(0, 0, 0, .28); }
.ha-wait { font: 800 calc(var(--hb2, var(--hb, 40px)) * .3)/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: #ffe7a6; padding: 0 2px; white-space: nowrap; }
.ha-x { width: calc(var(--hb2, var(--hb, 40px)) * .82); height: calc(var(--hb2, var(--hb, 40px)) * .82); display: inline-grid; place-items: center; padding: 0; cursor: pointer;
  border-radius: 50%; border: 2px solid #ffd9d6; background: radial-gradient(circle at 35% 30%, #ff6b60, #c81e14 70%); color: #fff;
  box-shadow: 0 0 0 2px rgba(200, 30, 20, .35), 0 3px 8px rgba(0, 0, 0, .5); }
.ha-x svg { width: 58%; height: 58%; fill: none; stroke: currentColor; stroke-width: 3.4; stroke-linecap: round; }
.ha-x:hover { filter: brightness(1.12); }
@keyframes bjActsIn { from { opacity: 0; transform: translate(-50%, 6px) scale(.92); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
@keyframes bjActsPulse { 0%, 100% { box-shadow: 0 0 0 2px rgba(255, 214, 102, .35), 0 0 18px rgba(255, 200, 80, .45), 0 8px 20px rgba(0, 0, 0, .55); }
  50% { box-shadow: 0 0 0 3px rgba(255, 224, 130, .6), 0 0 30px rgba(255, 210, 90, .75), 0 8px 20px rgba(0, 0, 0, .55); } }
@media (prefers-reduced-motion: reduce) { .hacts, .hacts.turn { animation: none; } }
html[data-q='low'] .hacts.turn { animation: none; }

/* v3.2: telefonda ön hamle açıklaması taşmasın (karar düğmeleri masada da var) */
@media (max-width: 760px) {
  .ctl-act.premode .ctl-who small { display: none; }
  .ctl-who { white-space: normal; overflow-wrap: anywhere; }
}

/* =====================================================================
   v3.3 ALT KARAR ÇUBUĞU — kararlar alttan verilir (örnek oyundaki gibi)
   Yuvarlak, renkli simgeler: Pes et (gri) · İki kat (yeşil) · Böl (sarı) ·
   Dur (kırmızı) · Kart al (mavi). Ön seçimde düğmeler kontur olur, seçilen
   dolar ve köşesinde onay işareti çıkar. Telefonda yatayda düğmeler masanın
   iki alt köşesine yerleşir; masa tam genişlikte kalır.
   ===================================================================== */
.bj-controls { display: block; min-height: 0; padding: 12px max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.bj-controls.busy .ctl-main { opacity: 1; }
.bj-controls.busy .dock[data-mode='turn'] .dk-bar { opacity: .72; }
.dock { position: relative; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 9px; }
.dk-info { display: flex; align-items: center; justify-content: center; gap: 8px 12px; flex-wrap: wrap; min-height: 24px; }
.dk-who { margin: 0; display: flex; align-items: center; justify-content: center; gap: 4px 9px; flex-wrap: wrap; font-size: 14px; line-height: 1.25; color: var(--muted); }
.dk-who b { color: var(--gold-hi); font-weight: 800; }
.dk-who span { color: #fff; font-weight: 700; }
.dk-who small { flex-basis: 100%; text-align: center; font-size: 12px; color: var(--muted); }
.dk-sum { font-style: normal; font-weight: 900; color: #fff; padding: 0 9px; line-height: 22px; border-radius: 99px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); font-variant-numeric: tabular-nums; }
.dk-amt { font-variant-numeric: tabular-nums; }
.dock[data-mode='turn'] .dk-who b { animation: dkTurn 1.6s ease-in-out infinite; }
@keyframes dkTurn { 0%, 100% { text-shadow: 0 0 0 rgba(255, 215, 122, 0); } 50% { text-shadow: 0 0 14px rgba(255, 215, 122, .85); } }
.dk-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; }
.dk-l, .dk-r { display: contents; }
.dk-c { flex: 1.25 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
.dock[data-mode='res'] .dk-c, .dock[data-mode='wait'] .dk-c { flex: 1; min-height: 52px; }
.dock .tbar { position: absolute; left: 6%; right: 6%; top: -8px; height: 3px; flex: none; }
.ab {
  position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 2px 0;
  border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.ab-d {
  position: relative; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 30%, var(--c1), var(--c2) 74%);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .3), inset 0 -4px 0 rgba(0, 0, 0, .3), 0 0 0 2px rgba(0, 0, 0, .6), 0 0 0 3.5px var(--ring), 0 9px 16px rgba(0, 0, 0, .5);
  transition: transform .12s ease, box-shadow .2s ease, filter .2s ease;
}
.ab-d i { display: block; width: 26px; height: 26px; color: #fff; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .35)); }
.ab-d svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.ab b { font-size: 12.5px; font-weight: 800; white-space: nowrap; letter-spacing: .01em; }
.ab kbd { position: absolute; top: -2px; left: calc(50% + 22px); font: 700 10px var(--ui); color: rgba(255, 255, 255, .45); }
.ab:hover:not(:disabled) .ab-d { filter: brightness(1.12); transform: translateY(-2px); }
.ab:active:not(:disabled) .ab-d { transform: scale(.9); transition-duration: .05s; }
.ab:focus-visible { outline: none; }
.ab:focus-visible .ab-d { outline: 3px solid #fff; outline-offset: 3px; }
.ab:disabled { cursor: default; }
.ab:disabled .ab-d { filter: grayscale(.9) brightness(.5); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .06), 0 0 0 2px rgba(0, 0, 0, .6), 0 0 0 3px rgba(255, 255, 255, .1); }
.ab:disabled b { opacity: .38; }
.ab.a-hit { --c1: #66b0ff; --c2: #1450b6; --ring: #96cbff; }
.ab.a-stand { --c1: #ff8070; --c2: #b01b12; --ring: #ffb0a5; }
.ab.a-double { --c1: #63e394; --c2: #0f8a3b; --ring: #a5f2c3; }
.ab.a-split { --c1: #ffdc6b; --c2: #c78700; --ring: #ffe9a8; }
.ab.a-split .ab-d i { color: #2b1c00; filter: none; }
.ab.a-surrender { --c1: #c2c7d2; --c2: #545b6a; --ring: #dde1e9; }
.ab.sb { --c1: #3b3c33; --c2: #15160f; --ring: rgba(233, 207, 140, .5); }
.ab.sb .ab-d i { color: var(--gold-hi); }
.ab.sb.go { --c1: #ffe6a3; --c2: #b8882d; --ring: #fff2cc; }
.ab.sb.go .ab-d i { color: #2a1a04; filter: none; }
.ab.fired .ab-d { animation: abFire .4s ease-out; }
@keyframes abFire { 0% { box-shadow: 0 0 0 2px rgba(0, 0, 0, .6), 0 0 0 3.5px var(--ring), 0 0 0 0 var(--ring); } 100% { box-shadow: 0 0 0 2px rgba(0, 0, 0, .6), 0 0 0 3.5px var(--ring), 0 0 0 16px rgba(255, 255, 255, 0); } }
/* ön seçim: kontur düğme, seçilen dolu + onay işareti (tekrar dokununca kalkar) */
.dock[data-mode='pre'] .ab-d { background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, .1), rgba(0, 0, 0, .4) 74%); box-shadow: 0 0 0 2px rgba(0, 0, 0, .6), 0 0 0 2.5px var(--ring), 0 6px 12px rgba(0, 0, 0, .4); }
.dock[data-mode='pre'] .ab-d i { color: var(--ring); }
.dock[data-mode='pre'] .ab.on .ab-d { background: radial-gradient(circle at 50% 30%, var(--c1), var(--c2) 74%); box-shadow: 0 0 0 2px rgba(0, 0, 0, .6), 0 0 0 3.5px #fff, 0 0 20px var(--ring); }
.dock[data-mode='pre'] .ab.on .ab-d i { color: #fff; }
.dock[data-mode='pre'] .ab.a-split.on .ab-d i { color: #2b1c00; }
.dock[data-mode='pre'] .ab:disabled .ab-chk { display: none; }
.ab-chk { position: absolute; top: -5px; right: -5px; width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; border: 2px solid rgba(255, 255, 255, .6); background: rgba(8, 10, 8, .9); transition: background .15s, border-color .15s, transform .15s; }
.ab-chk svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.ab.on .ab-chk { background: #22c063; border-color: #fff; transform: scale(1.08); }
.ab.on .ab-chk svg { opacity: 1; }
/* bahis: ortadaki büyük fiş, her dokunuşta bir fiş ekler */
.pchip.big { width: 68px; height: 68px; flex: none; margin-top: -4px; filter: drop-shadow(0 8px 8px rgba(0, 0, 0, .55)); }
.pchip.big .pc-plus { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); font: 800 11.5px var(--ui); color: #1d1404; background: #ffd77a; padding: 1px 8px; border-radius: 99px; box-shadow: 0 2px 6px rgba(0, 0, 0, .45); white-space: nowrap; }
.pchip.big.tap { animation: chipTap .26s ease-out; }
@keyframes chipTap { 0% { transform: none; } 40% { transform: translateY(-9px) scale(1.07); } 100% { transform: none; } }
.dk-tabs { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dk-tabs button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 99px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .04); font: 800 12.5px var(--ui); color: var(--ink); font-variant-numeric: tabular-nums; }
.dk-tabs button em { font-style: normal; font-size: 11px; color: var(--gold-hi); }
.dk-tabs button[aria-pressed='true'] { background: var(--gold-hi); border-color: var(--gold-hi); color: #1d1404; }
.dk-tabs button[aria-pressed='true'] em { color: #1d1404; }
.dock .ar-group { flex-direction: row; gap: 6px; }
.dock .ar { padding: 4px 10px; }
.dock .ctl-status { font-size: 14.5px; }
.dock .hand-read { gap: 4px; }
.dock .mc { min-width: 30px; height: 36px; padding: 0 5px; font-size: 16px; border-radius: 6px; }
.dock .mc-dl { font-size: 11.5px; margin: 0 2px; }
.set-note { margin: -2px 0 6px; font-size: 12px; line-height: 1.4; color: var(--muted); }

/* el toplamı değişince kısa büyüme */
.tot.pop { animation: totPop .34s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes totPop { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }

/* kart gölgesi: uçuşta filtre değişmez (her karede yeniden çizim olmasın), gölge ayrı katmanda kayar */
.cd-f, .cd-b { transition: none; }
html[data-q='high'] .cd-f, html[data-q='high'] .cd-b { filter: none; }
html[data-q='high'] .cd::before {
  content: ''; position: absolute; inset: 2% 3%; border-radius: 9%; background: rgba(0, 0, 0, .5); filter: blur(4px);
  transform: translate3d(0, 4px, 0); opacity: .9; transition: transform .32s cubic-bezier(.3, .7, .3, 1), opacity .32s;
}
html[data-q='high'] .cd.flying::before { transform: translate3d(8px, 22px, 0) scale(1.05); opacity: .42; }
html[data-q='high'] .cd.dim .cd-f { filter: grayscale(1) brightness(.58) contrast(.92); }
html[data-q='high'] .cd.reveal .cd-f { filter: none; }
html[data-q='high'] .cd.reveal::before { background: rgba(255, 214, 130, .7); filter: blur(10px); }

/* el altı ön seçim şeridi: kelimeler (Hit · Stand · 2x · Split) */
.ha { width: auto; min-width: var(--hb2, var(--hb, 40px)); padding: 0 calc(var(--hb2, var(--hb, 40px)) * .26); font-size: calc(var(--hb2, var(--hb, 40px)) * .36); letter-spacing: 0; border-radius: calc(var(--hb2, var(--hb, 40px)) * .5); }
.ha-wait { font-size: calc(var(--hb2, var(--hb, 40px)) * .28); }

/* masaüstü: biraz daha büyük düğmeler */
@media (min-width: 761px) and (min-height: 501px) {
  .bj-controls { min-height: 142px; }
  .ab-d { width: 58px; height: 58px; }
  .ab-d i { width: 27px; height: 27px; }
  .ab b { font-size: 13px; }
  .dock { gap: 10px; }
}
/* dik telefon: kısa bilgi satırı, beş düğme tek sırada */
@media (max-width: 760px) {
  .bj-controls { padding-top: 10px; min-height: calc(126px + env(safe-area-inset-bottom)); }
  .dk-who small { flex-basis: auto; }
  .dock { gap: 7px; }
  .dk-who { font-size: 13px; }
  .dock[data-mode='turn'] .dk-who small, .dock[data-mode='pre'] .dk-who small { display: none; }
  .dk-info { gap: 6px 10px; }
  .ab-d { width: 50px; height: 50px; }
  .ab-d i { width: 24px; height: 24px; }
  .ab b { font-size: 11.5px; }
  .ab kbd { display: none; }
  .pchip.big { width: 62px; height: 62px; }
  .dock .mc { min-width: 26px; height: 31px; font-size: 14px; }
  .dock[data-mode='turn'] .dk-info, .dock[data-mode='pre'] .dk-info { flex-wrap: nowrap; }
  .dock .hand-read { flex-wrap: nowrap; }
}
@media (max-width: 360px) {
  .ab-d { width: 44px; height: 44px; }
  .ab b { font-size: 10.5px; }
  .dock[data-mode='turn'] .mc-dl { display: none; }
}
/* yatay telefon: masa tam genişlikte; düğmeler masanın iki alt köşesinde (ortadaki pozisyon görünür kalır) */
@media (max-height: 500px) and (orientation: landscape) {
  .bj-view { display: flex; flex-direction: column; }
  .bj-controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; min-height: 0; border: 0; background: none; pointer-events: none;
    padding: 0 max(6px, env(safe-area-inset-right)) max(5px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
  }
  .dock { max-width: none; gap: 0; }
  .dk-bar { align-items: flex-end; gap: 6px; }
  .dk-l, .dk-r { display: flex; align-items: flex-start; gap: 2px; pointer-events: auto; padding: 6px 5px 4px; border-radius: 20px;
    background: linear-gradient(180deg, rgba(6, 8, 6, .55), rgba(6, 8, 6, .86)); border: 1px solid rgba(233, 207, 140, .2); box-shadow: 0 6px 18px rgba(0, 0, 0, .45); }
  .dk-l:empty, .dk-r:empty { display: none; }
  .dk-l { margin-right: auto; }
  .dk-c { flex: none; pointer-events: auto; margin-left: auto; align-self: flex-end; }
  .dk-c:empty { display: none; }
  .ab { flex: none; width: 46px; gap: 3px; }
  .ab-d { width: 38px; height: 38px; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .28), inset 0 -3px 0 rgba(0, 0, 0, .3), 0 0 0 1.5px rgba(0, 0, 0, .6), 0 0 0 3px var(--ring), 0 5px 10px rgba(0, 0, 0, .5); }
  .ab-d i { width: 18px; height: 18px; }
  .ab b { font-size: 9.5px; }
  .ab kbd { display: none; }
  .ab-chk { width: 17px; height: 17px; top: -4px; right: -4px; }
  .ab-chk svg { width: 10px; height: 10px; }
  .pchip.big { width: 50px; height: 50px; margin: 0 2px 6px 0; }
  .pchip.big .pc-plus { font-size: 10px; bottom: -6px; }
  .dk-info { position: absolute; left: 0; bottom: calc(100% + 6px); max-width: min(38vw, 300px); justify-content: flex-start; pointer-events: auto;
    padding: 4px 10px; border-radius: 14px; background: rgba(6, 8, 6, .78); border: 1px solid rgba(233, 207, 140, .18); }
  .dk-info:empty { display: none; }
  .dk-who { justify-content: flex-start; font-size: 11.5px; gap: 2px 6px; }
  .dk-who small, .dock .hand-read { display: none; }
  .dk-sum { line-height: 18px; padding: 0 7px; }
  .dk-tabs button { padding: 2px 8px; font-size: 11px; }
  .dock .ar { padding: 2px 8px; font-size: 10px; }
  .dock .ar span { display: none; }
  .dock[data-mode='wait'] .dk-c { display: none; }
  .dock[data-mode='res'] .dk-c { min-height: 0; margin-bottom: 4px; }
  .dock[data-mode='res'] .ctl-res { padding: 4px 12px; border-radius: 14px; background: rgba(6, 8, 6, .8); border: 1px solid rgba(233, 207, 140, .2); gap: 6px; }
  .dock[data-mode='res'] .ctl-res b { font-size: 18px; }
  .dock[data-mode='res'] .ctl-res small { display: none; }
  .dock[data-mode='res'] .dk-info, .dock[data-mode='wait'] .dk-info { position: static; padding: 0; background: none; border: 0; margin: 0 auto 4px 0; }
  .dock .tbar { display: none; }
  .bj-controls.busy .dock[data-mode='turn'] .dk-bar { opacity: 1; }
  .bj-controls.busy .dock[data-mode='turn'] .dk-l, .bj-controls.busy .dock[data-mode='turn'] .dk-r { opacity: .72; }
}
@media (prefers-reduced-motion: reduce) {
  .dock[data-mode='turn'] .dk-who b, .ab.fired .ab-d, .pchip.big.tap, .tot.pop { animation: none; }
}

/* v3.3: alttaki fişten bahis alanına atılan fiş */
.chip-toss { position: absolute; left: 0; top: 0; width: 54px; height: 54px; margin: -27px 0 0 -27px; pointer-events: none; z-index: 3; filter: drop-shadow(0 10px 8px rgba(0, 0, 0, .45)); }
.chip-toss svg { display: block; width: 100%; height: 100%; }
.bj-stage[data-layout='port'] .chip-toss { width: 66px; height: 66px; margin: -33px 0 0 -33px; }

/* =====================================================================
   v3.4 YAN BAHİSLER — Perfect Pairs (ana yuvanın solunda) ve 21+3 (sağında)
   Bekleyen yan bahis kesik çizgili, alınan bahis dolu; kazanınca yeşil parlar,
   kaybedince söner. Bahis türü alttaki çubuktan seçilir.
   ===================================================================== */
.bj-side { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; }
/* yan bahis yuvası: ana yuvanın kenarına oturan küçük fiş; üstünde tür etiketi (PP altın, 21+3 mavi) */
.sp { --c: #f3d892; --c2: #8a6420; --ink: #1d1404; position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
  display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; white-space: nowrap; font-variant-numeric: tabular-nums;
  background: radial-gradient(circle at 50% 35%, #3a2a14, #120c06 70%); border: 2px solid var(--c);
  box-shadow: 0 0 0 2px rgba(0, 0, 0, .55), 0 5px 10px rgba(0, 0, 0, .55), inset 0 0 0 3px rgba(0, 0, 0, .35), inset 0 0 0 4px var(--c2);
  transition: opacity .3s, filter .3s; }
.sp em { position: absolute; left: 50%; top: -10px; transform: translateX(-50%); padding: 1px 5px; border-radius: 99px; font: 900 8.5px/1.15 var(--ui); font-style: normal;
  letter-spacing: .04em; color: var(--ink); background: var(--c); box-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
.sp b { font: 900 12.5px/1 var(--ui); color: #fff; text-shadow: 0 1px 2px #000; }
.sp.sp-t3 { --c: #8cc8ff; --c2: #1f4f86; --ink: #06223c; background: radial-gradient(circle at 50% 35%, #15304d, #060d18 70%); }
.sp.wait { border-style: dashed; }
.sp.wait b { opacity: .85; }
.sp.ghost { background: rgba(0, 0, 0, .35); box-shadow: none; border-style: dashed; animation: spGhost 1.4s ease-in-out infinite; }
.sp.ghost b { color: var(--c); font-size: 18px; }
.sp.sel { box-shadow: 0 0 0 2px rgba(0, 0, 0, .55), 0 0 0 5px var(--c), 0 0 16px var(--c); }
.sp.ghost.sel { box-shadow: 0 0 12px var(--c); }
.sp.won { --c: #74e3a6; --c2: #1d6b45; --ink: #052414; width: auto; min-width: 36px; padding: 0 9px; border-radius: 18px; background: radial-gradient(circle at 50% 30%, #1d6b45, #052414 75%);
  box-shadow: 0 0 0 2px rgba(0, 0, 0, .5), 0 0 22px rgba(116, 227, 166, .75); animation: spWin .7s cubic-bezier(.2, 1.5, .4, 1) both; }
.sp.won b { color: #b6ffd6; font-size: 14px; }
.sp.lost { opacity: .35; filter: grayscale(.9); }
@keyframes spGhost { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
@keyframes spWin { 0% { transform: translate(-50%, -50%) scale(.6); } 60% { transform: translate(-50%, -50%) scale(1.25); } 100% { transform: translate(-50%, -50%) scale(1.08); } }
.bj-stage[data-layout='port'] .sp { width: 44px; height: 44px; }
.bj-stage[data-layout='port'] .sp em { font-size: 11px; top: -12px; }
.bj-stage[data-layout='port'] .sp b { font-size: 16px; }
.bj-stage[data-layout='port'] .sp.won { width: auto; height: 44px; border-radius: 22px; }
.bj-stage[data-layout='port'] .sp.won b { font-size: 18px; }
.fx-float.side { color: #ffe08a; text-shadow: 0 2px 0 #3a2400, 0 0 16px rgba(255, 210, 90, .7); }

/* bahis türü seçimi (Ana bahis / Perfect Pairs / 21+3) */
.dk-kind { display: inline-flex; padding: 3px; gap: 3px; border-radius: 99px; background: rgba(0, 0, 0, .35); border: 1px solid var(--line-2); }
.dk-kind button { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 11px; border: 0; border-radius: 99px; background: none; font: 800 12.5px var(--ui); color: var(--muted); white-space: nowrap; }
.dk-kind button em { font-style: normal; font-size: 11.5px; color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.dk-kind button[aria-pressed='true'] { background: var(--gold-hi); color: #1d1404; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
.dk-kind button[aria-pressed='true'] em { color: #1d1404; }
.dk-kind .bk-t3 em { color: #a9d6ff; }
.dk-kind .bk-t3[aria-pressed='true'] { background: #8cc8ff; color: #06223c; }
.dk-kind .bk-t3[aria-pressed='true'] em { color: #06223c; }
.dk-who b.bk-t { color: #f3d892; }
.dk-kind .ks { display: none; }
@media (max-width: 420px) {
  .dk-kind button { padding: 5px 8px; font-size: 11.5px; gap: 4px; }
}
@media (max-width: 360px) {
  .dk-kind .kl { display: none; }
  .dk-kind .ks { display: inline; }
}
/* yatay telefon: bilgi kutusu küçük kalsın (masayı örtmesin): tür seçimi kısa adlarla, açıklama satırı gizli */
@media (max-height: 500px) and (orientation: landscape) {
  .dk-who.has-kind { display: none; }
  .dk-kind { padding: 2px; }
  .dk-kind button { padding: 3px 8px; font-size: 11px; gap: 4px; }
  .dk-kind button em { font-size: 10.5px; }
  .dk-kind .kl { display: none; }
  .dk-kind .ks { display: inline; }
}
@media (prefers-reduced-motion: reduce) {
  .sp.ghost, .sp.won { animation: none; }
}
.lbc-side { padding: 1px 8px; border-radius: 99px; font-size: 11px; font-weight: 800; letter-spacing: .02em; color: #1d1404; background: linear-gradient(90deg, #f3d892, #a9d6ff); }
.lbc-side + .lbc-priv { margin-left: 6px; }
.lbc-top .lbc-side { margin-left: auto; }
/* masa oluştur: yan bahis onay kutusu (varsayılan işaretli) */
.side-check { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 14px; cursor: pointer;
  border: 1px solid rgba(243, 216, 146, .35); background: linear-gradient(135deg, rgba(243, 216, 146, .1), rgba(140, 200, 255, .08)); }
.side-check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sc-box { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 7px; border: 2px solid rgba(243, 216, 146, .7); background: rgba(0, 0, 0, .3); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.sc-box::after { content: ''; width: 11px; height: 6px; margin-top: -3px; border-left: 3px solid #1d1404; border-bottom: 3px solid #1d1404; transform: rotate(-45deg) scale(0); transition: transform .15s; }
.side-check input:checked + .sc-box { background: #f3d892; border-color: #f3d892; }
.side-check input:checked + .sc-box::after { transform: rotate(-45deg) scale(1); }
.side-check input:focus-visible + .sc-box { outline: 2px solid #fff; outline-offset: 2px; }
.sc-t { display: grid; gap: 3px; }
.sc-t b { font-size: 14px; color: #fff; }
.sc-t small { font-size: 12px; line-height: 1.4; color: var(--muted, #b7b0a0); }

/* ---------------- v3.4.1: yan bahis sayaçları, Hazır, masadaki yuvalar ---------------- */
.sbk-row { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sbk { --c: #f3d892; --ink: #1d1404; display: inline-flex; align-items: stretch; border-radius: 99px; background: rgba(0, 0, 0, .4); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); overflow: hidden; }
.sbk.sbk-t3 { --c: #8cc8ff; --ink: #06223c; }
.sbk-add { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px 0 5px; border: 0; background: none; color: var(--c); font: 800 13px var(--ui); cursor: pointer; white-space: nowrap; }
.sbk-add i { display: grid; place-items: center; min-width: 26px; height: 24px; padding: 0 6px; border-radius: 99px; font-style: normal; font-size: 11px; font-weight: 900; color: var(--ink); background: var(--c); }
.sbk-add b { font-variant-numeric: tabular-nums; color: #fff; }
.sbk.on { background: color-mix(in srgb, var(--c) 18%, rgba(0, 0, 0, .55)); box-shadow: 0 0 12px color-mix(in srgb, var(--c) 35%, transparent); }
.sbk.on .sbk-add b { color: var(--c); }
.sbk.off { opacity: .5; }
.sbk-add:active { transform: scale(.96); }
.sbk-x { min-width: 30px; border: 0; border-left: 1px solid color-mix(in srgb, var(--c) 35%, transparent); background: rgba(0, 0, 0, .3); color: #fff; font: 800 16px/1 var(--ui); cursor: pointer; }
.sbk-cap { font-size: 11px; color: var(--muted); white-space: nowrap; }
@media (max-width: 420px) {
  .sbk-cap { display: none; }
  .sbk-add { padding: 0 10px 0 4px; font-size: 12.5px; min-height: 32px; }
}
.ab.go.done { filter: saturate(.75); }
.ab.go.done .ab-d { box-shadow: 0 0 0 2px #63e6a8, 0 0 16px rgba(99, 230, 168, .5); }
/* masadaki yan bahis yuvaları kendi pozisyonumda dokunulabilir */
.sp.tap { pointer-events: auto; cursor: pointer; }
.sp.tap:hover { filter: brightness(1.15); }
.sp.ghost.tap { animation: spGhost 1.4s ease-in-out infinite; }
.sp.ghost.tap b { font-size: 20px; }
/* v3.4.1: krupiyesiz görünüm: sahnenin üstü kırpılır, mesaj kartı ortada */
.bj-stage.no-dealer .bj-dealer { visibility: hidden; }
.bj-stage.no-dealer .dmsg.bubble { transform: translate(-50%, -50%); }
.bj-stage.no-dealer .dmsg.bubble::before { display: none; }
/* v3.4.1: yatay telefonda yan bahis sayaçları kısa (masayı örtmesin) */
@media (max-height: 500px) and (orientation: landscape) {
  .sbk-cap { display: none; }
  .sbk-row { flex-wrap: nowrap; gap: 4px; }
  .sbk-add { min-height: 28px; padding: 0 8px 0 3px; font-size: 11.5px; gap: 4px; }

  .sbk-x { min-width: 24px; font-size: 14px; }
}

</style>

<body>
<noscript>Bu oyunu oynamak için JavaScript'i etkinleştirin.</noscript>
<main id="lobby" class="bj-lobby" hidden></main>
<section id="table" class="bj-view" hidden aria-label="Blackjack masası">
  <header id="hud" class="bj-hud"></header>
  <div id="scene" class="bj-scene"></div>
  <footer id="controls" class="bj-controls"></footer>
</section>
<aside id="chat" class="bj-chat" hidden aria-label="Masa sohbeti"></aside>
<script src="assets/js/bg-table.js?v=3.4.1"></script>
<script>
/* ---- cards.js ---- */
/* =====================================================================
   Bözer Royale — kart yüzleri, kart arkası, kesme kartı ve fişler (SVG)
   Kart kodu: rütbe + renk  ör. "AS" (maça as), "TD" (karo 10), "QH" (kupa kız)
   ===================================================================== */
(function () {
  'use strict';
  const SUITS = { S: 'spade', H: 'heart', D: 'diamond', C: 'club' };
  const RED = { H: 1, D: 1 };
  const RANKS = ['A', '2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K'];
  const LABEL = { T: '10' };
  const SUIT_NAME = { S: 'Maça', H: 'Kupa', D: 'Karo', C: 'Sinek' };
  const RANK_NAME = { A: 'As', J: 'Vale', Q: 'Kız', K: 'Papaz', T: '10' };

  const PATH = {
    heart: 'M50 90 C50 90 5 60 5 32 C5 15 17 5 31 5 C40 5 47 10 50 19 C53 10 60 5 69 5 C83 5 95 15 95 32 C95 60 50 90 50 90 Z',
    diamond: 'M50 3 Q66 29 90 50 Q66 71 50 97 Q34 71 10 50 Q34 29 50 3 Z',
    spade: 'M50 4 C50 4 7 38 7 61 C7 76 19 85 31 85 C39 85 45 81 48 75 C47 85 43 91 35 97 L65 97 C57 91 53 85 52 75 C55 81 61 85 69 85 C81 85 93 76 93 61 C93 38 50 4 50 4 Z',
    club: 'M50 9 A19 19 0 1 1 49.9 9 Z M27 40 A19 19 0 1 1 26.9 40 Z M73 40 A19 19 0 1 1 72.9 40 Z M46 56 Q45 80 34 97 L66 97 Q55 80 54 56 Z',
  };
  // Klasik pip düzenleri (250×350 kart içinde merkezler; r=ters)
  const L = 78, C = 125, R = 172;
  const PIPS = {
    2: [[C, 78], [C, 272, 1]],
    3: [[C, 78], [C, 175], [C, 272, 1]],
    4: [[L, 78], [R, 78], [L, 272, 1], [R, 272, 1]],
    5: [[L, 78], [R, 78], [C, 175], [L, 272, 1], [R, 272, 1]],
    6: [[L, 78], [R, 78], [L, 175], [R, 175], [L, 272, 1], [R, 272, 1]],
    7: [[L, 78], [R, 78], [C, 126], [L, 175], [R, 175], [L, 272, 1], [R, 272, 1]],
    8: [[L, 78], [R, 78], [C, 126], [L, 175], [R, 175], [C, 224, 1], [L, 272, 1], [R, 272, 1]],
    9: [[L, 78], [R, 78], [L, 143], [R, 143], [C, 175], [L, 207, 1], [R, 207, 1], [L, 272, 1], [R, 272, 1]],
    T: [[L, 78], [R, 78], [C, 110], [L, 143], [R, 143], [L, 207, 1], [R, 207, 1], [C, 240, 1], [L, 272, 1], [R, 272, 1]],
  };
  const pipUse = (s, x, y, size, flip) =>
    `<use href="#bjs-${SUITS[s]}" x="${-size / 2}" y="${-size / 2}" width="${size}" height="${size}" transform="translate(${x} ${y})${flip ? ' rotate(180)' : ''}"/>`;

  function courtArt(r, s) {
    const col = RED[s] ? '#b5122b' : '#17171c';
    const crown =
      r === 'K'
        ? '<path d="M-34 10 L-38 -22 L-18 -6 L0 -30 L18 -6 L38 -22 L34 10 Z" fill="url(#bjGold)" stroke="#7a5a1c" stroke-width="2"/><circle cx="0" cy="-30" r="5" fill="#b5122b"/><circle cx="-38" cy="-22" r="4" fill="url(#bjGold)"/><circle cx="38" cy="-22" r="4" fill="url(#bjGold)"/>'
        : r === 'Q'
        ? '<path d="M-30 8 Q-30 -16 0 -26 Q30 -16 30 8 Z" fill="url(#bjGold)" stroke="#7a5a1c" stroke-width="2"/><circle cx="0" cy="-12" r="6" fill="#1d5bd8"/><circle cx="-16" cy="-6" r="3.5" fill="#fff"/><circle cx="16" cy="-6" r="3.5" fill="#fff"/>'
        : '<path d="M-4 10 C-20 -6 -8 -26 18 -34 C6 -22 4 -8 10 6 Z" fill="url(#bjGold)" stroke="#7a5a1c" stroke-width="2"/><path d="M2 -4 C8 -16 14 -24 20 -30" stroke="#7a5a1c" stroke-width="1.6" fill="none"/>';
    return `
      <rect x="58" y="40" width="134" height="270" rx="10" fill="#fffdf6" stroke="${col}" stroke-width="2.4"/>
      <rect x="65" y="47" width="120" height="256" rx="7" fill="none" stroke="#c9a24d" stroke-width="1.6"/>
      <path d="M65 175 H185" stroke="#c9a24d" stroke-width="1" stroke-dasharray="2 5"/>
      <g transform="translate(125 118)">${crown}</g>
      <text x="125" y="196" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="84" fill="${col}">${r}</text>
      ${pipUse(s, 125, 252, 46, 0)}
      ${pipUse(s, 84, 70, 20, 0)}${pipUse(s, 166, 280, 20, 1)}`;
  }

  function faceSymbol(code) {
    const r = code[0];
    const s = code[1];
    const col = RED[s] ? '#c4122f' : '#16161a';
    const label = LABEL[r] || r;
    const idx = (flip) =>
      `<g transform="${flip ? 'rotate(180 125 175) ' : ''}translate(0 0)" fill="${col}">
        <text x="${label.length > 1 ? 33 : 33}" y="63" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="800" font-size="${label.length > 1 ? 50 : 62}" letter-spacing="${label.length > 1 ? -5 : 0}">${label}</text>
        ${pipUse(s, 33, 98, 36, 0)}
      </g>`;
    let mid = '';
    if (r === 'A') {
      mid = pipUse(s, 125, 175, s === 'S' ? 112 : 92, 0);
      if (s === 'S') mid += '<circle cx="125" cy="168" r="9" fill="#fffdf6" opacity=".9"/><circle cx="125" cy="168" r="4.5" fill="url(#bjGold)"/>';
    } else if (r === 'J' || r === 'Q' || r === 'K') mid = courtArt(r, s);
    else mid = PIPS[r].map((p) => pipUse(s, p[0], p[1], 50, p[2])).join('');
    return `<symbol id="bjc-${code}" viewBox="0 0 250 350">
      <rect x="1.5" y="1.5" width="247" height="347" rx="17" fill="url(#bjPaper)" stroke="#cfc6b2" stroke-width="2"/>
      <g fill="${col}">${mid}</g>${idx(0)}${idx(1)}
    </symbol>`;
  }

  function defs() {
    let out = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <linearGradient id="bjPaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffefa"/><stop offset=".55" stop-color="#f8f4ea"/><stop offset="1" stop-color="#ece5d4"/></linearGradient>
      <linearGradient id="bjGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe7a6"/><stop offset=".5" stop-color="#cfa14a"/><stop offset="1" stop-color="#8a6420"/></linearGradient>
      <linearGradient id="bjBack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#145c3e"/><stop offset=".5" stop-color="#0b3f2a"/><stop offset="1" stop-color="#062a1b"/></linearGradient>
      <pattern id="bjLattice" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 11 H22 M11 0 V22" stroke="#c9a24d" stroke-width="1.3" opacity=".45"/></pattern>
      <linearGradient id="bjCut" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a4a"/><stop offset=".5" stop-color="#e5391f"/><stop offset="1" stop-color="#a91c10"/></linearGradient>`;
    Object.keys(PATH).forEach((k) => (out += `<symbol id="bjs-${k}" viewBox="0 0 100 100"><path d="${PATH[k]}"/></symbol>`));
    RANKS.forEach((r) => Object.keys(SUITS).forEach((s) => (out += faceSymbol(r + s))));
    out += `<symbol id="bjc-back" viewBox="0 0 250 350">
        <rect x="1.5" y="1.5" width="247" height="347" rx="17" fill="#fbf8ef" stroke="#cfc6b2" stroke-width="2"/>
        <rect x="14" y="14" width="222" height="322" rx="10" fill="url(#bjBack)"/>
        <rect x="14" y="14" width="222" height="322" rx="10" fill="url(#bjLattice)"/>
        <rect x="24" y="24" width="202" height="302" rx="7" fill="none" stroke="#c9a24d" stroke-width="2"/>
        <circle cx="125" cy="175" r="46" fill="#0a3523" stroke="url(#bjGold)" stroke-width="4"/>
        <text x="125" y="192" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="46" fill="url(#bjGold)">BR</text>
      </symbol>
      <symbol id="bjc-cut" viewBox="0 0 250 350">
        <rect x="1.5" y="1.5" width="247" height="347" rx="17" fill="url(#bjCut)" stroke="#7c140b" stroke-width="2"/>
        <rect x="18" y="18" width="214" height="314" rx="10" fill="none" stroke="#ffd7c4" stroke-width="2" opacity=".6"/>
        <text x="125" y="186" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="40" letter-spacing="6" fill="#fff3ea">KESME</text>
      </symbol>`;
    // Fişler: 5 kırmızı, 10 mavi, 20 turkuaz, 25 yeşil, 50 turuncu, 100 siyah, 500 mor, 1000 altın
    CHIPS.forEach((c) => {
      let ins = '';
      for (let i = 0; i < 8; i++) ins += `<rect x="45" y="2" width="10" height="15" rx="2" fill="${c.edge}" transform="rotate(${i * 45} 50 50)"/>`;
      // gövde (yazısız) ayrı: panelden gelen standart dışı bahis değerleri aynı gövdeye kendi yazısıyla çizilir
      out += `<symbol id="bjchipb-${c.v}" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="48" fill="${c.base}"/>${ins}
        <circle cx="50" cy="50" r="48" fill="url(#bjChipShade)"/>
        <circle cx="50" cy="50" r="34" fill="${c.inner}" stroke="${c.edge}" stroke-width="2.4" stroke-dasharray="4 3"/>
      </symbol>
      <symbol id="bjchip-${c.v}" viewBox="0 0 100 100"><use href="#bjchipb-${c.v}"/>${chipText(c.v, c.text)}</symbol>`;
    });
    out += `<radialGradient id="bjChipShade" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>`;
    out += '</defs></svg>';
    return out;
  }

  const CHIPS = [
    { v: 1000, base: '#c9a24d', inner: '#e7c873', edge: '#fff7df', text: '#3a2608' },
    { v: 500, base: '#5b2a86', inner: '#7a46a6', edge: '#efe3ff', text: '#fff' },
    { v: 100, base: '#151517', inner: '#2b2b2f', edge: '#d9b45c', text: '#f2d488' },
    { v: 50, base: '#c8601a', inner: '#e07a2c', edge: '#fff1de', text: '#fff' },
    { v: 25, base: '#1d7a46', inner: '#2a9a5c', edge: '#f4f1e8', text: '#fff' },
    { v: 20, base: '#0f6f73', inner: '#16898d', edge: '#e9fbf7', text: '#fff' },
    { v: 10, base: '#1f4fa8', inner: '#3366c4', edge: '#f4f1e8', text: '#fff' },
    { v: 5, base: '#b3172b', inner: '#d02a3e', edge: '#f4f1e8', text: '#fff' },
  ];
  /** Fiş üstündeki değer yazısı: 1.000 → 1K, 2.500 → 2,5K */
  function chipLabel(v) {
    if (v >= 1000) {
      const k = v / 1000;
      return (Number.isInteger(k) ? String(k) : k.toFixed(1).replace('.', ',')) + 'K';
    }
    return String(v);
  }
  function chipText(v, color) {
    const t = chipLabel(v);
    const fs = t.length >= 4 ? 19 : t.length === 3 ? 24 : 27;
    return `<text x="50" y="${t.length >= 3 ? 58 : 59}" text-anchor="middle" font-family="Manrope, 'Segoe UI', sans-serif" font-weight="800" font-size="${fs}" fill="${color}">${t}</text>`;
  }
  /** Herhangi bir bahis değeri için fiş (standart değil ise en yakın küçük fişin renginde, kendi yazısıyla) */
  function chipSVG(v) {
    if (CHIPS.some((c) => c.v === v)) return `<use href="#bjchip-${v}"/>`;
    const c = CHIPS.find((x) => x.v <= v) || CHIPS[CHIPS.length - 1];
    return `<use href="#bjchipb-${c.v}"/>${chipText(v, c.text)}`;
  }
  /** v3.4.1: masanın fiş birimi (Bronze 10, Silver 20, Gold 50…). Bahis bu fişlerle konduğu için yığın da
      aynı fişlerle gösterilir: 2 × 20 BP → iki tane 20'lik fiş (25 + 10 + 5 değil). */
  let unit = 0;
  function setUnit(u) {
    unit = Math.max(0, Math.round(+u || 0));
  }
  /** Tutarı fiş yığınına böler (büyükten küçüğe) */
  function chipsFor(amount) {
    let a = Math.max(0, Math.round(amount));
    const u = unit;
    if (u > 0 && a > 0 && a % u === 0) {
      const n = a / u;
      if (n <= 10) return Array(n).fill(u);
      // büyük tutar: birimin katı olan fişlerle (en fazla 12 fiş)
      const den = CHIPS.map((c) => c.v).filter((v) => v > u && v % u === 0);
      den.push(u);
      den.sort((x, y) => y - x);
      const out = [];
      for (const v of den) {
        while (a >= v && out.length < 12) {
          out.push(v);
          a -= v;
        }
      }
      return out.reverse();
    }
    const out = [];
    for (const c of CHIPS) {
      while (a >= c.v && out.length < 12) {
        out.push(c.v);
        a -= c.v;
      }
    }
    if (a > 0 && out.length < 12) out.push(5);
    return out.reverse();
  }
  function stackHTML(amount, cls) {
    const list = chipsFor(amount);
    return `<div class="chips ${cls || ''}" style="--n:${list.length}">${list
      .map((v, i) => `<svg class="chip" style="--i:${i}" viewBox="0 0 100 100">${chipSVG(v)}</svg>`)
      .join('')}</div>`;
  }
  const cardHTML = (code, extra, style, title) =>
    `<div class="cd ${extra || ''}" data-c="${code || ''}"${style ? ` style="${style}"` : ''}${title ? ` title="${title}"` : ''}><div class="cd-in"><svg class="cd-f" viewBox="0 0 250 350"><use href="#bjc-${code && code !== '??' ? code : 'back'}"/></svg><svg class="cd-b" viewBox="0 0 250 350"><use href="#bjc-back"/></svg></div></div>`;
  function cardName(code) {
    if (!code || code === '??') return 'Kapalı kart';
    return `${SUIT_NAME[code[1]]} ${RANK_NAME[code[0]] || code[0]}`;
  }
  function value(code) {
    const r = code[0];
    if (r === 'A') return 1;
    if (r === 'T' || r === 'J' || r === 'Q' || r === 'K') return 10;
    return +r;
  }
  /** El toplamı: { total, soft } — As 11 sayılabiliyorsa soft */
  function handValue(cards) {
    let t = 0;
    let aces = 0;
    for (const c of cards) {
      if (!c || c === '??') continue;
      t += value(c);
      if (c[0] === 'A') aces++;
    }
    const soft = aces > 0 && t + 10 <= 21;
    return { total: soft ? t + 10 : t, soft };
  }
