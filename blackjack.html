    this.root = root;
    this.skin = SKINS[skin] ? skin : 'neriman';
    this.name = SKINS[this.skin].name;
    root.innerHTML = SKINS[this.skin].svg;
    this.svg = root.querySelector('svg');
    this.armL = root.querySelector('.dl-arm-l');
    this.armR = root.querySelector('.dl-arm-r');
    this.head = root.querySelector('.dl-head');
    this.body = root.querySelector('.dl-body');
    this.caps = root.querySelector('.dl-caps');
    this.iris = root.querySelector('.dl-iris');
    this.lids = [...root.querySelectorAll('.dl-lid')];
    this.mouthN = root.querySelector('.dl-mouth-n');
    this.mouthS = root.querySelector('.dl-mouth-s');
    this.brows = root.querySelector('.dl-brows');
    this.deck = root.querySelector('.dl-deck');
    this.cur = JSON.parse(JSON.stringify(POSE.rest));
    this.look = 0; // -1…1
    this.blinkT = 0;
    this.breath = 0;
    this.tw = null;
    this.reduced = false;
    this.mood('neutral');
    this.apply();
    this._loop = this._loop.bind(this);
    this._last = performance.now();
    this._nextBlink = this._last + 1800;
    requestAnimationFrame(this._loop);
  }
  Dealer.prototype.apply = function () {
    const p = this.cur;
    const b = Math.sin(this.breath) * 1.6;
    const setArm = (g, a, sx, sy) => {
      g.setAttribute('transform', `translate(${sx} ${sy + b * 0.6}) rotate(${a[0]})`);
      g.querySelector('.dl-fore').setAttribute('transform', `translate(0 126) rotate(${a[1]})`);
      g.querySelector('.dl-hand').setAttribute('transform', `translate(0 104) rotate(${a[2]})`);
    };
    setArm(this.armL, p.l, 166, 318);
    setArm(this.armR, p.r, 434, 318);
    const lk = this.look;
    this.head.setAttribute('transform', `translate(${p.head[1] + lk * 3} ${b * 0.8 + (p.body || 0)}) rotate(${p.head[0] + lk * 4} 300 240)`);
    this.iris.setAttribute('transform', `translate(${lk * 3.2} 0)`);
    this.body.setAttribute('transform', `translate(0 ${b * 0.5 + (p.body || 0) * 0.5})`);
    if (this.caps) this.caps.setAttribute('transform', `translate(0 ${b * 0.5 + (p.body || 0) * 0.5})`);
    const bl = this.blinkT;
    this.lids.forEach((l, i) => {
      const y = 152;
      l.setAttribute('transform', `translate(0 ${y}) scale(1 ${bl}) translate(0 ${-y})`);
    });
  };
  Dealer.prototype._loop = function (now) {
    if (this.dead) return;
    const dt = Math.min(64, now - this._last);
    this._last = now;
    if (!this.reduced) this.breath += dt * 0.0015;
    if (now > this._nextBlink && this.blinkT === 0 && !this._blinking) this.blink();
    if (this.tw) {
      const t = Math.min(1, (now - this.tw.t0) / this.tw.ms);
      const e = ease(t);
      const a = this.tw.from;
      const z = this.tw.to;
      const mix = (x, y) => x.map((v, i) => lerp(v, y[i], e));
      this.cur = { l: mix(a.l, z.l), r: mix(a.r, z.r), head: mix(a.head, z.head), body: lerp(a.body || 0, z.body || 0, e) };
      if (t >= 1) {
        const done = this.tw.done;
        this.tw = null;
        done();
      }
    }
    this.apply();
    requestAnimationFrame(this._loop);
  };
  /** Belirtilen poza yumuşak geçiş (Promise) */
  Dealer.prototype.pose = function (name, ms) {
    const to = typeof name === 'string' ? POSE[name] : name;
    if (!to) return Promise.resolve();
    if (this.tw) this.tw.done();
    return new Promise((res) => {
      if (this.reduced || ms === 0) {
        this.cur = JSON.parse(JSON.stringify(to));
        this.tw = null;
        return res();
      }
      this.tw = { from: JSON.parse(JSON.stringify(this.cur)), to, t0: performance.now(), ms: ms || 380, done: res };
    });
  };
  Dealer.prototype.pitch = function (dx, ms) {
    return this.pose(pitchPose(dx), ms);
  };
  Dealer.prototype.lookAt = function (dx) {
    this.look = Math.max(-1, Math.min(1, dx || 0));
  };
  Dealer.prototype.blink = function () {
    this._blinking = true;
    const t0 = performance.now();
    const step = (now) => {
      const t = (now - t0) / 170;
      this.blinkT = t < 0.5 ? t * 2 : Math.max(0, 2 - t * 2);
      if (t < 1) requestAnimationFrame(step);
      else {
        this.blinkT = 0;
        this._blinking = false;
        this._nextBlink = performance.now() + 2400 + Math.random() * 3600;
      }
    };
    requestAnimationFrame(step);
  };
  /** Yüz ifadesi: neutral | smile | joy */
  Dealer.prototype.mood = function (m) {
    const smile = m === 'smile' || m === 'joy';
    this.mouthN.style.display = smile ? 'none' : '';
    this.mouthS.style.display = smile ? '' : 'none';
    this.brows.setAttribute('transform', m === 'joy' ? 'translate(0 -4)' : '');
    this._mood = m;
  };
  /** Elde tutulan kart görünürlüğü (kart dağıtırken) */
  Dealer.prototype.holding = function (side, on) {
    const arm = side === 'l' ? this.armL : this.armR;
    arm.querySelector('.dl-card').setAttribute('opacity', on ? '1' : '0');
  };
  /** Elin ekrandaki merkezi (kart uçuşlarını elden başlatmak için) */
  Dealer.prototype.handPoint = function (side) {
    const arm = side === 'l' ? this.armL : this.armR;
    const r = arm.querySelector('.dl-hand').getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height * 0.75 };
  };
  Dealer.prototype.showDeck = function (on) {
    this.deck.setAttribute('opacity', on ? '1' : '0');
  };
  /** Karıştırma: eller önde, deste ikiye bölünüp iç içe geçer */
  Dealer.prototype.shuffle = async function (rounds) {
    this.showDeck(true);
    const rf = this.root.querySelector('.dl-riffle');
    for (let i = 0; i < (rounds || 4); i++) {
      await this.pose('shuffleA', 240);
      rf.setAttribute('opacity', '1');
      await this.pose('shuffleB', 240);
      rf.setAttribute('opacity', '.35');
    }
    this.showDeck(false);
    await this.pose('rest', 360);
  };
  Dealer.prototype.celebrate = async function () {
    this.mood('joy');
    await this.pose('joy', 420);
    await new Promise((r) => setTimeout(r, 520));
    await this.pose('rest', 520);
    this.mood('smile');
  };
  Dealer.prototype.setReduced = function (on) {
    this.reduced = !!on;
  };

  /** Krupiyeyi bırak (görünüm değişince yenisi kurulur) */
  Dealer.prototype.destroy = function () {
    this.dead = true;
    if (this.tw) {
      const d = this.tw.done;
      this.tw = null;
      d();
    }
  };
  window.BJDealer = { create: (el, skin) => new Dealer(el, skin), POSE, SKINS: Object.keys(SKINS), nameOf: (k) => (SKINS[k] || SKINS.neriman).name };
})();

/* ---- sound.js ---- */
/* =====================================================================
   Bözer Royale — ses (WebAudio ile üretilir, dosya indirmez)
   Ayrı kanallar: genel ses, efektler (fiş, arayüz, sonuç), krupiye
   (kart dağıtma, çevirme, toplama, karıştırma) ve ortam sesi.
   ===================================================================== */
(function () {
  'use strict';
  const KEY = 'bj.audio';
  const DEF = { master: 0.8, fx: 0.8, dealer: 0.8, amb: 0.25, on: true };
  let cfg = Object.assign({}, DEF);
  try {
    cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}'));
  } catch (e) {}

  let ctx = null;
  let out = null;
  const bus = {};
  let noiseBuf = null;
  let amb = null;

  const AU = () => (window.BGT && window.BGT.audio) || null;
  /** a → b → c bağlantısı (zincirleme connect eski Safari'de çalışmaz) */
  function link() {
    for (let i = 0; i < arguments.length - 1; i++) arguments[i].connect(arguments[i + 1]);
  }
  function init() {
    if (ctx && ctx.state !== 'closed') return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC();
    } catch (e) {
      ctx = null;
      return null;
    }
    // v3.3: eski Safari'de connect() zincirlenemez (undefined döner); bağlantılar tek tek
    out = ctx.createGain();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 4;
    out.connect(comp);
    comp.connect(ctx.destination);
    ['fx', 'dealer', 'amb'].forEach((k) => {
      bus[k] = ctx.createGain();
      bus[k].connect(out);
    });
    if (AU()) {
      AU().add(ctx);
      AU().want(cfg.on && cfg.master > 0);
    }
    const len = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    applyVolumes();
    return ctx;
  }
  function applyVolumes() {
    if (!ctx) return;
    const t = ctx.currentTime;
    out.gain.setTargetAtTime(cfg.on ? cfg.master : 0, t, 0.05);
    bus.fx.gain.setTargetAtTime(cfg.fx, t, 0.05);
    bus.dealer.gain.setTargetAtTime(cfg.dealer, t, 0.05);
    bus.amb.gain.setTargetAtTime(cfg.amb * 0.5, t, 0.3);
  }
  /** Dokunuşta ses açılır (tarayıcı kuralı). iPhone'da yalnız touchend / click gibi olaylar sayılır;
      bu yüzden hepsi dinlenir, bağlam "suspended" ya da "interrupted" ise sürdürülür. */
  function unlock() {
    const c = init();
    if (!c) return;
    if (c.state !== 'running') {
      try {
        const p = c.resume();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }
    if (AU()) AU().kick();
    if (cfg.amb > 0 && cfg.on) ambient(true);
  }
  ['touchstart', 'touchend', 'pointerdown', 'pointerup', 'mousedown', 'click', 'keydown'].forEach((ev) =>
    window.addEventListener(ev, unlock, { capture: true, passive: true }),
  );

  /** Çalmaya hazır mı: bağlam durduysa (arka plandan dönüş, iOS kesintisi) sürdürmeyi dener */
  function ready() {
    if (!ctx || !cfg.on || !(cfg.master > 0)) return false;
    if (ctx.state !== 'running' && ctx.state !== 'closed' && document.visibilityState === 'visible') {
      try {
        const p = ctx.resume();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }
    return ctx.state === 'running';
  }

  function noise(chan, at, dur, o) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.playbackRate.value = o.rate || 1;
    const f = ctx.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f0 || 2500, at);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, at + dur);
    f.Q.value = o.q || 1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.3, at + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    link(src, f, g, bus[chan]);
    src.start(at, Math.random() * 1.5);
    src.stop(at + dur + 0.05);
  }
  function tone(chan, at, freq, dur, o) {
    o = o || {};
    const osc = ctx.createOscillator();
    osc.type = o.wave || 'sine';
    osc.frequency.setValueAtTime(freq, at);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, at + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.2, at + (o.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    link(osc, g, bus[chan]);
    osc.start(at);
    osc.stop(at + dur + 0.05);
  }
  // Fiş sesi: iki sert seramik tıkırtısı
  function chipClack(at, gain) {
    const g = gain || 1;
    noise('fx', at, 0.05, { f0: 3800, q: 6, gain: 0.35 * g });
    tone('fx', at, 3100 + Math.random() * 600, 0.07, { wave: 'triangle', gain: 0.08 * g });
    tone('fx', at + 0.002, 5200 + Math.random() * 800, 0.04, { wave: 'sine', gain: 0.04 * g });
  }

  const S = {
    /** Kart sabottan çıkar ve masaya kayar */
    deal(delay) {
      if (!ready()) return;
      const t = ctx.currentTime + (delay || 0);
      noise('dealer', t, 0.13, { type: 'bandpass', f0: 5600, f1: 2000, q: 0.9, gain: 0.2, attack: 0.008 });
    },
    /** Kart keçeye iner: yumuşak, boğuk tık */
    land(soft) {
      if (!ready()) return;
      const t = ctx.currentTime;
      noise('dealer', t, 0.07, { type: 'lowpass', f0: soft ? 700 : 1000, q: 0.8, gain: soft ? 0.16 : 0.26 });
      noise('dealer', t, 0.025, { f0: 3200, q: 2, gain: soft ? 0.03 : 0.06 });
    },
    slide() {
      if (!ready()) return;
      noise('dealer', ctx.currentTime, 0.22, { type: 'bandpass', f0: 3000, f1: 1200, q: 0.6, gain: 0.16, attack: 0.02 });
    },
    flip() {
      if (!ready()) return;
      const t = ctx.currentTime;
      noise('dealer', t, 0.035, { f0: 4200, q: 3, gain: 0.3 });
      noise('dealer', t + 0.07, 0.05, { type: 'lowpass', f0: 1400, q: 1, gain: 0.28 });
    },
    collect(n) {
      if (!ready()) return;
      const t = ctx.currentTime;
      for (let i = 0; i < Math.min(n || 6, 10); i++) noise('dealer', t + i * 0.045, 0.12, { f0: 2600, f1: 1500, q: 0.7, gain: 0.1 });
      noise('dealer', t + 0.45, 0.1, { type: 'lowpass', f0: 700, gain: 0.25 });
    },
    shuffle() {
      if (!ready()) return;
      const t = ctx.currentTime;
      for (let k = 0; k < 3; k++) {
        const b = t + k * 0.62;
        for (let i = 0; i < 26; i++) noise('dealer', b + i * 0.016 + Math.random() * 0.006, 0.02, { f0: 3400 + Math.random() * 1600, q: 4, gain: 0.12 });
        noise('dealer', b + 0.46, 0.09, { type: 'lowpass', f0: 800, gain: 0.3 });
      }
    },
    cut() {
      if (!ready()) return;
      const t = ctx.currentTime;
      noise('dealer', t, 0.08, { f0: 2400, q: 2, gain: 0.25 });
      tone('fx', t + 0.05, 660, 0.35, { gain: 0.08 });
      tone('fx', t + 0.05, 990, 0.3, { gain: 0.05 });
    },
    chip(n) {
      if (!ready()) return;
      const t = ctx.currentTime;
      for (let i = 0; i < Math.min(n || 1, 6); i++) chipClack(t + i * 0.055, 1 - i * 0.08);
    },
    chipsStack() {
      if (!ready()) return;
      const t = ctx.currentTime;
      for (let i = 0; i < 4; i++) chipClack(t + i * 0.04 + Math.random() * 0.01, 0.8);
    },
    payout() {
      if (!ready()) return;
      const t = ctx.currentTime;
      for (let i = 0; i < 9; i++) chipClack(t + i * 0.05 + Math.random() * 0.02, 0.7);
    },
    gather() {
      if (!ready()) return;
      const t = ctx.currentTime;
      noise('fx', t, 0.3, { f0: 2200, f1: 900, q: 0.8, gain: 0.08, attack: 0.03 });
      for (let i = 0; i < 5; i++) chipClack(t + 0.18 + i * 0.03, 0.5);
    },
    turn() {
      if (!ready()) return;
      const t = ctx.currentTime;
      tone('fx', t, 880, 0.5, { gain: 0.07 });
      tone('fx', t, 1320, 0.42, { gain: 0.035 });
      tone('fx', t + 0.12, 1175, 0.45, { gain: 0.05 });
    },
    tick(urgent) {
      if (!ready()) return;
      const t = ctx.currentTime;
      noise('fx', t, 0.03, { f0: urgent ? 2400 : 1800, q: 8, gain: urgent ? 0.22 : 0.12 });
    },
    click() {
      if (!ready()) return;
      const t = ctx.currentTime;
      noise('fx', t, 0.025, { f0: 3000, q: 4, gain: 0.12 });
      tone('fx', t, 1500, 0.05, { gain: 0.03 });
    },
    win() {
      if (!ready()) return;
      const t = ctx.currentTime;
      [659, 880, 1109].forEach((f, i) => tone('fx', t + i * 0.09, f, 0.5, { gain: 0.07, wave: 'triangle' }));
    },
    blackjack() {
      if (!ready()) return;
      const t = ctx.currentTime;
      [523, 659, 784, 1047, 1319].forEach((f, i) => {
        tone('fx', t + i * 0.075, f, 0.7, { gain: 0.07, wave: 'triangle' });
        tone('fx', t + i * 0.075, f * 2, 0.4, { gain: 0.02 });
      });
    },
    lose() {
      if (!ready()) return;
      const t = ctx.currentTime;
      tone('fx', t, 330, 0.35, { gain: 0.05, f1: 262, wave: 'triangle' });
    },
    push() {
      if (!ready()) return;
      const t = ctx.currentTime;
      tone('fx', t, 587, 0.3, { gain: 0.05 });
      tone('fx', t + 0.1, 587, 0.3, { gain: 0.04 });
    },
    jackpot() {
      if (!ready()) return;
      const t = ctx.currentTime;
      const seq = [523, 659, 784, 1047, 784, 1047, 1319, 1568];
      seq.forEach((f, i) => {
        tone('fx', t + i * 0.12, f, 0.8, { gain: 0.08, wave: 'triangle' });
        tone('fx', t + i * 0.12, f * 1.5, 0.5, { gain: 0.025 });
      });
      for (let i = 0; i < 24; i++) tone('fx', t + 1 + i * 0.05, 2000 + Math.random() * 3000, 0.25, { gain: 0.015 });
      for (let i = 0; i < 14; i++) chipClack(t + 1.1 + i * 0.07, 0.6);
    },
    /** Kendi elin battı: kısa, alçalan boğuk ses */
    bust() {
      if (!ready()) return;
      const t = ctx.currentTime;
      noise('fx', t, 0.18, { type: 'lowpass', f0: 600, f1: 180, q: 0.8, gain: 0.3 });
      tone('fx', t, 220, 0.45, { gain: 0.06, f1: 110, wave: 'triangle' });
    },
    /** Krupiye battı: yükselen parlak akor ve hafif alkış hışırtısı */
    dealerBust() {
      if (!ready()) return;
      const t = ctx.currentTime;
      [392, 523, 659, 784].forEach((f, i) => tone('fx', t + i * 0.06, f, 0.55, { gain: 0.06, wave: 'triangle' }));
      for (let i = 0; i < 18; i++) noise('fx', t + 0.2 + i * 0.03 + Math.random() * 0.02, 0.04, { f0: 2400 + Math.random() * 1800, q: 2, gain: 0.05 });
    },
    whoosh() {
      if (!ready()) return;
      noise('fx', ctx.currentTime, 0.35, { type: 'bandpass', f0: 900, f1: 3200, q: 0.7, gain: 0.12, attack: 0.08 });
    },
    gift() {
      if (!ready()) return;
      const t = ctx.currentTime;
      tone('fx', t, 1047, 0.3, { gain: 0.05 });
      tone('fx', t + 0.08, 1568, 0.4, { gain: 0.05 });
    },
    message() {
      if (!ready()) return;
      tone('fx', ctx.currentTime, 1245, 0.18, { gain: 0.035 });
    },
  };

  /** Ortam: uzak salon uğultusu + çok hafif akor; ses düzeyi düşük tutulur */
  function ambient(on) {
    if (!ctx) return;
    if (on && !amb && cfg.amb > 0) {
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      src.loop = true;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 520;
      const bp = ctx.createBiquadFilter();
      bp.type = 'peaking';
      bp.frequency.value = 300;
      bp.gain.value = 6;
      const g = ctx.createGain();
      g.gain.value = 0.06;
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.13;
      const lg = ctx.createGain();
      lg.gain.value = 0.02;
      link(lfo, lg, g.gain);
      link(src, lp, bp, g, bus.amb);
      const pad = [];
      [110, 164.8, 220, 277.2].forEach((f) => {
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = f;
        const og = ctx.createGain();
        og.gain.value = 0.006;
        link(o, og, bus.amb);
        o.start();
        pad.push(o);
      });
      src.start();
      lfo.start();
      amb = { stop: () => [src, lfo, ...pad].forEach((n) => n.stop()) };
    } else if (!on && amb) {
      amb.stop();
      amb = null;
    }
  }

  window.BJSound = {
    play(name, arg) {
      try {
        if (S[name]) S[name](arg);
      } catch (e) {}
    },
    get: () => Object.assign({}, cfg),
    set(patch) {
      cfg = Object.assign(cfg, patch || {});
      try {
        localStorage.setItem(KEY, JSON.stringify(cfg));
      } catch (e) {}
      if (AU()) AU().want(cfg.on && cfg.master > 0);
      if (ctx) {
        applyVolumes();
        ambient(cfg.on && cfg.amb > 0);
      }
    },
    /** iPhone / iPad: telefon sessiz moddayken de çal (varsayılan açık) */
    iOS: () => !!(AU() && AU().iOS),
    silentOk: () => (AU() ? AU().silentOk() : true),
    setSilentOk: (on) => AU() && AU().setSilentOk(on),
    suspend(on) {
      if (!ctx) return;
      if (on) ctx.suspend().catch(() => {});
      else ctx.resume().catch(() => {});
    },
  };
})();

/* ---- scene.js ---- */
/* =====================================================================
   Bözer Royale — sahne: masa, krupiye, kart ve fiş animasyonları
   Sunucudan gelen anlık durum (state) her geldiğinde ekran onunla
   eşitlenir. Her fiziksel kartın kendi öğesi vardır (anahtar = kart kodu):
   yeni kart sabottan yay çizerek uçar ve havada döner, split'te kart yeni
   ele kayar, kapalı kart yerinde 3B çevrilir, tur bitince kartlar atık
   tepsisine toplanır. Fişler atılır, toplanır ve ödenir; sıra kimdeyse eli
   altın ışıkla vurgulanır; sonuçlar elin üstünde etiketle görünür.
   ===================================================================== */
(function () {
  'use strict';
  const C = window.BJCards;
  const TB = window.BJTable;
  const SND = window.BJSound;
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fmt = (n) => Number(n || 0).toLocaleString('tr-TR');
  const sgn = (n) => (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt(Math.abs(n));
  const CARD_MS = 420; // sunucudaki dağıtım temposu (kart başına)
  const RATIO = 1.4;
  // kapanmakta olan çerçevede Element.animate null dönebilir: boş bir animasyon nesnesi
  const NOANIM = () => ({ cancel() {}, finish() {}, onfinish: null, oncancel: null });
  const TURN_MS = 15600;

  const PRE_LABEL = { hit: 'KART', stand: 'DUR', double: 'İKİYE KATLA', split: 'BÖL', surrender: 'TESLİM' };
  const OUT_LABEL = { win: 'KAZANDI', lose: 'KAYBETTİ', push: 'BERABERE', blackjack: 'BLACKJACK', surrender: 'TESLİM' };

  function Scene(root, hooks) {
    this.root = root;
    this.hooks = hooks || {};
    this.cards = new Map();
    this.stacks = new Map();
    this.st = null;
    this.me = null;
    this.roundId = null;
    this.settledFor = null;
    this.ready = false;
    this.layout = null;
    this.timers = [];
    this.shown = new Set();
    this.build();
  }

  Scene.prototype.opt = function (k) {
    return this.hooks.opt ? this.hooks.opt(k) : null;
  };
  Scene.prototype.dur = function (ms) {
    if (this.opt('reduced')) return 0;
    return this.opt('fast') ? Math.round(ms * 0.55) : ms;
  };
  Scene.prototype.calm = function () {
    return !!(this.opt('reduced') || this.opt('quality') === 'low');
  };
  Scene.prototype.now = function () {
    return this.hooks.now ? this.hooks.now() : Date.now();
  };
  Scene.prototype.later = function (ms, fn) {
    const id = setTimeout(() => {
      this.timers = this.timers.filter((x) => x !== id);
      fn();
    }, Math.max(0, ms));
    this.timers.push(id);
    return id;
  };

  /* ---------------- iskelet ---------------- */
  Scene.prototype.build = function () {
    this.root.innerHTML = `${C.defs()}
      <div class="bj-stage">
        <div class="bj-room"></div>
        <div class="bj-dealer"></div>
        <div class="bj-table"></div>
        <div class="bj-props"></div>
        <div class="bj-glow"></div>
        <div class="bj-spots"></div>
        <div class="bj-chiplayer"></div>
        <div class="bj-cardlayer"></div>
        <div class="bj-badges"></div>
        <div class="bj-acts"></div>
        <div class="bj-center" aria-live="polite"></div>
        <div class="bj-fx"></div>
      </div>`;
    const q = (s) => this.root.querySelector(s);
    this.stage = q('.bj-stage');
    this.lDealer = q('.bj-dealer');
    this.lTable = q('.bj-table');
    this.lProps = q('.bj-props');
    this.lGlow = q('.bj-glow');
    this.lSpots = q('.bj-spots');
    this.lChips = q('.bj-chiplayer');
    this.lCards = q('.bj-cardlayer');
    this.lBadges = q('.bj-badges');
    this.lActs = q('.bj-acts');
    this.lCenter = q('.bj-center');
    this.lFx = q('.bj-fx');
    this.skinDealer = 'neriman';
    this.skinFelt = null;
    this.sideOn = false;
    this.dealer = window.BJDealer.create(this.lDealer, this.skinDealer);
    // krupiye mesaj kartı: portre bir kez kurulur, metin ve süre güncellenir
    const port = this.lDealer.querySelector('svg').cloneNode(true);
    port.setAttribute('viewBox', '214 26 172 172');
    port.setAttribute('class', 'msg-face');
    this.lCenter.innerHTML = `<div class="dmsg" hidden><span class="dmsg-av"></span><div class="dmsg-t"><small>Krupiye ${this.dealer.name}</small><strong></strong><span></span></div>
      <span class="dmsg-time" hidden><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="bg" cx="22" cy="22" r="19"/><circle class="fg" cx="22" cy="22" r="19"/></svg><b></b></span></div>`;
    this.msg = {
      el: q('.dmsg'),
      title: q('.dmsg-t strong'),
      sub: q('.dmsg-t span'),
      time: q('.dmsg-time'),
      num: q('.dmsg-time b'),
      ring: q('.dmsg-time .fg'),
    };
    q('.dmsg-av').appendChild(port);
    this.lSpots.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const seat = +b.dataset.seat;
      const act = b.dataset.act;
      if (this.hooks.onSeat) this.hooks.onSeat(act, seat, b);
    });
    this.lChips.addEventListener('click', (e) => {
      const b = e.target.closest('[data-bb]');
      if (b && this.hooks.onSeat) this.hooks.onSeat('bblist', +b.dataset.bb, b);
    });
    // v3.2: elin altındaki karar düğmeleri (sırası gelen el: hemen; bekleyen el: ön karar, X ile iptal)
    this.lActs.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-ha]');
      if (!b || b.disabled || !this.hooks.onHandAct) return;
      e.stopPropagation();
      this.hooks.onHandAct(+b.dataset.hand, b.dataset.ha === 'x' ? null : b.dataset.ha, b.dataset.mode);
    });
  };

  Scene.prototype.setLayout = function (name) {
    if (this.layout === name) return false;
    this.layout = name;
    const L = (this.L = TB.LAYOUTS[name]);
    this.cw = L.card;
    this.dcw = L.dcard || L.card;
    this.stage.style.width = L.W + 'px';
    this.stage.style.height = L.H + 'px';
    this.stage.style.setProperty('--cw', this.cw + 'px');
    this.stage.dataset.layout = name;
    this.lTable.innerHTML = TB.feltSVG(L, this.skinFelt, { side: this.sideOn });
    this.lProps.innerHTML = TB.propsHTML(L);
    const d = L.dealer;
    Object.assign(this.lDealer.style, { left: d.x - d.w / 2 + 'px', top: d.top + 'px', width: d.w + 'px' });
    this.geo = [];
    for (let k = 0; k < 7; k++) this.geo.push(TB.seatGeom(L, k));
    // yerleşim değişince her şey yeniden, animasyonsuz çizilir
    this.cards.forEach((c) => c.el.remove());
    this.cards.clear();
    this.stacks.forEach((s) => s.el.remove());
    this.stacks.clear();
    this.lSpots.innerHTML = '';
    this.lGlow.innerHTML = '';
    this.seatSig = [];
    this._badges = '';
    this._acts = '';
    this._glow = '';
    this._msgKey = '';
    if (this.lSide) this.lSide.innerHTML = '';
    if (this.sideEls) this.sideEls.clear();
    this.ready = false;
    if (this.st) this.update(this.st, this.me, true);
    return true;
  };

  Scene.prototype.fit = function (w, h) {
    const L = this.L;
    if (!L) return;
    this._fitW = w;
    this._fitH = h;
    // v3.4.1: krupiye gizliyse sahnenin üst kısmı (krupiyenin durduğu yer) kırpılır, masa büyür
    const y0 = this.noDealer ? L.crop || 0 : 0;
    const Hv = L.H - y0;
    let s = Math.min(w / L.W, h / Hv);
    // dikey telefonda genişlik sınırlıyor: kenarlardan az kırparak biraz daha büyüt
    if (this.noDealer && L.zoomX && h / Hv > s) s = Math.min(s * L.zoomX, h / Hv);
    this.scale = s;
    // el altı karar düğmeleri ekranda en az ~32 px görünsün (sahne birimine çevrilir)
    this.stage.style.setProperty('--hb', Math.round(Math.max(36, Math.min(74, 33 / Math.max(0.2, s)))) + 'px');
    const x = (w - L.W * s) / 2;
    const y = Math.max(0, (h - Hv * s) / 2) - y0 * s;
    this.stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    this.stage.classList.toggle('no-dealer', !!this.noDealer);
  };
  /** v3.4.1: krupiyeyi gizle / göster (ayar bu cihazda saklanır) */
  Scene.prototype.setNoDealer = function (on) {
    this.noDealer = !!on;
    if (this._fitW) this.fit(this._fitW, this._fitH);
  };

  /** v3.4: masanın görünümü — kurucunun kuşandığı krupiye (Alev Pack) ve keçe; yan bahis yazısı */
  Scene.prototype.setSkin = function (skin, side) {
    skin = skin || {};
    const felt = skin.felt || null;
    const dl = skin.dealer && window.BJDealer.SKINS.indexOf(skin.dealer) >= 0 ? skin.dealer : 'neriman';
    side = !!side;
    if ((felt !== this.skinFelt || side !== this.sideOn) && this.L) {
      this.skinFelt = felt;
      this.sideOn = side;
      this.lTable.innerHTML = TB.feltSVG(this.L, felt, { side });
    }
    this.skinFelt = felt;
    this.sideOn = side;
    if (dl !== this.skinDealer) {
      this.skinDealer = dl;
      const reduced = this.dealer && this.dealer.reduced;
      if (this.dealer) this.dealer.destroy();
      this.dealer = window.BJDealer.create(this.lDealer, dl);
      this.dealer.setReduced(!!reduced);
      const port = this.lDealer.querySelector('svg').cloneNode(true);
      port.setAttribute('viewBox', '214 26 172 172');
      port.setAttribute('class', 'msg-face');
      const av = this.root.querySelector('.dmsg-av');
      if (av) {
        av.innerHTML = '';
        av.appendChild(port);
      }
      const nm = this.root.querySelector('.dmsg-t small');
      if (nm) nm.textContent = 'Krupiye ' + this.dealer.name;
    }
  };
  /* ---------------- v3.4 yan bahisler (Perfect Pairs, 21+3) ----------------
     Ana bahis yuvasının iki alt yanında küçük yuvalar: PP solda, 21+3 sağda. Bahis aşamasında konur
     (bekleyen kesik çizgili), dağıtım bitince sonuç açılır (kazanan parlar, kaybeden söner) ve birkaç
     saniye sonra gerçek masadaki gibi kaybeden fiş krupiyeye, kazanç oyuncuya gider; yuva boşalır.
     Böylece sonradan gelen Double / Split / sigorta yığınlarıyla çakışmaz. */
  const SIDE_TXT = { perfect: 'Mükemmel çift', colored: 'Renkli çift', mixed: 'Karışık çift', suited_trips: 'Aynı tür üçlü',
                     straight_flush: 'Sıralı floş', trips: 'Üçlü', straight: 'Kent', flush: 'Floş' };
  const SIDE_SHOW = 3600; // sonucun masada kalma süresi (ms)
  /** Yan bahis yuvasının sahne konumu */
  Scene.prototype.sidePoint = function (seat, kind) {
    const g = this.geo[(seat || 1) - 1];
    const dir = kind === 'pp' ? -1 : 1;
    // ana yuvanın kenarında saat 8 (PP) ve saat 4 (21+3) konumu: pozisyonun kendi alanında kalır
    return { x: g.spot.x + dir * 44, y: g.spot.y + 26 };
  };
  Scene.prototype.sideHTML = function (w) {
    const label = w.kind === 'pp' ? 'PP' : '21+3';
    if (w.ghost) return `<em>${label}</em><b>+</b>`;
    if (w.phase === 'show' && w.pay > 0) return `<em>${esc(SIDE_TXT[w.res] || label)}</em><b>+${fmt(w.pay - w.amt)}</b>`;
    return `<em>${label}</em><b>${fmt(w.amt)}</b>`;
  };
  Scene.prototype.syncSide = function (st, ctx) {
    if (!this.lSide) {
      this.lSide = document.createElement('div');
      this.lSide.className = 'bj-side';
      this.lChips.parentNode.insertBefore(this.lSide, this.lChips.nextSibling);
    }
    if (!this.sideEls) this.sideEls = new Map();
    if (!this.sideRev) this.sideRev = {};
    ctx = ctx || {};
    const rid = st.round ? st.round.id : '';
    const live = !!this.fxLive && !this.opt('reduced');
    const want = new Map();
    (st.seats || []).forEach((s) => {
      const sd = s.side;
      const mine = s.user && ctx.myId && s.user.id === ctx.myId;
      // v3.4.1: ana bahsi olan kendi pozisyonlarımda bahis aşamasında iki yan bahis yuvası da dokunulabilir
      // (boşsa "+" yuvası; dokununca masanın fişi eklenir)
      const tap = !!(mine && ctx.sideTap && s.bet && s.bet_status !== 'dropped');
      const sel = null;
      if (tap) ['pp', 't3'].forEach((k) => {
        if (!(sd && sd[k] && sd.st !== 'dropped' && sd.st !== 'refunded')) want.set('g:' + s.no + ':' + k, { ghost: true, seat: s.no, kind: k, cls: 'ghost tap' });
      });
      if (!sd || s.bet_status === 'dropped' || s.bet_status === 'refunded' || sd.st === 'dropped' || sd.st === 'refunded') return;
      const rk = rid + ':' + s.no;
      let phase = sd.st === 'placed' ? 'in' : 'wait';
      if (sd.st === 'settled') {
        let rv = this.sideRev[rk];
        if (!rv) {
          // sonradan açılan masa ya da hareket azaltılmış: sonuç zaten kapanmış sayılır
          rv = this.sideRev[rk] = { phase: this.fxLive ? 'in' : 'gone', s, sd };
          if (this.fxLive) this.sideReveal(rk, s, sd);
        }
        phase = rv.phase;
        if (phase === 'gone') return;
      }
      ['pp', 't3'].forEach((k) => {
        const amt = sd[k] || 0;
        if (!amt) return;
        const pay = sd[k + '_pay'] || 0;
        const cls = (phase === 'wait' ? 'wait' : 'in') + (phase === 'show' ? (pay > 0 ? ' won' : ' lost') : '') + (sel === k ? ' sel' : '') + (tap && phase !== 'show' ? ' tap' : '');
        want.set(rk + ':' + k, { seat: s.no, kind: k, amt, pay, res: sd[k + '_r'], phase, cls });
      });
    });
    // kalkan yuvalar: sonuçlanmışsa kaybeden krupiyeye, kazanç oyuncuya uçar; değilse söner
    this.sideEls.forEach((el, key) => {
      if (want.has(key)) return;
      this.sideEls.delete(key);
      const w = el._w;
      if (!live || !w || w.ghost || w.phase !== 'show') {
        if (live && !w.ghost) {
          const a = el.animate([{ opacity: 1 }, { opacity: 0, transform: 'translate(-50%, -50%) scale(.6)' }], { duration: 220, easing: 'ease-in' });
          if (a) a.onfinish = () => el.remove();
          else el.remove();
        } else el.remove();
        return;
      }
      const from = { x: el._x, y: el._y };
      const to = w.pay > 0 ? this.platePoint(w.seat) : this.trayPoint();
      const k = [];
      for (let i = 0; i <= 10; i++) {
        const t = i / 10;
        const u = t * t * (3 - 2 * t);
        const x = from.x + (to.x - from.x) * u;
        const y = from.y + (to.y - from.y) * u - Math.sin(Math.PI * u) * 46;
        k.push({ left: x.toFixed(1) + 'px', top: y.toFixed(1) + 'px', opacity: t > 0.8 ? (1 - t) * 5 : 1, transform: `translate(-50%, -50%) scale(${(1 - 0.45 * u).toFixed(3)})`, offset: t });
      }
      const a = el.animate(k, { duration: this.dur(560), easing: 'linear', fill: 'forwards' });
      if (w.pay > 0) this.later(this.dur(470), () => SND.play('chip', 1));
      if (a) a.onfinish = () => el.remove();
      else el.remove();
    });
    want.forEach((w, key) => {
      let el = this.sideEls.get(key);
      const p = this.sidePoint(w.seat, w.kind);
      if (!el) {
        el = document.createElement('span');
        el.style.left = p.x + 'px';
        el.style.top = p.y + 'px';
        el._x = p.x;
        el._y = p.y;
        this.lSide.appendChild(el);
        this.sideEls.set(key, el);
        if (live && !w.ghost && this.ready) el.animate([{ transform: 'translate(-50%, -50%) scale(.4)', opacity: 0 }, { transform: 'translate(-50%, -50%) scale(1.12)', opacity: 1, offset: 0.7 }, { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 }], { duration: 300, easing: 'ease-out' });
      } else if (el._x !== p.x || el._y !== p.y) {
        el.style.left = p.x + 'px';
        el.style.top = p.y + 'px';
        el._x = p.x;
        el._y = p.y;
      }
      const cls = 'sp sp-' + w.kind + ' ' + w.cls;
      const html = this.sideHTML(w);
      el.dataset.seat = w.seat;
      el.dataset.kind = w.kind;
      if (el.className !== cls) el.className = cls;
      if (el._h !== html) {
        el.innerHTML = html;
        el._h = html;
      }
      el._w = w;
    });
  };
  /** Sonuç: kartlar yerine oturunca açılır, birkaç saniye görünür, sonra fişler toplanır */
  Scene.prototype.sideReveal = function (rk, s, sd) {
    const wait = Math.max(this.dur(420), (this.dealEnd || 0) - performance.now() + this.dur(260));
    const again = () => {
      if (this.st) this.syncSide(this.st, this.hooks.ctx ? this.hooks.ctx(this.st, this.me) : {});
    };
    this.later(wait, () => {
      const rv = this.sideRev[rk];
      if (!rv) return;
      rv.phase = 'show';
      again();
      const won = (sd.pp_pay > 0 ? sd.pp_pay - sd.pp : 0) + (sd.t3_pay > 0 ? sd.t3_pay - sd.t3 : 0);
      if (won > 0 && !this.opt('reduced')) {
        ['pp', 't3'].forEach((k) => {
          if (!(sd[k + '_pay'] > 0)) return;
          const p = this.sidePoint(s.no, k);
          this.burst(p.x, p.y, { n: 16, kind: 'coin', spread: 70 });
        });
        const g = this.geo[s.no - 1];
        this.floatText(g.spot.x, g.spot.y - 20, '+' + fmt(won) + ' BP', 'side');
        SND.play('win');
      }
      if (this.hooks.onSide) this.hooks.onSide(s, sd, true);
      this.later(this.dur(SIDE_SHOW), () => {
        if (this.sideRev[rk]) this.sideRev[rk].phase = 'gone';
        again();
      });
    });
  };

  /** Sahne koordinatından ekran koordinatına */
  Scene.prototype.toScreen = function (x, y) {
    const r = this.stage.getBoundingClientRect();
    const s = this.scale || 1;
    return { x: r.left + x * s, y: r.top + y * s };
  };
  Scene.prototype.shoePoint = function () {
    const s = this.L.shoe;
    return { x: s.x - 64, y: s.y + 6, rot: -24, sc: 0.8 };
  };
  Scene.prototype.discardPoint = function () {
    const d = this.L.discard;
    return { x: d.x, y: d.y - 4 };
  };
  Scene.prototype.trayPoint = function () {
    const t = this.L.tray;
    return { x: t.x, y: t.y + 6 };
  };
  /** Bir koltuğun avatarı (emoji, sohbet balonu ve hediye uçuşu için) */
  Scene.prototype.avatarEl = function (seat) {
    return this.lSpots.querySelector(`[data-sn="${seat}"] .seat-av`);
  };

  /* ---------------- kart yerleşimi ---------------- */
  Scene.prototype.handLayout = function (k, n, i) {
    const g = this.geo[k];
    const sc = n <= 1 ? 1 : n === 2 ? 0.84 : n === 3 ? 0.7 : 0.6;
    const w = this.cw * sc;
    const gap = w * 1.12 + (n > 1 ? w * 0.34 : 0);
    const x = g.cards.x + (i - (n - 1) / 2) * gap;
    return { x, y: g.cards.y + (n > 1 ? this.cw * 0.18 : 0), rot: g.cards.rot, sc };
  };
  /** k: pot, n: el sayısı, i: el, j: kart sırası, m: eldeki kart sayısı (sağdan sabitlenen yelpaze için) */
  Scene.prototype.cardPos = function (k, n, i, j, m) {
    const h = this.handLayout(k, n, i);
    const w = this.cw * h.sc;
    const step = m > 4 ? 0.24 : 0.3;
    const dx = w * step;
    const dy = -w * RATIO * 0.12;
    const shift = this.geo[k].cards.end && m > 1 ? -(m - 1) * dx : 0;
    return { x: h.x + shift + j * dx, y: h.y + j * dy, rot: h.rot + (j % 2 ? 1.1 : -0.7), sc: h.sc };
  };
  Scene.prototype.dealerPos = function (j, n) {
    const L = this.L;
    const w = this.dcw;
    const step = w * (n > 4 ? 0.52 : 0.64);
    const x0 = L.dcards.x - ((n - 1) * step) / 2;
    return { x: x0 + j * step, y: L.dcards.y, rot: 0, sc: this.dcw / this.cw };
  };
  /** Bir elin ekrandaki kutusu (sahne koordinatı) */
  Scene.prototype.handBox = function (k, n, i, m) {
    let x0 = Infinity;
    let x1 = -Infinity;
    let y0 = Infinity;
    let y1 = -Infinity;
    for (let j = 0; j < Math.max(1, m); j++) {
      const p = this.cardPos(k, n, i, j, Math.max(1, m));
      const w = this.cw * p.sc;
      x0 = Math.min(x0, p.x - w / 2);
      x1 = Math.max(x1, p.x + w / 2);
      y0 = Math.min(y0, p.y - (w * RATIO) / 2);
      y1 = Math.max(y1, p.y + (w * RATIO) / 2);
    }
    return { x0, x1, y0, y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0 };
  };

  /* İstenen kart listesi (anahtar, kod, konum, sıra) */
  Scene.prototype.wantedCards = function (st) {
    const out = [];
    const seen = {};
    const keyOf = (code) => {
      seen[code] = (seen[code] || 0) + 1;
      return seen[code] > 1 ? code + '#' + seen[code] : code;
    };
    if (!st.round || (st.round.cancelled && !st.dealer)) return out;
    (st.seats || []).forEach((s) => {
      const hands = s.hands || [];
      const n = hands.length;
      hands.forEach((h, i) => {
        h.cards.forEach((code, j) => {
          const p = this.cardPos(s.no - 1, n, i, j, h.cards.length);
          out.push({
            key: keyOf(code), code, seat: s.no, hand: h.id, i, j, x: p.x, y: p.y, rot: p.rot, sc: p.sc,
            z: 10 + (8 - s.no) * 60 + i * 12 + j, down: false, dim: h.st === 'bust' || h.out === 'lose' || h.out === 'surrender' || h.st === 'surrendered',
          });
        });
      });
    });
    if (st.dealer) {
      const dc = st.dealer.cards || [];
      dc.forEach((code, j) => {
        const p = this.dealerPos(j, dc.length);
        out.push({ key: j === 1 ? 'hole' : code === '??' ? 'hole' : keyOf(code), code, seat: 0, hand: 0, i: 0, j, x: p.x, y: p.y, rot: 0, sc: p.sc, z: 5 + j, down: code === '??', dealer: true });
      });
    }
    return out;
  };

  /* İlk dağıtım sırası: P1..P7 (sağdan sola) birinci kart, krupiye açık, P1..P7 ikinci kart, krupiye kapalı */
  function dealOrder(st) {
    const seats = (st.seats || []).filter((s) => s.hands && s.hands.length);
    const ord = {};
    let k = 0;
    seats.forEach((s) => s.hands[0] && s.hands[0].cards[0] && (ord[s.hands[0].cards[0]] = k++));
    if (st.dealer && st.dealer.cards[0]) ord[st.dealer.cards[0]] = k++;
    seats.forEach((s) => s.hands[0] && s.hands[0].cards[1] && (ord[s.hands[0].cards[1]] = k++));
    ord.hole = k++;
    return ord;
  }

  function cardEl(code) {
    const el = document.createElement('div');
    el.className = 'cd';
    el.innerHTML = `<div class="cd-in"><svg class="cd-f" viewBox="0 0 250 350"><use href="#bjc-${code && code !== '??' ? code.slice(0, 2) : 'back'}"/></svg><svg class="cd-b" viewBox="0 0 250 350"><use href="#bjc-back"/></svg></div>`;
    return el;
  }
  Scene.prototype.tf = function (x, y, rot, sc) {
    const w = this.cw;
    return `translate3d(${(x - w / 2).toFixed(1)}px, ${(y - (w * RATIO) / 2).toFixed(1)}px, 0) rotate(${(rot || 0).toFixed(2)}deg) scale(${(sc || 1).toFixed(3)})`;
  };
  Scene.prototype.place = function (c, x, y, rot, sc, ms) {
    if (c.anim && ms) {
      c.anim.cancel();
      c.anim = null;
    }
    c.el.style.transition = ms ? `transform ${ms}ms cubic-bezier(.22,.75,.25,1)` : 'none';
    c.el.style.transform = this.tf(x, y, rot, sc);
    c.x = x;
    c.y = y;
    c.rot = rot;
    c.sc = sc;
  };
  /** Yay çizen uçuş (v3.3: akıcı eğri). Kart ikinci dereceden bir eğri üzerinde, hızlı çıkıp yavaşlayarak
      iner: tepe noktasında hafifçe büyür ve döner, sonunda keçeye yumuşak oturur. Eğri 16 noktayla
      örneklenir; aralarında doğrusal geçiş olduğundan yön değişimi kırılmadan akar. */
  Scene.prototype.flyCard = function (c, from, to, ms, o) {
    o = o || {};
    const lift = o.lift != null ? o.lift : 54;
    const qx = from.x + (to.x - from.x) * 0.5;
    const qy = from.y + (to.y - from.y) * 0.42 - lift * 2;
    const spin = o.spin != null ? o.spin : (to.x < from.x ? -1 : 1) * 10;
    const pw = o.ease || 2.6;
    const N = 16;
    const big = Math.max(from.sc, to.sc);
    const k = [];
    for (let i = 0; i <= N; i++) {
      const tt = i / N;
      const u = 1 - Math.pow(1 - tt, pw);
      const a = (1 - u) * (1 - u);
      const b = 2 * (1 - u) * u;
      const d = u * u;
      const arc = Math.sin(Math.PI * u);
      k.push({
        transform: this.tf(a * from.x + b * qx + d * to.x, a * from.y + b * qy + d * to.y, from.rot + (to.rot - from.rot) * u + spin * arc * (1 - u * 0.4), from.sc + (to.sc - from.sc) * u + big * 0.075 * arc),
        offset: tt,
      });
    }
    if (c.anim) c.anim.cancel();
    c.el.style.transition = 'none';
    c.el.style.transform = this.tf(to.x, to.y, to.rot, to.sc);
    c.x = to.x;
    c.y = to.y;
    c.rot = to.rot;
    c.sc = to.sc;
    c.el.classList.add('flying');
    const a = c.el.animate(k, { duration: Math.max(1, ms), easing: 'linear' }) || NOANIM();
    c.anim = a;
    a.onfinish = a.oncancel = () => {
      c.el.classList.remove('flying');
      if (c.anim === a) c.anim = null;
    };
    return a;
  };
  Scene.prototype.setFace = function (c, code, down) {
    if (code && code !== '??' && c.code !== code) {
      c.el.querySelector('.cd-f use').setAttribute('href', '#bjc-' + code.slice(0, 2));
      c.code = code;
    }
    c.el.classList.toggle('down', !!down);
    c.down = !!down;
  };

  /* Krupiye eli: kartı sabottan alıp hedefe doğru uzatır */
  Scene.prototype.dealerReach = function (tx, delay) {
    if (this.opt('reduced')) return;
    const L = this.L;
    const dx = (tx - L.cx) / (L.W * 0.45);
    this.later(Math.max(0, delay - 120), () => {
      this.dealer.pose('shoe', 120).then(() => {
        this.dealer.holding('r', true);
        return this.dealer.pitch(dx, 200);
      }).then(() => this.dealer.holding('r', false));
    });
    clearTimeout(this._restT);
    this._restT = setTimeout(() => this.dealer.pose('rest', 460), delay + 760);
  };

  Scene.prototype.syncCards = function (st, instant) {
    const want = this.wantedCards(st);
    const keep = new Set();
    const fresh = [];
    want.forEach((w) => {
      keep.add(w.key);
      let c = this.cards.get(w.key);
      if (!c) {
        c = { el: cardEl(w.code), code: w.code, down: true };
        c.el.style.zIndex = w.z;
        if (w.dealer) c.el.classList.add('dl');
        this.lCards.appendChild(c.el);
        this.cards.set(w.key, c);
        fresh.push({ c, w });
        return;
      }
      c.el.style.zIndex = w.z;
      c.el.classList.toggle('dim', !!w.dim);
      c.hand = w.hand;
      c.seat = w.seat;
      const moved = Math.abs(c.x - w.x) > 0.5 || Math.abs(c.y - w.y) > 0.5 || Math.abs(c.sc - w.sc) > 0.01;
      if (moved && !c.flying) this.place(c, w.x, w.y, w.rot, w.sc, instant ? 0 : this.dur(380));
      if (c.down && !w.down && !c.flying) {
        // kapalı kart açılıyor: krupiye çevirir, kart hafifçe kalkıp döner
        if (!instant && !this.opt('reduced')) {
          this.dealer.pose('flipR', 260).then(() => this.dealer.pose('rest', 460));
          SND.play('flip');
          c.el.classList.add('reveal');
          this.later(this.dur(700), () => c.el.classList.remove('reveal'));
        }
        this.setFace(c, w.code, false);
      } else if (!c.flying && w.code !== '??') this.setFace(c, w.code, w.down);
      c.target = w;
    });
    // yeni kartlar
    if (fresh.length) {
      const anim = !instant && this.ready && !this.opt('reduced');
      const ord = st.state === 'INITIAL_DEAL' ? dealOrder(st) : null;
      const since = st.since || this.now();
      const now = this.now();
      let stagger = 0;
      fresh
        .sort((a, b) => (ord ? (ord[a.w.key] ?? 99) - (ord[b.w.key] ?? 99) : a.w.z - b.w.z))
        .forEach(({ c, w }, n) => {
          c.hand = w.hand;
          c.seat = w.seat;
          c.target = w;
          c.el.classList.toggle('dim', !!w.dim);
          if (!anim) {
            this.place(c, w.x, w.y, w.rot, w.sc, 0);
            this.setFace(c, w.code, w.down);
            if (this.ready && !instant) c.el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160 });
            return;
          }
          let delay;
          if (ord && ord[w.key] != null) delay = since + ord[w.key] * CARD_MS - now;
          else delay = stagger;
          if (delay < -1500) delay = n * 70;
          delay = Math.max(0, delay);
          stagger = delay + 190;
          const sp = this.shoePoint();
          this.dealEnd = Math.max(this.dealEnd || 0, performance.now() + delay + this.dur(640));
          this.place(c, sp.x, sp.y, sp.rot, sp.sc, 0);
          c.el.style.opacity = '0';
          this.setFace(c, w.code, true);
          c.flying = true;
          this.dealerReach(w.x, delay);
          this.later(delay, () => {
            c.el.style.opacity = '1';
            SND.play('deal');
            const t = c.target || w;
            const ms = this.dur(t.dealer ? 540 : 620);
            this.flyCard(c, sp, t, ms, { lift: t.dealer ? 26 : 60 });
            // yüzü açık kart havada döner ve yüzü yukarı iner; keçeye değdiği an yumuşak bir tık
            if (!t.down) this.later(ms * 0.36, () => this.setFace(c, t.code, false));
            this.later(ms * 0.8, () => SND.play('land', !!t.dealer));
            this.later(ms + 20, () => {
              c.flying = false;
              const tt = c.target || t;
              if (Math.abs(c.x - tt.x) > 0.5 || Math.abs(c.y - tt.y) > 0.5) this.place(c, tt.x, tt.y, tt.rot, tt.sc, this.dur(260));
              this.setFace(c, tt.code, tt.down);
              c.el.classList.toggle('dim', !!tt.dim);
              this.badgesSoon();
            });
          });
        });
    }
    // masadan kalkan kartlar → atık tepsisi
    const gone = [];
    this.cards.forEach((c, k) => {
      if (!keep.has(k)) gone.push([k, c]);
    });
    if (gone.length) this.collect(gone, instant);
  };

  Scene.prototype.collect = function (list, instant) {
    const dp = this.discardPoint();
    if (instant || this.opt('reduced') || !this.ready) {
      list.forEach(([k, c]) => {
        if (c.anim) c.anim.cancel();
        c.el.remove();
        this.cards.delete(k);
      });
      return;
    }
    SND.play('collect', list.length);
    this.dealer.pose('sweep1', 260).then(() => this.dealer.pose('sweep2', 320)).then(() => this.dealer.pose('toDiscard', 300)).then(() => this.dealer.pose('rest', 460));
    // krupiye sağından (P7) soluna (P1) toplar, kendi kartları en son
    list
      .sort((a, b) => (b[1].seat || 0) - (a[1].seat || 0) || (a[1].seat === 0 ? 1 : 0))
      .forEach(([k, c], i) => {
        this.cards.delete(k);
        c.flying = true;
        this.later(i * 36, () => {
          this.setFace(c, c.code, true);
          const to = { x: dp.x + (Math.random() * 8 - 4), y: dp.y + (Math.random() * 6 - 3), rot: 88 + Math.random() * 6, sc: 0.6 };
          const from = { x: c.x, y: c.y, rot: c.rot || 0, sc: c.sc || 1 };
          const a = this.flyCard(c, from, to, this.dur(620), { lift: 30, spin: 0 });
          a.onfinish = () => {
            c.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' });
            this.later(170, () => c.el.remove());
          };
        });
      });
  };

  /* ---------------- fişler ---------------- */
  function stackEl(amount, cls) {
    const el = document.createElement('div');
    el.className = 'bj-stack ' + (cls || '');
    el.innerHTML = C.stackHTML(amount);
    return el;
  }
  const stf = (x, y, sc) => `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) scale(${(sc || 1).toFixed(3)})`;
  Scene.prototype.putStack = function (s, x, y, ms) {
    if (s.anim) {
      s.anim.cancel();
      s.anim = null;
    }
    s.el.style.transition = ms ? `transform ${ms}ms cubic-bezier(.25,.8,.25,1), opacity ${ms}ms` : 'none';
    s.el.style.transform = stf(x, y);
    s.x = x;
    s.y = y;
  };
  /** Fiş yığını yay çizerek atılır (oyuncudan bahis alanına, tepsiden ödemeye…) */
  Scene.prototype.flyStack = function (s, from, to, ms, o) {
    o = o || {};
    const lift = o.lift != null ? o.lift : 70;
    const mx = (from.x + to.x) / 2;
    const my = Math.min(from.y, to.y) - lift;
    if (s.anim) s.anim.cancel();
    s.el.style.transition = 'none';
    s.el.style.transform = stf(to.x, to.y);
    s.x = to.x;
    s.y = to.y;
    const k = [
      { transform: stf(from.x, from.y, o.from || 0.85), opacity: o.fadeIn ? 0 : 1, offset: 0 },
      { transform: stf(mx, my, 1.12), opacity: 1, offset: 0.5 },
      { transform: stf(to.x, to.y - 6, 1.03), opacity: o.fadeOut ? 0.9 : 1, offset: 0.84 },
      { transform: stf(to.x, to.y, o.fadeOut ? 0.8 : 1), opacity: o.fadeOut ? 0 : 1, offset: 1 },
    ];
    const a = s.el.animate(k, { duration: Math.max(1, ms), easing: 'cubic-bezier(.35,.6,.3,1)', fill: o.fadeOut ? 'forwards' : 'none' }) || NOANIM();
    s.anim = a;
    a.onfinish = () => {
      if (s.anim === a) s.anim = null;
      if (o.done) o.done();
    };
    return a;
  };
  Scene.prototype.wantedStacks = function (st) {
    const out = [];
    const r = st.round;
    if (!r) return out;
    (st.seats || []).forEach((s) => {
      const g = this.geo[s.no - 1];
      const hands = s.hands || [];
      if (!hands.length && s.bet && s.bet_status !== 'dropped' && s.bet_status !== 'refunded') {
        out.push({ key: 'b:' + s.no, amount: s.bet, x: g.spot.x, y: g.spot.y, seat: s.no, cls: s.bet_status === 'pending' && !s.confirmed ? 'pending' : '' });
      }
      hands.forEach((h, i) => {
        const p = hands.length > 1 ? this.handLayout(s.no - 1, hands.length, i) : null;
        const x = p ? p.x : g.spot.x;
        const y = p ? g.spot.y + 6 : g.spot.y;
        const base = h.dbl ? h.bet / 2 : h.bet;
        out.push({ key: i === 0 ? 'b:' + s.no : 'h:' + h.id, amount: base, x, y, seat: s.no, hand: h, cls: hands.length > 1 ? 'sm' : '' });
        if (h.dbl) out.push({ key: 'd:' + h.id, amount: h.bet / 2, x: x + (hands.length > 1 ? 24 : 36), y: y + 4, seat: s.no, hand: h, cls: hands.length > 1 ? 'sm' : '' });
      });
      if (s.bb && s.bb.total > 0) {
        const side = g.spot.x < this.L.cx ? 1 : -1;
        const port = this.layout === 'port';
        // split varsa Bet Behind yığını el yığınlarının dışına alınır
        let off = port ? 66 : 62;
        if (hands.length > 1) {
          const last = this.handLayout(s.no - 1, hands.length, side > 0 ? hands.length - 1 : 0);
          off = Math.max(off, Math.abs(last.x - g.spot.x) + 42);
        }
        let by = g.spot.y + (port ? -6 : 30);
        // v3.4: yan bahis yuvaları varken Bet Behind yığını biraz dışarı alınır (üst üste binmesin)
        const sd = s.side;
        if (sd && (sd.pp || sd.t3) && sd.st !== 'dropped' && sd.st !== 'refunded') {
          off = Math.max(off, port ? 74 : 82);
          by = g.spot.y + (port ? -14 : 18);
        }
        const bx = g.spot.x + side * off;
        out.push({ key: 'bb:' + s.no, amount: s.bb.total, x: bx, y: by, seat: s.no, bb: true, cls: 'sm bbst' });
      }
      // Sigorta: bahis yuvasının içinde, ana yığının dış yanında (kartların altında kalmasın; tutar her zaman bahsin yarısı).
      // Krupiye blackjack yapmazsa kontrol sırasında kaybedilen sigorta hemen toplanır.
      if (s.ins > 0 && s.ins_result !== 'lose') {
        const out2 = g.spot.x < this.L.cx ? -1 : 1;
        out.push({ key: 'in:' + s.no, amount: s.ins, x: g.spot.x + out2 * 36, y: g.spot.y - (this.layout === 'port' ? 26 : 22), seat: s.no, cls: 'sm ins' });
      }
    });
    return out;
  };
  Scene.prototype.syncStacks = function (st, instant) {
    if (this.settling) return;
    const want = this.wantedStacks(st);
    const keep = new Set();
    let sound = 0;
    want.forEach((w) => {
      keep.add(w.key);
      let s = this.stacks.get(w.key);
      if (!s) {
        s = { el: stackEl(w.amount, w.cls), amount: w.amount, seat: w.seat };
        if (w.bb) s.el.dataset.bb = w.seat;
        s.el.insertAdjacentHTML('beforeend', `<b class="stv">${w.bb ? 'BB ' : ''}${fmt(w.amount)}</b>`);
        this.lChips.appendChild(s.el);
        this.stacks.set(w.key, s);
        const from = this.ready && !instant && !this.opt('reduced') ? this.platePoint(w.seat, w.key) : null;
        if (from) {
          this.flyStack(s, from, w, this.dur(520), { fadeIn: true, lift: w.key.startsWith('d:') || w.key.startsWith('h:') ? 40 : 80 });
          this.later(this.dur(470), () => SND.play('chip', 2));
        } else this.putStack(s, w.x, w.y, 0);
        return;
      }
      s.seat = w.seat;
      if (s.amount !== w.amount) {
        s.el.innerHTML = C.stackHTML(w.amount) + `<b class="stv">${w.bb ? 'BB ' : ''}${fmt(w.amount)}</b>`;
        if (!instant && this.ready && !this.calm()) s.el.querySelector('.chips').animate([{ transform: 'translateY(-10px) scale(1.12)' }, { transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.3,1.5,.5,1)' });
        s.amount = w.amount;
        if (!instant) sound++;
      }
      s.el.className = 'bj-stack ' + (w.cls || '');
      if (Math.abs(s.x - w.x) > 0.5 || Math.abs(s.y - w.y) > 0.5) this.putStack(s, w.x, w.y, instant ? 0 : this.dur(360));
    });
    this.stacks.forEach((s, k) => {
      if (keep.has(k)) return;
      this.stacks.delete(k);
      // kaybedilen sigorta krupiyenin tepsisine, diğerleri sahibine döner
      const to = !instant && this.ready ? (k.startsWith('in:') ? this.trayPoint() : this.platePoint(s.seat)) : null;
      if (to && !this.opt('reduced')) this.flyStack(s, { x: s.x, y: s.y }, to, this.dur(460), { fadeOut: true, lift: 40, done: () => s.el.remove() });
      else s.el.remove();
    });
    if (sound) SND.play('chip', Math.min(3, sound));
  };
  /* Fişlerin geldiği/gittiği yer: Bet Behind için masanın önü, oyuncu için avatar */
  Scene.prototype.platePoint = function (seat, key) {
    const g = this.geo[(seat || 1) - 1];
    if (key && key.startsWith('bb:')) return { x: g.plate.x, y: this.L.H + 40 };
    return { x: g.plate.x, y: g.plate.y };
  };

  /* Sonuç: kaybeden fişler krupiyeye kayar; kazananlara tepsiden ödeme fişi atılır, sonra hepsi oyuncuya gider */
  Scene.prototype.settleAnim = function (st, myId) {
    if (this.opt('reduced') || !this.ready) {
      this.stacks.forEach((s) => s.el.remove());
      this.stacks.clear();
      return;
    }
    this.settling = true;
    const tp = this.trayPoint();
    const fates = [];
    (st.seats || []).forEach((s) => {
      (s.hands || []).forEach((h, i) => {
        const keys = [i === 0 ? 'b:' + s.no : 'h:' + h.id];
        if (h.dbl) keys.push('d:' + h.id);
        keys.forEach((k, j) => fates.push([k, h.out, s.no, j === 0 && (h.out === 'win' || h.out === 'blackjack') ? h.pay - h.bet : 0, false, s.user && s.user.id === myId]));
      });
      if (s.bb && s.bb.total > 0) {
        const st2 = (s.bb.list || []).map((x) => x.status);
        const win = (s.bb.list || []).reduce((a, x) => a + Math.max(0, (x.payout || 0) - (x.amount || 0)), 0);
        const lost = st2.length && st2.every((x) => x === 'SETTLED_LOSE');
        fates.push(['bb:' + s.no, lost ? 'lose' : win > 0 ? 'win' : 'push', s.no, win, true, false]);
      }
      if (s.ins > 0) fates.push(['in:' + s.no, s.ins_result === 'win' ? 'win' : 'lose', s.no, s.ins_result === 'win' ? s.ins * 2 : 0, false, false]);
    });
    let lostAny = false;
    let wonAny = false;
    let li = 0;
    let wi = 0;
    const gains = {};
    fates.forEach(([k, out, seat, profit, bb, mine]) => {
      const s = this.stacks.get(k);
      if (!s) return;
      if (out === 'lose' || out === 'surrender') {
        lostAny = true;
        const d = 380 + li++ * 70;
        this.later(d, () => this.flyStack(s, { x: s.x, y: s.y }, { x: tp.x + (Math.random() * 80 - 40), y: tp.y }, this.dur(640), { lift: 50, fadeOut: true }));
      } else if (profit > 0) {
        wonAny = true;
        const d = 900 + wi++ * 110;
        const p = { el: stackEl(profit, s.el.className.replace('bj-stack', '').replace('pending', '').trim() + ' pay'), amount: profit };
        p.el.insertAdjacentHTML('beforeend', `<b class="stv">+${fmt(profit)}</b>`);
        p.el.style.opacity = '0';
        this.lChips.appendChild(p.el);
        this.later(d, () => {
          p.el.style.opacity = '1';
          this.flyStack(p, tp, { x: s.x + 34, y: s.y - 10 }, this.dur(620), { lift: 90 });
          this.later(this.dur(560), () => SND.play('chip', 3));
        });
        this.later(2500 + wi * 60, () => {
          const to = this.platePoint(seat, bb ? 'bb:' : '');
          this.flyStack(p, { x: p.x, y: p.y }, to, this.dur(560), { lift: 30, fadeOut: true, done: () => p.el.remove() });
        });
        if (!bb) gains[seat] = (gains[seat] || 0) + profit;
      }
      if (out !== 'lose' && out !== 'surrender') {
        this.later(2500, () => {
          const to = this.platePoint(seat, bb ? 'bb:' : '');
          this.flyStack(s, { x: s.x, y: s.y }, to, this.dur(560), { lift: 30, fadeOut: true });
        });
      }
    });
    // ödeme oyuncuya ulaşınca: kazanç yazısı ve kıvılcım
    Object.keys(gains).forEach((seat) => {
      this.later(3050, () => {
        const pp = this.platePoint(+seat);
        this.floatText(pp.x, pp.y - 46, '+' + fmt(gains[seat]) + ' BP', 'win');
        this.burst(pp.x, pp.y - 10, { n: 14, kind: 'coin', spread: 70 });
      });
    });
    if (lostAny)
      this.later(360, () => {
        this.dealer.pose('chips', 300).then(() => this.dealer.pose('rest', 460));
        SND.play('gather');
      });
    if (wonAny) this.later(900, () => SND.play('payout'));
    this.later(3400, () => {
      this.stacks.forEach((s) => s.el.remove());
      this.stacks.clear();
      this.settling = false;
      if (this.st) this.syncStacks(this.st, true);
    });
  };

  /** v3.3: alttaki çubuktaki fişten masadaki bahis alanına fiş atışı (ekran noktası → sahne) */
  Scene.prototype.tossChip = function (seat, from, amount, kind) {
    if (this.calm() || !this.ready || !this.geo || !from) return;
    const g = this.geo[seat - 1];
    if (!g) return;
    const r = this.stage.getBoundingClientRect();
    const sc = this.scale || 1;
    const fx = (from.x - r.left) / sc;
    const fy = (from.y - r.top) / sc;
    const to = kind === 'pp' || kind === 't3' ? this.sidePoint(seat, kind) : g.spot;
    const tx = to.x;
    const ty = to.y;
    const qx = (fx + tx) / 2;
    const qy = Math.min(fy, ty) - 140;
    const el = document.createElement('div');
    el.className = 'chip-toss';
    el.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">${C.chipSVG(amount)}</svg>`;
    this.lFx.appendChild(el);
    const k = [];
    for (let i = 0; i <= 12; i++) {
      const tt = i / 12;
      const u = 1 - Math.pow(1 - tt, 2.2);
      const x = (1 - u) * (1 - u) * fx + 2 * (1 - u) * u * qx + u * u * tx;
      const y = (1 - u) * (1 - u) * fy + 2 * (1 - u) * u * qy + u * u * ty;
      k.push({ transform: `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) rotate(${(u * 260).toFixed(0)}deg) scale(${(1.15 - 0.3 * u).toFixed(3)})`, opacity: tt > 0.92 ? 0 : 1, offset: tt });
    }
    const a = el.animate(k, { duration: this.dur(430), easing: 'linear' });
    if (a) a.onfinish = () => el.remove();
    else el.remove();
  };

  /* ---------------- parçacık, yazı ve bant efektleri ---------------- */
  /** Kıvılcım ya da altın para patlaması (sahne koordinatı) */
  Scene.prototype.burst = function (x, y, o) {
    if (this.calm()) return;
    o = o || {};
    const n = this.opt('quality') === 'mid' ? Math.round((o.n || 18) * 0.6) : o.n || 18;
    const spread = o.spread || 90;
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i');
      p.className = 'pt ' + (o.kind || 'spark');
      const ang = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      const r = spread * (0.55 + Math.random() * 0.6);
      const dx = Math.cos(ang) * r;
      const dy = Math.sin(ang) * r - (o.up || 0);
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      this.lFx.appendChild(p);
      const ms = 700 + Math.random() * 500;
      p.animate(
        [
          { transform: 'translate(-50%,-50%) scale(.4) rotate(0deg)', opacity: 1 },
          { transform: `translate(calc(-50% + ${dx * 0.7}px), calc(-50% + ${dy * 0.7}px)) scale(1) rotate(${Math.random() * 360}deg)`, opacity: 1, offset: 0.55 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 34}px)) scale(.5) rotate(${Math.random() * 540}deg)`, opacity: 0 },
        ],
        { duration: ms, easing: 'cubic-bezier(.2,.7,.3,1)' }
      ).onfinish = () => p.remove();
    }
  };
  Scene.prototype.floatText = function (x, y, text, cls) {
    const el = document.createElement('div');
    el.className = 'fx-float ' + (cls || '');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    this.lFx.appendChild(el);
    const a = el.animate(
      [
        { transform: 'translate(-50%,-30%) scale(.6)', opacity: 0 },
        { transform: 'translate(-50%,-60%) scale(1.08)', opacity: 1, offset: 0.2 },
        { transform: 'translate(-50%,-80%) scale(1)', opacity: 1, offset: 0.7 },
        { transform: 'translate(-50%,-140%) scale(.96)', opacity: 0 },
      ],
      { duration: this.calm() ? 1600 : 2200, easing: 'ease-out' }
    );
    a.onfinish = () => el.remove();
  };
  /** Büyük bant: KRUPİYE BATTI, KRUPİYE BLACKJACK, BLACKJACK! */
  Scene.prototype.banner = function (kind, text, sub, at) {
    this.lFx.querySelectorAll('.banner').forEach((x) => x.remove());
    const el = document.createElement('div');
    el.className = 'banner ' + kind;
    const L = this.L;
    const y = at && at.y != null ? at.y : L.dcards.y + (this.layout === 'port' ? 6 : 0);
    el.style.left = (at && at.x != null ? at.x : L.cx) + 'px';
    el.style.top = y + 'px';
    el.innerHTML = `<div class="bn-rays"></div><strong>${esc(text)}</strong>${sub ? `<small>${esc(sub)}</small>` : ''}`;
    this.lFx.appendChild(el);
    this._bannerAt = Date.now();
    if (!this.calm()) this.later(160, () => this.burst(at && at.x != null ? at.x : L.cx, y, { n: kind === 'dbust' ? 26 : 22, kind: kind === 'dbust' ? 'ember' : 'spark', spread: 150 }));
    this.later(2300, () => {
      el.classList.add('out');
      this.later(420, () => el.remove());
    });
  };

  /* ---------------- koltuklar ---------------- */
  Scene.prototype.seatHTML = function (s, ctx) {
    const g = this.geo[s.no - 1];
    const mine = s.user && ctx.myId && s.user.id === ctx.myId;
    const myState = mine ? (ctx.me.seats || []).find((x) => x.no === s.no) : null;

      else h += `<span class="seat-no" style="${spot}">P${s.no}</span>`;
      return h;
    }
    const target = ctx.betting && (mine || ctx.canBB);
    if (target) h += `<button type="button" class="seat-hit${mine ? ' mine' : ' bbt'}" data-act="${mine ? 'bet' : 'bb'}" data-seat="${s.no}" style="${spot}" aria-label="${mine ? 'P' + s.no + ' bahis' : 'P' + s.no + ' Bet Behind'}"><span>${mine ? (s.bet ? '' : 'BAHİS') : 'BET BEHIND'}</span></button>`;
    const av = ctx.avatar ? ctx.avatar({ name: s.user.name, avatar_url: s.user.avatar, badge: s.user.badge, rankPip: true }, 52) : `<span class="seat-av-f">${esc((s.user.name || '?').charAt(0))}</span>`;
    let sub = '';
