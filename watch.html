<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bozer Gaming — Canlı İzle</title><style>body{margin:0;background:#020617;color:#e2e8f0;font-family:system-ui}header{height:52px;display:flex;align-items:center;padding:0 16px;background:#0f172a;position:fixed;inset:0 0 auto;z-index:2}iframe{border:0;width:100%;height:100vh;padding-top:52px;box-sizing:border-box}#status{margin-left:auto;color:#86efac}</style></head><body><header><b>👁️ Bozer Gaming · Canlı İzleme</b><span id="status">Bağlanıyor…</span></header><iframe id="game" title="Canlı oyun"></iframe><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="bozer-config.js"></script><script>const q=new URLSearchParams(location.search),id=q.get('session'),cfg=window.BOZER_CONFIG,stat=document.querySelector('#status'),frame=document.querySelector('#game');if(!id||!cfg.supabaseUrl)stat.textContent='Geçersiz bağlantı';else{const db=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey),draw=s=>{if(!s?.html)return;const d=frame.contentDocument;d.open();d.write(s.html);d.close();d.addEventListener('click',e=>e.preventDefault(),true);stat.textContent='● Canlı';};db.auth.getSession().then(async()=>{const{data,error}=await db.from('game_sessions').select('state,is_live').eq('id',id).single();if(error){stat.textContent='İzleme iznin yok';return}draw(data.state);db.channel('watch:'+id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'game_sessions',filter:'id=eq.'+id},p=>{if(!p.new.is_live)stat.textContent='Yayın bitti';else draw(p.new.state)}).subscribe();});}</script></body></html>
