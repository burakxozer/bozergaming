body { --bz-accent: #e2534f; }

.kz-wrap.port .kz-pods { grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: center; width: min(var(--sz, 360px), 100%); justify-self: center; padding: 0; }
.kz-wrap.port .kz-board { justify-self: center; }
.kz-board { --sz: 640px; --cs: calc(var(--sz) / 11); position: relative; width: var(--sz); height: var(--sz); border-radius: calc(var(--sz) * 0.04); touch-action: manipulation;

.kz-cross { position: absolute; left: calc(var(--cs) * 4); top: calc(var(--cs) * 4); width: calc(var(--cs) * 3); height: calc(var(--cs) * 3); border-radius: 50%;
  background: conic-gradient(from 45deg, #e2443c33 0 25%, #f2c12e33 0 50%, #3a7de033 0 75%, #36b45a33 0); }
.kz-sq { position: absolute; left: calc(var(--x) * var(--cs) + var(--cs) * 0.1); top: calc(var(--y) * var(--cs) + var(--cs) * 0.1); width: calc(var(--cs) * 0.8); height: calc(var(--cs) * 0.8); border-radius: 50%;
  background: #fffdf6; box-shadow: inset 0 calc(var(--cs) * -0.05) 0 rgba(0, 0, 0, 0.12), 0 0 0 calc(var(--cs) * 0.035) #b99a66; display: grid; place-items: center; }
.kz-sq b { width: 0; height: 0; border-left: calc(var(--cs) * 0.16) solid rgba(255, 255, 255, 0.9); border-top: calc(var(--cs) * 0.11) solid transparent; border-bottom: calc(var(--cs) * 0.11) solid transparent; margin-left: calc(var(--cs) * 0.04); }
.kz-sq.red { --k: #e2443c; } .kz-sq.blue { --k: #3a7de0; } .kz-sq.green { --k: #36b45a; } .kz-sq.yellow { --k: #f2c12e; }
.kz-sq.start, .kz-sq.home { background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--k) 55%, white), var(--k)); }
.kz-sq.yard { background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--k) 25%, white), color-mix(in srgb, var(--k) 55%, white)); box-shadow: inset 0 calc(var(--cs) * 0.06) calc(var(--cs) * 0.08) rgba(0, 0, 0, 0.25), 0 0 0 calc(var(--cs) * 0.035) color-mix(in srgb, var(--k) 70%, black); }
.kz-sq.off, .kz-yard.off { opacity: 0.35; filter: saturate(0.4); }
.kz-yard { position: absolute; left: calc(var(--x) * var(--cs) - var(--cs) * 0.08); top: calc(var(--y) * var(--cs) - var(--cs) * 0.08); width: calc(var(--cs) * 2.16); height: calc(var(--cs) * 2.16); border-radius: calc(var(--cs) * 0.4); }
.kz-yard.red { background: #e2443c2e; box-shadow: inset 0 0 0 3px #e2443c88; } .kz-yard.blue { background: #3a7de02e; box-shadow: inset 0 0 0 3px #3a7de088; }

.kz-die { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; }
.kz-die .bz-die { --die-bg: linear-gradient(145deg, #ffffff, #f4ecdc 55%, #dccdb0); }
.kz-die.wait .bz-die { animation: kzWait 1.1s ease-in-out infinite; cursor: pointer; }

.kz-die.shaking .bz-die { animation: kzRattle 0.16s linear infinite; }
@keyframes kzWait { 0%, 100% { transform: rotate(0) translateY(0); } 30% { transform: rotate(-10deg) translateY(-4px); } 60% { transform: rotate(8deg) translateY(1px); } }

.kz-die-res.bz-throw.land::after { border-color: rgba(255, 236, 170, 0.95); }
.kz-roll { position: absolute; transform: translateX(-50%); z-index: 35; display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 18px; border-radius: 99px; border: 0; cursor: pointer; pointer-events: auto;

.kz-pod { position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 7px 12px 9px 8px; border-radius: 14px; overflow: hidden;

.kz-av-in { display: grid; place-items: center; border-radius: 50%; font-weight: 850; color: #1b1206; background: linear-gradient(160deg, #f3dfb0, #b98a3c); font-size: 15px; }
.kz-dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2); }

.kz-pod.red { border-left: 4px solid #e2443c; } .kz-pod.blue { border-left: 4px solid #3a7de0; } .kz-pod.green { border-left: 4px solid #36b45a; } .kz-pod.yellow { border-left: 4px solid #f2c12e; }
.kz-time { position: absolute; left: 0; bottom: 0; height: 3px; width: calc(var(--t) * 100%); background: linear-gradient(90deg, #45cf8c, #9ff2c8); opacity: 0; transition: width 0.5s linear; }
.kz-pod.timed .kz-time { opacity: 1; }
.kz-pod.late .kz-time { background: linear-gradient(90deg, #ec5a5f, #ffb27a); }
.kz-seattag { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 800; color: #1b1206; }
.kz-seattag.red { background: #ff8f86; } .kz-seattag.blue { background: #8fb9ff; } .kz-seattag.green { background: #8ee0a4; } .kz-seattag.yellow { background: #ffe08a; }
.kz-opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--bz-line); color: var(--bz-ink); font-size: 14px; cursor: pointer; }
.kz-opt input { width: 18px; height: 18px; accent-color: #d9aa4b; }
.kz-netpill { position: absolute; z-index: 70; left: 50%; bottom: calc(10px + var(--bz-safe-b)); transform: translateX(-50%); padding: 6px 14px; border-radius: 99px; font-weight: 800; font-size: 13px; color: #2a1406; background: linear-gradient(180deg, #ffd88a, #e7a63c); }

/* küçük ekranlar */
.kz-wrap.port .kz-pod { padding: 6px 10px 8px 6px; gap: 6px; }
.kz-wrap.port .kz-pod-t b { font-size: 13px; }

   6 atan yeniden atar; bütün piyonları ahırda (ya da evde kımıldayamaz) olan oyuncunun 6 için 3 hakkı vardır.

   Hamleler: {seat, kind: 'roll', data: {d: [v], k}} (zar sunucudan) | {seat, kind: 'move', data: {i, k}}.

    const hud = port && vw <= 560 ? 94 : 58;
    let size;
    if (port) size = Math.min(vw - 12, vh - hud - 150);
    else size = Math.min(vh - hud - 10, vw - 2 * Math.min(210, vw * 0.21) - 30);
    size = Math.max(240, Math.min(size, 860));
    const cs = size / 11;
    G.layout = { port, size, cs, ds: Math.round(Math.max(34, Math.min(64, cs * 0.95))) };
    const b = $('#kzBoard');
    b.style.setProperty('--sz', size + 'px');
    $('#kzWrap').classList.toggle('port', port);
  }
  function relayout() {
    if (!G.st || $('#game').hidden) return;
    layout();
    $('#kzBoard').innerHTML = boardHTML();
    paintPieces();
    paintTargets();
    paintPods();
    const st = G.st;
    if (!st.over) {
      if (st.phase === 'roll') paintIdleDie(st.cur, G.waitRoll);
      else paintIdleDie(st.cur, false);
    }
  }

  /* ---------------- canlandırma kuyruğu ---------------- */
  function enqueue(fn) {
    G.Q.push(fn);
    if (!G.running) runQ();
  }
  async function runQ() {
    const gen = G.gen;
    G.running = true;
    G.anim = true;
    while (G.Q.length && G.gen === gen) {
      const fn = G.Q.shift();
      try {
        await fn();
      } catch (e) {
        console.error('[kızma] canlandırma', e);
      }
    }
    if (G.gen !== gen) return;
    G.running = false;
    G.anim = false;
    afterAnim();
  }
  function reduce(st, a) {
    const r = K.apply(st, a);
    if (r.ok) st._at = a.at || now();
    return r;
  }
  /** Hamle uygula ve canlandır. own: kendi elle yaptığım hamle (piyon hemen gider) */
  function applyUI(a, own) {
    const st = G.st;
    if (!st) return { ok: false };
    const before = K.clone(st);
    const r = reduce(st, a);
    if (!r.ok) return r;
    G.ms = null;
    G.waitRoll = false;
    paintTargets();
    const snap = K.clone(st);
    enqueue(async () => {
      for (const e of r.ev) await animEvent(e, before, own);
      // eşitle
      G.view = snap;
      paintPieces();
    });
    return r;
  }
  async function animEvent(e, before, own) {
    const gen = G.gen;
    if (e.t === 'roll') {
      G.lastDie = e.d;
      await throwDie(e.seat, e.d);
      if (gen !== G.gen) return;
      if (e.n === 0) {
        if (e.again) note('6! Oynayacak piyon yok, yine at', e.seat, 'good');
        else if (e.tries) note(`6 gelmedi · ${3 - e.tries} hak kaldı`, e.seat);
        else note('Oynayacak piyon yok', e.seat);
        await sleep(D(e.pass ? 650 : 420));
      } else if (e.d === 6) {
        SND.play('coin');
        note('6 geldi!', e.seat, 'good');
      }
      return;
    }
    if (e.t === 'move') {
      await animMove(e, own);
      return;
    }
    if (e.t === 'again') {
      note('6! Bir daha at', e.seat, 'good');
      await sleep(D(260));
      return;
    }
    if (e.t === 'finish') {
      const w = who(e.seat);
      SND.play('win');
      BZ.toast(`${esc(w.me ? 'Sen' : w.name)} dört piyonunu da eve soktu! (${e.place}.)`, isMine(e.seat) ? 'good' : '', 2200);
      await sleep(D(600));
      return;
    }
    if (e.t === 'over') {
      G.view = K.clone(G.st);
      return;
    }
  }
  async function throwDie(s, v) {
    const box = $('.kz-dicebox');
    if (!box || !G.layout) return;
    box.classList.remove('tap');
    const idle = box.querySelector('.kz-die');
    if (idle && G.rolling) await BZ.shakeDie(idle, D(220));
    box.innerHTML = '';
    G.rolling = false;
    const at = diceSpot(s);
    const from = yardCorner(s);
    const cs = G.layout.cs;
    // atış yönü: ahırdan tahtanın ortasına doğru, ahırın biraz dışından
    const dx = from.x - G.layout.size / 2;
    const dy = from.y - G.layout.size / 2;
    const L = Math.hypot(dx, dy) || 1;
    const f = { x: from.x + (dx / L) * cs * 1.2, y: from.y + (dy / L) * cs * 1.2 };
    const nodes = await BZ.throwDice(box, { values: [v], at: [at], from: f, size: G.layout.ds, dur: D(1150), height: cs * 3.2 });
    nodes.forEach((n) => n.classList.add('kz-die-res', COLORS[colOf(s)]));
  }
  async function animMove(e, own) {
    const { seat: s, i } = e;
    const n = $(`.kz-pc[data-s="${s}"][data-i="${i}"]`);
    if (!n) return;
    n.classList.add('moving');
    const steps = [];
    if (e.from === -1) steps.push(0);
    else for (let p = e.from + 1; p <= e.to; p++) steps.push(p);
    const per = own ? 120 : 150;
    for (const p of steps) {
      const { x, y } = piecePx(s, p, i);
      n.style.setProperty('--px', x.toFixed(1) + 'px');
      n.style.setProperty('--py', y.toFixed(1) + 'px');
      n.classList.remove('hop');
      void n.offsetWidth;
      n.classList.add('hop');
      SND.play('tap');
      await sleep(D(per));
    }
    n.classList.remove('moving', 'hop');
    if (e.cap) {
      const [cs, ci] = e.cap;
      const vn = $(`.kz-pc[data-s="${cs}"][data-i="${ci}"]`);
      SND.play('boom');
      BZ.haptic(40);
      if (vn) {
        vn.classList.add('knocked');
        await sleep(D(240));
        const { x, y } = piecePx(cs, -1, ci);
        vn.style.setProperty('--px', x.toFixed(1) + 'px');
        vn.style.setProperty('--py', y.toFixed(1) + 'px');
        await sleep(D(420));
        vn.classList.remove('knocked');
      }
      const a = who(s);
      const b = who(cs);
      BZ.toast(`${esc(a.me ? 'Sen' : a.name)}, ${esc(b.me ? 'senin' : b.name)} piyonunu kırdı!`, isMine(s) && !isMine(cs) ? 'good' : isMine(cs) && !isMine(s) ? 'bad' : '', 1600);
    }
    if (e.to >= 40 && e.from < 40) SND.play('coin');
  }

  /* ---------------- sıra ---------------- */
  function afterAnim() {
    const st = G.st;
    if (!st || G.anim) return;
    paintPieces();
    paintPods();
    if (st.over) {
      $('.kz-dicebox').innerHTML = '';
      G.hud.msg('Oyun bitti', '');
      return onOver();
    }
    const mine = isMine(st.cur);
    G.ms = null;
    if (st.phase === 'move') {
      if (mine && (G.mode !== 'online' || (G.net && G.net.canAct()))) {
        G.ms = K.moves(st, st.cur, st.die);
        if (G.ms.length === 1 && set.auto1 !== false) {
          // tek seçenek: kısa bir an gösterip kendiliğinden oynat
          const m = G.ms[0];
          const key = st.step;
          paintTargets();
          paintMsg();
          setTimeout(() => {
            if (G.st === st && st.step === key && !G.anim) play(m.i);
          }, D(520));
          return;
        }
      }
      paintIdleDie(st.cur, false);
    } else {
      G.waitRoll = mine && (G.mode !== 'online' || (G.net && G.net.canAct()));
      paintIdleDie(st.cur, G.waitRoll);
      if (G.waitRoll) {
        const k = 'r' + st.turnNo + ':' + st.step;
        if (G.turnKey !== k && (G.mode !== 'local')) {
          G.turnKey = k;
          if (st.tries === 0 && st.sixes === 0) {
            SND.play('turn');
            BZ.haptic(25);
          }
        }
      }
    }
    paintTargets();
    paintMsg();
    if (G.mode === 'online') netDrive();
    else driveOffline();
  }
  /** Zarı at (benim sıram) */
  function roll() {
    const st = G.st;
    if (!st || st.over || st.phase !== 'roll' || !G.waitRoll || G.anim) return;
    SND.unlock();
    G.waitRoll = false;
    G.rolling = true;
    const idle = $('.kz-dicebox .kz-die');
    paintRollCta(false);
    $$('.kz-dicebox .kz-tapme').forEach((n) => n.remove());
    $('.kz-dicebox').classList.remove('tap');
    if (idle) {
      idle.classList.remove('wait');
      idle.classList.add('shaking');
    }
    SND.play('shake');
    if (G.mode === 'online') {
      const r = G.net.dispatch({ seat: G.me, kind: 'roll', data: { k: st.step } }, { later: true });
      if (!r || r.ok === false) {
        G.rolling = false;
        G.waitRoll = true;
        paintIdleDie(st.cur, true);
        if (r && r.err) BZ.toast(esc(r.err), 'bad');
      }
      return;
    }
    applyUI({ seat: st.cur, kind: 'roll', data: { d: [1 + Math.floor(Math.random() * 6)], k: st.step }, at: now() });
  }
  /** Piyon oynat (benim sıram) */
  function play(i) {
    const st = G.st;
    if (!st || st.phase !== 'move' || !G.ms || G.anim) return;
    const m = G.ms.find((x) => x.i === i);
    if (!m) {
      SND.play('error');
      return;
    }
    SND.play('select');
    G.ms = null;
    paintTargets();
    if (G.mode === 'online') {
      const r = G.net.dispatch({ seat: G.me, kind: 'move', data: { i, k: st.step } });
      if (!r || r.ok === false) {
        if (r && r.err) BZ.toast(esc(r.err), 'bad');
        afterAnim();
      }
      return;
    }
    applyUI({ seat: st.cur, kind: 'move', data: { i, k: st.step }, at: now() }, true);
  }

  /* ---------------- botlara karşı ---------------- */
  function driveOffline() {
    clearTimeout(G.botT);
    const st = G.st;
    if (!st || st.over || G.anim || G.mode === 'online') return;
    if (G.human[st.cur]) return;
    const s = st.cur;
    const key = st.step;
    G.botT = setTimeout(
      () => {
        if (G.st !== st || st.step !== key || G.anim) return;
        if (st.phase === 'roll') applyUI({ seat: s, kind: 'roll', data: { d: [1 + Math.floor(Math.random() * 6)], k: st.step }, at: now() });
        else {
          const m = K.choose(st, s, set.level);
          if (m) applyUI({ seat: s, kind: 'move', data: { i: m.i, k: st.step }, at: now() });
        }
      },
      D(st.phase === 'roll' ? 520 : 480 + Math.random() * 320),
    );
  }
  function startOffline() {
    G.gen++;
    BZ.closeModals();
    clearTimeout(G.botT);
    const n = +set.players || 4;
    G.mode = set.mode === 'local' ? 'local' : 'offline';
    G.net = null;
    G.spect = false;
    G.me = 0;
    G.rot = 0;
    G.rules = null;
    G.finished = false;
    G.Q = [];
    G.running = false;
    G.anim = false;
    G.st = K.newGame({ n, first: Math.floor(Math.random() * n), end: +set.end === 2 ? 2 : 1 });
    G.st._at = now();
    const bots = BZ.botNames(3, set.name);
    G.human = [];
    G.names = [];
    for (let s = 0; s < n; s++) {
      G.human[s] = G.mode === 'local' || s === 0;
      G.names[s] = G.mode === 'local' ? CNAME[G.st.col[s]] : s === 0 ? set.name || 'Sen' : bots[s - 1];
    }
    G.humans = G.human.filter(Boolean).length;
    sh.show('game');
    setupGame(`${n} oyuncu · ${G.mode === 'local' ? 'aynı cihazda' : 'botlara karşı'}`);
    BZ.toast(`${esc(who(G.st.cur).me ? 'Sen' : who(G.st.cur).name)} başlıyor`, '', 1400);
    afterAnim();
  }
  function setupGame(sub) {
    G.hud = BZ.hud({
      root: $('#hud'),
      title: 'Kızma Birader',
      sub,
      right: G.mode === 'online' && NET ? `<button class="bz-ib" data-a="emoji" aria-label="Emoji gönder">${icon('smile', 20)}</button>` : '',
      chat: G.mode === 'online' && !!NET,
      onMenu: showMenu,
      onAction: (a) => {
        if (a === 'emoji' && NET) NET.emojiPicker();
      },
      onSound: (v) => {
        set.sound = v;
        S.save();
      },
    });
    layout();
    $('#kzBoard').innerHTML = boardHTML();
    paintPieces();
    paintPods();
  }

  /* ---------------- online masa ---------------- */
  const GA = {
    init(table) {
      const st = K.newGame({ n: table.seats_n, first: Number(table.seed || 1) % table.seats_n, end: +((table.rules || {}).end) === 2 ? 2 : 1 });
      st._at = Date.parse(table.started_at) || now();
      return st;
    },
    apply: (st, a) => reduce(st, a),
    clone: (st) => K.clone(st),
    view: () => G.st,
    applyLocal: (a) => applyUI(Object.assign({ at: now() }, a), true),
    applyRemote(a, mine) {
      const r = applyUI(a, mine && a.kind === 'move');
      return r && r.ok ? { pace: 120 } : null;
    },
    reset(st) {
      G.gen++;
      G.st = st;
      G.Q = [];
      G.running = false;
      G.anim = false;
      G.ms = null;
      G.rolling = false;
      relayout();
      afterAnim();
    },
    onSeats() {
      if (G.st && !G.anim) paintPods();
    },
    onStatus(status) {
      if (status === 'closed') {
        BZ.toast(G.spect ? 'Masa kapandı.' : 'Masa kapandı: oyunda başka oyuncu kalmadı.', 'bad');
        setTimeout(() => sh.lobby(), 1600);
      }
    },
    onTick() {
      if (G.mode !== 'online') return;
      paintTimer();
      const pill = $('#kzNet');
      if (pill) pill.hidden = !(G.net && G.net.fails > 1);
      netDrive();
    },
    onSpectate() {
      G.spect = true;
      G.ms = null;
      G.waitRoll = false;
      BZ.toast('Koltuğunda artık bot oynuyor. Masayı izliyorsun.', 'bad');
      paintPods();
      paintTargets();
      paintMsg();
    },
  };
  function fresh(slot, key) {
    const k = G[slot];
    if (k && k.key === key && Date.now() - k.at < 6000) return false;
    G[slot] = { key, at: Date.now() };
    return true;
  }
  function netDrive() {
    const N = G.net;
    const st = G.st;
    if (!N || !st || G.mode !== 'online' || N.closed || G.anim || st.over) return;
    if (!N.canAct() || N.busy()) return;
    const t = now();
    const key = st.step;
    const at = st._at || t;
    const sec = turnSec();
    const p = st.cur;
    const ctl = N.control(p);
    // benim sıram: süre dolunca kendi tarayıcım oynar
    if (!G.spect && p === G.me) {
      // test kancası: kendi koltuğumu bot gibi oynat
      if (G.autoHuman) {
        if (t >= at + 300 * (G.testMul || 1)) {
          if (fresh('botKey', key)) botAct(p, false);
        } else soon(at + 300 * (G.testMul || 1) - t);
        return;
      }
      if (sec && t >= at + sec * 1000 && fresh('autoKey', key)) {
        BZ.toast('Süre doldu: hamlen otomatik oynandı', 'warn');
        botAct(p, true);
      }
      return;
    }
    if (!N.isDriver()) return;
    if (ctl === 'bot' || ctl === 'away') {
      const due = at + (st.phase === 'roll' ? 650 : 450) * (G.testMul || 1);
      if (t >= due) {
        if (fresh('botKey', key)) botAct(p, false);
      } else soon(due - t);
      return;
    }
    if (ctl === 'human' && sec && t >= at + sec * 1000 + 3500 && fresh('autoKey', key)) botAct(p, true);
  }
  /** Botun sırası: bir sonraki saniyeyi beklemeden tam zamanında yeniden bak */
  function soon(ms) {
    clearTimeout(G.ndT);
    G.ndT = setTimeout(netDrive, Math.max(20, ms + 15));
  }
  function botAct(p, auto) {
    const st = G.st;
    const extra = auto ? { auto: true } : {};
    if (st.phase === 'roll') {
      const r = G.net.dispatch({ seat: p, kind: 'roll', data: Object.assign({ k: st.step }, extra) }, { later: true });
      if (!r || r.ok === false) G.botKey = G.autoKey = null;
      if (p === G.me) {
        G.waitRoll = false;
        G.rolling = true;
      }
      return;
    }
    const lvl = (G.rules && G.rules.level) || 'orta';
    const m = K.choose(st, p, lvl);
    if (!m) return;
    const r = G.net.dispatch({ seat: p, kind: 'move', data: Object.assign({ i: m.i, k: st.step }, extra) }, { later: true });
    if (!r || r.ok === false) G.botKey = G.autoKey = null;
  }
  function startTable(sess) {
    G.gen++;
    BZ.closeModals();
    clearTimeout(G.botT);
    G.net = sess;
    G.mode = 'online';
    G.rules = Object.assign({ turn: 20, level: 'orta', end: 1 }, sess.table.rules || {});
    G.spect = sess.spect;
    G.me = sess.spect ? sess.watch : sess.mySeat;
    if (G.me == null) G.me = 0;
    G.finished = false;
    G.Q = [];
    G.running = false;
    G.anim = false;
    G.st = GA.init(sess.table);
    G.rot = G.st.col[G.me] || 0;
    sh.show('game');
    setupGame(`${sess.table.seats_n} oyuncu · online${G.spect ? ' · izliyorsun' : ''}`);
    sess.start(GA).catch(() => sh.lobby());
  }
  const TABLE_RULES = {
    defaults: () => ({ turn: 20, level: 'orta', end: 1 }),
    form(r, n) {
      const seg = (k, v, l) => `<button type="button" data-v="${v}" aria-pressed="${String(r[k]) === String(v)}">${l}</button>`;
      return `<div class="t-field"><span class="t-lab">Maç sonu</span><div class="t-seg" data-seg="end">${seg('end', 1, 'İlk bitiren kazanır')}${n > 2 ? seg('end', 2, '2. de belli olsun') : ''}</div></div>
        <div class="t-field"><span class="t-lab">Hamle süresi</span><div class="t-seg" data-seg="turn">${[15, 20, 30, 45].map((v) => seg('turn', v, v + ' sn')).join('')}</div></div>
        <div class="t-field"><span class="t-lab">Bot seviyesi (boş koltuk ve bağlantısı kopan oyuncu için)</span><div class="t-seg" data-seg="level">${LEVELS.map(([v, l]) => seg('level', v, l)).join('')}</div></div>
        <p class="t-note">Zar sunucuda atılır. 6 atan yeniden atar; 6 ile ahırdan piyon çıkarabilir ya da dışarıdaki bir piyonu oynayabilirsin.</p>`;
    },
    read(form, prev) {
      const r = Object.assign({}, prev || TABLE_RULES.defaults());
      const pick = (k) => form.querySelector(`[data-seg="${k}"] [aria-pressed="true"]`);
      const t = pick('turn');
      const l = pick('level');
      const e = pick('end');
      if (t) r.turn = +t.dataset.v;
      if (l) r.level = l.dataset.v;
      if (e) r.end = +e.dataset.v;
      return r;
    },
    summary: (r, n) => `${+r.end === 2 && n > 2 ? '2. de belli olana kadar' : 'ilk bitiren kazanır'} · hamle ${r.turn ? r.turn + ' sn' : 'süresiz'}`,
  };

  /* ---------------- maç sonu ---------------- */
  function onOver() {
    const st = G.st;
    if (!st || !st.over || $('.bz-modals [data-modal="results"]')) return;
    const rk = K.ranking(st);
    if (G.mode === 'online' && G.net && !G.spect && !G.finished) {
      G.finished = true;
      G.net.finish({ ranking: rk.map((r) => ({ seat: r.seat, total: r.total })) });
    }
    const w = who(st.winner);
    const iWon = isMine(st.winner) && (G.mode !== 'local');
    if (G.mode === 'local' || G.spect) BZ.banner(`${esc(w.name).toLocaleUpperCase('tr-TR')} KAZANDI`, 'Dört piyon evde', true);
    else BZ.banner(iWon ? 'KAZANDIN!' : `${esc(w.name).toLocaleUpperCase('tr-TR')} KAZANDI`, 'Dört piyon evde', iWon);
    SND.play(iWon || G.mode === 'local' ? 'win' : 'lose');
    if (iWon) BZ.confetti(120);
    const online = G.mode === 'online';
    const gen = G.gen;
    setTimeout(() => {
      if (gen !== G.gen) return;
      const rows = rk.map((r) => {
        const x = who(r.seat);
        return { name: x.me ? 'Sen' : x.name + (x.bot && online ? ' (BOT)' : ''), val: r.total, label: r.done ? 'bitirdi' : `${r.home}/4 evde`, me: isMine(r.seat) && G.mode !== 'local', win: r.seat === st.winner };
      });
      BZ.results({
        title: `${esc(w.me ? 'Sen' : w.name)} kazandı`,
        sub: 'Sıralama: bitiriş sırası, sonra evdeki piyonlar ve yolda kat edilen mesafe.',
        rows,
        tiePlaces: true,
        extra: online && !G.spect ? '<div class="rw-slot"></div>' : '',
        onAgain: () => (online ? sh.lobby() : startOffline()),
        onHome: () => (online ? sh.lobby() : home()),
      });
      const box = $('.bz-modals [data-modal="results"]');
      if (online && box) {
        const again = box.querySelector('[data-m="again"]');
        if (again) again.innerHTML = `${icon('users', 17)} Masalara dön`;
        const hm = box.querySelector('[data-m="home"]');
        if (hm) hm.remove();
        const rws = box.querySelector('.rw-slot');
        if (rws && NET && NET.mountRewards && G.net) NET.mountRewards(rws, G.net.id);
      }
    }, D(1700));
  }

  /* ---------------- menü, kurallar, başlangıç ---------------- */
  const RULES = `<p><b>Amaç:</b> dört piyonunu da tahtayı dolaştırıp kendi rengindeki eve ilk sokan kazanır.</p>
    <p><b>Çıkış:</b> piyonlar ahırda başlar; ahırdan çıkmak için <b>6</b> atmalısın. 6 atınca ister ahırdan piyon çıkarırsın, ister dışarıdaki bir piyonunu 6 kare oynarsın — seçim senin.</p>
    <p><b>6:</b> 6 atan bir kez daha atar. 6 ile piyon çıkardıktan sonra gelen zarla istediğin piyonu oynayabilirsin (yeni çıkanı oynamak zorunda değilsin).</p>
    <p><b>Hamle:</b> zar kadar saat yönünde ilerlersin. Kendi piyonunun üstüne konamazsın. Oynayabildiğin bir hamle varsa oynamak zorundasın.</p>
    <p><b>Kırmak:</b> rakibin piyonunun bulunduğu kareye tam gelirsen onu ahırına geri yollarsın.</p>
    <p><b>Üç hak:</b> bütün piyonların ahırdaysa 6 için 3 kez atabilirsin.</p>
    <p><b>Ev:</b> tahtayı dolaşınca kendi ev sırana girersin; eve tam zarla girilir ve evde piyon atlanmaz.</p>
    <p><b>Online:</b> zar sunucuda atılır. Sıran gelince “Zar at”a dokun; süre dolarsa hamlen kendiliğinden oynanır. Bağlantın koparsa yerine bot oynar.</p>`;
  function showMenu() {
    const online = G.mode === 'online' && G.net;
    BZ.gameMenu({
      title: 'Kızma Birader',
      rules: RULES,
      online,
      homeLabel: online ? (G.spect ? 'İzlemeyi bırak' : 'Masadan çık') : 'Oyun ayarlarına dön',
      extra: `<label class="kz-opt"><input type="checkbox" data-set="auto1" ${set.auto1 !== false ? 'checked' : ''}> Tek seçenek varsa piyonu kendiliğinden oynat</label>`,
      onAction: (m) => {
        if (m === 'restart') return startOffline();
        if (m === 'home') return online ? sh.leave(G.net, G.spect) : home();
      },
    });
    const box = $('.bz-modals .bz-mwrap:last-child');
    if (box)
      box.addEventListener('change', (e) => {
        if (e.target.dataset.set === 'auto1') {
          set.auto1 = e.target.checked;
          S.save();
        }
      });
  }
  function home() {
    G.gen++;
    clearTimeout(G.botT);
    BZ.closeModals();
    G.st = null;
    G.mode = 'offline';
    G.net = null;
    sh.show('start');
    BZ.startScreen({
      root: $('#start'),
      title: 'Kızma Birader',
      tagline: 'Zarı at, 6 ile piyonunu çıkar ya da dışarıdakini koştur; rakiplerini kırıp ahırlarına yolla. Dört piyonunu da eve ilk sokan kazanır.',
      chips: ['2–4 kişi', 'Zar', 'Online masa'],
      art: window.GAME_ART,
      settings: set,
      save: () => S.save(),
      panelTitle: 'Botlara karşı',
      options: [
        { key: 'players', label: 'Oyuncu sayısı', choices: [[2, '2'], [3, '3'], [4, '4']] },
        { key: 'mode', label: 'Rakipler', choices: [['bot', 'Botlar'], ['local', 'Hepsi aynı cihazda']] },
        { key: 'level', label: 'Bot seviyesi', choices: LEVELS, when: (s) => s.mode !== 'local' },
        { key: 'end', label: 'Maç sonu', choices: [[1, 'İlk bitiren kazanır'], [2, '2. de belli olsun']], when: (s) => +s.players > 2 },
      ],
      actions: [{ id: 'play', label: 'Oyuna başla', kind: 'gold big', icon: 'play' }],
      online: { title: 'Online', text: 'Arkadaşlarınla 2–4 kişilik masa kur ya da açık masalara katıl. Zar sunucuda atılır; boş koltuklara bot oturur, bağlantısı kopanın yerine bot oynar.' },
      onAction: (id) => {
        if (id === 'play') return startOffline();
        if (id === 'online') return sh.online();
      },
      rules: RULES,
    });
  }
  const sh = BZ.shell({
    game: 'kizma-online',
    name: 'Kızma Birader',
    seatCounts: [2, 3, 4],
    defSeats: 4,
    rules: TABLE_RULES,
    seatTag: (seat, n) => {
      const c = K.colorsFor(n)[seat];
      return `<span class="kz-seattag ${COLORS[c]}">${CNAME[c]}</span>`;
    },
    onPlay: startTable,
    onOffline: () => startOffline(),
    onStart: home,
    mySeat: () => (G.spect ? null : G.me),
    avatarEl: (uid, seat) => {
      if (!G.st) return null;
      let p = seat != null && seat !== '' && !isNaN(+seat) ? +seat : null;
      if (p == null && G.net) for (let i = 0; i < G.st.n; i++) if (G.net.who(i).user_id === uid) p = i;
      return p == null ? null : $(`.kz-pod[data-seat="${p}"] .kz-av`);
    },
  });

  /* ---------------- dokunma ---------------- */
  function onBoard(e) {
    SND.unlock();
    const st = G.st;
    if (!st || st.over) return;
    if (e.target.closest('[data-roll]') || (G.waitRoll && (e.target.closest('.kz-dicebox') || e.target.closest('.kz-board')))) {
      if (G.waitRoll) roll();
      return;
    }
    if (!G.ms || G.anim) return;
    const t = e.target.closest('.kz-tgt');
    const pc = e.target.closest('.kz-pc');
    let i = null;
    if (t) i = +t.dataset.i;
    else if (pc && +pc.dataset.s === st.cur) i = +pc.dataset.i;
    else if (pc) {
      // kırılacak rakip piyona dokunmak: onu kıran hamle
      const m = G.ms.find((x) => x.cap && x.cap[0] === +pc.dataset.s && x.cap[1] === +pc.dataset.i);
      if (m) i = m.i;
    }
    if (i == null) return;
    play(i);
  }
  function boot() {
    $('#game').insertAdjacentHTML('beforeend', `<div id="kzWrap" class="kz-wrap"><div id="kzPodsA" class="kz-pods a"></div><div id="kzBoard" class="kz-board"></div><div id="kzPodsB" class="kz-pods b"></div></div><span id="kzNet" class="kz-netpill" hidden>Bağlantı yavaş…</span>`);
    $('#kzBoard').addEventListener('click', onBoard);
    $('#kzWrap').addEventListener('click', (e) => {
      if (e.target.closest('.kz-pods [data-roll]')) {
        SND.unlock();
        return roll();
      }
      const av = e.target.closest('.kz-av[data-uid]');
      if (av && av.dataset.uid && NET && G.mode === 'online') NET.playerCard(av.dataset.uid);
    });
    document.addEventListener('keydown', (e) => {
      if ((e.key === ' ' || e.key === 'Enter') && G.waitRoll && !BZ.hasModal()) {
        e.preventDefault();
        roll();
      }
    });
    let rz = null;
    window.addEventListener('resize', () => {
      clearTimeout(rz);
      rz = setTimeout(relayout, 80);
    });
    window.addEventListener('orientationchange', () => setTimeout(relayout, 260));
    setInterval(() => {
      if (G.st && G.mode === 'online') paintTimer();
    }, 500);
    sh.boot();
  }
  window.__KZT = { startOffline, roll, play, relayout, G };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
