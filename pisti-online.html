  }
  function onOver() {
    const st = G.st;
    if (!st || st.phase !== 'over' || $('#modals [data-modal="over"]')) return;
    const rank = PS.ranking(st);
    const top = rank[0].total;
    const iWon = !G.spect && st.totals[G.me] === top;
    SND.play(iWon ? 'win' : 'lose');
    if (G.mode === 'online' && G.net && !G.spect && !G.finished) {
      G.finished = true;
      G.net.finish({ ranking: rank.map((r) => ({ seat: r.seat, total: r.total })), rounds: st.round, pairs: st.pairs });
    }
    const medal = (i) => ['🥇', '🥈', '🥉'][i] || i + 1 + '.';
    const units = st.pairs ? [0, 1].map((u) => ({ u, t: st.totals[u] })).sort((a, b) => b.t - a.t) : rank.map((r) => ({ u: r.seat, t: r.total }));
    let place = 0;
    const list = units
      .map((x, i) => {
        if (i > 0 && x.t < units[i - 1].t) place = i;
        return `<li class="${x.t === top ? 'win' : ''}"><span>${medal(place)}</span><b>${esc(unitName(st, x.u))}</b><i>${x.t} puan</i></li>`;
      })
      .join('');
    const online = G.mode === 'online';
    modal(
      'over',
      `<div class="ps-over-head">${icon('trophy', 34)}<h2>${G.spect ? 'Oyun bitti' : iWon ? 'Kazandın!' : 'Oyun bitti'}</h2></div>
       <ol class="ps-rank">${list}</ol>
       ${online && !G.spect ? '<div class="rw-slot"></div>' : ''}
       <div class="ps-mact">${online ? `<button class="ps-btn gold" data-m="lobby">${icon('users', 16)} Masalara dön</button>` : `<button class="ps-btn gold" data-m="again">${icon('play', 16)} Yeniden oyna</button><button class="ps-btn" data-m="home">${icon('home', 16)} Ana menü</button>`}
       <button class="ps-btn" data-m="score">${icon('chart', 16)} Puanlar</button></div>`,
      (m) => {
        if (m === 'again') startOffline();
        else if (m === 'home' || m === 'lobby') toLobby();
        else if (m === 'score') showScore();
      },
    );
    const rws = $('#modals [data-modal="over"] .rw-slot');
    if (rws && NET && NET.mountRewards && G.net) NET.mountRewards(rws, G.net.id);
  }

  /* ---------------- başlangıç ekranı ---------------- */
  function startScreen() {
    const s = G.set;
    const seg = (k, v, l) => `<button type="button" data-k="${k}" data-v="${v}" aria-pressed="${String(s[k]) === String(v)}">${l}</button>`;
    $('#start').innerHTML = `<div class="ps-start">
      <div class="ps-logo" aria-hidden="true">${CARDS.faceSVG(10, 74)}${CARDS.faceSVG(36, 74)}</div>
      <h1>Pişti</h1>
      <p class="ps-lead">Aynı kartla al, valeyle süpür, tek kartı yakalayınca <b>PİŞTİ</b>!</p>
      <div class="ps-cards">
        <section class="ps-card">
          <h2>Botlara karşı</h2>
          <div class="ps-row"><span>Oyuncu</span><div class="ps-seg">${[2, 3, 4].map((v) => seg('n', v, v + ' kişi')).join('')}</div></div>
          <div class="ps-row ${+s.n === 4 ? '' : 'is-off'}"><span>Tür</span><div class="ps-seg">${seg('pairs', false, 'Tekli')}${seg('pairs', true, 'Eşli')}</div></div>
          <div class="ps-row"><span>Hedef</span><div class="ps-seg">${[51, 101, 151].map((v) => seg('target', v, v)).join('')}</div></div>
          <div class="ps-row"><span>Bot</span><div class="ps-seg">${LEVELS.map((l) => seg('level', l.id, l.label)).join('')}</div></div>
          <label class="ps-row"><span>Adın</span><input class="ps-input" id="pname" maxlength="16" value="${esc(s.name)}"></label>
          <button class="ps-btn gold big" data-go="bots">${icon('play', 18)} Başla</button>
        </section>
        <section class="ps-card">
          <h2>Online</h2>
          <p class="ps-sub">Arkadaşlarınla 2–4 kişilik masa kur ya da açık masalara katıl. Emoji ve hediyeler masada açık.</p>
          <button class="ps-btn gold big" data-go="online">${icon('users', 18)} Online masalar</button>
          <button class="ps-btn" data-go="rules">${icon('book', 16)} Kurallar</button>
        </section>
      </div>
    </div>`;
  }
  function onStartClick(e) {
    const b = e.target.closest('button');
    if (!b) return;
    SND.unlock();
    if (b.dataset.k) {
      const k = b.dataset.k;
      let v = b.dataset.v;
      if (k === 'n' || k === 'target') v = +v;
      if (k === 'pairs') v = v === 'true';
      G.set[k] = v;
      saveSet();
      return startScreen();
    }
    if (b.dataset.go === 'bots') return startOffline();
    if (b.dataset.go === 'rules') return showRules();
    if (b.dataset.go === 'online') {
      if (!NET) return toast('Online oyun için oyunu Bözer Gaming sitesinden aç.', 'err');
      if (!NET.authed()) return NET.goLogin();
      showScreen('net');
      NET.openLobby();
    }
  }

  /* =====================================================================
     DOKUNMA / SÜRÜKLEME
     ===================================================================== */
  function cardAt(e) {
    const n = e.target.closest('.cd.is-mine');
    return n ? +n.dataset.id : null;
  }
  function onDown(e) {
    const c = cardAt(e);
    if (c == null || G.spect) return;
    if (e.button != null && e.button !== 0) return;
    const n = G.els.get(c);
    G.drag = { c, x0: e.clientX, y0: e.clientY, moved: false, id: e.pointerId, n };
    try {
      n.setPointerCapture(e.pointerId);
    } catch (er) {}
  }
  function onMove(e) {
    const d = G.drag;
    if (!d || e.pointerId !== d.id) return;
    const dx = e.clientX - d.x0;
    const dy = e.clientY - d.y0;
    if (!d.moved && Math.hypot(dx, dy) < 10) return;
    if (!canAct()) return;
    d.moved = true;
    const L = G.lay;
    const s = L.hand / BASEW;
    d.n.style.transitionDuration = '0ms';
    d.n.style.zIndex = 1500;
    d.n.style.transform = `translate3d(${e.clientX - BASEW / 2}px, ${e.clientY - BASEW * 0.7}px, 0) scale(${s * 1.06})`;
    d.n.__tr = '';
    const over = e.clientY < L.handY - L.hand * 0.75;
    $('#pileGlow').classList.toggle('on', over);
  }
  function onUp(e) {
    const d = G.drag;
    if (!d || e.pointerId !== d.id) return;
    G.drag = null;
    $('#pileGlow').classList.remove('on');
    const L = G.lay;
    if (d.moved) {
      const over = e.clientY < L.handY - L.hand * 0.75;
      if (over && playCard(d.c)) return;
      place(G.vs, { dur: 220 });
      return;
    }
    // dokunma: seç / at
    if (!canAct()) {
      if (G.st && G.st.phase === 'play' && !G.spect) {
        SND.play('error');
        toast(G.anim ? 'Kartlar yerine otursun…' : 'Sıra sende değil', '');
      }
      return;
    }
    if (G.set.oneTap || G.sel === d.c) {
      playCard(d.c);
      return;
    }
    G.sel = d.c;
    SND.play('flick');
    place(G.vs, { dur: 160 });
    markHand();
  }
  function onSceneClick(e) {
    const b = e.target.closest('[data-a]');
    if (b) return topAction(b.dataset.a);
    const av = e.target.closest('.ps-av[data-uid]');
    if (av && av.dataset.uid && NET && G.mode === 'online') return NET.playerCard(av.dataset.uid);
    if (e.target.closest('#pileHit') && G.sel != null && canAct()) return playCard(G.sel);
    if (!e.target.closest('.cd') && G.sel != null) {
      G.sel = null;
      place(G.vs, { dur: 160 });
      markHand();
    }
  }
  function topAction(a) {
    SND.unlock();
    if (a === 'menu') return showMenu();
    if (a === 'score') return showScore();
    if (a === 'emoji') return NET && NET.emojiPicker();
    if (a === 'sound') {
      G.set.sound = !G.set.sound;
      SND.setOn(G.set.sound);
      saveSet();
      return renderHUD();
    }
    if (a === 'watch' && G.net) {
      const list = G.net.watchable();
      if (list.length < 2) return toast('İzleyebileceğin başka arkadaş yok.', '');
      const i = list.indexOf(G.me);
      G.me = list[(i + 1) % list.length];
      layout();
      renderPods();
      place(G.vs, { dur: 200 });
      toast(`${who(G.me).name} izleniyor`, '');
    }
  }
  function relayout() {
    if ($('#game').classList.contains('hidden') || !G.st) return;
    layout();
    renderPods();
    place(G.vs, { dur: 0 });
    deckLabel();
    paintStatic();
  }
  function paintStatic() {
    const L = G.lay;
    if (!L) return;
    const ph = $('#pileHit');
    ph.style.left = L.pileC.x + 'px';
    ph.style.top = L.pileC.y + 'px';
    ph.style.width = L.pile * 1.7 + 'px';
    ph.style.height = L.pile * 1.9 + 'px';
    const pg = $('#pileGlow');
    pg.style.left = L.pileC.x + 'px';
    pg.style.top = L.pileC.y + 'px';
    pg.style.width = L.pile * 2.1 + 'px';
    pg.style.height = L.pile * 2.3 + 'px';
  }

  /* =====================================================================
     BAŞLAT
     ===================================================================== */
  function boot() {
    document.body.insertAdjacentHTML('afterbegin', CARDS.defs());
    SND.setOn(G.set.sound);
    $('#start').addEventListener('click', onStartClick);
    $('#start').addEventListener('input', (e) => {
      if (e.target.id === 'pname') {
        G.set.name = e.target.value.trim().slice(0, 16) || 'Oyuncu';
        saveSet();
      }
    });
    const game = $('#game');
    game.addEventListener('pointerdown', onDown);
    game.addEventListener('pointermove', onMove);
    game.addEventListener('pointerup', onUp);
    game.addEventListener('pointercancel', () => {
      G.drag = null;
      $('#pileGlow').classList.remove('on');
      if (G.vs) place(G.vs, { dur: 200 });
    });
    game.addEventListener('click', onSceneClick);
    let rz = null;
    window.addEventListener('resize', () => {
      clearTimeout(rz);
      rz = setTimeout(relayout, 60);
    });
    window.addEventListener('orientationchange', () => setTimeout(relayout, 250));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') ['menu', 'score', 'rules'].forEach(closeModal);
      if (!G.st || !canAct()) return;
      const k = +e.key;
      if (k >= 1 && k <= 4) {
        const h = G.st.hands[G.me];
        if (h[k - 1] != null) playCard(h[k - 1]);
      }
    });
    setInterval(() => {
      if (G.mode === 'offline' && G.st && !G.anim && G.st.phase === 'play' && G.st.cur !== G.me && Date.now() - (G.botAt || 0) > 4000) driveOffline();
    }, 1500);
    if (NET) {
      NET.on('viewers', (list) => (G.viewers = list || []));
      NET.mount({
        game: 'pisti-online',
        name: 'Pişti',
        root: $('#net'),
        seatCounts: [2, 3, 4],
        defSeats: 2,
        seatDir: -1,
        rules: TABLE_RULES,
        toast: (t, k) => toast(t, k === 'err' ? 'err' : k === 'good' ? 'good' : ''),
        onPlay: startTable,
        mySeat: () => (G.spect ? null : G.me),
        avatarEl: (uid, seat) => {
          if (!G.st || !G.net) return null;
          let p = seat != null && seat !== '' && !isNaN(+seat) ? +seat : null;
          if (p == null) for (let i = 0; i < G.st.n; i++) if (G.net.who(i).user_id === uid) p = i;
          if (p == null) return null;
          return $(`.ps-pod[data-seat="${p}"] .ps-av`);
        },
        onBack: () => {
          showScreen('start');
          startScreen();
        },
      });
      const q = NET.params;
      if (q.masa && NET.authed()) {
        showScreen('net');
        NET.openTable(q.masa, { watch: q.izle === '1', who: q.kim || '' }).catch((e) => {
          toast(e.message || 'Masa açılamadı', 'err');
          NET.openLobby();
        });
        return;
      }
      if (q.mod === 'online') {
        if (!NET.authed()) {
          showScreen('start');
          startScreen();
          return;
        }
        showScreen('net');
        NET.openLobby();
        return;
      }
      if (q.mod === 'bot') {
        startOffline();
        return;
      }
    }
    showScreen('start');
    startScreen();
  }
  window.__PST = { startOffline, playCard, canAct, showScore, showMenu, relayout };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
