<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
.fb{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.hd{transform-box:view-box;transform-origin:64px 68px}
.cuss text,.bub text{opacity:0;animation:cuss .9s steps(1) infinite}
.c2{animation-delay:.3s!important}.c3{animation-delay:.6s!important}
.steam{transform-box:fill-box;transform-origin:50% 100%;animation:puff 1s ease-out infinite}
.s2{animation-delay:.5s}
.vein{transform-box:fill-box;transform-origin:50% 50%;animation:vein .45s ease-in-out infinite alternate}
.bub{transform-box:fill-box;transform-origin:15% 100%;animation:bub 1.8s ease-in-out infinite}
@keyframes cuss{0%{opacity:1}33.3%{opacity:0}}
@keyframes puff{0%{transform:translateY(6px) scale(.4);opacity:0}30%{opacity:.95}100%{transform:translateY(-22px) scale(1.5);opacity:0}}
@keyframes vein{from{transform:scale(.8)}to{transform:scale(1.18)}}
@keyframes bub{0%,100%{transform:scale(1) rotate(0)}10%{transform:scale(1.14) rotate(-5deg)}20%{transform:scale(1) rotate(3deg)}}
.shake{animation:shake .16s linear infinite}
.fistl,.fistr{animation:fist .3s ease-in-out infinite alternate}.fistr{animation-delay:.15s}
.glow{animation:glow .4s ease-in-out infinite alternate}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-1.5px,1px) rotate(-1.5deg)}50%{transform:translate(1.5px,-1px) rotate(1.2deg)}75%{transform:translate(-1px,-1px) rotate(-.8deg)}100%{transform:translate(0,0)}}
@keyframes fist{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes glow{from{fill:#2a0606}to{fill:#ff1a1a}}</style>
