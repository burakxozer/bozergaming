.fb{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.hd{transform-box:view-box;transform-origin:64px 68px}.hope{animation:hope 1.6s ease-in-out infinite}
.fl{transform-box:view-box;transform-origin:28px 106px;animation:fl .7s ease-in-out infinite alternate}
.fr2{transform-box:view-box;transform-origin:100px 106px;animation:fr .7s ease-in-out infinite alternate}
.spk{transform-box:fill-box;transform-origin:50% 50%;animation:tw 1.4s ease-in-out infinite}.s2{animation-delay:.7s}
