.hd{transform-box:view-box;transform-origin:64px 68px}.slump{animation:slump 2s ease-in-out infinite}
.cloud{animation:cl 3s ease-in-out infinite}
.rain{animation:rain .6s linear infinite}
.pad{transform-box:fill-box;transform-origin:50% 50%;animation:pad 2s ease-in-out infinite}
