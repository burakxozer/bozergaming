  <style>
.fb{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.hd{transform-box:view-box;transform-origin:64px 68px}.party{animation:party .8s ease-in-out infinite}
.horn{transform-box:fill-box;transform-origin:0% 50%;animation:horn .8s ease-in-out infinite}
.curl{animation:curl .8s ease-in-out infinite}
.cf{animation:fall 1.6s linear infinite}.c1{animation-delay:.3s}.c2{animation-delay:.6s}.c3{animation-delay:.9s}.c4{animation-delay:1.2s}.c5{animation-delay:.45s}
@keyframes party{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-2px)}}
@keyframes horn{0%,100%{transform:scaleX(.85)}50%{transform:scaleX(1.08)}}
@keyframes curl{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(40px) rotate(160deg);opacity:0}}</style>
