.lift{animation:lift .8s cubic-bezier(.3,1.5,.5,1) infinite}
.bst{opacity:0;animation:bst .8s ease-out infinite}
.spk{transform-box:fill-box;transform-origin:50% 50%;animation:tw .8s ease-in-out infinite}
