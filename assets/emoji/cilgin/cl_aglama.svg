<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
.a{transform-box:view-box;transform-origin:64px 66px}
.fb{transform-box:fill-box;transform-origin:50% 50%}
.fbb{transform-box:fill-box;transform-origin:50% 100%}
.fbt{transform-box:fill-box;transform-origin:50% 0%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.sob{animation:sob .5s ease-in-out infinite}
.riv{animation:riv .5s linear infinite}
.mo{transform-box:fill-box;transform-origin:50% 100%;animation:mo .5s ease-in-out infinite alternate}
.dr{animation:jl .9s ease-in infinite}
.d2,.d4{animation-name:jr}.d3{animation-delay:.45s}.d4{animation-delay:.3s}
@keyframes sob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(2px) scale(1.02,.98)}}
@keyframes riv{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes mo{from{transform:scale(1,1)}to{transform:scale(1.1,.85)}}
@keyframes jl{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-14px,40px);opacity:0}}
@keyframes jr{0%{transform:translate(0,0);opacity:1}100%{transform:translate(14px,40px);opacity:0}}
</style>
  <defs><radialGradient id="f" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#fff6b0"/><stop offset=".42" stop-color="#ffd43b"/><stop offset=".86" stop-color="#f8a100"/><stop offset="1" stop-color="#d96a00"/></radialGradient><radialGradient id="hl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff5d73" stop-opacity=".7"/><stop offset="1" stop-color="#ff5d73" stop-opacity="0"/></radialGradient>
    <linearGradient id="tear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bff0ff"/><stop offset="1" stop-color="#2e9bff"/></linearGradient>
    <radialGradient id="mouth" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#7a1022"/><stop offset="1" stop-color="#3b0610"/></radialGradient>
    <linearGradient id="tongue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a9b"/><stop offset="1" stop-color="#e2405c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#f2b705"/><stop offset="1" stop-color="#a86b00"/></linearGradient></defs>
  
  <g class="a sob">
    <circle cx="64" cy="66" r="52" fill="url(#f)"/>
      <path d="M20 80 C30 108 98 108 108 80 C100 112 28 112 20 80 Z" fill="#b45200" opacity=".18"/>
      <circle cx="64" cy="66" r="51" fill="none" stroke="#b45200" stroke-opacity=".45" stroke-width="2.5"/>
      <ellipse cx="44" cy="34" rx="20" ry="11" fill="url(#hl)" transform="rotate(-28 44 34)"/>
    <path d="M30 46 Q40 40 52 46" fill="none" stroke="#3a2410" stroke-width="4" stroke-linecap="round" transform="rotate(14 41 44)"/>
    <path d="M98 46 Q88 40 76 46" fill="none" stroke="#3a2410" stroke-width="4" stroke-linecap="round" transform="rotate(-14 87 44)"/>
    <path d="M34 60 Q42 54 52 60" fill="none" stroke="#3a2410" stroke-width="5" stroke-linecap="round"/>
    <path d="M94 60 Q86 54 76 60" fill="none" stroke="#3a2410" stroke-width="5" stroke-linecap="round"/>
    <path class="mo" d="M44 96 Q64 74 84 96 Q74 90 64 90 Q54 90 44 96 Z" fill="url(#mouth)"/>
    <path class="riv" d="M42 62 C40 76 38 90 36 118" fill="none" stroke="url(#tear)" stroke-width="9" stroke-linecap="round" stroke-dasharray="10 8"/>
    <path class="riv" d="M86 62 C88 76 90 90 92 118" fill="none" stroke="url(#tear)" stroke-width="9" stroke-linecap="round" stroke-dasharray="10 8"/>
  </g>
  <circle class="dr d1" cx="24" cy="60" r="4.5" fill="url(#tear)"/>
  <circle class="dr d2" cx="104" cy="60" r="4.5" fill="url(#tear)"/>
  <circle class="dr d3" cx="20" cy="70" r="3.5" fill="url(#tear)"/>
  <circle class="dr d4" cx="108" cy="70" r="3.5" fill="url(#tear)"/>
</svg>
