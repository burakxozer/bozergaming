<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
.a{transform-box:view-box;transform-origin:64px 66px}
.fb{transform-box:fill-box;transform-origin:50% 50%}
.fbb{transform-box:fill-box;transform-origin:50% 100%}
.fbt{transform-box:fill-box;transform-origin:50% 0%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate}
.f2{animation-duration:.42s;animation-delay:.1s}.f3{animation-duration:.38s;animation-delay:.2s}
.burn{animation:burn 1s ease-in-out infinite}
.em{animation:em 1.2s ease-out infinite}
@keyframes flick{from{transform:scale(1,1) skewX(-3deg)}to{transform:scale(.92,1.14) skewX(4deg)}}
@keyframes burn{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes em{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
</style>
