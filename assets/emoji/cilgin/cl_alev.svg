    <path d="M64 22 C72 30 78 36 78 46 C78 54 72 58 64 58 C56 58 50 54 50 46 C50 38 56 34 58 26 C60 32 62 32 64 22 Z" fill="#fff3b0" opacity=".85"/></g>
