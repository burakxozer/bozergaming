<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
.a{transform-box:view-box;transform-origin:64px 66px}
.fb{transform-box:fill-box;transform-origin:50% 50%}
.fbb{transform-box:fill-box;transform-origin:50% 100%}
.fbt{transform-box:fill-box;transform-origin:50% 0%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.rock{animation:rock .5s ease-in-out infinite}
.jaw{transform-box:fill-box;transform-origin:50% 0%;animation:jaw .25s ease-in-out infinite alternate}
.ghost{transform-box:fill-box;transform-origin:50% 100%;animation:soul 2.4s ease-in-out infinite}
.lt{animation:lt .5s ease-in-out infinite alternate}
@keyframes rock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes jaw{from{transform:translateY(0)}to{transform:translateY(7px)}}
@keyframes soul{0%{transform:translate(-20px,40px) scale(.3);opacity:0}25%{opacity:.95}80%{opacity:.9}100%{transform:translate(0,-16px) scale(1);opacity:0}}
@keyframes lt{from{opacity:.4}to{opacity:1}}
</style>
  <defs><radialGradient id="f" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#fff6b0"/><stop offset=".42" stop-color="#ffd43b"/><stop offset=".86" stop-color="#f8a100"/><stop offset="1" stop-color="#d96a00"/></radialGradient><radialGradient id="hl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff5d73" stop-opacity=".7"/><stop offset="1" stop-color="#ff5d73" stop-opacity="0"/></radialGradient>
    <linearGradient id="tear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bff0ff"/><stop offset="1" stop-color="#2e9bff"/></linearGradient>
    <radialGradient id="mouth" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#7a1022"/><stop offset="1" stop-color="#3b0610"/></radialGradient>
    <linearGradient id="tongue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a9b"/><stop offset="1" stop-color="#e2405c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#f2b705"/><stop offset="1" stop-color="#a86b00"/></linearGradient><radialGradient id="bone" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f1efe4"/><stop offset="1" stop-color="#c9c5b0"/></radialGradient></defs>
  
  <g class="ghost"><path d="M88 34 C88 18 112 18 112 34 L112 52 L107 48 L102 52 L97 48 L92 52 L88 48 Z" fill="#fff" opacity=".92"/>
    <circle cx="96" cy="34" r="2.4" fill="#203040"/><circle cx="104" cy="34" r="2.4" fill="#203040"/><ellipse cx="100" cy="41" rx="2.4" ry="3" fill="#203040"/></g>
  <g class="a rock">
    <path d="M64 18 C34 18 18 38 18 62 C18 78 26 88 36 92 L36 100 L92 100 L92 92 C102 88 110 78 110 62 C110 38 94 18 64 18 Z" fill="url(#bone)" stroke="#8a8a78" stroke-width="2.5"/>
    <ellipse cx="44" cy="22" rx="16" ry="7" fill="#fff" opacity=".7" transform="rotate(-20 44 22)"/>
    <path d="M36 54 C36 46 56 44 56 56 C56 66 40 70 36 54 Z" fill="#26201a"/>
    <path d="M92 54 C92 46 72 44 72 56 C72 66 88 70 92 54 Z" fill="#26201a"/>
    <path d="M40 54 L50 60 M50 54 L40 60" stroke="#ff4d6d" stroke-width="2.6" stroke-linecap="round" class="xx"/>
    <path d="M78 54 L88 60 M88 54 L78 60" stroke="#ff4d6d" stroke-width="2.6" stroke-linecap="round" class="xx"/>
    <path d="M60 72 L64 64 L68 72 Z" fill="#26201a"/>
    <g class="jaw">
      <path d="M38 96 L90 96 L88 112 C80 118 48 118 40 112 Z" fill="url(#bone)" stroke="#8a8a78" stroke-width="2.5"/>
      <path d="M48 96 L48 106 M56 96 L56 108 M64 96 L64 108 M72 96 L72 108 M80 96 L80 106" stroke="#8a8a78" stroke-width="2"/>
    </g>
    <path d="M40 92 L88 92 M48 84 L48 92 M56 82 L56 92 M64 82 L64 92 M72 82 L72 92 M80 84 L80 92" stroke="#8a8a78" stroke-width="2"/>
    <path class="lt" d="M22 70 C14 74 12 82 16 88" fill="none" stroke="url(#tear)" stroke-width="4" stroke-linecap="round"/>
    <path class="lt" d="M106 70 C114 74 116 82 112 88" fill="none" stroke="url(#tear)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
