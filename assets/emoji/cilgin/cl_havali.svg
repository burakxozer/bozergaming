<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
.a{transform-box:view-box;transform-origin:64px 66px}
.fb{transform-box:fill-box;transform-origin:50% 50%}
.fbb{transform-box:fill-box;transform-origin:50% 100%}
.fbt{transform-box:fill-box;transform-origin:50% 0%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.nod{animation:nod 1.1s ease-in-out infinite}
.shine{animation:shine 2.2s ease-in-out infinite}
.tw{transform-box:fill-box;transform-origin:50% 50%;animation:tw 2.2s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(2px)}}
@keyframes shine{0%,40%{transform:skewX(-25deg) translateX(0)}70%,100%{transform:skewX(-25deg) translateX(110px)}}
@keyframes tw{0%,50%{transform:scale(0) rotate(0);opacity:0}65%{transform:scale(1.2) rotate(45deg);opacity:1}85%,100%{transform:scale(0) rotate(90deg);opacity:0}}
</style>
  <defs><radialGradient id="f" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#fff6b0"/><stop offset=".42" stop-color="#ffd43b"/><stop offset=".86" stop-color="#f8a100"/><stop offset="1" stop-color="#d96a00"/></radialGradient><radialGradient id="hl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff5d73" stop-opacity=".7"/><stop offset="1" stop-color="#ff5d73" stop-opacity="0"/></radialGradient>
    <linearGradient id="tear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bff0ff"/><stop offset="1" stop-color="#2e9bff"/></linearGradient>
    <radialGradient id="mouth" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#7a1022"/><stop offset="1" stop-color="#3b0610"/></radialGradient>
    <linearGradient id="tongue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a9b"/><stop offset="1" stop-color="#e2405c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#f2b705"/><stop offset="1" stop-color="#a86b00"/></linearGradient><linearGradient id="lens" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f4a"/><stop offset="1" stop-color="#05070a"/></linearGradient></defs>
  
  <g class="a nod">
    <circle cx="64" cy="66" r="52" fill="url(#f)"/>
      <path d="M20 80 C30 108 98 108 108 80 C100 112 28 112 20 80 Z" fill="#b45200" opacity=".18"/>
      <circle cx="64" cy="66" r="51" fill="none" stroke="#b45200" stroke-opacity=".45" stroke-width="2.5"/>
      <ellipse cx="44" cy="34" rx="20" ry="11" fill="url(#hl)" transform="rotate(-28 44 34)"/>
    <path d="M24 52 L104 52 L102 58 L26 58 Z" fill="#111"/>
    <path d="M26 54 C26 74 54 76 58 58 L60 54 Z" fill="url(#lens)"/>
    <path d="M102 54 C102 74 74 76 70 58 L68 54 Z" fill="url(#lens)"/>
    <clipPath id="lc"><path d="M26 54 C26 74 54 76 58 58 L60 54 Z M102 54 C102 74 74 76 70 58 L68 54 Z"/></clipPath>
    <g clip-path="url(#lc)"><rect class="shine" x="10" y="40" width="10" height="50" fill="#fff" opacity=".75" transform="skewX(-25)"/></g>
    <path d="M46 88 Q66 96 86 82" fill="none" stroke="#3a2410" stroke-width="5" stroke-linecap="round"/>
    <path d="M30 104 Q64 126 98 104" fill="none" stroke="url(#gold)" stroke-width="5" stroke-dasharray="6 3"/>
    <circle cx="64" cy="114" r="6" fill="url(#gold)" stroke="#8a5500" stroke-width="1.4"/>
  </g>
  <g class="tw"><path d="M110 22 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="#fff6c0"/></g>
</svg>
