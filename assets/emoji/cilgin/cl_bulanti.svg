<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
.a{transform-box:view-box;transform-origin:64px 66px}
.fb{transform-box:fill-box;transform-origin:50% 50%}
.fbb{transform-box:fill-box;transform-origin:50% 100%}
.fbt{transform-box:fill-box;transform-origin:50% 0%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.wob{animation:wob 1.6s ease-in-out infinite}
.ch{transform-box:fill-box;transform-origin:50% 50%;animation:ch .8s ease-in-out infinite alternate}
.sp1,.sp2{transform-box:fill-box;transform-origin:50% 50%;animation:spn 1.2s linear infinite}
.sp2{animation-direction:reverse}
.drip{transform-box:fill-box;transform-origin:50% 0%;animation:drip 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg) skewX(0)}25%{transform:rotate(0) skewX(4deg)}50%{transform:rotate(6deg) skewX(0)}75%{transform:rotate(0) skewX(-4deg)}}
@keyframes ch{from{transform:scale(.9)}to{transform:scale(1.15)}}
@keyframes spn{to{transform:rotate(360deg)}}
@keyframes drip{0%,40%{transform:scaleY(.2);opacity:0}60%{transform:scaleY(1);opacity:.85}100%{transform:scaleY(1.2) translateY(4px);opacity:0}}
</style>
  <defs><radialGradient id="f" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#fff6b0"/><stop offset=".42" stop-color="#ffd43b"/><stop offset=".86" stop-color="#f8a100"/><stop offset="1" stop-color="#d96a00"/></radialGradient><radialGradient id="hl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff5d73" stop-opacity=".7"/><stop offset="1" stop-color="#ff5d73" stop-opacity="0"/></radialGradient>
    <linearGradient id="tear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bff0ff"/><stop offset="1" stop-color="#2e9bff"/></linearGradient>
    <radialGradient id="mouth" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#7a1022"/><stop offset="1" stop-color="#3b0610"/></radialGradient>
    <linearGradient id="tongue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a9b"/><stop offset="1" stop-color="#e2405c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#f2b705"/><stop offset="1" stop-color="#a86b00"/></linearGradient><radialGradient id="f5" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#e6ffb0"/><stop offset=".42" stop-color="#b6e35d"/><stop offset=".86" stop-color="#7fbf2e"/><stop offset="1" stop-color="#3f7a14"/></radialGradient></defs>
  
  <g class="a wob">
    <circle cx="64" cy="66" r="52" fill="url(#f5)"/>
      <path d="M20 80 C30 108 98 108 108 80 C100 112 28 112 20 80 Z" fill="#2b6b1a" opacity=".18"/>
      <circle cx="64" cy="66" r="51" fill="none" stroke="#2b6b1a" stroke-opacity=".45" stroke-width="2.5"/>
      <ellipse cx="44" cy="34" rx="20" ry="11" fill="url(#hl)" transform="rotate(-28 44 34)"/>
    <path d="M34 54 L50 60 M34 64 L50 60" fill="none" stroke="#1e3a10" stroke-width="5" stroke-linecap="round"/>
    <path d="M94 54 L78 60 M94 64 L78 60" fill="none" stroke="#1e3a10" stroke-width="5" stroke-linecap="round"/>
    <ellipse class="ch" cx="34" cy="82" rx="10" ry="9" fill="#9be15d" opacity=".9"/><ellipse class="ch" cx="94" cy="82" rx="10" ry="9" fill="#9be15d" opacity=".9"/>
    <path class="mo" d="M46 92 Q52 86 58 92 Q64 98 70 92 Q76 86 82 92" fill="none" stroke="#1e3a10" stroke-width="5" stroke-linecap="round"/>
    <path d="M56 98 C54 106 58 112 62 112 C66 112 68 106 64 98 Z" fill="#7fd13b" opacity=".8" class="drip"/>
  </g>
  <g transform="translate(16 22)"><path class="sp1" d="M0 0 C3 -3 7 0 6 4 C5 9 -2 10 -5 6 C-9 1 -6 -7 1 -8 C9 -9 14 -2 13 6" fill="none" stroke="#7fd13b" stroke-width="3" stroke-linecap="round"/></g>
  <g transform="translate(112 24)"><path class="sp2" d="M0 0 C3 -3 7 0 6 4 C5 9 -2 10 -5 6 C-9 1 -6 -7 1 -8 C9 -9 14 -2 13 6" fill="none" stroke="#7fd13b" stroke-width="3" stroke-linecap="round"/></g>
</svg>
