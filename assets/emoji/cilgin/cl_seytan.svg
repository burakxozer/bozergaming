    <linearGradient id="tongue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a9b"/><stop offset="1" stop-color="#e2405c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#f2b705"/><stop offset="1" stop-color="#a86b00"/></linearGradient><radialGradient id="f4" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#e9b8ff"/><stop offset=".42" stop-color="#a64dff"/><stop offset=".86" stop-color="#7a1fd6"/><stop offset="1" stop-color="#3d0a63"/></radialGradient>
    <radialGradient id="aura" cx="50%" cy="55%" r="50%"><stop offset=".72" stop-color="#ff3b00" stop-opacity=".0"/><stop offset=".86" stop-color="#ff5a00" stop-opacity=".55"/><stop offset="1" stop-color="#ff2a00" stop-opacity="0"/></radialGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#ff5c5c"/><stop offset="1" stop-color="#8f0b0b"/></linearGradient></defs>
  
