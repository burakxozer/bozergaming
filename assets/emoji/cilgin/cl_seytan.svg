<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
.a{transform-box:view-box;transform-origin:64px 66px}
.fb{transform-box:fill-box;transform-origin:50% 50%}
.fbb{transform-box:fill-box;transform-origin:50% 100%}
.fbt{transform-box:fill-box;transform-origin:50% 0%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.aura{transform-box:fill-box;transform-origin:50% 50%;animation:aura 1.2s ease-in-out infinite alternate}
.sly{animation:sly 2s ease-in-out infinite}
.brw{animation:brw 1s ease-in-out infinite}
@keyframes aura{from{transform:scale(.92);opacity:.55}to{transform:scale(1.04);opacity:1}}
@keyframes sly{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-2px)}}
@keyframes brw{0%,60%,100%{transform:translateY(0)}70%{transform:translateY(-5px)}80%{transform:translateY(0)}88%{transform:translateY(-5px)}}
</style>
