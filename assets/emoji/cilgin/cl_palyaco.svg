<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
.a{transform-box:view-box;transform-origin:64px 66px}
.fb{transform-box:fill-box;transform-origin:50% 50%}
.fbb{transform-box:fill-box;transform-origin:50% 100%}
.fbt{transform-box:fill-box;transform-origin:50% 0%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.bounce{animation:bounce 1.2s ease-in-out infinite}
.nose{transform-box:fill-box;transform-origin:50% 50%;animation:honk 1.2s ease-in-out infinite}
.honk{transform-box:fill-box;transform-origin:0% 100%;opacity:0;animation:hk 1.2s ease-out infinite}
.hair{transform-box:view-box;transform-origin:64px 66px;animation:hair .6s ease-in-out infinite alternate}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3px) rotate(3deg)}}
@keyframes honk{0%,30%,100%{transform:scale(1)}36%{transform:scale(.7,1.2)}44%{transform:scale(1.3,.85)}52%{transform:scale(1)}}
@keyframes hk{0%,34%{opacity:0;transform:scale(.5)}42%{opacity:1;transform:scale(1.2)}70%{opacity:1;transform:scale(1)}80%,100%{opacity:0}}
@keyframes hair{from{transform:scale(1)}to{transform:scale(1.04,.98)}}
</style>
  <defs><radialGradient id="f" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#fff6b0"/><stop offset=".42" stop-color="#ffd43b"/><stop offset=".86" stop-color="#f8a100"/><stop offset="1" stop-color="#d96a00"/></radialGradient><radialGradient id="hl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff5d73" stop-opacity=".7"/><stop offset="1" stop-color="#ff5d73" stop-opacity="0"/></radialGradient>
    <linearGradient id="tear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bff0ff"/><stop offset="1" stop-color="#2e9bff"/></linearGradient>
    <radialGradient id="mouth" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#7a1022"/><stop offset="1" stop-color="#3b0610"/></radialGradient>
    <linearGradient id="tongue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a9b"/><stop offset="1" stop-color="#e2405c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#f2b705"/><stop offset="1" stop-color="#a86b00"/></linearGradient><radialGradient id="paint" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f4f1ff"/><stop offset="1" stop-color="#d4cde8"/></radialGradient>
    <radialGradient id="nose" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ff8a8a"/><stop offset=".6" stop-color="#ff1f3d"/><stop offset="1" stop-color="#a3001a"/></radialGradient></defs>
  
  <g class="a bounce">
    <g class="hair"><circle cx="18" cy="48" r="14" fill="#ff3b6b"/><circle cx="12" cy="66" r="12" fill="#ffb000"/><circle cx="20" cy="82" r="10" fill="#2fc8ff"/>
      <circle cx="110" cy="48" r="14" fill="#2fc8ff"/><circle cx="116" cy="66" r="12" fill="#ff3b6b"/><circle cx="108" cy="82" r="10" fill="#ffb000"/></g>
    <circle cx="64" cy="66" r="50" fill="url(#paint)"/>
    <circle cx="64" cy="66" r="49" fill="none" stroke="#c8c3d6" stroke-width="2"/>
    <ellipse cx="46" cy="34" rx="18" ry="9" fill="#fff" opacity=".8" transform="rotate(-25 46 34)"/>
    <path d="M34 50 L42 40 L50 50 L42 62 Z" fill="#3b7bff" opacity=".85"/><path d="M78 50 L86 40 L94 50 L86 62 Z" fill="#3b7bff" opacity=".85"/>
    <ellipse cx="42" cy="52" rx="5" ry="6.5" fill="#1a1208"/><ellipse cx="86" cy="52" rx="5" ry="6.5" fill="#1a1208"/>
    <path d="M26 78 Q64 128 102 78 Q96 96 64 100 Q32 96 26 78 Z" fill="#e8173c"/>
    <path d="M34 82 Q64 116 94 82 Q64 96 34 82 Z" fill="url(#mouth)"/>
    <path d="M40 84 Q64 94 88 84 L86 88 Q64 98 42 88 Z" fill="#fff"/>
    <g class="nose"><circle cx="64" cy="70" r="11" fill="url(#nose)"/><ellipse cx="60" cy="66" rx="4" ry="2.6" fill="#fff" opacity=".8"/></g>
  </g>
  <g class="honk" font-family="'Arial Black', 'Segoe UI Black', Impact, Arial, sans-serif" font-weight="900" font-size="12" fill="#ff3b6b" text-anchor="middle"><text x="106" y="20">DIT!</text></g>
</svg>
