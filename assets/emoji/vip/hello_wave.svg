  <style>
.fb{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.hd{transform-box:view-box;transform-origin:64px 62px}.bob{animation:bob 1.2s ease-in-out infinite}
.wave{transform-box:view-box;transform-origin:104px 86px;animation:wave .5s ease-in-out infinite alternate}
.wv{animation:wv .5s ease-in-out infinite alternate}
