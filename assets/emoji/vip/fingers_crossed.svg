<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
.fb{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.hd{transform-box:view-box;transform-origin:64px 62px}.hope{animation:hope 1.6s ease-in-out infinite}
.fl{transform-box:view-box;transform-origin:28px 106px;animation:fl .7s ease-in-out infinite alternate}
.fr2{transform-box:view-box;transform-origin:100px 106px;animation:fr .7s ease-in-out infinite alternate}
.spk{transform-box:fill-box;transform-origin:50% 50%;animation:tw 1.4s ease-in-out infinite}.s2{animation-delay:.7s}
@keyframes hope{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes fl{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes fr{from{transform:rotate(6deg)}to{transform:rotate(-6deg)}}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1.1) rotate(45deg);opacity:1}}</style>
