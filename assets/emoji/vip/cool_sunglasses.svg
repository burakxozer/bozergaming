<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
.fb{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.hd{transform-box:view-box;transform-origin:64px 62px}.nod{animation:nod 1.6s ease-in-out infinite}
.glint{animation:glint 2.2s ease-in-out infinite}
.spk{transform-box:fill-box;transform-origin:50% 50%;animation:tw 2.2s ease-in-out infinite}.s2{animation-delay:1.1s}
@keyframes nod{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(2px) rotate(2deg)}50%{transform:translateY(0)}}
@keyframes glint{0%,60%{transform:translateX(-6px);opacity:0}70%{opacity:.9}85%,100%{transform:translateX(10px);opacity:0}}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.15}50%{transform:scale(1.1) rotate(90deg);opacity:1}}</style>
