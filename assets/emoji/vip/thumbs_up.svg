.hd{transform-box:view-box;transform-origin:64px 62px}.nod{animation:nod 1s ease-in-out infinite}
.th{transform-box:view-box;transform-origin:30px 110px;animation:th 1s cubic-bezier(.3,1.6,.5,1) infinite}
.spk{transform-box:fill-box;transform-origin:50% 50%;animation:tw 1s ease-in-out infinite}
.bst{opacity:0;animation:bst 1s ease-out infinite}
