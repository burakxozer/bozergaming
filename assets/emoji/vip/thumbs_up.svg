@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.2}40%{transform:scale(1.1) rotate(45deg);opacity:1}}
@keyframes bst{0%,20%{opacity:0;transform:scale(.6)}35%{opacity:1}70%,100%{opacity:0;transform:scale(1.2)}}</style>
