  <style>
.fb{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.hd{transform-box:view-box;transform-origin:64px 62px}.jolt{animation:jolt 1.4s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:pop 1.4s ease-in-out infinite}
.chl,.chr{animation:ch 1.4s ease-in-out infinite}
.ex{transform-box:fill-box;transform-origin:50% 100%;animation:ex 1.4s ease-in-out infinite}
