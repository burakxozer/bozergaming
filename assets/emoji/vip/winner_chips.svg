  <style>
.fb{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.hd{transform-box:view-box;transform-origin:64px 62px}.cheer{animation:cheer .6s ease-in-out infinite}
.ul,.ur{animation:pump .6s ease-in-out infinite}.ur{animation-delay:.3s}
.coin{animation:coin 1.2s ease-out infinite;opacity:0}.k1{animation-delay:.3s}.k2{animation-delay:.6s}.k3{animation-delay:.9s}
@keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pump{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes coin{0%{transform:translateY(10px) scale(.4);opacity:0}30%{opacity:1}100%{transform:translateY(-12px) scale(1);opacity:0}}</style>
