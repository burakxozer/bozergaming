<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
.fb{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.hd{transform-box:view-box;transform-origin:64px 62px}.party{animation:party .8s ease-in-out infinite}
.horn{transform-box:fill-box;transform-origin:0% 50%;animation:horn .8s ease-in-out infinite}
.curl{animation:curl .8s ease-in-out infinite}
.cf{animation:fall 1.6s linear infinite}.c1{animation-delay:.3s}.c2{animation-delay:.6s}.c3{animation-delay:.9s}.c4{animation-delay:1.2s}.c5{animation-delay:.45s}
@keyframes party{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-2px)}}
@keyframes horn{0%,100%{transform:scaleX(.85)}50%{transform:scaleX(1.08)}}
@keyframes curl{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(40px) rotate(160deg);opacity:0}}</style>
  <defs><radialGradient id="f" cx="38%" cy="30%" r="78%"><stop offset="0" stop-color="#fff6b0"/><stop offset=".42" stop-color="#ffd43b"/><stop offset=".86" stop-color="#f8a100"/><stop offset="1" stop-color="#d96a00"/></radialGradient><radialGradient id="hl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><radialGradient id="blush" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff5d73" stop-opacity=".75"/><stop offset="1" stop-color="#ff5d73" stop-opacity="0"/></radialGradient><radialGradient id="mouth" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#7a1022"/><stop offset="1" stop-color="#3b0610"/></radialGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#f2b705"/><stop offset="1" stop-color="#a86b00"/></linearGradient><linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f323d"/><stop offset="1" stop-color="#0d0e12"/></linearGradient><linearGradient id="lapel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4e5c"/><stop offset=".5" stop-color="#1b1d24"/><stop offset="1" stop-color="#3a3d48"/></linearGradient><linearGradient id="bow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4a5a"/><stop offset="1" stop-color="#a40d1f"/></linearGradient><radialGradient id="disc" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#2b2f40"/><stop offset="1" stop-color="#0b0c12"/></radialGradient><clipPath id="disc-c"><circle cx="64" cy="70" r="55"/></clipPath></defs>
