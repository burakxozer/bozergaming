@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.hd{transform-box:view-box;transform-origin:64px 62px}.slump{animation:slump 2s ease-in-out infinite}
.cdl,.hl{animation:tl 2s ease-in-out infinite}.cdr,.hr{animation:tr 2s ease-in-out infinite}
.rain{animation:rain .6s linear infinite}
