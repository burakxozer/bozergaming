@keyframes tr{0%,30%{transform:translateX(0) rotate(0)}50%,80%{transform:translateX(5px) rotate(6deg)}100%{transform:translateX(0)}}
@keyframes rain{from{transform:translateY(-4px);opacity:1}to{transform:translateY(10px);opacity:0}}</style>
