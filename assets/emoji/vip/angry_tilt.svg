    <g class="vein"><path d="M76 22 l6 2 l2 -6 M92 24 l-6 2 l2 6 M82 37 l2 -6 l6 1 M77 32 l6 -2" fill="none" stroke="#ff2a2a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <g class="fistl"><g transform="translate(24 108) rotate(-8) scale(1.22)">
      <g fill="#8f96a3" stroke="#8f96a3" stroke-width="3.6" stroke-linejoin="round"><rect x="-11" y="-15" width="22" height="17" rx="7"/><rect x="-11.0" y="-19" width="5.8" height="9" rx="2.9"/><rect x="-5.5" y="-19" width="5.8" height="9" rx="2.9"/><rect x="0.0" y="-19" width="5.8" height="9" rx="2.9"/><rect x="5.5" y="-19" width="5.8" height="9" rx="2.9"/><rect x="-10" y="-10" width="15" height="5.6" rx="2.8"/></g>
      <g fill="url(#glove)"><rect x="-11" y="-15" width="22" height="17" rx="7"/><rect x="-11.0" y="-19" width="5.8" height="9" rx="2.9"/><rect x="-5.5" y="-19" width="5.8" height="9" rx="2.9"/><rect x="0.0" y="-19" width="5.8" height="9" rx="2.9"/><rect x="5.5" y="-19" width="5.8" height="9" rx="2.9"/><rect x="-10" y="-10" width="15" height="5.6" rx="2.8"/></g><path d="M-5.5 -18 v5 M0 -18 v5 M5.5 -18 v5" stroke="#8f96a3" stroke-width="1.1" stroke-linecap="round" opacity=".7"/><rect x="-11" y="-1" width="22" height="7" rx="2.5" fill="#f4f5f8" stroke="#8f96a3" stroke-width="1.2"/><rect x="-11" y="5" width="22" height="6" rx="2" fill="#15161c"/></g></g><g class="fistr"><g transform="translate(104 108) rotate(8) scale(-1 1) scale(1.22)">
      <g fill="#8f96a3" stroke="#8f96a3" stroke-width="3.6" stroke-linejoin="round"><rect x="-11" y="-15" width="22" height="17" rx="7"/><rect x="-11.0" y="-19" width="5.8" height="9" rx="2.9"/><rect x="-5.5" y="-19" width="5.8" height="9" rx="2.9"/><rect x="0.0" y="-19" width="5.8" height="9" rx="2.9"/><rect x="5.5" y="-19" width="5.8" height="9" rx="2.9"/><rect x="-10" y="-10" width="15" height="5.6" rx="2.8"/></g>
      <g fill="url(#glove)"><rect x="-11" y="-15" width="22" height="17" rx="7"/><rect x="-11.0" y="-19" width="5.8" height="9" rx="2.9"/><rect x="-5.5" y="-19" width="5.8" height="9" rx="2.9"/><rect x="0.0" y="-19" width="5.8" height="9" rx="2.9"/><rect x="5.5" y="-19" width="5.8" height="9" rx="2.9"/><rect x="-10" y="-10" width="15" height="5.6" rx="2.8"/></g><path d="M-5.5 -18 v5 M0 -18 v5 M5.5 -18 v5" stroke="#8f96a3" stroke-width="1.1" stroke-linecap="round" opacity=".7"/><rect x="-11" y="-1" width="22" height="7" rx="2.5" fill="#f4f5f8" stroke="#8f96a3" stroke-width="1.2"/><rect x="-11" y="5" width="22" height="6" rx="2" fill="#15161c"/></g></g>
