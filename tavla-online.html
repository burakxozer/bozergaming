<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#140b05" />
<title>Tavla Online · Bözer Gaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/bg-table.css?v=3.4.1" />
<link rel="stylesheet" href="assets/css/badges.css?v=3.4.1" />
<style>
/* =====================================================================
   TAVLA · Görünüm
   Ceviz tahta, zeytin yeşili deri alan, fildişi ve bordo haneler,
   fildişi / abanoz taşlar ve altın kakma ayrıntılar.
   ===================================================================== */
:root {
  --tv-bg: #120a05;
  --tv-gold: #e2bf6e;
  --tv-gold-2: #c9a24d;
  --tv-gold-hi: #fbe8b0;
  --tv-ink: #f5ecd6;
  --tv-muted: #cbbba0;
  --tv-good: #63e6a8;
  --tv-display: 'Cinzel', Georgia, serif;
  --tv-ui: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
  --t-bg: #140b05;
  --t-sheet: linear-gradient(180deg, #3a2414, #1c0f06);
  --t-btn: linear-gradient(180deg, #5a3519, #321b0b);
  --t-felt: radial-gradient(120% 120% at 50% 35%, #2a5a40 0%, #173826 55%, #0d2217 100%);
  --t-felt-edge: #6b4426;
  --t-display: 'Cinzel', Georgia, serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(120% 90% at 50% 25%, #2b190c 0%, #170c05 55%, #080402 100%) fixed var(--tv-bg);
  color: var(--tv-ink);
  font-family: var(--tv-ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  touch-action: manipulation;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; }
.hidden { display: none !important; }
.tv-game { position: fixed; inset: 0; overflow: hidden; }

/* ---------------- üst çubuk ---------------- */
.tv-hud {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 52px;
  padding: 0 max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  z-index: 60;
  background: linear-gradient(180deg, rgba(12, 6, 2, 0.94), rgba(12, 6, 2, 0.66));
  border-bottom: 1px solid rgba(226, 191, 110, 0.2);
}
.tv-hud-l, .tv-hud-r { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tv-hud-c { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; }
.tv-info { display: flex; flex-direction: column; line-height: 1.1; }
.tv-info b { font-family: var(--tv-display); font-size: 17px; letter-spacing: 0.06em; color: var(--tv-gold); }
.tv-info span { font-size: 11.5px; color: var(--tv-muted); white-space: nowrap; }
.tv-ib { position: relative; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; border: 1px solid rgba(226, 191, 110, 0.22); background: rgba(255, 255, 255, 0.04); color: var(--tv-gold-hi); cursor: pointer; }
.tv-ib:hover { background: rgba(226, 191, 110, 0.12); }
.tv-ib .t-badge { position: absolute; top: -4px; right: -4px; }
.tv-msg { display: inline-block; padding: 6px 14px; border-radius: 99px; font-weight: 750; font-size: 13px; white-space: nowrap; background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.08); color: var(--tv-muted); }
.tv-msg.me { color: #062a1b; background: linear-gradient(180deg, #8ef0c0, #3fcf8a); border-color: transparent; box-shadow: 0 0 18px rgba(80, 230, 160, 0.45); animation: tvPulse 1.6s ease-in-out infinite; }
@keyframes tvPulse { 50% { box-shadow: 0 0 6px rgba(80, 230, 160, 0.25); } }
@media (max-width: 520px) {
  .tv-info span { display: none; }
  .tv-hud-c { left: auto; right: 50%; transform: translate(50%, -50%); }
  .tv-ib { width: 34px; height: 34px; }
  .tv-msg { font-size: 12px; padding: 5px 10px; }
}
@media (max-width: 380px) { .tv-hud-c { display: none; } }

/* ---------------- tahta ---------------- */
.tv-board {
  position: absolute;
  left: 0;
  top: 0;
  width: 1040px;
  height: 660px;
  transform-origin: 0 0;
  border-radius: 26px;
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(0, 0, 0, 0.6);
}
.tv-svg { position: absolute; inset: 0; display: block; border-radius: 26px; }
.tv-hits { position: absolute; inset: 0; z-index: 2; }
.hit, .hit-bar, .hit-tray { position: absolute; border-radius: 10px; cursor: pointer; }
.hit.is-src::after {
  content: '';
  position: absolute;
  left: 22%;
  right: 22%;
  height: 7px;
  border-radius: 99px;
  background: var(--tv-good);
  box-shadow: 0 0 14px rgba(99, 230, 168, 0.8);
  opacity: 0.85;
}
.hit.bot.is-src::after { bottom: -15px; }
.hit.top.is-src::after { top: -15px; }
.hit.is-dst { background: radial-gradient(60% 45% at 50% var(--dy, 80%), rgba(255, 224, 140, 0.42), rgba(255, 224, 140, 0) 80%); box-shadow: inset 0 0 0 2px rgba(255, 224, 140, 0.55); animation: tvDst 1s ease-in-out infinite; }
.hit.top.is-dst { --dy: 20%; }
.hit-tray.is-dst { background: rgba(255, 224, 140, 0.18); box-shadow: inset 0 0 0 2px rgba(255, 224, 140, 0.7); animation: tvDst 1s ease-in-out infinite; }
.hit-bar.is-src { box-shadow: inset 0 0 0 2px rgba(99, 230, 168, 0.7); }
@keyframes tvDst { 50% { box-shadow: inset 0 0 0 2px rgba(255, 224, 140, 0.2); } }

/* taşlar */
.tv-ck-layer { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.ck {
  position: absolute;
  left: 0;
  top: 0;
  border-radius: 50%;
  transition-property: transform;
  transition-timing-function: cubic-bezier(0.25, 0.8, 0.25, 1);
  will-change: transform;
  pointer-events: auto;
  cursor: pointer;
}
.ck::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35), 0 7px 12px rgba(0, 0, 0, 0.45);
}
.ck-w { background: radial-gradient(circle at 34% 30%, #fffdf6 0%, #f1e6cf 40%, #d6c4a0 78%, #b9a47c 100%); }
.ck-k { background: radial-gradient(circle at 34% 30%, #6a4a3a 0%, #3a241a 40%, #1d110b 78%, #0d0705 100%); }
.ck::after {
  content: '';
  position: absolute;
  inset: 13%;
  border-radius: 50%;
  border: 2px solid rgba(201, 162, 77, 0.75);
  box-shadow: inset 0 0 0 4px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(255, 255, 255, 0.12);
}
.ck-k::after { border-color: rgba(226, 191, 110, 0.6); box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.04); }
.ck i { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-weight: 900; font-size: 22px; z-index: 2; color: #2a1408; }
.ck-k i { color: #f5dfae; }
.ck.is-sel { filter: drop-shadow(0 0 10px rgba(255, 220, 120, 0.95)); }
.ck.is-sel::after { border-color: #fff1b8; border-width: 3px; }
.ck.is-off::before { box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
.ck.is-off::after { display: none; }

/* zarlar */
.tv-dice { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.dice-g { position: absolute; transform: translate(-50%, -50%); display: flex; gap: 18px; align-items: center; }
.dice-x { position: absolute; left: 50%; top: 100%; margin-top: 10px; transform: translateX(-50%); padding: 3px 10px; border-radius: 99px; font-weight: 850; font-size: 15px; color: #2a1406; background: linear-gradient(180deg, var(--tv-gold-hi), var(--tv-gold-2)); white-space: nowrap; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); }
.die {
  width: 62px;
  height: 62px;
  border-radius: 14px;
  background: linear-gradient(145deg, #fffef8 0%, #f3ead6 55%, #d9c9a6 100%);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.12), inset 0 2px 0 rgba(255, 255, 255, 0.8), 0 10px 18px rgba(0, 0, 0, 0.5);
  transition: opacity 0.25s, transform 0.25s, filter 0.25s;
}
.die.used { opacity: 0.38; transform: scale(0.88); filter: grayscale(0.4); }
.die-f { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 100%; height: 100%; padding: 9px; gap: 2px; }
.die-f span { width: 12px; height: 12px; margin: auto; border-radius: 50%; }
.die-f span.on { background: radial-gradient(circle at 35% 35%, #4a3a30, #120b07 70%); box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.6); }
.die-f span.on.red { background: radial-gradient(circle at 35% 35%, #e04050, #8a0f1c 70%); width: 15px; height: 15px; }
.die.rolling { animation: tvRoll 0.62s cubic-bezier(0.2, 0.6, 0.3, 1) both; }
.die.rolling.r1 { animation-delay: 0.06s; }
@keyframes tvRoll {
  0% { transform: translate(-90px, -40px) rotate(-200deg) scale(0.6); opacity: 0; filter: blur(2px); }
  45% { transform: translate(10px, 8px) rotate(30deg) scale(1.08); opacity: 1; filter: blur(0.6px); }
  70% { transform: translate(-4px, -3px) rotate(-8deg) scale(0.98); }
  100% { transform: none; filter: none; }
}
.dice-g.op .die.rolling { animation-name: tvRollR; }
@keyframes tvRollR {
  0% { transform: translate(90px, 40px) rotate(200deg) scale(0.6); opacity: 0; filter: blur(2px); }
  45% { transform: translate(-10px, -8px) rotate(-30deg) scale(1.08); opacity: 1; }
  70% { transform: translate(4px, 3px) rotate(8deg); }
  100% { transform: none; filter: none; }
}
.dice-g.open .die.c0::after, .dice-g.open .die.c1::after { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 6px; font-size: 13px; font-weight: 800; color: var(--tv-gold-hi); white-space: nowrap; }
.dice-g.open .die { position: relative; }
.dice-g.open .die.c0::after { content: 'Beyaz'; }
.dice-g.open .die.c1::after { content: 'Siyah'; }

/* ---------------- oyuncu yuvaları ---------------- */
.tv-pod { position: absolute; transform: translate(-50%, -50%); z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.tv-pod.row { flex-direction: row; gap: 10px; }
.tv-pod.row .tv-tag { align-items: flex-start; }
.tv-av { position: relative; width: var(--av); height: var(--av); display: grid; place-items: center; border-radius: 50%; pointer-events: auto; cursor: pointer; }
.tv-ring { position: absolute; inset: -7px; width: calc(100% + 14px); height: calc(100% + 14px); transform: rotate(-90deg); pointer-events: none; }
.tv-ring circle { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 4; }
.tv-ring .tv-ring-t { stroke: var(--tv-gold); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; }
.tv-pod.has-timer .tv-ring-t { opacity: 1; }
@keyframes tvRing { 0% { stroke-dashoffset: 0; stroke: #8ef0c0; } 60% { stroke: var(--tv-gold); } 100% { stroke-dashoffset: 100; stroke: #ff6b5b; } }
.tv-av > .tv-av-in, .tv-av > .t-av:not(.has-frame) { border-radius: 50%; box-shadow: 0 0 0 2px rgba(226, 191, 110, 0.55), 0 6px 16px rgba(0, 0, 0, 0.5); }
.tv-av-in { display: grid; place-items: center; font-family: var(--tv-display); font-weight: 800; color: #fff4dc; background: radial-gradient(circle at 35% 30%, #8a5a32, #3a2010 70%); }
.tv-pod.is-turn .tv-av::before { content: ''; position: absolute; inset: -12px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 214, 110, 0.4), transparent 75%); animation: tvGlow 1.4s ease-in-out infinite; pointer-events: none; }
@keyframes tvGlow { 50% { opacity: 0.45; transform: scale(0.94); } }
.tv-pod.is-away { opacity: 0.6; }
.tv-color { position: absolute; right: -4px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c9a24d; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5); }
.tv-color.c0 { background: radial-gradient(circle at 35% 30%, #fffdf6, #d6c4a0); }
.tv-color.c1 { background: radial-gradient(circle at 35% 30%, #6a4a3a, #1d110b); }
.tv-tag { display: flex; flex-direction: column; align-items: center; gap: 3px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7); }
.tv-name { font-size: 13px; font-weight: 800; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tv-name small { font-weight: 600; opacity: 0.7; }
.tv-meta { display: flex; gap: 5px; }
.tv-score, .tv-pip { display: inline-flex; align-items: baseline; gap: 3px; padding: 1px 8px; border-radius: 99px; font-size: 11px; color: var(--tv-muted); background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(226, 191, 110, 0.26); }
.tv-score i, .tv-pip i { font-style: normal; font-weight: 900; font-size: 13px; color: var(--tv-gold-hi); }

/* ---------------- eylem düğmeleri ---------------- */
.tv-actions { position: absolute; z-index: 50; display: flex; align-items: center; gap: 8px; transform: translate(0, -50%); }
.tv-actions.below { transform: translate(-50%, 0); flex-direction: column; }
.tv-actions .tv-btn { min-height: 38px; padding: 0 12px; font-size: 13.5px; }
.tv-commit { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; border-radius: 14px; background: rgba(20, 10, 4, 0.92); border: 1px solid rgba(226, 191, 110, 0.4); overflow: hidden; font-weight: 700; font-size: 13px; }
.tv-commit i { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--tv-gold); transform-origin: 0 50%; transform: scaleX(0); }
.tv-commit.go i { animation: tvBar 1.1s linear forwards; }
@keyframes tvBar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
body.tv-port .tv-actions .tv-commit span, body.tv-port #undoBtn span { display: none; }
body.tv-port #undoBtn { width: 40px; padding: 0; }
.tv-actions .tv-btn, .tv-commit { white-space: nowrap; }

/* ---------------- efektler, bildirimler, pencereler ---------------- */
.tv-fx { position: absolute; inset: 0; z-index: 70; pointer-events: none; }
.tv-banner { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; animation: tvBanner 0.55s cubic-bezier(0.2, 1.4, 0.3, 1) both; }
.tv-banner-t { font-family: var(--tv-display); font-weight: 900; font-size: clamp(34px, 8vmin, 76px); letter-spacing: 0.05em; background: linear-gradient(180deg, #fff8dc 10%, #f7d27a 45%, #b07a22 80%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(255, 200, 90, 0.7)) drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6)); white-space: nowrap; }
.tv-banner-s { padding: 3px 12px; border-radius: 99px; font-weight: 850; font-size: 14px; color: #2a1a06; background: linear-gradient(180deg, var(--tv-gold-hi), var(--tv-gold-2)); }
.tv-banner.out { animation: tvBannerOut 0.35s ease-in forwards; }
@keyframes tvBanner { from { opacity: 0; transform: translate(-50%, -50%) scale(0.35) rotate(-6deg); } }
@keyframes tvBannerOut { to { opacity: 0; transform: translate(-50%, -64%) scale(1.15); } }
.tv-net { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); z-index: 80; padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; background: rgba(150, 40, 30, 0.85); }
.tv-toasts { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3000; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; width: min(92vw, 420px); }
.tv-toast { padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 650; text-align: center; background: rgba(22, 12, 5, 0.94); border: 1px solid rgba(226, 191, 110, 0.32); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); animation: tvToastIn 0.25s ease-out; }
.tv-toast.err { border-color: rgba(255, 122, 107, 0.6); color: #ffd6cf; }
.tv-toast.good { border-color: rgba(99, 230, 168, 0.6); color: #d6ffe9; }
.tv-toast.out { opacity: 0; transform: translateY(-6px); transition: opacity 0.3s, transform 0.3s; }
@keyframes tvToastIn { from { opacity: 0; transform: translateY(-8px); } }
.tv-modal { position: fixed; inset: 0; z-index: 2500; display: grid; place-items: center; padding: 16px; background: rgba(6, 3, 1, 0.62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: tvFade 0.2s ease-out; }
@keyframes tvFade { from { opacity: 0; } }
.tv-mbox { width: min(520px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 20px 20px 16px; border-radius: 22px; background: linear-gradient(180deg, #3a2414, #1c0f06); border: 1px solid rgba(226, 191, 110, 0.38); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); animation: tvPop 0.28s cubic-bezier(0.2, 1.2, 0.3, 1); }
@keyframes tvPop { from { opacity: 0; transform: translateY(12px) scale(0.96); } }
.tv-mbox h2 { margin: 0 0 4px; font-family: var(--tv-display); font-size: 22px; color: var(--tv-gold-hi); }
.tv-sub { margin: 0 0 10px; color: var(--tv-muted); font-size: 13.5px; }
.tv-sub b { color: var(--tv-gold-hi); }
.tv-mact { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 14px; align-items: center; }
.tv-mact.col { flex-direction: column; align-items: stretch; }
.tv-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(226, 191, 110, 0.35); background: linear-gradient(180deg, #5a3519, #321b0b); color: var(--tv-gold-hi); font-weight: 750; cursor: pointer; }
.tv-btn:hover { filter: brightness(1.12); }
.tv-btn.gold { color: #2a1406; border-color: transparent; background: linear-gradient(180deg, #f6dd98, #c99a3d 55%, #9c7427); box-shadow: 0 6px 18px rgba(201, 154, 61, 0.35); }
.tv-btn.danger { color: #ffd6cf; border-color: rgba(255, 122, 107, 0.5); background: linear-gradient(180deg, #5a1a14, #3a0f0b); }
.tv-btn.big { min-height: 50px; font-size: 16px; width: 100%; }
.tv-btn.sm { min-height: 32px; padding: 0 12px; font-size: 13px; }
.tv-opt { display: flex; align-items: center; gap: 10px; padding: 9px 2px; font-weight: 600; cursor: pointer; }
.tv-opt input { width: 18px; height: 18px; accent-color: var(--tv-gold-2); }
.tv-rules p { margin: 0 0 9px; line-height: 1.5; font-size: 14px; color: #ecdfc8; }
.tv-score-big { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 12px 0; }
.tv-score-big span { display: flex; flex-direction: column; align-items: center; font-size: 13px; color: var(--tv-muted); }
.tv-score-big b { font-family: var(--tv-display); font-size: 44px; color: var(--tv-gold-hi); line-height: 1; }
.tv-score-big i { font-style: normal; font-size: 28px; color: var(--tv-muted); }
.tv-over-head { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--tv-gold); text-align: center; }
.rw-slot:empty { display: none; }
.rw-slot { margin-top: 12px; }

/* ---------------- başlangıç ---------------- */
.tv-screen { position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.tv-start { max-width: 860px; margin: 0 auto; padding: 28px 16px 40px; text-align: center; }
.tv-logo { position: relative; display: flex; justify-content: center; align-items: center; gap: 10px; height: 92px; }
.tv-logo .ck { position: relative; width: 62px; height: 62px; }
.tv-logo .ck-k { margin-left: -22px; transform: translateY(8px); }
.tv-logo .die { width: 48px; height: 48px; border-radius: 11px; }
.tv-logo .die .die-f { padding: 7px; }
.tv-logo .die .die-f span { width: 9px; height: 9px; }
.tv-logo .die:first-of-type { transform: rotate(-12deg); }
.tv-logo .die:last-of-type { transform: rotate(9deg) translateY(6px); }
.tv-start h1 { margin: 6px 0 2px; font-family: var(--tv-display); font-size: clamp(40px, 9vw, 64px); letter-spacing: 0.08em; color: var(--tv-gold); text-shadow: 0 0 30px rgba(226, 191, 110, 0.35); }
.tv-lead { margin: 0 auto 22px; max-width: 470px; color: var(--tv-muted); }
.tv-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; text-align: left; }
.tv-card { padding: 18px; border-radius: 20px; background: linear-gradient(180deg, rgba(122, 75, 40, 0.3), rgba(28, 15, 6, 0.6)); border: 1px solid rgba(226, 191, 110, 0.24); display: flex; flex-direction: column; gap: 10px; }
.tv-card h2 { margin: 0 0 4px; font-family: var(--tv-display); font-size: 20px; color: var(--tv-gold-hi); }
.tv-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tv-row > span { color: var(--tv-muted); font-size: 13px; font-weight: 650; min-width: 52px; }
.tv-seg { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

<script>
/* ---- engine.js ---- */
/* =====================================================================
   TAVLA · Oyun motoru (kurallar, hamle üretimi, maç puanı)
   Mutlak noktalar 1–24. 0. oyuncu (beyaz) 24 → 1 yönünde ilerler, evi 1–6;
   1. oyuncu (siyah) 1 → 24 yönünde ilerler, evi 19–24.
   b[i] > 0: beyaz taş sayısı, b[i] < 0: siyah taş sayısı.
   Zarlar online masada sunucuda atılır (hamle verisinde d: [a, b]):
   'open' başlangıç zarı, 'move' hamle + sıradakinin zarı, 'roll' (pas sonrası), 'next' yeni oyun.
   ===================================================================== */
(function () {
  'use strict';
  const START = (() => {
    const b = new Array(26).fill(0);
    b[24] = 2;
    b[13] = 5;
    b[8] = 3;
    b[6] = 5;
    b[1] = -2;
    b[12] = -5;
    b[17] = -3;
    b[19] = -5;
    return b;
  })();
  const sgn = (p) => (p === 0 ? 1 : -1);
  const mine = (b, i, p) => (p === 0 ? b[i] > 0 : b[i] < 0);
  const count = (b, i) => Math.abs(b[i]);
  const opp = (p) => 1 - p;
  /** Oyuncuya göre konum: 1 (eve en yakın) … 24; bar 25, dışarı 0 */
  const posOf = (p, a) => (p === 0 ? a : 25 - a);
  const absOf = (p, pos) => (p === 0 ? pos : 25 - pos);

  function newBoard() {
    return { b: START.slice(), bar: [0, 0], off: [0, 0] };
  }
  function cloneBoard(x) {
    return { b: x.b.slice(), bar: x.bar.slice(), off: x.off.slice() };
  }
  const keyOf = (x) => x.b.join(',') + '|' + x.bar.join(',') + '|' + x.off.join(',');

  function allHome(x, p) {
    if (x.bar[p]) return false;
    for (let a = 1; a <= 24; a++) {
      if (mine(x.b, a, p) && posOf(p, a) > 6) return false;
    }
    return true;
  }
  /** Tek zarla yapılabilecek tek taş hamleleri: {from, to, d, hit}; from 25 = bar, to 0 = dışarı (oyuncuya göre konum) */
  function singleMoves(x, p, d) {
    const out = [];
    const blocked = (a) => (p === 0 ? x.b[a] <= -2 : x.b[a] >= 2);
    const hitAt = (a) => (p === 0 ? x.b[a] === -1 : x.b[a] === 1);
    if (x.bar[p]) {
      const a = absOf(p, 25 - d);
      if (!blocked(a)) out.push({ from: 25, to: 25 - d, d, hit: hitAt(a) });
      return out;
    }
    const home = allHome(x, p);
    let far = 0; // evdeki en uzak taş (oyuncuya göre)
    if (home) for (let pos = 6; pos >= 1; pos--) if (mine(x.b, absOf(p, pos), p)) { far = pos; break; }
    for (let pos = 24; pos >= 1; pos--) {
      const a = absOf(p, pos);
      if (!mine(x.b, a, p)) continue;
      const t = pos - d;
      if (t >= 1) {
        const ta = absOf(p, t);
        if (!blocked(ta)) out.push({ from: pos, to: t, d, hit: hitAt(ta) });
      } else if (home) {
        // taş toplama: tam zar ya da daha uzakta taş yoksa büyük zarla
        if (t === 0 || pos === far) out.push({ from: pos, to: 0, d, hit: false });
      }
    }
    return out;
  }
  function applySingle(x, p, m) {
    const s = sgn(p);
    if (m.from === 25) x.bar[p] -= 1;
    else x.b[absOf(p, m.from)] -= s;
    if (m.to === 0) x.off[p] += 1;
    else {
      const ta = absOf(p, m.to);
      if (x.b[ta] === -s) {
        x.b[ta] = 0;
        x.bar[opp(p)] += 1;
      }
      x.b[ta] += s;
    }
    return x;
  }
  const diceKey = (ds) => ds.slice().sort((a, b) => a - b).join('');
  function removeDie(ds, d) {
    const i = ds.indexOf(d);
    return i < 0 ? ds.slice() : ds.slice(0, i).concat(ds.slice(i + 1));
  }
  /** Bu konumda bu zarlarla en çok kaç zar oynanabilir */
  function maxDepth(x, p, ds, memo) {
    if (!ds.length) return 0;
    memo = memo || new Map();
    const k = keyOf(x) + '#' + diceKey(ds);
    if (memo.has(k)) return memo.get(k);
    let best = 0;
    const seen = new Set();
    for (const d of ds) {
      if (seen.has(d)) continue;
      seen.add(d);
      const rest = removeDie(ds, d);
      for (const m of singleMoves(x, p, d)) {
        const v = 1 + maxDepth(applySingle(cloneBoard(x), p, m), p, rest, memo);
        if (v > best) best = v;
        if (best === ds.length) break;
      }
      if (best === ds.length) break;
    }
    memo.set(k, best);
    return best;
  }
  /**
   * Kurallara uygun tek adımlar: en çok zarı kullanan dizilerin ilk adımları; turun başında yalnız
   * bir zar oynanabiliyorsa büyük zar (oynanabiliyorsa) zorunlu.
   */
  function legalSteps(x, p, ds, memo) {
    memo = memo || new Map();
    const need = maxDepth(x, p, ds, memo);
    if (!need) return [];
    let out = [];
    const seen = new Set();
    for (const d of ds) {
      if (seen.has(d)) continue;
      seen.add(d);
      const rest = removeDie(ds, d);
      for (const m of singleMoves(x, p, d)) {
        if (1 + maxDepth(applySingle(cloneBoard(x), p, m), p, rest, memo) === need) out.push(m);
      }
    }
    if (need === 1 && ds.length === 2 && ds[0] !== ds[1]) {
      const big = Math.max(ds[0], ds[1]);
      if (out.some((m) => m.d === big)) out = out.filter((m) => m.d === big);
    }
    return out;
  }
  /** Bütün farklı son konumlar ve onlara götüren diziler (bot için) */
  function finals(x, p, ds) {
    const memo = new Map();
    const res = new Map();
    const need = maxDepth(x, p, ds, memo);
    function rec(y, rest, path) {
      if (path.length === need) {
        const k = keyOf(y);
        if (!res.has(k)) res.set(k, { x: y, seq: path });
        return;
      }
      for (const m of legalSteps(y, p, rest, memo)) rec(applySingle(cloneBoard(y), p, m), removeDie(rest, m.d), path.concat([m]));
    }
    rec(cloneBoard(x), ds.slice(), []);
    return Array.from(res.values());
  }
  function pips(x, p) {
    let s = x.bar[p] * 25;
    for (let a = 1; a <= 24; a++) if (mine(x.b, a, p)) s += count(x.b, a) * posOf(p, a);
    return s;
  }
  const diceList = (d) => (d[0] === d[1] ? [d[0], d[0], d[0], d[0]] : [d[0], d[1]]);
  const validDie = (v) => Number.isInteger(v) && v >= 1 && v <= 6;

  /* ---------------- maç durumu ---------------- */
  function newGame(o) {
    const st = {
      v: 1,
      names: (o.names || ['Beyaz', 'Siyah']).slice(0, 2),
      target: [1, 3, 5, 7].indexOf(+o.target) >= 0 ? +o.target : 3,
      seed: o.seed >>> 0 || 1,
      score: [0, 0],
      game: 1,
      x: newBoard(),
      cur: 0,
      dice: null, // atılan zar [a, b]
      left: [], // kalan zarlar
      phase: 'open', // open | move | roll | gameEnd | over
      turnNo: 0,
      last: null, // son oyunun sonucu {winner, pts, mars}
      hist: [],
      moves: 0,
    };
    return st;
  }
  const clone = (st) => JSON.parse(JSON.stringify(st));
  function fail(why) {
    return { ok: false, why };
  }
  function dataDice(a) {
    const d = a && a.data && a.data.d;
    if (!Array.isArray(d) || d.length !== 2 || !validDie(+d[0]) || !validDie(+d[1])) return null;
    return [+d[0], +d[1]];
  }
  /** Sıradaki oyuncuya zar ver; oynayacak hamlesi yoksa pas geçer (sıra karşıya 'roll' bekleyerek döner) */
  function giveDice(st, p, d, ev) {
    st.cur = p;
    st.dice = d.slice();
    st.left = diceList(d);
    ev.push({ t: 'dice', seat: p, d: d.slice() });
    if (!legalSteps(st.x, p, st.left).length) {
      ev.push({ t: 'pass', seat: p, d: d.slice() });
      st.cur = opp(p);
      st.dice = null;
      st.left = [];
      st.phase = 'roll';
    } else st.phase = 'move';
  }
  function startGame(st, d, ev) {
    st.x = newBoard();
    st.dice = null;
    st.left = [];
    const first = d[0] > d[1] ? 0 : 1;
    ev.push({ t: 'open', d: d.slice(), first, game: st.game });
    giveDice(st, first, d, ev);
  }
  function endGame(st, p, ev) {
    const mars = st.x.off[opp(p)] === 0;
    const pts = mars ? 2 : 1;
    st.score[p] += pts;
    st.last = { winner: p, pts, mars, game: st.game };
    st.hist.push(st.last);
    st.dice = null;
    st.left = [];
    ev.push({ t: 'win', seat: p, pts, mars, score: st.score.slice() });
    if (st.score[p] >= st.target) {
      st.phase = 'over';
      ev.push({ t: 'over', winner: p });
    } else st.phase = 'gameEnd';
  }

  /**
   * Hamle uygula: a = { seat, kind, data }.
   *  open (seat null): data.d başlangıç zarı (farklı iki değer; büyüğü atan başlar ve iki zarı da oynar)
   *  move (seat = sıradaki): data.m = [[from, to], …] (oyuncuya göre konum), data.d = sıradakinin zarı
   *  roll (seat = sıradaki): pas sonrası zar
   *  next (seat null): yeni oyun, data.d başlangıç zarı
   */
  function apply(st, a) {
    const ev = [];
    if (!a || !st) return fail('none');
    const d = dataDice(a);
    if (a.kind === 'open') {
      if (st.phase !== 'open' || !d || d[0] === d[1]) return fail('phase');
      startGame(st, d, ev);
      st.turnNo += 1;
      return { ok: true, ev };
    }
    if (a.kind === 'next') {
      if (st.phase !== 'gameEnd' || !d || d[0] === d[1]) return fail('phase');
      st.game += 1;
      startGame(st, d, ev);
      st.turnNo += 1;
      return { ok: true, ev };
    }
    if (a.kind === 'roll') {
      if (st.phase !== 'roll' || a.seat !== st.cur || !d) return fail('phase');
      giveDice(st, st.cur, d, ev);
      st.turnNo += 1;
      return { ok: true, ev };
    }
    if (a.kind === 'move') {
      if (st.phase !== 'move' || a.seat !== st.cur) return fail('phase');
      const p = st.cur;
      const seq = a.data && Array.isArray(a.data.m) ? a.data.m : null;
      if (!seq || !seq.length) return fail('seq');
      // doğrula: her adım kurallara uygun ilk adım olmalı, sonunda oynanabilecek zar kalmamalı
      let x = cloneBoard(st.x);
      let left = st.left.slice();
      const steps = [];
      const memo = new Map();
      for (const s of seq) {
        if (!Array.isArray(s) || s.length < 2) return fail('step');
        const ok = legalSteps(x, p, left, memo).find((m) => m.from === +s[0] && m.to === +s[1] && (s[2] == null || m.d === +s[2]));
        if (!ok) return fail('illegal');
        steps.push(ok);
        x = applySingle(x, p, ok);
        left = removeDie(left, ok.d);
      }
      if (legalSteps(x, p, left, memo).length) return fail('incomplete');
      st.x = x;
      st.left = [];
      st.moves += 1;
      st.turnNo += 1;
      ev.push({ t: 'move', seat: p, steps, d: st.dice ? st.dice.slice() : null });
      if (x.off[p] >= 15) {
        endGame(st, p, ev);
        return { ok: true, ev };
      }
      if (!d) {
        // zar gelmediyse (eski kayıt) sıradaki oyuncu zar atar
        st.cur = opp(p);
        st.dice = null;
        st.phase = 'roll';
        return { ok: true, ev };
      }
      giveDice(st, opp(p), d, ev);
      return { ok: true, ev };
    }
    return fail('kind');
  }
  function ranking(st) {
    return [0, 1].map((seat) => ({ seat, total: st.score[seat] })).sort((a, b) => b.total - a.total || a.seat - b.seat);
  }

  /* ---------------- yerel zar (botlara karşı, bu cihazda) ---------------- */
  function randDice(distinct) {
    for (;;) {
      const a = 1 + Math.floor(Math.random() * 6);
      const b = 1 + Math.floor(Math.random() * 6);
      if (!distinct || a !== b) return [a, b];
    }
  }

  window.TV = {
    START,
    posOf,
    absOf,
    mine,
    newBoard,
    cloneBoard,
    singleMoves,
    applySingle,
    legalSteps,
    maxDepth,
    finals,
    pips,
    allHome,
    removeDie,
    diceList,
    newGame,
    clone,
    apply,
    ranking,
    randDice,
    opp,
  };
})();

/* ---- ai.js ---- */
/* =====================================================================
   TAVLA · Bot (yapay zekâ)
   Bütün farklı son konumları değerlendirir: pip farkı, açık taş riski
   (rakibin vuruş zarları), kapılar ve blok, evdeki kapılar, kırılan taşlar,
   toplanan taşlar. Yarış durumunda (temas yok) yalnız pip ve toplama.
   Kolay: iyi hamlelerden rastgele; Orta: en iyi (küçük sapma); Zor: en iyi.
   ===================================================================== */
(function () {
  'use strict';
  const TV = window.TV;
  // tek mesafeye vuruş olasılığı (36 zar kombinasyonu üzerinden, engelsiz yaklaşık)
  const SHOT = [0, 11, 12, 14, 15, 15, 17, 6, 6, 5, 3, 2, 3, 0, 0, 1, 1, 0, 1, 0, 1, 0, 0, 0, 1];
  function contact(x) {
    // beyazın en geri taşı siyahın en geri taşını geçmişse temas yoktur
    let wBack = 0;
    let bBack = 25;
    for (let a = 1; a <= 24; a++) {
      if (x.b[a] > 0) wBack = Math.max(wBack, a);
      if (x.b[a] < 0) bBack = Math.min(bBack, a);
    }
    if (x.bar[0]) wBack = 25;
    if (x.bar[1]) bBack = 0;
    return wBack > bBack;
  }
  /** p'nin açık taşlarına rakibin vuruş riski (kaybedilecek pip ağırlıklı) */
  function blotRisk(x, p) {
    const o = 1 - p;
    let risk = 0;
    for (let a = 1; a <= 24; a++) {
      const n = p === 0 ? x.b[a] : -x.b[a];
      if (n !== 1) continue;
      let miss = 1;
      // rakip taşları (ve bar) bu taşın arkasında mı?
      const dists = [];
      if (x.bar[o]) dists.push(p === 0 ? a : 25 - a);
      for (let c = 1; c <= 24; c++) {
        const own = o === 0 ? x.b[c] > 0 : x.b[c] < 0;
        if (!own) continue;
        const dist = o === 1 ? a - c : c - a;
        if (dist > 0) dists.push(dist);
      }
      dists.forEach((dd) => {
        if (dd < SHOT.length && SHOT[dd]) miss *= 1 - SHOT[dd] / 36;
      });
      const prob = 1 - miss;
      const pos = TV.posOf(p, a);
      risk += prob * (25 - pos + 4);
    }
    return risk;
  }
  function evaluate(x, p, deep) {
    const o = 1 - p;
    const myP = TV.pips(x, p);
    const opP = TV.pips(x, o);
    let s = (opP - myP) * 1.0;
    s += x.off[p] * 6 - x.off[o] * 6;
    if (!contact(x)) {
      // yarış: toplama ve pip
      return s * 1.5 + x.off[p] * 6;
    }
    s -= blotRisk(x, p) * (deep ? 1.05 : 0.85);
    s += x.bar[o] * (deep ? 11 : 9);
    s -= x.bar[p] * 10;
    // kapılar (iki ve üstü taş), evdeki kapılar, art arda kapılar (blok)
    let run = 0;
    let bestRun = 0;
    let homeClosed = 0;
    for (let pos = 1; pos <= 24; pos++) {
      const a = TV.absOf(p, pos);
      const n = p === 0 ? x.b[a] : -x.b[a];
      if (n >= 2) {
        run += 1;
        bestRun = Math.max(bestRun, run);
        if (pos <= 6) {
          homeClosed += 1;
          s += pos >= 4 ? 3.2 : 2.4;
        } else if (pos <= 9) s += 2.2;
        else if (pos >= 19) s += 1.6; // rakip evinde çapa
        else s += 1.1;
        if (n >= 4) s -= (n - 3) * 0.6; // fazla yığma
      } else run = 0;
    }
    s += bestRun * bestRun * (deep ? 0.9 : 0.7);
    s += homeClosed * x.bar[o] * 2.2;
    return s;
  }
  function choose(st, p, level) {
    if (st.phase !== 'move' || st.cur !== p) return null;
    const fins = TV.finals(st.x, p, st.left);
    if (!fins.length) return null;
    level = level || 'orta';
    const deep = level === 'zor';
    const scored = fins.map((f) => ({ f, v: evaluate(f.x, p, deep) + Math.random() * (level === 'kolay' ? 6 : deep ? 0.15 : 1.2) }));
    scored.sort((a, b) => b.v - a.v);
    let pick = scored[0];
    if (level === 'kolay' && scored.length > 2 && Math.random() < 0.35) pick = scored[Math.floor(Math.random() * Math.min(scored.length, Math.max(3, scored.length / 2)))];
    return pick.f.seq.map((m) => [m.from, m.to, m.d]);
  }
  window.TVAI = { choose, evaluate };
})();

/* ---- board.js ---- */
/* =====================================================================
   TAVLA · Tahta çizimi ve yerleşim (tasarım birimleri 1040 × 660)
   Ekranda "ben" her zaman altta: görünen nokta v = oyuncuya göre konum
   (1–6 sağ alt, 7–12 sol alt, 13–18 sol üst, 19–24 sağ üst). Toplanan taşlar
   sağdaki kutuda (benimkiler altta), kırılan taşlar ortadaki barda.
   ===================================================================== */
(function () {
  'use strict';
  const W = 1040;
  const H = 660;
  const M = 26; // çerçeve
  const TRAY = 74; // toplama kutusu
  const GAP = 10; // kutu ile alan arası
  const BAR = 58;
  const FW = (W - 2 * M - TRAY - GAP - BAR) / 2; // tek alanın genişliği
  const PW = FW / 6; // nokta genişliği
  const XL = M; // sol alan
  const XR = M + FW + BAR; // sağ alan
  const XB = M + FW; // bar sol kenarı
  const XT = W - M - TRAY; // kutu sol kenarı
  const TOP = M;
  const BOT = H - M;
  const PH = (BOT - TOP) * 0.42; // üçgen yüksekliği
  const CD = PW * 0.88; // taş çapı

  /** Görünen noktanın merkezi ve yönü: {x, y0 (taban), dir (+1 aşağı, -1 yukarı)} */
  function pointGeo(v) {
    if (v >= 1 && v <= 6) return { x: XR + (6 - v + 0.5) * PW, base: BOT, dir: -1 };
    if (v >= 7 && v <= 12) return { x: XL + (12 - v + 0.5) * PW, base: BOT, dir: -1 };
    if (v >= 13 && v <= 18) return { x: XL + (v - 13 + 0.5) * PW, base: TOP, dir: 1 };
    return { x: XR + (v - 19 + 0.5) * PW, base: TOP, dir: 1 };
  }
  /** Bir noktadaki k. taşın merkezi (n taş varsa sıkıştırılır) */
  function stackXY(v, k, n) {
    const g = pointGeo(v);
    const room = (BOT - TOP) / 2 - 6;
    const step = n > 5 ? Math.min(CD, (room - CD) / (n - 1)) : CD * 0.98;

  /** Bir adımı taş öğelerine işle; döndürür {mover, hit} */
  function stepLoc(p, m) {
    const from = m.from === 25 ? topAt(p, 'bar') : topAt(p, 'pt', TV.absOf(p, m.from));
    let hit = null;
    if (m.to !== 0) {
      const ta = TV.absOf(p, m.to);
      if (m.hit) {
        hit = topAt(1 - p, 'pt', ta);
        if (hit) G.loc.set(hit, { p: 1 - p, w: 'bar', t: ++G.seq });
      }
      if (from) G.loc.set(from, { p, w: 'pt', a: ta, t: ++G.seq });
    } else if (from) G.loc.set(from, { p, w: 'off', t: ++G.seq });
    return { mover: from, hit };
  }
  /** Taşların ekrandaki konumları */
  function placeCheckers(o) {
    o = o || {};
    const dur = reduceMotion ? 0 : o.dur || 0;
    const groups = new Map();
    for (const [id, l] of G.loc) {
      const key = l.w === 'pt' ? 'pt' + l.a : l.w + l.p;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(id);
    }
    for (const [key, list] of groups) {
      list.sort((a, b) => G.loc.get(a).t - G.loc.get(b).t);
      list.forEach((id, k) => {
        const l = G.loc.get(id);
        const n = $(`.ck[data-id="${id}"]`);
        let xy;
        let off = false;
        if (l.w === 'pt') xy = B.stackXY(TV.posOf(G.me, l.a), k, list.length);
        else if (l.w === 'bar') xy = B.barXY(l.p === G.me, k);
        else {
          xy = B.offXY(l.p === G.me, k);
          off = true;
        }
        const tr = `translate(${(xy.x - B.CD / 2).toFixed(1)}px, ${(xy.y - B.CD / 2).toFixed(1)}px)${off ? ' scale(1, .24)' : ''}`;
        const lift = o.lift && o.lift === id;
        n.style.transitionDuration = dur ? (lift ? dur + 'ms' : Math.round(dur * 0.85) + 'ms') : '0ms';
        n.style.zIndex = lift ? 500 : off ? 5 + k : 20 + k;
        if (n.__tr !== tr) {
          n.style.transform = tr;
          n.__tr = tr;
        }
        n.classList.toggle('is-off', off);
        // 5'ten fazla taş: en üstteki taşta sayı
        const cnt = !off && k === list.length - 1 && list.length > 5 ? list.length : 0;
        n.querySelector('i').textContent = cnt ? cnt : '';
      });
    }
  }

  /* =====================================================================
     ZARLAR
     ===================================================================== */
  const PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
  const dieFace = (v) => `<div class="die-f">${Array.from({ length: 9 }, (_, i) => `<span class="${(PIPS[v] || []).indexOf(i + 1) >= 0 ? 'on' : ''}${v === 1 ? ' red' : ''}"></span>`).join('')}</div>`;
  function paintDice(o) {
    o = o || {};
    const box = $('#dice');
    const st = G.st;
    const d = o.d || (st && st.dice);
    const seat = o.seat != null ? o.seat : st ? st.cur : 0;
    if (!d) {
      box.innerHTML = '';
      G.diceShown = null;
      return;
    }
    const meSide = seat === G.me;
    const cx = meSide ? B.XR + B.FW / 2 : B.XL + B.FW / 2;
    const left = o.left || (G.stage && seat === G.me ? G.stage.left : st && st.cur === seat && st.phase === 'move' ? st.left : []);
    const dbl = d[0] === d[1];
    // kullanılan zarlar soluk
    const rem = left.slice();
    const used = [false, false];
    if (!o.open) {
      if (dbl) {
        used[0] = rem.length <= 2;
        used[1] = rem.length <= 0;
      } else
        d.forEach((v, i) => {
          const k = rem.indexOf(v);
          if (k >= 0) rem.splice(k, 1);
          else used[i] = true;
        });
    }
    const key = d.join('-') + ':' + seat + ':' + (o.roll ? 'r' + Date.now() : '') + (o.open ? 'o' : '');
    const html = `<div class="dice-g ${meSide ? 'me' : 'op'}${o.open ? ' open' : ''}" style="left:${cx}px;top:${B.H / 2}px">
        ${d.map((v, i) => `<div class="die${used[i] ? ' used' : ''}${o.roll ? ' rolling r' + i : ''}${o.open ? ' c' + i : ''}" data-v="${v}">${dieFace(v)}</div>`).join('')}
        ${dbl && !o.open ? `<span class="dice-x">×2${left.length ? ` · ${left.length} hamle` : ''}</span>` : ''}
      </div>`;
    if (G.diceShown === key && !o.roll) {
      // yalnız soluk durumunu güncelle
      $$('.die', box).forEach((n, i) => n.classList.toggle('used', used[i]));
      const x = $('.dice-x', box);
      if (x && dbl) x.textContent = `×2${left.length ? ` · ${left.length} hamle` : ''}`;
      return;
    }
    G.diceShown = key;
    box.innerHTML = html;
  }

  /* =====================================================================
     VURGULAR VE ETKİLEŞİM
     ===================================================================== */
  function myTurn() {
    const s = G.st;
    return !!s && !G.spect && s.phase === 'move' && s.cur === G.me && !G.pending && (G.mode !== 'online' || (G.net && G.net.canAct()));
  }
  function canAct() {
    return myTurn() && !G.anim && !!G.stage;
  }
  function stepsNow() {
    if (!G.stage) return [];
    return TV.legalSteps(G.stage.x, G.me, G.stage.left);
  }
  function paintHints() {
    const hits = $('#hits');
    const act = canAct();
    const steps = act ? stepsNow() : [];
    const src = new Set(steps.map((m) => m.from));
    const dst = G.sel != null ? new Set(steps.filter((m) => m.from === G.sel).map((m) => m.to)) : new Set();
    $$('.hit', hits).forEach((h) => {
      const v = +h.dataset.v; // oyuncuya göre konum (ben altta)
      h.classList.toggle('is-src', act && G.set.hints && src.has(v) && G.sel == null);
      h.classList.toggle('is-sel', act && G.sel === v);
      h.classList.toggle('is-dst', act && dst.has(v));
    });
    const bar = $('.hit-bar', hits);
    bar.classList.toggle('is-src', act && src.has(25) && G.sel == null);
    bar.classList.toggle('is-sel', act && G.sel === 25);
    const tray = $('.hit-tray', hits);
    tray.classList.toggle('is-dst', act && dst.has(0));
    // seçili kaynağın en üst taşı parlar
    $$('.ck.is-sel').forEach((n) => n.classList.remove('is-sel'));
    if (act && G.sel != null) {
      const id = G.sel === 25 ? topAt(G.me, 'bar') : topAt(G.me, 'pt', TV.absOf(G.me, G.sel));
      const n = id && $(`.ck[data-id="${id}"]`);
      if (n) n.classList.add('is-sel');
    }
    $('#undoBtn').hidden = !(act || (G.stage && G.stage.steps.length && !G.pending)) || !G.stage || !G.stage.steps.length;
  }
  function buildHits() {
    const box = $('#hits');
    let h = '';
    for (let v = 1; v <= 24; v++) {
      const r = B.hitRect(v);
      h += `<div class="hit${r.y < B.H / 2 ? ' top' : ' bot'}" data-v="${v}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px"></div>`;
    }
    h += `<div class="hit-bar" data-v="25" style="left:${B.XB}px;top:${B.H / 2}px;width:${B.BAR}px;height:${B.BOT - B.H / 2}px"></div>`;
    h += `<div class="hit-tray" data-v="0" style="left:${B.XT}px;top:${B.H / 2}px;width:${B.TRAY}px;height:${B.BOT - B.H / 2}px"></div>`;
    box.innerHTML = h;
  }
  function onBoardClick(e) {
    SND.unlock();
    if (!canAct()) {
      if (G.st && !G.spect && e.target.closest('#board') && G.st.phase === 'move' && G.st.cur !== G.me) toast('Sıra rakipte', '');
      return;
    }
    const ck = e.target.closest('.ck');
    let v = null;
    if (ck) {
      const l = G.loc.get(ck.dataset.id);
      if (l && l.p === G.me) v = l.w === 'bar' ? 25 : l.w === 'pt' ? TV.posOf(G.me, l.a) : null;
      else if (l && l.w === 'pt') v = TV.posOf(G.me, l.a); // rakibin tek taşı: hedef olabilir
    }
    const h = e.target.closest('[data-v]');
    if (v == null && h) v = +h.dataset.v;
    if (v == null) {
      G.sel = null;
      return paintHints();
    }
    const steps = stepsNow();
    if (G.sel != null) {
      const m = steps.find((x) => x.from === G.sel && x.to === v);
      if (m) return doStep(m);
      if (v === G.sel) {
        G.sel = null;
        return paintHints();
      }
    }
    const from = steps.filter((x) => x.from === v);
    if (from.length) {
      const dests = Array.from(new Set(from.map((x) => x.to)));
      if (G.set.oneTap && dests.length === 1) return doStep(from[0]);
      G.sel = v;
      SND.play('pick');
      return paintHints();
    }
    if (steps.length && v !== 0) {
      SND.play('error');
      if (G.stage.x.bar[G.me]) toast('Önce kırık taşını oyuna sok', '');
    }
    G.sel = null;
    paintHints();
  }
  async function doStep(m) {
    const p = G.me;
    const st = G.stage;
    st.x = TV.applySingle(st.x, p, m);
    st.left = TV.removeDie(st.left, m.d);
    st.steps.push(m);
    G.sel = null;
    const r = stepLoc(p, m);
    placeCheckers({ dur: D(300), lift: r.mover });
    SND.play(m.to === 0 ? 'off' : m.hit ? 'hit' : 'move');
    paintDice({ seat: p, d: G.st.dice, left: st.left });
    paintPips();
    paintHints();
    if (!stepsNow().length) scheduleCommit();
  }
  function undo() {
    if (!G.stage || !G.stage.steps.length || G.pending) return;
    clearTimeout(G.commitT);
    const steps = G.stage.steps.slice(0, -1);
    beginStage();
    steps.forEach((m) => {
      G.stage.x = TV.applySingle(G.stage.x, G.me, m);
      G.stage.left = TV.removeDie(G.stage.left, m.d);
      G.stage.steps.push(m);
    });
    assignFresh(G.stage.x);
    placeCheckers({ dur: D(220) });
    paintDice({ seat: G.me, d: G.st.dice, left: G.stage.left });
    paintPips();
    paintHints();
    hideCommitBar();
  }
  function beginStage() {
    const st = G.st;
    G.stage = { x: TV.cloneBoard(st.x), steps: [], left: st.left.slice() };
    G.sel = null;
  }
  function scheduleCommit() {
    clearTimeout(G.commitT);
    const bar = $('#commitBar');
    bar.hidden = false;
    bar.classList.remove('go');
    void bar.offsetWidth;
    bar.classList.add('go');
    G.commitT = setTimeout(commit, D(1100));
  }
  function hideCommitBar() {
    const bar = $('#commitBar');
    bar.hidden = true;
    bar.classList.remove('go');
  }
  function commit() {
    clearTimeout(G.commitT);
    hideCommitBar();
    if (!G.stage || G.pending) return;
    const seq = G.stage.steps.map((m) => [m.from, m.to, m.d]);
    if (!seq.length) return;
    const a = { seat: G.me, kind: 'move', data: { m: seq } };
    G.committed = JSON.stringify(seq);
    if (G.mode === 'online') {
      G.pending = true;
      const r = G.net.dispatch(a, { later: true });
      if (!r || r.ok === false) {
        G.pending = false;
        toast((r && r.err) || 'Hamle gönderilemedi', 'err');
        resetVisual();
      }
      paintHints();
      return;
    }
    a.data.d = TV.randDice(false);
    a.at = now();
    applyUI(a, true);
  }

  /* =====================================================================
     OYUNCU YUVALARI, ÜST ÇUBUK
     ===================================================================== */
  function who(p) {
    if (G.mode === 'online' && G.net) return G.net.who(p);
    return { name: G.st.names[p], bot: p !== 0, me: p === 0, avatar_url: '', user_id: null, badge: null };
  }
  function avatarHTML(w, size) {
    if (NET && G.mode === 'online') return NET.avatar({ name: w.name, avatar_url: w.avatar_url, bot: w.bot && !w.away, badge: w.badge }, size);
    const ch = String(w.name || '?').trim().charAt(0).toLocaleUpperCase('tr-TR');
    return `<span class="tv-av-in" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.42)}px">${esc(ch)}</span>`;
  }
  function podHTML(p, pos) {
    const w = who(p);
    const L = G.lay;
    const size = L.pods.slim ? 34 : L.port ? 42 : 52;
    return `<div class="tv-pod${L.pods.row ? ' row' : ''}${p === G.me && !G.spect ? ' is-me' : ''}" data-seat="${p}" style="left:${pos.x}px;top:${pos.y}px;--av:${size}px">
      <div class="tv-av" data-uid="${esc(w.user_id || '')}" data-seat="${p}">
        <svg class="tv-ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47"/><circle class="tv-ring-t" cx="50" cy="50" r="47" pathLength="100"/></svg>
        ${avatarHTML(w, size)}
        <span class="tv-color c${p}" title="${COLOR[p]}"></span>
      </div>
      <div class="tv-tag"><b class="tv-name">${esc(w.me ? 'Sen' : w.name)}${w.bot && G.mode === 'online' && !w.me ? ' <small>(B)</small>' : ''}</b>
        <span class="tv-meta"><span class="tv-score" title="Maç puanı"><i>${G.st.score[p]}</i>/${G.st.target}</span><span class="tv-pip" title="Pip (kalan yol)">pip <i>0</i></span></span></div>
    </div>`;
  }
  function renderPods() {
    const L = G.lay;
    if (!G.st) return;
    const opp = 1 - G.me;
    $('#pods').innerHTML = podHTML(opp, L.pods.opp) + podHTML(G.me, L.pods.me);
    paintPods();
  }
  function paintPods() {
    const st = G.st;
    if (!st) return;
    $$('.tv-pod').forEach((pod) => {
      const p = +pod.dataset.seat;
      pod.classList.toggle('is-turn', (st.phase === 'move' || st.phase === 'roll') && st.cur === p && !G.anim);
      pod.querySelector('.tv-score i').textContent = st.score[p];
      pod.classList.toggle('is-away', !!who(p).away);
    });
    paintPips();
    paintTimer();
  }
  function paintPips() {
    const x = G.stage && G.st && G.st.cur === G.me ? G.stage.x : G.vx || (G.st && G.st.x);
    if (!x) return;
    $$('.tv-pod').forEach((pod) => {
      const p = +pod.dataset.seat;
      pod.querySelector('.tv-pip i').textContent = TV.pips(x, p);
    });
  }
  function paintTimer() {
    const st = G.st;
    const ms = turnSec() * 1000;
    $$('.tv-pod').forEach((pod) => {
      const ring = pod.querySelector('.tv-ring-t');
      const p = +pod.dataset.seat;
      const on = ms && st && st.phase === 'move' && st.cur === p && !G.anim;
      pod.classList.toggle('has-timer', !!on);
      if (!on) {
        ring.style.animation = 'none';
        return;
      }
      const start = Math.max(st._phaseAt || now(), G.animEnd || 0);
      const left = Math.max(0, start + ms - now());
      ring.style.animation = 'none';
      void ring.getBoundingClientRect();
      ring.style.animation = `tvRing ${ms}ms linear -${ms - left}ms forwards`;
    });
  }
  function hudHTML() {
    const st = G.st;
    const online = G.mode === 'online' && G.net;
    const emo = online && !G.spect ? `<button class="tv-ib" data-a="emoji" aria-label="Emoji gönder">${icon('smile', 20)}</button>` : '';
    const chat = online ? `<button class="tv-ib" id="btnChat" aria-label="Masa sohbeti">${icon('chat', 20)}<span class="t-badge"></span></button>` : '';
    const view = online && G.spect ? `<button class="tv-ib" data-a="watch" aria-label="İzlenen oyuncu">${icon('eye', 20)}</button>` : '';
    return `<div class="tv-hud-l"><button class="tv-ib" data-a="menu" aria-label="Menü">${icon('menu', 20)}</button>
        <div class="tv-info"><b>Tavla</b><span>${st.target === 1 ? 'Tek oyun' : st.target + ' sayılık maç'} · ${st.game}. oyun</span></div></div>
      <div class="tv-hud-c" id="hudMsg"></div>
      <div class="tv-hud-r">${view}${emo}${chat}<button class="tv-ib" data-a="rules" aria-label="Kurallar">${icon('book', 20)}</button>
        <button class="tv-ib" data-a="sound" aria-label="Ses">${icon(G.set.sound ? 'vol' : 'mute', 20)}</button></div>`;
  }
  function renderHUD() {
    $('#hud').innerHTML = hudHTML();
    if (NET && G.net) NET.chat.bind($('#btnChat'));
    paintMsg();
  }
  function paintMsg() {
    const box = $('#hudMsg');
    const st = G.st;
    if (!box || !st) return;
    let t = '';
    let cls = '';
    if (st.phase === 'move' || st.phase === 'roll') {
      if (G.spect) t = `${esc(who(st.cur).name)} oynuyor`;
      else if (st.cur === G.me) {
        t = G.pending ? 'Hamle gönderiliyor…' : 'Sıra sende';
        cls = 'me';
      } else t = `${esc(who(st.cur).name)} oynuyor…`;
    } else if (st.phase === 'gameEnd') t = 'Oyun bitti';
    else if (st.phase === 'over') t = 'Maç bitti';
    else if (st.phase === 'open') t = 'Zarlar atılıyor…';
    box.innerHTML = t ? `<span class="tv-msg ${cls}">${t}</span>` : '';
  }

  /* =====================================================================
     CANLANDIRMA KUYRUĞU VE HAMLE UYGULAMA
     ===================================================================== */
  function enqueue(fn) {
    G.Q.push(fn);
    if (!G.running) runQ();
  }
  async function runQ() {
    G.running = true;
    G.anim = true;
    paintHints();
    while (G.Q.length) {
      const fn = G.Q.shift();
      try {
        await fn();
      } catch (e) {
        console.error('[tavla] canlandırma', e);
      }
    }
    G.running = false;
    G.anim = false;
    G.animEnd = now();
    afterAnim();
  }
  function reduce(st, a) {
    const r = TV.apply(st, a);
    if (r.ok) st._phaseAt = a.at || now();
    return r;
  }
  /** mine: kendi hamlem (taşlar zaten yerinde) */
  function applyUI(a, mine) {
    const st = G.st;
    if (!st) return { ok: false };
    const before = TV.cloneBoard(st.x);
    const r = reduce(st, a);
    if (!r.ok) {
      if (mine) {
        G.pending = false;
        resetVisual();
      }
      return r;
    }
    const fin = TV.cloneBoard(st.x);
    // kendi elle yaptığım (tahtada zaten görünen) hamle canlandırılmaz; otomatik hamle canlandırılır
    const own = !!mine && a.kind === 'move' && a.seat === G.me && !!G.committed && G.committed === JSON.stringify(a.data && a.data.m);
    if (mine && a.kind === 'move' && a.seat === G.me) {
      G.committed = null;
      G.pending = false;
      G.stage = null;
      clearTimeout(G.commitT);
      hideCommitBar();
    }
    enqueue(animJob(r.ev, before, fin, own));
    paintMsg();
    return r;
  }
  function animJob(evs, before, fin, own) {
    return async () => {
      for (const e of evs) await animEvent(e, own);
      // eşitle: ekrandaki tahta motorla aynı olmalı
      G.vx = fin;
      if (!sameLoc(fin)) {
        assignFresh(fin);
        placeCheckers({ dur: D(200) });
      }
      paintPips();
    };
  }
  /** Taş öğelerinin dağılımı tahtayla aynı mı */
  function sameLoc(x) {
    const cnt = { b: new Array(26).fill(0), bar: [0, 0], off: [0, 0] };
    for (const [, l] of G.loc) {
      if (l.w === 'pt') cnt.b[l.a] += l.p === 0 ? 1 : -1;
      else if (l.w === 'bar') cnt.bar[l.p]++;
      else cnt.off[l.p]++;
    }
    for (let a = 1; a <= 24; a++) if (cnt.b[a] !== x.b[a]) return false;
    return cnt.bar[0] === x.bar[0] && cnt.bar[1] === x.bar[1] && cnt.off[0] === x.off[0] && cnt.off[1] === x.off[1];
  }
  async function animEvent(e, own) {
    if (e.t === 'open') {
      G.vx = TV.newBoard();
      assignFresh(G.vx);
      placeCheckers({ dur: D(380) });
      paintPips();
      SND.play('roll');
      paintDice({ d: [e.d[0], e.d[1]], seat: G.me, open: true, roll: true });
      await sleep(D(900));
      const fw = who(e.first);
      toast(`${COLOR[0]} ${e.d[0]} · ${COLOR[1]} ${e.d[1]}: ${fw.me ? 'sen başlıyorsun' : esc(fw.name) + ' başlıyor'}`, 'good');
      await sleep(D(700));
      return;
    }
    if (e.t === 'dice') {
      SND.play('roll');
      paintDice({ d: e.d, seat: e.seat, roll: true, left: TV.diceList(e.d) });
      await sleep(D(640));
      return;
    }
    if (e.t === 'pass') {
      const w = who(e.seat);
      toast(`${w.me ? 'Oynayacak hamlen yok' : esc(w.name) + ': oynayacak hamle yok'} (${e.d[0]}-${e.d[1]})`, '');
      await sleep(D(1200));
      paintDice({ d: null });
      return;
    }
    if (e.t === 'move') {
      if (own) return;
      let left = e.d ? TV.diceList(e.d) : [];
      if (e.d) paintDice({ d: e.d, seat: e.seat, left });
      await sleep(D(120));
      for (const m of e.steps) {
        const r = stepLoc(e.seat, m);
        placeCheckers({ dur: D(330), lift: r.mover });
        SND.play(m.to === 0 ? 'off' : m.hit ? 'hit' : 'move');
        left = TV.removeDie(left, m.d);
        if (e.d) paintDice({ d: e.d, seat: e.seat, left });
        await sleep(D(m.hit ? 470 : 380));
      }
      return;
    }
    if (e.t === 'win') {
      const w = who(e.seat);

  const GA = {
    init(table, seats) {

      }
      const r = table.rules || {};

      return st;
    },
    apply: (st, a) => reduce(st, a),
    clone: (st) => TV.clone(st),

    reset(st) {

        setTimeout(() => toLobby(), 1600);
      }
    },
    onTick() {
      const pill = $('#netPill');
      if (pill) pill.hidden = !(G.net && G.net.fails > 1);
      if (G.mode === 'online') netDrive();
    },
    onSpectate() {

      renderPods();

    },
  };
  function fresh(slot, key) {
    const k = G[slot];
    if (k && k.key === key && Date.now() - k.at < 5000) return false;
    G[slot] = { key, at: Date.now() };
    return true;
  }
  const phaseKey = (s) => s.game + ':' + s.turnNo + ':' + s.phase;
  function netDrive() {
    const N = G.net;
    const s = G.st;
    if (!N || !s || G.mode !== 'online' || G.spect || N.closed || G.anim) return;
    if (!N.canAct() || N.busy() || G.pending) return;
    const t = now();
    const key = phaseKey(s);
    const at = Math.max(s._phaseAt || t, G.animEnd ? G.animEnd - 300 : 0);
    const tMs = turnSec() * 1000;
    // pas sonrası zar: sıradaki oyuncunun kendi tarayıcısı hemen atar
    if (s.phase === 'roll' && s.cur === G.me) {
      if (t >= at + 900 && fresh('rollKey', key)) {
        const r = N.dispatch({ seat: G.me, kind: 'roll' }, { later: true });
        if (!r || r.ok === false) G.rollKey = null;
      }
      return;
    }
    if (s.phase === 'move' && s.cur === G.me) {
      if (G.autoHuman) {
        G.stage = null;
        return netBot(G.me, key);
      }
      if (tMs && t >= at + tMs && fresh('autoKey', key)) {
        toast('Süre doldu: hamlen otomatik oynandı', 'err');
        clearTimeout(G.commitT);
        hideCommitBar();
        resetVisual();
        const seq = AI.choose(s, G.me, 'orta');
        if (seq) {
          G.pending = true;
          const r = N.dispatch({ seat: G.me, kind: 'move', data: { m: seq, auto: true } }, { later: true });
          if (!r || r.ok === false) {
            G.pending = false;
            G.autoKey = null;
          }
        }
      }
      return;
    }
    if (!N.isDriver()) return;
    if (s.phase === 'open') {
      if (fresh('openKey', key)) {
        const r = N.dispatch({ seat: null, kind: 'open' }, { later: true });
        if (!r || r.ok === false) G.openKey = null;
      }
      return;
    }
    if (s.phase === 'gameEnd') {
      if (t >= at + 5200 * (G.testMul || 1) && fresh('nextKey', key)) {
        const r = N.dispatch({ seat: null, kind: 'next' }, { later: true });
        if (!r || r.ok === false) G.nextKey = null;
      }
      return;
    }
    const p = s.cur;
    const ctl = N.control(p);
    if (s.phase === 'roll') {
      if ((ctl === 'bot' || ctl === 'away' || t >= at + 4000) && fresh('rollKey', key)) {
        const r = N.dispatch({ seat: p, kind: 'roll', data: ctl === 'human' ? { auto: true } : {} }, { later: true });
        if (!r || r.ok === false) G.rollKey = null;
      }
      return;
    }
    if (s.phase !== 'move') return;
    if (ctl === 'bot' || ctl === 'away') return netBot(p, key);
    if (ctl === 'human' && tMs && t >= at + tMs + 3500 && fresh('autoKey', key)) {
      const seq = AI.choose(s, p, 'orta');
      const r = seq ? N.dispatch({ seat: p, kind: 'move', data: { m: seq, auto: true } }, { later: true }) : null;
      if (!r || r.ok === false) G.autoKey = null;
    }
  }
  function netBot(p, key) {

          <p class="tv-sub">Arkadaşınla 1’e 1 masa kur ya da açık masalara katıl. Zarlar sunucuda atılır; emoji ve hediyeler masada açık.</p>
          <button class="tv-btn gold big" data-go="online">${icon('users', 18)} Online masalar</button>
          <button class="tv-btn" data-go="rules">${icon('book', 16)} Kurallar</button>
        </section>
      </div>
    </div>`;
  }
  function onStartClick(e) {
    const b = e.target.closest('button');
    if (!b) return;
    SND.unlock();
    if (b.dataset.k) {
      const k = b.dataset.k;
      let v = b.dataset.v;
      if (k === 'target') v = +v;
      G.set[k] = v;
      saveSet();
      return startScreen();
    }
    if (b.dataset.go === 'bots') return startOffline();
    if (b.dataset.go === 'rules') return showRules();
    if (b.dataset.go === 'online') {
      if (!NET) return toast('Online oyun için oyunu Bözer Gaming sitesinden aç.', 'err');
      if (!NET.authed()) return NET.goLogin();
      showScreen('net');
      NET.openLobby();
    }
  }
  function topAction(a) {
    SND.unlock();
    if (a === 'menu') return showMenu();
    if (a === 'rules') return showRules();
    if (a === 'emoji') return NET && NET.emojiPicker();
    if (a === 'sound') {
      G.set.sound = !G.set.sound;
      SND.setOn(G.set.sound);
      saveSet();
      return renderHUD();
    }
    if (a === 'watch' && G.net) {
      const list = G.net.watchable();
      if (list.length < 2) return toast('İzleyebileceğin başka arkadaş yok.', '');
      const i = list.indexOf(G.me);
      G.me = list[(i + 1) % list.length];
      setupTable();
      afterAnim();
    }
  }
  function relayout() {
    if ($('#game').classList.contains('hidden') || !G.st) return;
    layout();
    renderPods();
  }

  function boot() {
    SND.setOn(G.set.sound);
    $('#board').insertAdjacentHTML('afterbegin', B.svg());
    $('#start').addEventListener('click', onStartClick);
    $('#start').addEventListener('input', (e) => {
      if (e.target.id === 'pname') {
        G.set.name = e.target.value.trim().slice(0, 16) || 'Oyuncu';
        saveSet();
      }
    });
    $('#board').addEventListener('click', onBoardClick);
    $('#game').addEventListener('click', (e) => {
      const b = e.target.closest('[data-a]');
      if (b) return topAction(b.dataset.a);
      if (e.target.closest('#undoBtn')) return undo();
      if (e.target.closest('#commitNow')) return commit();
      const av = e.target.closest('.tv-av[data-uid]');
      if (av && av.dataset.uid && NET && G.mode === 'online') NET.playerCard(av.dataset.uid);
    });
    let rz = null;
    window.addEventListener('resize', () => {
      clearTimeout(rz);
      rz = setTimeout(relayout, 60);
    });
    window.addEventListener('orientationchange', () => setTimeout(relayout, 250));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') ['menu', 'rules'].forEach(closeModal);
      if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) undo();
    });
    setInterval(() => {
      if (G.mode === 'offline' && G.st && !G.anim && G.st.cur !== G.me && Date.now() - (G.botAt || 0) > 4000 && ['open', 'roll', 'move'].indexOf(G.st.phase) >= 0) driveOffline();
      if (G.st && !G.anim) paintTimer();
    }, 1500);
    if (NET) {
      NET.mount({
        game: 'tavla-online',
        name: 'Tavla',
        root: $('#net'),
        seatCounts: [2],
        defSeats: 2,
        seatDir: -1,
        rules: TABLE_RULES,
        toast: (t, k) => toast(t, k === 'err' ? 'err' : k === 'good' ? 'good' : ''),
        onPlay: startTable,
        mySeat: () => (G.spect ? null : G.me),
        avatarEl: (uid, seat) => {
          if (!G.st || !G.net) return null;
          let p = seat != null && seat !== '' && !isNaN(+seat) ? +seat : null;
          if (p == null) for (let i = 0; i < 2; i++) if (G.net.who(i).user_id === uid) p = i;
          if (p == null) return null;
          return $(`.tv-pod[data-seat="${p}"] .tv-av`);
        },
        onBack: () => {
          showScreen('start');
          startScreen();
        },
      });
      const q = NET.params;
      if (q.masa && NET.authed()) {
        showScreen('net');
        NET.openTable(q.masa, { watch: q.izle === '1', who: q.kim || '' }).catch((e) => {
          toast(e.message || 'Masa açılamadı', 'err');
          NET.openLobby();
        });
        return;
      }
      if (q.mod === 'online') {
        if (!NET.authed()) {
          showScreen('start');
          startScreen();
          return;
        }
        showScreen('net');
        NET.openLobby();
        return;
      }
      if (q.mod === 'bot') return startOffline();
    }
    showScreen('start');
    startScreen();
  }
  window.__TVT = { startOffline, commit, undo, canAct, stepsNow, doStep };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
