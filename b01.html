            ${x ? `<div class="b-field"><label>Başlangıç</label><div class="b-seg" data-k="start">${[301, 501, 701, 1001].map((n) => `<button type="button" data-v="${n}" aria-pressed="${c.start === n}">${n}</button>`).join('')}
                <input class="b-input sm" style="width:110px" inputmode="numeric" data-start placeholder="Serbest" value="${[301, 501, 701, 1001].indexOf(c.start) < 0 ? c.start : ''}"></div></div>
              <div class="b-row wrap" style="gap:16px;align-items:flex-start">
                <div class="b-field"><label>Giriş</label><div class="b-seg" data-k="inRule">${[['straight', 'Düz'], ['double', 'Çift'], ['master', 'Master']].map(([k, t]) => `<button type="button" data-v="${k}" aria-pressed="${c.inRule === k}">${t}</button>`).join('')}</div></div>
                <div class="b-field"><label>Bitiş</label><div class="b-seg" data-k="outRule">${[['double', 'Çift'], ['straight', 'Düz'], ['master', 'Master']].map(([k, t]) => `<button type="button" data-v="${k}" aria-pressed="${c.outRule === k}">${t}</button>`).join('')}</div></div>
              </div>` : ''}
            ${c.type === 'cricket' ? `<div class="b-field"><label>Kriket türü</label><div class="b-seg" data-k="variant">${[['points', 'Puanlı (standart)'], ['close', 'Kapatma (15–20, Bull)']].map(([k, t]) => `<button type="button" data-v="${k}" aria-pressed="${c.variant === k}">${t}</button>`).join('')}</div>
              <p class="b-hint">${c.variant === 'points' ? 'Kapattığın sayıya rakip kapatmadıysa her işaret puan getirir. Hepsini kapatıp puanda önde olan kazanır.' : 'Puan yok; 20–15 ve Bull’u ilk kapatan seti alır.'}</p></div>` : ''}
            ${c.type === 'karambol' ? '<p class="b-hint" style="margin-bottom:16px">20–12, D, T, B ve H hedefleri. Hücreye dokununca bir işaret yazılır; kuralları sen uygularsın. Hepsini ilk kapatan seti alır.</p>' : ''}
            <div class="b-field"><label>Maç uzunluğu</label>
              <div class="b-row wrap"><div class="b-seg" data-k="mode"><button type="button" data-v="first" aria-pressed="${!useSets}">İlk ${unit === 'leg' ? 'leg' : 'set'} sayısı</button>${x || c.variant === 'points' ? `<button type="button" data-v="sets" aria-pressed="${useSets}">Set + leg</button>` : ''}</div></div>
              <div class="b-row wrap" style="margin-top:8px">${useSets ? `${stepper('sets', 'Kazanılacak set', c.sets || 2, 2, 9)}${stepper('legs', 'Her sette leg', c.legs, 1, 9)}` : stepper('legs', unit === 'leg' ? 'Kazanılacak leg' : 'Kazanılacak set', c.legs, 1, 15)}</div>
              <p class="b-hint">${esc(E.formatText(cfgOut()))}</p></div>
            ${x ? `<details class="b-field"><summary class="b-label" style="cursor:pointer">Gelişmiş</summary>
              <div class="b-row wrap" style="margin-top:10px">${stepper('roundLimit', 'Tur sınırı (0: yok)', c.roundLimit, 0, 30)}</div>
              <label class="b-switch"><input type="checkbox" data-sw="askDD" ${c.askDD ? 'checked' : ''}><span>Çifte atılan oku sor<small>Bitiş yüzdesi istatistiği için; 50 ve altındaki ellerde sorulur.</small></span></label></details>` : ''}
          </div>
          <div class="b-sec"><div class="b-sec-h"><h2 class="b-h2">Taraflar</h2>${c.sides.length < 4 ? `<button class="b-btn sm" type="button" data-a="addSide">${ic.plus}Taraf ekle</button>` : ''}</div>
            <div class="b-sides">${c.sides
              .map(
                (s, i) => `<div class="b-side"><div class="b-side-h"><span class="b-dot" style="background:${A.SIDE_COLORS[i]}"></span>
                  <input class="b-input sm" data-sname="${i}" placeholder="${esc(sideName(s, i))}" value="${esc(s.name)}" aria-label="Taraf adı">
                  ${c.sides.length > 2 ? `<button class="b-iconbtn" type="button" data-rm="${i}" aria-label="Tarafı sil">${ic.trash}</button>` : ''}</div>
                  <div class="b-mems">${s.members.map((m, j) => `<span class="b-mem${m.bot ? ' bot' : ''}">${m.bot ? ic.bot : ''}${esc(m.n)}${m.bot ? ` · ${esc(E.botName(m.bot))}` : ''}${m.u ? ' ·  üye' : ''}<button type="button" data-rmm="${i}:${j}" aria-label="Çıkar">×</button></span>`).join('')}</div>
                  <div class="b-row wrap"><button class="b-btn sm ghost" type="button" data-addn="${i}">${ic.plus}İsim</button>
                    ${A.authed() ? `<button class="b-btn sm ghost" type="button" data-addf="${i}">${ic.users}Arkadaş</button>` : ''}
                    <button class="b-btn sm ghost" type="button" data-addb="${i}">${ic.bot}Bot</button></div></div>`
              )
              .join('')}</div>
            <p class="b-hint" style="margin-top:8px">Bir tarafa iki ya da daha çok oyuncu eklersen çiftler usulü oynanır: oyuncular sırayla atar.</p>
          </div>
          <div class="b-sec"><div class="b-field"><label>Kim başlıyor?</label><div class="b-seg" data-k="starter">${c.sides.map((s, i) => `<button type="button" data-v="${i}" aria-pressed="${c.starter === i}">${esc(sideName(s, i))}</button>`).join('')}<button type="button" data-v="r">Rastgele</button></div></div>
            ${A.authed() ? `<label class="b-switch"><input type="checkbox" data-sw="broadcast" ${c.broadcast ? 'checked' : ''}><span>Canlı yayınla<small>Maç Canlı listesinde görünür; arkadaşların ve TV ekranı izler. Üye oyuncuların istatistiğine yazılır.</small></span></label>
              ${c.broadcast ? `<div class="b-seg" data-k="vis" style="margin-bottom:8px"><button type="button" data-v="public" aria-pressed="${c.vis === 'public'}">Herkese açık</button><button type="button" data-v="link" aria-pressed="${c.vis === 'link'}">Yalnız bağlantıyla</button></div>` : ''}` : '<p class="b-hint">Giriş yaparsan maçı canlı yayınlayabilirsin.</p>'}
          </div>
          <div class="b-wiz-foot"><a class="b-btn ghost" href="#/">Vazgeç</a><button class="b-btn gold" type="button" data-a="go">${ic.play}Maçı başlat</button></div>
        </div>`;
      }
      function stepper(k, label, val, min, max) {
        return `<div class="b-field" style="margin:0"><span class="b-label">${esc(label)}</span><span class="b-stepper" data-step="${k}" data-min="${min}" data-max="${max}"><button type="button" data-d="-1" aria-label="Azalt">−</button><output>${val}</output><button type="button" data-d="1" aria-label="Artır">+</button></span></div>`;
      }
      function cfgOut() {
        const o = { type: c.type, legs: c.legs, sets: useSets ? c.sets || 2 : 0, legMode: 'first' };
        if (c.type === 'x01') Object.assign(o, { start: c.start, inRule: c.inRule, outRule: c.outRule, roundLimit: c.roundLimit, askDD: c.askDD });
        if (c.type === 'cricket') o.variant = c.variant;
        return o;
      }
      root.addEventListener('click', async (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        const seg = b.closest('[data-k]');
        if (seg && b.dataset.v != null) {
          const k = seg.dataset.k;
          const v = b.dataset.v;
          if (k === 'type') c.type = v;
          else if (k === 'start') c.start = +v;
          else if (k === 'mode') {
            useSets = v === 'sets';
            if (useSets && !c.sets) c.sets = 2;
          } else if (k === 'starter') c.starter = v === 'r' ? 'r' : +v;
          else c[k] = v;
          return paint();
        }
        const stp = b.closest('[data-step]');
        if (stp) {
          const k = stp.dataset.step;
          c[k] = Math.max(+stp.dataset.min, Math.min(+stp.dataset.max, (c[k] || 0) + +b.dataset.d));
          return paint();
        }
        if (b.dataset.a === 'addSide') {
          c.sides.push({ name: '', members: [{ n: 'Oyuncu ' + (c.sides.length + 1) }] });
          return paint();
        }
        if (b.dataset.rm != null) {
          c.sides.splice(+b.dataset.rm, 1);
          if (c.starter >= c.sides.length) c.starter = 0;
          return paint();
        }
        if (b.dataset.rmm) {
          const [i, j] = b.dataset.rmm.split(':').map(Number);
          c.sides[i].members.splice(j, 1);
          return paint();
        }
        if (b.dataset.addn != null) {
          const n = await A.prompt('Oyuncu adı', '');
          if (n && n.trim()) {
            c.sides[+b.dataset.addn].members.push({ n: n.trim().slice(0, 28) });
            paint();
          }
          return;
        }
        if (b.dataset.addf != null) {
          const used = [].concat(...c.sides.map((s) => s.members.map((m) => m.u).filter(Boolean)));
          const r = await A.pickFriends({ self: true, multi: true, max: 4, disabled: used, title: 'Oyuncu seç' });
          if (r && r.length) {
            const s = c.sides[+b.dataset.addf];
            // ilk eklemede varsayılan "Oyuncu N" yer tutucusunu kaldır
            s.members = s.members.filter((m) => m.u || m.bot || !/^Oyuncu \d$/.test(m.n));
            r.forEach((f) => s.members.push({ n: f.n, u: f.u }));
            paint();
          }
          return;
        }
        if (b.dataset.addb != null) {
          const body = A.frag(`<div class="b-grid" style="grid-template-columns:repeat(auto-fill,minmax(96px,1fr))">${E.BOT_LEVELS.map((l) => `<button class="b-btn" type="button" data-l="${l}">${esc(E.botName(l))}</button>`).join('')}</div>`);
          const m = A.modal({ title: 'Bot seviyesi', body });
          body.addEventListener('click', (ev) => {
            const x = ev.target.closest('[data-l]');
            if (!x) return;
            const s = c.sides[+b.dataset.addb];
            s.members = s.members.filter((mm) => mm.u || mm.bot || !/^Oyuncu \d$/.test(mm.n));
            s.members.push({ n: 'Bot', bot: +x.dataset.l });
            m.close();
            paint();
          });
          return;
        }
        if (b.dataset.a === 'go') return start(b);
      });
      root.addEventListener('change', (e) => {
        const t = e.target;
        if (t.dataset.sw) {
          c[t.dataset.sw] = t.checked;
          paint();
        } else if (t.dataset.start != null) {
          const n = parseInt(t.value, 10);
          if (n >= 101 && n <= 9999) c.start = n;
          else if (t.value) A.toast('Başlangıç 101–9999 arası olmalı.', 'err');
          paint();
        }
      });
      root.addEventListener('input', (e) => {
        if (e.target.dataset.sname != null) c.sides[+e.target.dataset.sname].name = e.target.value.slice(0, 40);
      });
      async function start(btn) {
        for (const s of c.sides) if (!s.members.length) return A.toast('Her tarafta en az bir oyuncu olmalı.', 'err');
        const sides = c.sides.map((s, i) => ({ name: sideName(s, i), members: s.members }));
        const starter = c.starter === 'r' ? Math.floor(Math.random() * sides.length) : c.starter;
        if (c.starter === 'r') A.toast(sides[starter].name + ' başlıyor.');
        const cfg = Object.assign(cfgOut(), { sides, starter, title: 'Hızlı maç' });
        const save = Object.assign({}, c);
        A.ls.set('lastSetup', save);
        const st = E.create(cfg);
        if (c.broadcast && A.authed()) {
          btn.disabled = true;
          try {
            const r = await A.rpc('bg_b01_quick_create', { p_game: cfgOut(), p_sides: sides, p_visibility: c.vis, p_state: st });
            A.go('/skor/' + r.id);
          } catch (e) {
            A.toast(A.errText(e), 'err');
            btn.disabled = false;
          }
          return;
        }
        A.ls.set('local', st);
        A.go('/skor/yerel');
      }
      paint();
    },
    { nav: 'new' }
  );

  /* ---------------- İzleyici ekranı ---------------- */
  A.route('/izle/:id', function (root, params) {
    let d = null;
    let ch = null;
    let lastEvent = Date.now();
    let poll = null;
    let destroyed = false;
    root.innerHTML = `<div class="b-page"><p class="b-muted">Maç açılıyor…</p></div>`;
    const load = async () => {
      try {
        d = await A.rpc('bg_b01_match_get', { p_id: params.id });
        if (destroyed) return;
        paint();
      } catch (e) {
        root.innerHTML = `<div class="b-page"><div class="b-empty">${esc(A.errText(e))}<br><a class="b-btn" href="#/">Merkeze dön</a></div></div>`;
      }
    };
    function names() {
      const m = d.match;
      if (m.state && m.state.cfg) return m.state.cfg.sides.map((s) => s.name);
      if (m.event_id) return [d.a ? d.a.name : 'Belli değil', d.b ? d.b.name : 'Belli değil'];
      return (m.sides || []).map((s) => s.name);
    }
    function paint() {
      const m = d.match;
      const st = m.state && m.state.cfg ? m.state : null;
      if (!root.querySelector('.b-watch')) {
        root.innerHTML = `<div class="b-page b-watch">
          <div class="b-row wrap"><span class="b-sp">${d.event ? `<a href="#/e/${esc(d.event.id)}" class="b-muted" style="text-decoration:none">${ic.back.replace('<svg', '<svg style="width:16px;height:16px;vertical-align:-3px"')} ${esc(d.event.name)}</a>` : '<span class="b-muted">Hızlı maç</span>'}
            <h1 class="b-h2" data-h style="margin-top:4px"></h1></span><span data-chip></span></div>
          <div class="tvhost" data-tv></div>
          <div class="b-row wrap" data-acts></div>
          <section data-extra></section></div>`;
      }
      A.$('[data-h]', root).textContent = names().join(' – ') + (m.label && m.label !== 'Hızlı maç' ? ' · ' + m.label : '');
      A.$('[data-chip]', root).innerHTML = m.status === 'live' ? '<span class="b-chip live">Canlı</span>' : m.status === 'done' ? '<span class="b-chip">Bitti</span>' : m.status === 'ready' ? '<span class="b-chip gold">Başlamadı</span>' : `<span class="b-chip">${m.status === 'void' ? 'Kapandı' : 'Bekliyor'}</span>`;
      window.B01V.render(A.$('[data-tv]', root), { state: st, title: d.event ? d.event.name : 'Hızlı maç', label: m.label && m.label !== 'Hızlı maç' ? m.label : '', board: m.board, names: names(), status: m.status, score: m.sa != null ? m.sa + ' – ' + m.sb : '' });

    });
    load();
    A.presence(params.id);
    // canlı güncelleme: değişiklik bildirimi gelir; gelmezse 8 sn'de bir yoklar
    try {
      ch = A.channel('b01w-' + params.id.slice(0, 8) + '-' + Math.random().toString(36).slice(2, 7));
      if (ch) {
        ch.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'b01_matches', filter: 'id=eq.' + params.id }, (p) => {
          lastEvent = Date.now();
          const row = p.new || {};

            Object.assign(d.match, { state: row.state, status: row.status, seq: row.seq, sa: row.score_a, sb: row.score_b, board: row.board, wo: row.wo });
            if (row.scorer_id == null) d.match.scorer = null;
            paint();
          } else load();
        }).subscribe();
      }
    } catch (e) {}
    poll = setInterval(() => {
      const fin = d && ['done', 'void', 'bye'].indexOf(d.match.status) >= 0;
      if (!fin && document.visibilityState === 'visible' && Date.now() - lastEvent > 8000) load();
    }, 8000);
    return () => {
      destroyed = true;
      clearInterval(poll);
      A.unchannel(ch);
      A.presence(null);
    };
  });
})();

/* ---- scorer.js ---- */
/* =====================================================================
   B01 — skor ekranları (X01 tuş takımı, Kriket/Karambol hücreleri), sunucuya yazma ve bot
   ===================================================================== */
(function () {
  'use strict';
  const A = window.B01;
  const E = A.E;
  const { esc, ic } = A;
  const DEFAULT_QUICK = [26, 29, 41, 45, 60, 81, 85, 100, 121, 140, 180, 0];
  A.quickList = () => {
    const q = A.ls.get('quick', null);
    return Array.isArray(q) && q.length === 12 && q.every((x) => E.validVisit(x)) ? q : DEFAULT_QUICK.slice();
  };

  /* ---------------- sunucu eşitleme ---------------- */
  /** Anahtar sırasından bağımsız JSON (sunucu jsonb anahtarları yeniden sıralar) */
  function canon(v) {
    if (Array.isArray(v)) return '[' + v.map((x) => canon(x === undefined ? null : x)).join(',') + ']';
    if (v && typeof v === 'object') {
      return '{' + Object.keys(v).filter((k) => v[k] !== undefined && typeof v[k] !== 'function').sort().map((k) => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
    }
    return JSON.stringify(v === undefined ? null : v);
  }
  const canonOf = (x) => {
    try {
      return canon(typeof x === 'string' ? JSON.parse(x) : x);
    } catch (e) {
      return '';
    }
  };
  /** Maç durumunu sırayla yazar; bağlantı koparsa son durumu tekrar dener */
  function Sync(matchId, seq, onStatus, onLost) {
    this.id = matchId;
    this.seq = seq || 0;
    this.pending = null;
    this.busy = false;
    this.lost = false;
    this.onStatus = onStatus;
    this.onLost = onLost;
    this.retry = 0;
    this.resyncs = 0;
    this.sent = []; // gönderilen son durumlar (yanıtı kaybolan isteği tanımak için)
    this.timer = null;
    this.ping = setInterval(() => this.keepAlive(), 45000);
  }
  Sync.prototype.push = function (state, extra) {
    if (this.lost) return;
    this.pending = { state, summary: E.summary(state), lineup: extra && extra.lineup };
    this.kick();
  };
  Sync.prototype.kick = async function () {
    if (this.busy || !this.pending || this.lost) return;
    this.busy = true;
    const p = this.pending;
    this.pending = null;
    this.onStatus('wait');
    try {
      this.sent.push(JSON.stringify(p.state));
      if (this.sent.length > 4) this.sent.shift();
      const args = { p_id: this.id, p_seq: this.seq + 1, p_state: p.state, p_summary: p.summary };
      if (p.lineup) args.p_lineup = p.lineup;
      const r = await A.rpc('bg_b01_match_push', args);
      this.seq = (r && r.seq) || this.seq + 1;
      this.retry = 0;
      this.resyncs = 0;
      this.onStatus(this.pending ? 'wait' : 'on');
    } catch (e) {
      // sıra numarası çakıştı ama kilit hâlâ bizdeyse (ör. yanıtı kaybolan istek) sunucudaki numarayı alıp sürdür
      if ((e.code === 'BL002' || /BL002/.test(String(e.message || ''))) && this.resyncs < 3 && (await this.resync())) {
        this.resyncs++;
        this.retry = 0; // hemen yeniden gönder (finally içinde)
        clearTimeout(this.timer);
        if (!this.pending) this.pending = p;
        return;
      }
      if (A.lockErr(e) || e.code === '42501') {
        this.lost = true;
        this.onStatus('off');
        this.onLost(e);
      } else {
        // geçici hata: son durumu sakla ve yeniden dene
        if (!this.pending) this.pending = p;
        this.retry++;
        this.onStatus('off');
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.kick(), Math.min(15000, 1200 * this.retry));
      }
    } finally {
      this.busy = false;
      if (this.pending && !this.lost && !this.retry) this.kick();
    }
  };
  /**
   * Sıra çakışmasında: kilit hâlâ bu kullanıcıda VE sunucudaki durum bu cihazın gönderdiği bir durumsa
   * (yanıtı yolda kaybolmuş istek) sunucunun sıra numarasını alır. Aynı hesapla başka cihazdan yazılmışsa false.
   */
  Sync.prototype.resync = async function (extra) {
    try {
      const d = await A.rpc('bg_b01_match_get', { p_id: this.id });
      const m = d && d.match;
      if (!m || !m.scorer_id || m.scorer_id !== A.myId()) return false;
      const srv = canonOf(m.state);
      const mine = this.sent.concat(extra ? [JSON.stringify(extra)] : []);
      if (!srv || !mine.some((x) => canonOf(x) === srv)) return false;
      this.seq = m.seq;
      return true;
    } catch (e) {}
    return false;
  };
  /** Bitirme isteğinin yanıtı kaybolduysa: sunucuda maç zaten bu durumla bitmiş mi? 'mine' | 'other' | null */
  Sync.prototype.doneWith = async function (st) {
    try {
      const d = await A.rpc('bg_b01_match_get', { p_id: this.id });
      const m = d && d.match;
      if (!m || m.status !== 'done') return null;
      return canonOf(m.state) === canonOf(JSON.stringify(st)) ? 'mine' : 'other';
    } catch (e) {
      return null;
    }
  };
  Sync.prototype.flushed = function () {
    return !this.busy && !this.pending;
  };
  Sync.prototype.keepAlive = async function () {
    if (this.lost || document.visibilityState !== 'visible') return;
    try {
      const r = await A.rpc('bg_b01_match_ping', { p_id: this.id });
      if (r && r.ok === false && r.scorer) {
        this.lost = true;
        this.onStatus('off');
        this.onLost({ code: 'BL001', message: 'Bu maçın skorunu şu an ' + r.scorer + ' tutuyor.' });
      }
    } catch (e) {}
  };
  Sync.prototype.stop = function () {
    clearInterval(this.ping);
    clearTimeout(this.timer);
  };
  Sync.prototype.waitIdle = function (ms) {
    return new Promise((res) => {
      const t0 = Date.now();
      const tick = () => {
        if (this.flushed() || Date.now() - t0 > (ms || 8000)) res(this.flushed());
        else setTimeout(tick, 120);
      };
      tick();
    });
  };

  /* ---------------- kurulum: sunucudaki maçtan oyun durumu ---------------- */
  function sidesFromMatch(d) {
    const m = d.match;
    if (!m.event_id) return (m.sides || []).map((s) => ({ name: s.name, members: s.members }));
    const ent = [d.a, d.b];
    return ent.map((t, i) => {
      if (!t) return { name: i ? 'B' : 'A', members: [{ n: i ? 'B' : 'A' }] };
      let members = Array.isArray(t.members) && t.members.length ? t.members : [{ n: t.name }];
      const lu = m.lineup || {};
      const pick = lu[i ? 'b' : 'a'];
      let name = t.name;
      if (Array.isArray(pick) && pick.length) {
        members = pick.map((k) => members[k]).filter(Boolean);
        // takım karşılaşmasında tarafın adı: "Takım · Oyuncu"
        name = (t.name + ' · ' + members.map((x) => x.n).join(' & ')).slice(0, 40);
      }
      const o = { name, members };
      if (t.handicap && (m.game || {}).type === 'x01') o.start = t.handicap;
      return o;
    });
  }
  /** Takım karşılaşmasındaki maç: hangi oyuncular atacak? */
  function chooseLineup(d) {
    const kind = (d.match.lineup && d.match.lineup.kind) || 's';
    const need = kind === 'd' ? 2 : 1;
    const ent = [d.a, d.b];
    return new Promise((res) => {
      const sel = [[], []];
      const body = A.frag(`<div><p class="b-muted">${need === 1 ? 'Her takımdan bu maçı atacak oyuncuyu seç.' : 'Her takımdan bu maçı atacak iki oyuncuyu seç.'}</p>
        ${ent.map((t, i) => `<div class="b-field"><label>${esc(t.name)}</label><div class="b-seg" data-side="${i}">${(t.members || []).map((m, k) => `<button type="button" data-k="${k}" aria-pressed="false">${esc(m.n)}</button>`).join('')}</div></div>`).join('')}</div>`);
      body.addEventListener('click', (e) => {
        const b = e.target.closest('[data-k]');
        if (!b) return;
        const s = +b.parentNode.dataset.side;
        const k = +b.dataset.k;
        const arr = sel[s];
        const at = arr.indexOf(k);
        if (at >= 0) arr.splice(at, 1);
        else {
          if (arr.length >= need) arr.shift();
          arr.push(k);
        }
        A.$$('[data-k]', b.parentNode).forEach((x) => x.setAttribute('aria-pressed', arr.indexOf(+x.dataset.k) >= 0));
      });
      A.modal({
        title: d.match.label || 'Oyuncular',
        body,
        sticky: true,
        onClose: (v) => res(v || null),
        actions: [
          { label: 'Vazgeç', kind: 'ghost', value: null },
          {
            label: 'Başla',
            kind: 'gold',
            onClick: (m) => {
              const ok = sel.every((a, i) => a.length === Math.min(need, (ent[i].members || []).length));
              if (!ok) {
                A.toast(need === 1 ? 'Her takımdan bir oyuncu seç.' : 'Her takımdan iki oyuncu seç.', 'err');
                return false;
              }
              m.close({ a: sel[0], b: sel[1] });
              return false;
            },
          },
        ],
      });
    });
  }
  /** Kim başlıyor? (maç başında) */
  function chooseStarter(names) {
    return new Promise((res) => {
      const body = A.frag(`<div class="b-grid"><p class="b-muted" style="margin:0">Bull atışını kazanan ya da yazı turada çıkan başlar. Sonraki leg'lerde sıra kendiliğinden değişir.</p>
        ${names.map((n, i) => `<button class="b-btn block" type="button" data-s="${i}">${esc(n)} başlıyor</button>`).join('')}
        <button class="b-btn ghost block" type="button" data-s="r">${ic.shuffle} Rastgele seç</button></div>`);
      const m = A.modal({ title: 'Kim başlıyor?', body, sticky: true, onClose: (v) => res(v == null ? 0 : v) });
      body.addEventListener('click', (e) => {
        const b = e.target.closest('[data-s]');
        if (!b) return;
        const v = b.dataset.s === 'r' ? Math.floor(Math.random() * names.length) : +b.dataset.s;
        if (b.dataset.s === 'r') A.toast(names[v] + ' başlıyor.');
        m.close(v);
      });
    });
  }

  /* ---------------- ekran ---------------- */
  A.route(
    '/skor/:id',
    function (root, params) {
      const local = params.id === 'yerel';
      let st = null;
      let meta = { title: 'Hızlı maç', label: '', eventId: null, board: null, server: !local, quick: false };
      let sync = null;
      let lineup = null;
      let saved = false;
      let destroyed = false;
      let botTimer = null;
      let buf = '';
      const ui = { el: null };

      root.innerHTML = `<div class="b-page"><p class="b-muted">Maç açılıyor…</p></div>`;

      const cleanup = () => {
        destroyed = true;
        clearTimeout(botTimer);
        document.removeEventListener('keydown', onKey);

        if (sync) {

      init().catch((e) => {

          ${!local && !A.authed() ? '<button class="b-btn gold" type="button" data-login>Giriş yap</button>' : ''}</div></div>`;

      function setSync(s) {

          const w = L && L.w != null ? st.cfg.sides[L.w].name : '';

          <button class="b-iconbtn" type="button" data-a="back" aria-label="Geri">${ic.back}</button>

          <button class="b-iconbtn" type="button" data-a="menu" aria-label="Menü">${ic.more}</button>
        </header>`;
      }
      function draw() {
        if (destroyed || !st) return;
        const v = E.view(st);
        root.innerHTML = st.cfg.type === 'x01' ? x01Html(v) : crHtml(v);
        ui.el = root.firstElementChild;
        ui.el.addEventListener('click', onClick);
        bindHold();
      }

      function legDots(won, need) {
        if (st.cfg.legMode === 'total' || need > 7) return `<b>${won}</b>`;
        let h = '';
        for (let i = 0; i < need; i++) h += `<i class="${i < won ? 'w' : ''}"></i>`;
        return `<span class="sx-legs">${h}</span>`;
      }
      function x01Html(v) {
        const c = st.cfg;
        const sides = v.sides
          .map((s, i) => {
            const on = v.turn === i;
            const mem = s.members.length > 1 ? ' <em>' + esc(s.members[on ? v.member : s.member].n) + '</em>' : '';
            const bot = s.members.some((m) => m.bot) ? ' <em>bot</em>' : '';
            const legs = c.sets ? v.legs[i] : v.legsTotal[i];
            return `<div class="sx-side${on ? ' on' : ''}${s.route && s.rem <= 170 ? ' out' : ''}">
              <div class="sx-name"><i class="sx-turn"></i><span>${esc(s.name)}</span>${mem}${bot}</div>
              <div class="sx-rem">${s.rem}</div>
              <div class="sx-route">${s.route && s.rem <= 170 ? esc(E.routeText(s.route)) : ''}</div>
              <div class="sx-meta">${c.sets ? `<span>Set <b>${v.sets[i]}</b></span>` : ''}<span>Leg ${legDots(legs, c.legs)}</span><span>Ort <b>${s.avg ? s.avg.toFixed(1) : '0.0'}</b></span><span>${s.darts} ok</span>${s.last != null ? `<span>Son <b class="sx-last${s.lastBust ? ' bust' : ''}">${esc(s.last)}</b></span>` : ''}</div>
            </div>`;
          })
          .join('');
        const rows = v.rows;
        const sheet = rows.length
          ? rows
              .map((r, i) => `<button type="button" class="sx-v${r.b ? ' bust' : ''}${r.c ? ' co' : ''}${r.p >= 100 ? ' big' : ''}" data-edit="${i}" title="Düzelt" style="box-shadow: inset 0 -3px 0 ${A.SIDE_COLORS[r.s]}"><b>${r.b ? 'B' : r.p}</b><small>${r.after}</small></button>`)
              .join('')
          : '<span class="sx-none">Bu leg’de henüz atış yok. Atışa dokunarak düzeltebilirsin.</span>';
        const turnSide = v.turn != null ? v.sides[v.turn] : null;
        const isBot = turnSide && turnSide.members[v.member] && turnSide.members[v.member].bot;
        const who = turnSide ? esc(turnSide.members.length > 1 ? turnSide.members[v.member].n : turnSide.name) : '';
        const n = buf ? parseInt(buf, 10) : null;
        const prev = turnSide && n != null ? `${turnSide.rem} → ${turnSide.rem - n < 0 || (turnSide.rem - n === 1 && c.outRule === 'double') ? 'BUST' : turnSide.rem - n}` : turnSide ? 'Kalan ' + turnSide.rem : '';
        const quick = A.quickList();
        const disabled = st.done || isBot || v.pending ? 'disabled' : '';
        return `<div class="sx">${head()}
          <div class="sx-wrap">
            <div class="sx-body">
              <div class="sx-sides n${v.n}">${sides}</div>
              <div class="sx-sheet" aria-label="Bu leg'deki atışlar">${sheet}</div>
            </div>
            <div class="sx-in">
              <div class="sx-disp"><span class="who">${st.done ? 'Maç bitti' : v.pending ? 'Tur sınırı doldu' : isBot ? who + ' atıyor…' : who}</span><span class="prev">${st.done ? '' : esc(prev)}</span>
                <span class="val${buf ? '' : ' ph'}">${buf || '0'}</span></div>
              <div class="sx-quick">${quick.map((q) => `<button type="button" data-q="${q}" class="${q >= 100 ? 'hi' : ''}" ${disabled}>${q}</button>`).join('')}</div>
              <div class="sx-pad">
                <button type="button" data-d="1" ${disabled}>1</button><button type="button" data-d="2" ${disabled}>2</button><button type="button" data-d="3" ${disabled}>3</button>
                <button type="button" class="fn" data-a="bksp" aria-label="Sil" ${disabled}>${ic.bksp}</button>
                <button type="button" data-d="4" ${disabled}>4</button><button type="button" data-d="5" ${disabled}>5</button><button type="button" data-d="6" ${disabled}>6</button>
                <button type="button" class="fn bust" data-a="bust" ${disabled}>Bust</button>
                <button type="button" data-d="7" ${disabled}>7</button><button type="button" data-d="8" ${disabled}>8</button><button type="button" data-d="9" ${disabled}>9</button>
                <button type="button" class="enter" data-a="enter" ${disabled}>ENTER</button>
                <button type="button" class="fn" data-a="undo" aria-label="Geri al">${ic.undo}</button>
                <button type="button" data-d="0" ${disabled}>0</button>
                <button type="button" class="fn co" data-a="out" ${disabled}>Bitir</button>
              </div>
            </div>
          </div></div>`;
      }

      function crHtml(v) {
        const c = st.cfg;
        const two = v.n === 2;
        const pts = v.variant === 'points';
        const cols = two ? 'minmax(0,1fr) 64px minmax(0,1fr)' : `56px repeat(${v.n}, minmax(0,1fr))`;
        const headCell = (s, i) => {
          const on = v.turn === i;
          const mem = s.members.length > 1 ? ` · ${esc(s.members[on ? v.member : s.member].n)}` : '';
          const legsTxt = c.sets ? `Set ${v.sets[i]} · ${v.legs[i]}` : `${v.legsTotal[i]}`;
          return `<div class="${on ? 'on' : ''}"><div class="nm">${esc(s.name)}</div>
            <div class="pt b-num">${pts ? s.pts : s.closed + '/' + v.targets.length}</div>
            <div class="sub">${pts || c.type === 'x01' ? 'Leg' : 'Set'} ${legsTxt}${mem} · MPR ${s.mpr ? s.mpr.toFixed(2) : '0.00'}</div></div>`;
        };
        const tl = { D: 'çift', T: 'üçlü', B: 'bull', H: 'house' };
        const cell = (s, i, ti) => `<button type="button" class="sc-cell${s.marks[ti] >= 3 ? ' c3' : ''}${v.turn === i ? ' on' : ''}" data-s="${i}" data-t="${ti}" aria-label="${esc(s.name)} ${esc(v.targets[ti])}">${A.mark(Math.min(3, s.marks[ti]))}</button>`;
        let grid = `<div class="sc-head" style="grid-template-columns:${cols}">`;
        if (two) grid += headCell(v.sides[0], 0) + '<div></div>' + headCell(v.sides[1], 1);
        else grid += '<div></div>' + v.sides.map(headCell).join('');
        grid += '</div>';
        v.targets.forEach((t, ti) => {
          const lbl = `<div class="sc-t">${esc(t)}${tl[t] ? `<small>${tl[t]}</small>` : ''}</div>`;
          grid += `<div class="sc-row${v.dead[ti] ? ' dead' : ''}" style="grid-template-columns:${cols}">`;
          grid += two ? cell(v.sides[0], 0, ti) + lbl + cell(v.sides[1], 1, ti) : lbl + v.sides.map((s, i) => cell(s, i, ti)).join('');
          grid += '</div>';
        });
        const turnSide = v.turn != null ? v.sides[v.turn] : null;
        const isBot = turnSide && turnSide.members[v.member] && turnSide.members[v.member].bot;
        const next = v.turn != null ? v.sides[(v.turn + 1) % v.n].name : '';
        return `<div class="sx">${head()}
          <div class="sc-board" style="grid-template-rows:auto repeat(${v.targets.length}, minmax(0,1fr))">${grid}</div>
          <div>
            ${c.type === 'karambol' ? '<details class="sc-legend"><summary>D çift · T üçlü · B bull · H house — kurallar</summary><p>Üçlü: T açıksa T’ye bir işaret, kapalıysa sayıyı kapatır. Çift: D açıksa D’ye bir işaret, kapalıysa sayıya iki işaret. Bull bir, kırmızı bull iki işaret. Üç ok aynı sayıya gelirse (House açıksa) yalnız House yazılır. 1–11 tekleri sayılmaz.</p></details>' : ''}
            <div class="sc-acts">
              <button class="b-btn" type="button" data-a="undo">${ic.undo} Geri al</button>
              <button class="b-btn green" type="button" data-a="end" ${st.done || isBot ? 'disabled' : ''}>${st.done ? 'Maç bitti' : isBot ? esc(turnSide.name) + ' atıyor…' : `El bitti · sıra ${esc(next)}`}</button>
            </div>
          </div></div>`;
      }

      /* ---------- etkileşim ---------- */
      function onClick(e) {
        const b = e.target.closest('button');
        if (!b || b.disabled) return;
        if (b.dataset.d != null) return digit(b.dataset.d);
        if (b.dataset.q != null) {
          if (b._held) return (b._held = false);
          return submit(parseInt(b.dataset.q, 10));
        }
        if (b.dataset.edit != null) return editVisit(+b.dataset.edit);
        if (b.dataset.s != null) return tap(+b.dataset.s, +b.dataset.t, b);
        switch (b.dataset.a) {
          case 'back':
            return leave();
          case 'undo':
            buf = '';
            clearTimeout(botTimer);
            undo();
            return;
          case 'menu':
            return menu();
          case 'bksp':
            buf = buf.slice(0, -1);
            return paintInput();
          case 'enter':
            if (!buf) return fail('Önce sayıyı gir. Iska için 0 yaz.');
            return submit(parseInt(buf, 10));
          case 'bust':
            buf = '';
            return bust();
          case 'out':
            return checkoutAll();
          case 'end':
            return apply({ k: 'end' });
        }
      }
      // hızlı sayıya basılı tutunca değiştir
      function bindHold() {
        A.$$('.sx-quick button', root).forEach((b, i) => {
          let t;
          const start = () => {
            t = setTimeout(async () => {
              b._held = true;
              const v = await A.prompt('Hızlı sayı (0–180)', b.dataset.q);
              const n = parseInt(v, 10);
              if (v == null) return;
              if (!E.validVisit(n)) return A.toast('Geçerli bir el sayısı gir (0–180).', 'err');
              const q = A.quickList();
              q[i] = n;
              A.ls.set('quick', q);
              draw();
            }, 650);
          };
          const stop = () => clearTimeout(t);
          b.addEventListener('pointerdown', start);
          ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, stop));
          b.addEventListener('contextmenu', (e) => e.preventDefault());
        });
      }
      function paintInput() {
        const v = E.view(st);
        const t = v.turn != null ? v.sides[v.turn] : null;
        const d = root.querySelector('.sx-disp');
        if (!d || !t) return;
        const n = buf ? parseInt(buf, 10) : null;
        d.querySelector('.val').textContent = buf || '0';
        d.querySelector('.val').classList.toggle('ph', !buf);
        d.querySelector('.prev').textContent = n != null ? `${t.rem} → ${t.rem - n < 0 || (t.rem - n === 1 && st.cfg.outRule === 'double') ? 'BUST' : t.rem - n}` : 'Kalan ' + t.rem;
      }
      function digit(d) {
        if (st.done) return;
        const nb = (buf + d).replace(/^0+(?=\d)/, '');
        if (parseInt(nb, 10) > 180) return fail('Bir elde en fazla 180 atılır.');
        buf = nb.slice(0, 3);
        paintInput();
      }
      function isBotTurn() {
        const v = E.view(st);
        if (v.turn == null) return false;
        const mm = st.cfg.sides[v.turn].members[v.member];
        return !!(mm && mm.bot);
      }
      async function submit(score) {
        if (st.done || isBotTurn()) return;
        buf = '';
        const v = E.view(st);
        if (v.pending === 'rl') return decideLimit();
        const side = v.turn;
        const j = E.x01Judge(st, side, score);
        if (!j.ok) {
          paintInput();
          return fail(j.msg);
        }
        const a = { k: 'visit', p: score };
        const before = v.sides[side].rem;
        if (j.checkout) {
          const r = await askFinish(j.minDarts, before);
          if (!r) return paintInput();
          a.d = r.d;
          if (r.dd != null) a.dd = r.dd;
        } else if (st.cfg.askDD && before <= 50 && !j.bust) {
          const dd = await askDD(3, 'Çifte kaç ok attın?');
          if (dd == null) return paintInput();
          a.dd = dd;
        } else if (st.cfg.askDD && j.bust && before <= 50) {
          const dd = await askDD(3, 'Çifte kaç ok attın?');
          if (dd == null) return paintInput();
          a.dd = dd;
        }
        apply(a);
        if (j.bust) A.toast('Bust · ' + v.sides[side].name + ' ' + before + "'da kaldı.");
      }
      function bust() {
        if (st.done || isBotTurn()) return;
        const v = E.view(st);
        if (v.pending) return decideLimit();
        apply({ k: 'visit', p: 0, bust: true });
      }
      function checkoutAll() {
        const v = E.view(st);
        if (v.turn == null) return;
        const rem = v.sides[v.turn].rem;
        if (!E.minDarts(rem, st.cfg.outRule)) return fail(rem + ' tek elde bitmez.');
        submit(rem);
      }
      function askFinish(min, before) {
        return new Promise((res) => {
          const opts = [1, 2, 3].filter((d) => d >= min);
          const body = A.frag(`<div class="b-grid"><p class="b-muted" style="margin:0">${before} bitti. Kaç ok kullanıldı?</p>
            <div class="b-seg">${opts.map((d) => `<button type="button" data-d="${d}" style="flex:1;min-height:56px;font-size:20px">${d} ok</button>`).join('')}</div>
            ${st.cfg.askDD ? `<p class="b-muted" style="margin:6px 0 0">Bu elde çifte kaç ok attın?</p><div class="b-seg" data-dd>${[1, 2, 3].map((d) => `<button type="button" data-x="${d}" aria-pressed="${d === 1}" style="flex:1">${d}</button>`).join('')}</div>` : ''}</div>`);
          let dd = 1;
          const m = A.modal({ title: 'Bitiş', body, onClose: (v) => res(v || null) });
          body.addEventListener('click', (e) => {
            const x = e.target.closest('[data-x]');
            if (x) {
              dd = +x.dataset.x;
              A.$$('[data-x]', body).forEach((b) => b.setAttribute('aria-pressed', +b.dataset.x === dd));
              return;
            }
            const b = e.target.closest('[data-d]');
            if (!b) return;
            const d = +b.dataset.d;
            m.close({ d, dd: st.cfg.askDD ? Math.min(dd, d) : null });
          });
          if (opts.length === 1 && !st.cfg.askDD) m.close({ d: opts[0], dd: null });
        });
      }
      function askDD(max, title) {
        return new Promise((res) => {
          const body = A.frag(`<div class="b-seg">${Array.from({ length: max + 1 }, (_, i) => `<button type="button" data-x="${i}" style="flex:1;min-height:56px;font-size:20px">${i}</button>`).join('')}</div>`);
          const m = A.modal({ title, body, onClose: (v) => res(v == null ? null : v) });
          body.addEventListener('click', (e) => {
            const b = e.target.closest('[data-x]');
            if (b) m.close(+b.dataset.x);
          });
        });
      }
      function decideLimit() {
        const names = st.cfg.sides.map((s) => s.name);
        const body = A.frag(`<div class="b-grid"><p class="b-muted" style="margin:0">Tur sınırı doldu. Bull atışını (orta) kim kazandı?</p>${names.map((n, i) => `<button class="b-btn block" type="button" data-w="${i}">${esc(n)}</button>`).join('')}</div>`);
        const m = A.modal({ title: 'Bull atışı', body });
        body.addEventListener('click', (e) => {
          const b = e.target.closest('[data-w]');
          if (!b) return;
          m.close();
          apply({ k: 'rl', w: +b.dataset.w });
        });
      }
      function undo() {
        if (saved) return A.toast('Sonuç kaydedildi; düzeltmek için turnuva sayfasından “Sonucu geri al”ı kullan.');
        const r = E.act(st, { k: 'undo' });
        if (r.err) return A.toast(r.err);
        const prev = st;
        st = r.st;
        if (local) A.ls.set('local', st);
        else if (sync) sync.push(st);
        draw();
        if (prev.done) A.toast('Son atış geri alındı.');
        maybeBot();
      }
      async function editVisit(i) {
        const v = E.view(st);
        const r = v.rows[i];
        if (!r || st.done) return;
        if (r.c) return A.toast('Bitiş atışını düzeltmek için geri al.');
        const val = await A.prompt(`${st.cfg.sides[r.s].name} · ${r.no}. el (şimdi ${r.b ? 'bust' : r.p})`, r.b ? r.x || 0 : r.p);
        if (val == null) return;
        const n = parseInt(val, 10);
        if (!Number.isInteger(n)) return;
        apply({ k: 'edit', i, p: n });
      }
      function tap(s, t, btn) {
        if (st.done) return;
        if (isBotTurn()) return A.toast('Sıra botta.');
        const v = E.view(st);
        const before = v.sides[s].pts;
        const ok = apply({ k: 'tap', s, t }, true);
        if (!ok) {
          btn.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], { duration: 220 });
          return;
        }
        if (v.turn !== s && !st.done) A.toast('Sıra ' + st.cfg.sides[s].name + '’e geçti.');
        const after = E.view(st).sides[s].pts;
        if (after > before) {
          const cellEl = root.querySelector(`.sc-cell[data-s="${s}"][data-t="${t}"]`);
          if (cellEl) {
            cellEl.style.position = 'relative';
            const f = A.frag(`<span class="sc-flash">+${after - before}</span>`);
            cellEl.appendChild(f);
            setTimeout(() => f.remove(), 800);
          }
        }
      }
      function onKey(e) {
        if (document.querySelector('.b-modal')) return;
        if (e.target.matches && e.target.matches('input,textarea,select')) return;
        if (st.cfg.type !== 'x01') {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            apply({ k: 'end' });
          }
          if ((e.key === 'z' && (e.ctrlKey || e.metaKey)) || e.key === 'u') undo();
          return;
        }
        if (/^[0-9]$/.test(e.key)) digit(e.key);
        else if (e.key === 'Backspace') {
          buf = buf.slice(0, -1);
          paintInput();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (buf) submit(parseInt(buf, 10));
        } else if (e.key === 'Escape') {
          buf = '';
          paintInput();
        } else if ((e.key === 'z' && (e.ctrlKey || e.metaKey)) || e.key === 'u') undo();
      }

      /* ---------- bot ---------- */
      function maybeBot() {
        clearTimeout(botTimer);
        if (destroyed || !st || st.done || !isBotTurn()) return;
        const v = E.view(st);
        const lv = st.cfg.sides[v.turn].members[v.member].bot;
        botTimer = setTimeout(() => (st.cfg.type === 'x01' ? botX01(lv) : botCr(lv)), 700);
      }
      function botX01(lv) {
        const b = E.botX01(st, lv);
        const disp = root.querySelector('.sx-disp .val');
        let k = 0;
        const step = () => {
          if (destroyed) return;
          if (k < b.darts.length) {
            if (disp) {
              disp.classList.remove('ph');
              disp.textContent = b.darts.slice(0, k + 1).map((c) => (c === 'BULL' ? 'Bull' : c === 'MISS' ? '–' : c)).join(' ');
            }
            k++;
            botTimer = setTimeout(step, 480);
            return;
          }
          if (b.bust) apply({ k: 'visit', p: Math.min(180, b.p), bust: true });
          else apply({ k: 'visit', p: b.p, d: b.d, dd: st.cfg.askDD ? 1 : undefined });
        };
        step();
      }
      function botCr(lv) {
        const v = E.view(st);
        const side = v.turn;
        const b = st.cfg.type === 'karambol' ? E.botKarambol(st, lv) : E.botCricket(st, lv);
        const btn = root.querySelector('.sc-acts .green');
        if (btn) btn.textContent = (b.throws || b.darts || []).map((t) => (typeof t === 'string' ? t : t.text)).join(' · ') + (b.house ? ' · HOUSE' : '');
        let k = 0;
        const step = () => {
          if (destroyed || st.done) return;
          if (k < b.taps.length) {
            const tp = b.taps[k++];
            const r = E.act(st, { k: 'tap', s: side, t: tp.t, n: tp.n });
            if (!r.err) {
              const prev = st;
              st = r.st;
              if (local) A.ls.set('local', st);
              else if (sync) sync.push(st);
              if (st.done) return afterChange(prev);
              draw();
              const btn2 = root.querySelector('.sc-acts .green');
              if (btn2) btn2.textContent = (b.throws || b.darts || []).map((t) => (typeof t === 'string' ? t : t.text)).join(' · ');
            }
            botTimer = setTimeout(step, 450);
            return;
          }
          botTimer = setTimeout(() => apply({ k: 'end' }), 650);
        };
        botTimer = setTimeout(step, 900);
      }

      /* ---------- menü, çıkış, sonuç ---------- */
      function menu() {
        const v = E.view(st);
        const fresh = st.legs.length === 1 && (st.cfg.type === 'x01' ? !st.legs[0].v.length : !st.legs[0].a.length);
        const items = [];
        if (fresh) items.push(['starter', 'Başlayanı değiştir']);
        if (st.cfg.type === 'x01') items.push(['quick', 'Hızlı sayıları değiştir']);
        if (meta.server) items.push(['tv', 'TV ekranında aç'], ['share', 'İzleme bağlantısını paylaş']);
        items.push(['stats', 'İstatistikler']);
        if (meta.server && !meta.quick) items.push(['release', 'Skoru bırak (başka yönetici tutsun)']);
        if (local || meta.quick) items.push(['void', 'Maçı bitirmeden kapat']);
        const body = A.frag(`<div class="b-grid">${items.map(([k, t]) => `<button class="b-btn ghost block" style="justify-content:flex-start" type="button" data-m="${k}">${esc(t)}</button>`).join('')}</div>`);
        const m = A.modal({ title: 'Maç', body });
        body.addEventListener('click', async (e) => {
          const b = e.target.closest('[data-m]');
          if (!b) return;
          m.close();
          const k = b.dataset.m;
          if (k === 'starter') {
            const s = await chooseStarter(st.cfg.sides.map((x) => x.name));
            apply({ k: 'starter', s });
          } else if (k === 'quick') {
            const val = await A.prompt('12 hızlı sayıyı virgülle yaz', A.quickList().join(', '));
            if (val == null) return;
            const arr = val.split(/[ ,;]+/).filter(Boolean).map((x) => parseInt(x, 10));
            if (arr.length !== 12 || !arr.every((x) => E.validVisit(x))) return A.toast('12 geçerli sayı gerekli (0–180).', 'err');
            A.ls.set('quick', arr);
            draw();
          } else if (k === 'tv') window.open(A.tvUrl('mac=' + params.id), '_blank', 'noopener');
          else if (k === 'share') A.share(meta.title, A.siteUrl('masa=' + params.id + '&izle=1'));
          else if (k === 'stats') statsModal();
          else if (k === 'release') {
            await sync.waitIdle(5000);
            await A.rpc('bg_b01_match_release', { p_id: params.id }).catch(() => {});
            saved = true;
            A.go(meta.eventId ? '/e/' + meta.eventId : '/', true);
          } else if (k === 'void') {
            if (!(await A.confirm('Maçı kapat', 'Maç sonucu kaydedilmeden kapanacak.', 'Kapat', 'danger'))) return;
            if (local) A.ls.set('local', null);
            else {
              await A.rpc('bg_b01_match_void', { p_id: params.id }).catch(() => {});
              saved = true;
            }
            A.go('/', true);
          }
        });
      }
      function statsModal() {
        A.modal({ title: 'İstatistikler', body: A.statsTable(st), wide: st.cfg.sides.length > 2 });
      }
      async function leave() {
        if (A.leaveGuard && !A.leaveGuard()) return A.onBlockedLeave && A.onBlockedLeave();
        A.leaveGuard = null;
        if (meta.eventId) A.go('/e/' + meta.eventId);
        else history.length > 1 ? history.back() : A.go('/');
      }
      function showResult() {
        if (destroyed || !st.done) return;
        const res = E.result(st);
        const c = st.cfg;
        const names = c.sides.map((s) => s.name);
        const title = st.draw ? 'Berabere' : names[st.winner] + ' kazandı';
        const body = A.frag(`<div class="b-res"><div class="b-res-top"><b>${esc(title)}</b><div class="b-res-score">${res.score.join(' – ')}</div>
          <span class="b-muted">${esc(E.gameText(c))} · ${esc(E.formatText(c))}</span></div></div>`);
        body.appendChild(A.statsTable(st));
        const acts = [{ label: 'Son atışı geri al', kind: 'ghost', onClick: (m) => (m.close(), undo(), false) }];
        if (meta.server) {
          acts.push({
            label: meta.quick ? 'Maçı kaydet' : 'Sonucu kaydet',
            kind: 'gold',
            onClick: async (m) => {
              await saveResult();
              m.close();
              return false;
            },
          });
        } else {
          acts.push({ label: 'Yeni maç', kind: 'ghost', onClick: () => (A.ls.set('local', null), A.go('/yeni', true)) });
          acts.push({
            label: 'Rövanş',
            kind: 'gold',
            onClick: () => {
              const cfg = Object.assign({}, st.cfg, { starter: (st.cfg.starter + 1) % st.cfg.sides.length });
              st = E.create(cfg);
              A.ls.set('local', st);
              draw();
              maybeBot();
            },
          });
        }
        A.modal({ title: 'Maç sonucu', body, sticky: !!meta.server, actions: acts, wide: c.sides.length > 2 });
      }
      async function saveResult() {
        const res = E.result(st);
        const ok = await sync.waitIdle(8000);
        if (!ok && sync.lost) throw new Error('Skor bu cihazdan yazılamıyor.');
        const fin = () => A.rpc('bg_b01_match_finish', { p_id: params.id, p_seq: sync.seq + 1, p_state: st, p_result: res, p_summary: E.summary(st) });
        let r;
        try {
          r = await fin();
        } catch (e) {
          // yanıtı yolda kaybolan bitirme isteği: sunucuda maç bu sonuçla zaten bitmiş olabilir
          const done = await sync.doneWith(st);
          if (done === 'other') {
            saved = true;
            sync.stop();
            A.leaveGuard = null;
            A.toast('Bu maç başka bir cihazdan sonuçlandırılmış.', 'err');
            A.go(meta.eventId ? '/e/' + meta.eventId : '/izle/' + params.id, true);
            return null;
          }
          if (done === 'mine') r = { ok: true };
          else if ((e.code === 'BL002' || /BL002/.test(String(e.message || ''))) && (await sync.resync(st))) r = await fin();
          else throw e;
        }
        sync.seq++;
        saved = true;
        sync.stop();
        A.leaveGuard = null;
        A.toast('Sonuç kaydedildi.', 'ok');
        A.notifyChange();
        if (meta.eventId) {
          // sıradaki aşama (gruplardan eleme, İsviçre turu, lig sonu) yöneticinin cihazında hazırlanır
          try {
            await A.autoAdvance(meta.eventId, null, { boards: true });
          } catch (e) {
            console.warn('[b01] autoAdvance', e);
          }
          A.go('/e/' + meta.eventId, true);
        } else A.go('/izle/' + params.id, true);
        return r;
      }
      return cleanup;
    },
    { full: true }
  );

  /** Taraf/oyuncu istatistik tablosu */
  A.statsTable = function (st) {
    const s = E.stats(st);
    const c = st.cfg;
    const x = c.type === 'x01';
    const rows = x
      ? [
          ['3 ok ortalaması', (o) => o.avg.toFixed(2)],
          ['İlk 9 ortalaması', (o) => o.f9.toFixed(2)],
          ['180', (o) => o.c180],
          ['140+', (o) => o.c140],
          ['100+', (o) => o.c100],
          ['En yüksek bitiş', (o) => o.hiOut || '–'],
          ['En kısa leg (ok)', (o) => o.bestLeg || '–'],
          ['Kazanılan leg', (o) => o.legsWon],
          ['Atılan ok', (o) => o.darts],
        ]
      : [
          ['MPR (el başına işaret)', (o) => o.mpr.toFixed(2)],
          ['Toplam işaret', (o) => o.marks],
          ['El', (o) => o.rounds],
          [c.variant === 'points' ? 'Kazanılan leg' : 'Kazanılan set', (o) => o.legsWon],
        ];
    if (x && c.askDD) rows.splice(6, 0, ['Bitiş yüzdesi', (o) => (o.coPct == null ? '–' : '%' + o.coPct)]);
    const t = A.frag(`<table class="b-stat"><thead><tr><th></th>${c.sides.map((sd) => `<th>${esc(sd.name)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(([l, f]) => `<tr><th>${esc(l)}</th>${s.sides.map((o) => `<td>${f(o)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
    return t;
  };
})();
