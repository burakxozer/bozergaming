<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1013" />
<title>B01 Dart Merkezi · Bözer Gaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* =====================================================================
   B01 — dart merkezi
   Zemin site temasından gelir (gece / çuha / gündüz); dart kırmızısı, çift yeşili ve
   tabela sarısı B01'in kendi vurgularıdır. Rakamlar Big Shoulders Display ile yazılır.
   ===================================================================== */
:root,
html[data-bg-theme='gece'] {
  color-scheme: dark;
  --b-bg: #15122c;
  --b-s1: #1d1a3d;
  --b-s2: #262150;
  --b-s3: #302a63;
  --b-line: #322d66;
  --b-line2: #453e86;
  --b-ink: #f4eee2;
  --b-muted: #aca7cf;
  --b-faint: #7f7aa8;
  --b-gold: #f5b62a;
  --b-gold-ink: #231902;
  --b-red: #ec4a43;
  --b-green: #2bb673;
  --b-green-ink: #04170d;
  --b-chalk: #f4eee2;
  --b-shadow: 0 18px 50px -18px rgba(0, 0, 0, 0.65);
  --b-focus: #ffd166;
}
html[data-bg-theme='cuha'] {
  color-scheme: dark;
  --b-bg: #0d2a22;
  --b-s1: #12382d;
  --b-s2: #184536;
  --b-s3: #1f5342;
  --b-line: #2a6252;
  --b-line2: #387a66;
  --b-ink: #f3efe1;
  --b-muted: #a9c4b8;
  --b-faint: #7da394;
  --b-gold: #f5c64a;
  --b-gold-ink: #241b02;
  --b-red: #ff6b61;
  --b-green: #5ee9a0;
  --b-green-ink: #032016;
  --b-chalk: #f3efe1;
  --b-shadow: 0 18px 50px -18px rgba(0, 0, 0, 0.6);
  --b-focus: #ffe08a;
}
html[data-bg-theme='gunduz'] {
  color-scheme: light;
  --b-bg: #f4efe4;
  --b-s1: #fffdf8;
  --b-s2: #f1e9da;
  --b-s3: #e8dcc6;
  --b-line: #d8ccb2;
  --b-line2: #c4b493;
  --b-ink: #1e1a2e;
  --b-muted: #5f5a72;
  --b-faint: #8c869c;
  --b-gold: #b9850f;
  --b-gold-ink: #fffaf0;
  --b-red: #c8322b;
  --b-green: #138a4f;
  --b-green-ink: #f4fff8;
  --b-chalk: #1e1a2e;
  --b-shadow: 0 16px 40px -20px rgba(60, 40, 10, 0.35);
  --b-focus: #2f63de;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  background: var(--b-bg);
  color: var(--b-ink);
  font: 500 15px/1.45 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
:focus-visible {
  outline: 2px solid var(--b-focus);
  outline-offset: 2px;
}
.num,
.b-num {
  font-family: 'Big Shoulders Display', 'Barlow Condensed', 'Arial Narrow', sans-serif;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
}
[hidden] {
  display: none !important;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

/* ---------------- Kabuk ---------------- */
.b-app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr;
}
.b-top {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--b-line);
  background: var(--b-bg);
  min-width: 0;
}
.b-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--b-ink);
  flex: none;
}
.b-brand b {
  font: 900 26px/1 'Big Shoulders Display', sans-serif;
  letter-spacing: 0.02em;
}
.b-brand svg {
  width: 26px;
  height: 26px;
}
.b-nav {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  min-width: 0;
}
.b-nav::-webkit-scrollbar {
  display: none;
}
.b-nav a {
  flex: none;
  padding: 7px 12px;
  border-radius: 999px;
  color: var(--b-muted);
  text-decoration: none;
  font-weight: 650;
  font-size: 14px;
}
.b-nav a[aria-current='page'] {
  background: var(--b-s2);
  color: var(--b-ink);
}
.b-main {
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  min-height: 0;
}
.b-view {
  min-height: 100%;
}
.b-app.is-full .b-view {
  height: 100%;
}
.b-page {
  max-width: 1080px;
  margin: 0 auto;
  padding: 20px 16px 48px;
}
.b-app.is-full .b-top {
  display: none;
}
.b-app.is-full {
  grid-template-rows: 1fr;
}
.b-app.is-full .b-main {
  overflow: hidden;
}

/* ---------------- Ortak parçalar ---------------- */
h1,
h2,
h3 {
  margin: 0;
  line-height: 1.15;
}
.b-h1 {
  font: 850 clamp(28px, 6vw, 44px) / 1 'Big Shoulders Display', sans-serif;
  letter-spacing: 0.01em;
}
.b-h2 {
  font-size: 18px;
  font-weight: 800;
}
.b-h3 {
  font-size: 15px;
  font-weight: 750;
}
.b-muted {
  color: var(--b-muted);
}
.b-faint {
  color: var(--b-faint);
}
.b-sec {
  margin-top: 28px;
}
.b-sec-h {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px 12px;
  margin-bottom: 12px;
}
.b-sec-h > .b-row {
  flex-wrap: wrap;
}
.b-sec-h p {
  margin: 0;
}
.b-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 18px;
  border-radius: 12px;
  border: 1px solid var(--b-line2);
  background: var(--b-s2);
  color: var(--b-ink);
  font-weight: 750;
  text-decoration: none;
  white-space: nowrap;
  transition: background 0.15s, border-color 0.15s, transform 0.08s;
}
.b-btn:active {
  transform: translateY(1px);
}
.b-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.b-btn svg {
  width: 18px;
  height: 18px;
  flex: none;
}
.b-btn.gold {
  background: var(--b-gold);
  border-color: var(--b-gold);
  color: var(--b-gold-ink);
}
.b-btn.green {
  background: var(--b-green);
  border-color: var(--b-green);
  color: var(--b-green-ink);
}
.b-btn.ghost {
  background: transparent;
}
.b-btn.danger {
  background: transparent;
  border-color: color-mix(in srgb, var(--b-red) 60%, var(--b-line));
  color: var(--b-red);
}
.b-btn.sm {
  min-height: 36px;
  padding: 0 12px;
  border-radius: 10px;
  font-size: 14px;
}
.b-btn.block {
  width: 100%;
}
.b-iconbtn {
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--b-ink);
  flex: none;
}
.b-iconbtn:hover {
  background: var(--b-s2);
}
.b-iconbtn svg {
  width: 20px;
  height: 20px;
}
.b-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--b-s2);
  color: var(--b-muted);
  font-size: 12.5px;
  font-weight: 700;
  white-space: nowrap;
}
.b-chip.live {
  background: color-mix(in srgb, var(--b-red) 18%, transparent);
  color: var(--b-red);
}
.b-chip.live::before {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  animation: b-pulse 1.4s ease-in-out infinite;
}
.b-chip.ok {
  background: color-mix(in srgb, var(--b-green) 18%, transparent);
  color: var(--b-green);
}
.b-chip.gold {
  background: color-mix(in srgb, var(--b-gold) 20%, transparent);
  color: var(--b-gold);
}
@keyframes b-pulse {
  50% {
    opacity: 0.35;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
.b-card {
  background: var(--b-s1);
  border: 1px solid var(--b-line);
  border-radius: 16px;
}
.b-pad {
  padding: 16px;
}
.b-empty {
  padding: 26px 18px;
  text-align: center;
  color: var(--b-muted);
  border: 1px dashed var(--b-line2);
  border-radius: 16px;
}
.b-empty .b-btn {
  margin-top: 12px;
}
.b-grid {
  display: grid;
  gap: 12px;
}
.b-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.b-row.wrap {
  flex-wrap: wrap;
}
.b-sp {
  flex: 1;
  min-width: 0;
}
.b-ell {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.b-av {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--b-s3);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 800;
  color: var(--b-muted);
  flex: none;
  overflow: hidden;
}
.b-av img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Form */
.b-field {
  display: grid;
  gap: 6px;
  margin-bottom: 16px;
}
.b-field > label,
.b-label {
  font-size: 13px;
  font-weight: 750;
  color: var(--b-muted);
}
.b-hint {
  font-size: 13px;
  color: var(--b-faint);
  margin: 0;
}
.b-input,
.b-select,
.b-textarea {
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--b-line2);
  background: var(--b-bg);
  color: var(--b-ink);
}
.b-textarea {
  min-height: 120px;
  resize: vertical;
}
.b-input:focus,
.b-select:focus,
.b-textarea:focus {
  outline: none;
  border-color: var(--b-gold);
}
.b-input.sm {
  min-height: 36px;
  padding: 6px 10px;
}
.b-seg {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.b-seg button {
  min-height: 40px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid var(--b-line2);
  background: transparent;
  color: var(--b-muted);
  font-weight: 700;
}
.b-seg button[aria-pressed='true'] {
  background: var(--b-ink);
  border-color: var(--b-ink);
  color: var(--b-bg);
}
.b-opts {
  display: grid;
  gap: 8px;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
}
.b-opt {
  text-align: left;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--b-line2);
  background: var(--b-s1);
  display: grid;
  gap: 4px;
}
.b-opt b {
  font-size: 15px;
}
.b-opt span {
  color: var(--b-muted);
  font-size: 13px;
  line-height: 1.35;
}
.b-opt[aria-pressed='true'] {
  border-color: var(--b-gold);
  box-shadow: inset 0 0 0 1px var(--b-gold);
}
.b-switch {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  cursor: pointer;
}
.b-switch input {
  appearance: none;
  width: 44px;
  height: 26px;
  border-radius: 999px;
  background: var(--b-s3);
  position: relative;
  flex: none;
  transition: background 0.15s;
  cursor: pointer;
}
.b-switch input::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--b-ink);
  transition: transform 0.15s;
}
.b-switch input:checked {
  background: var(--b-green);
}
.b-switch input:checked::after {
  transform: translateX(18px);
  background: #fff;
}
.b-switch span {
  display: grid;
}
.b-switch small {
  color: var(--b-faint);
  font-size: 12.5px;
}
.b-stepper {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--b-line2);
  border-radius: 12px;
  overflow: hidden;
}
.b-stepper button {
  width: 40px;
  height: 40px;
  border: 0;
  background: var(--b-s2);
  font-size: 20px;
  font-weight: 700;
}
.b-stepper output {
  min-width: 48px;
  text-align: center;
  font: 800 20px/1 'Big Shoulders Display', sans-serif;
}

/* Bildirim ve pencere */
.b-toasts {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  display: grid;
  gap: 8px;
  z-index: 90;
  width: min(92vw, 420px);
  pointer-events: none;
}
body.b-full .b-toasts {
  top: calc(env(safe-area-inset-top, 0px) + 62px);
  bottom: auto;
}
.b-toast {
  padding: 12px 16px;
  border-radius: 14px;
  background: var(--b-ink);
  color: var(--b-bg);
  font-weight: 650;
  box-shadow: var(--b-shadow);
  animation: b-in 0.2s ease-out;
}
.b-toast.err {
  background: var(--b-red);
  color: #fff;
}
.b-toast.ok {
  background: var(--b-green);
  color: var(--b-green-ink);
}
@keyframes b-in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}
.b-modal {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(5, 4, 12, 0.62);
  animation: b-fade 0.15s ease-out;
}
@keyframes b-fade {
  from {
    opacity: 0;
  }
}
.b-dialog {
  width: min(100%, 520px);
  max-height: min(92vh, 860px);
  display: grid;
  grid-template-rows: auto 1fr auto;
  background: var(--b-s1);
  border: 1px solid var(--b-line2);
  border-radius: 20px;
  box-shadow: var(--b-shadow);
  overflow: hidden;
}
.b-dialog.wide {
  width: min(100%, 860px);
}
.b-dialog > header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 14px 10px 18px;
}
.b-dialog > header h2 {
  flex: 1;
  font-size: 18px;
}
.b-dialog > .b-dbody {
  overflow-y: auto;
  padding: 4px 18px 16px;
}
.b-dialog > footer {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  flex-wrap: wrap;
  padding: 12px 18px 16px;
  border-top: 1px solid var(--b-line);
}

/* ---------------- Merkez (ana sayfa) ---------------- */
.b-hero {
  display: grid;
  gap: 16px;
}
.b-hero p {
  margin: 6px 0 0;
  max-width: 60ch;
}
.b-starts {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.b-start {
  position: relative;
  display: grid;
  align-content: end;
  gap: 2px;
  min-height: 118px;
  padding: 14px;
  border-radius: 18px;
  border: 1px solid var(--b-line2);
  background: var(--b-s1);
  text-align: left;
  overflow: hidden;
  container-type: inline-size;
}
.b-start b,
.b-start span {
  position: relative;
  z-index: 1;
  text-shadow: 0 0 10px var(--b-s1), 0 1px 0 var(--b-s1);
}
.b-start b {
  font: 900 min(40px, 16cqw) / 0.9 'Big Shoulders Display', sans-serif;
}
.b-start span {
  color: var(--b-muted);
  font-size: 13px;
  font-weight: 650;
}
.b-start i {
  position: absolute;
  right: -18px;
  top: -18px;
  width: 86px;
  height: 86px;
  border-radius: 50%;
  opacity: 0.9;
  background: radial-gradient(circle, var(--b-red) 0 9%, var(--b-green) 9% 17%, transparent 17% 52%, var(--b-red) 52% 60%, transparent 60%);
}
.b-start:nth-child(2) i {
  background: radial-gradient(circle, var(--b-green) 0 9%, var(--b-red) 9% 17%, transparent 17% 52%, var(--b-green) 52% 60%, transparent 60%);
}
.b-start.alt i {
  width: 74px;
  height: 74px;
  background: repeating-linear-gradient(-45deg, var(--b-gold) 0 6px, transparent 6px 14px);
  border-radius: 12px;
  opacity: 0.5;
}
.b-lives {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(250px, 1fr);
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.b-live {
  display: grid;
  gap: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  border: 1px solid var(--b-line);
  background: var(--b-s1);
  text-align: left;
  text-decoration: none;
  color: inherit;
}
.b-live-l {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 10px;
  align-items: baseline;
}
.b-live-l .num {
  font-size: 22px;
  font-weight: 800;
  min-width: 2.6ch;
  text-align: right;
}
.b-live-k {
  flex: none;
  font-size: 11.5px;
  color: var(--b-faint);
  white-space: nowrap;
}
.b-live-s {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.b-live-s i {
  font-style: normal;
  display: inline-grid;
  place-items: center;
  min-width: 26px;
  height: 24px;
  padding: 0 6px;
  border-radius: 7px;
  background: var(--b-s2);
  border: 1px solid var(--b-line);
  font-weight: 800;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.b-live-s .num {
  margin-left: 4px;
}
.b-evs {
  display: grid;
  gap: 8px;
}
.b-ev {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid var(--b-line);
  background: var(--b-s1);
  text-decoration: none;
  color: inherit;
}
.b-ev-ic {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--b-s2);
  font: 900 18px/1 'Big Shoulders Display', sans-serif;
  color: var(--b-gold);
}
.b-ev-ic.lg {
  color: var(--b-green);
}
.b-ev h3 {
  font-size: 15.5px;
}
.b-ev p {
  margin: 2px 0 0;
  font-size: 13px;
  color: var(--b-muted);
}
.b-classic {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* ---------------- Hızlı maç kurulumu ---------------- */
.b-sides {
  display: grid;
  gap: 10px;
}
.b-side {
  display: grid;
  gap: 8px;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid var(--b-line);
  background: var(--b-s1);
}
.b-side-h {
  display: flex;
  align-items: center;
  gap: 8px;
}
.b-side-h .b-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex: none;
}
.b-mems {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.b-mem {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 6px 4px 10px;
  border-radius: 999px;
  background: var(--b-s2);
  font-size: 13.5px;
  font-weight: 650;
}
.b-mem button {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 0;
  background: transparent;
  color: var(--b-muted);
  font-size: 16px;
  line-height: 1;
}
.b-mem.bot {
  background: color-mix(in srgb, var(--b-gold) 18%, var(--b-s2));
}
.b-friends {
  display: grid;
  gap: 6px;
  max-height: 46vh;
  overflow-y: auto;
}
.b-friend {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 12px;
  border: 1px solid var(--b-line);
  background: transparent;
  text-align: left;
}
.b-friend[aria-pressed='true'] {
  border-color: var(--b-green);
  background: color-mix(in srgb, var(--b-green) 12%, transparent);
}
.b-friend[disabled] {
  opacity: 0.45;
}

/* ---------------- Skor ekranı (X01) ---------------- */
.sx {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
}
.sx-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  border-bottom: 1px solid var(--b-line);
  min-width: 0;
}
.sx-title {
  flex: 1;
  min-width: 0;
  display: grid;
  line-height: 1.2;
}
.sx-title b {
  font-size: 14.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sx-title small {
  color: var(--b-muted);
  font-size: 12.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sx-sync {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 750;
  color: var(--b-muted);
  white-space: nowrap;
}
.sx-sync i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--b-faint);
}
.sx-sync.on i {
  background: var(--b-green);
}
.sx-sync.wait i {
  background: var(--b-gold);
  animation: b-pulse 1s infinite;
}
.sx-sync.off i {
  background: var(--b-red);
}
.sx-wrap {
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  min-height: 0;
}
.sx-body {
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  min-height: 0;
}
.sx-sides {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  min-height: 0;
}
.sx-sides.n3,
.sx-sides.n4 {
  grid-auto-flow: row;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.sx-side {
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  align-items: center;
  padding: 10px 12px 10px;
  border-right: 1px solid var(--b-line);
  min-width: 0;
  min-height: 0;
  transition: background 0.2s;
}
.sx-side:last-child {
  border-right: 0;
}
.sx-sides.n3 .sx-side,
.sx-sides.n4 .sx-side {
  border-bottom: 1px solid var(--b-line);
}
.sx-side.on {
  background: linear-gradient(180deg, color-mix(in srgb, var(--b-gold) 14%, transparent), transparent 70%);
}
.sx-side.on::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 4px;
  background: var(--b-gold);
}
.sx-name {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  font-weight: 800;
  font-size: 15px;
}
.sx-name span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sx-name em {
  font-style: normal;
  font-size: 12px;
  font-weight: 700;
  color: var(--b-muted);
  white-space: nowrap;
}
.sx-turn {
  flex: none;
  width: 0;
  height: 0;
  border-left: 9px solid var(--b-gold);
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  opacity: 0;
}
.sx-side.on .sx-turn {
  opacity: 1;
}
.sx-rem {
  font: 800 clamp(54px, min(17vw, 19vh), 168px) / 0.86 'Big Shoulders Display', sans-serif;
  font-variant-numeric: tabular-nums;
  text-align: center;
  letter-spacing: -0.01em;
  color: var(--b-chalk);
}
.sx-sides.n3 .sx-rem,
.sx-sides.n4 .sx-rem {
  font-size: clamp(44px, min(12vw, 10vh), 110px);
}
.sx-side.out .sx-rem {
  color: var(--b-green);
}
.sx-route {
  min-height: 22px;
  text-align: center;
  font: 750 17px/1.2 'Big Shoulders Display', sans-serif;
  letter-spacing: 0.04em;
  color: var(--b-green);
}
.sx-meta {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 4px 12px;
  font-size: 12.5px;
  color: var(--b-muted);
  font-weight: 650;
}
.sx-meta b {
  color: var(--b-ink);
  font-weight: 800;
}
.sx-legs {
  display: inline-flex;
  gap: 3px;
}
.sx-legs i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.5px solid var(--b-line2);
}
.sx-legs i.w {
  background: var(--b-gold);
  border-color: var(--b-gold);
}
.sx-meta .sx-last.bust {
  color: var(--b-red);
}
.sx-sheet {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 10px;
  border-top: 1px solid var(--b-line);
  scrollbar-width: thin;
  min-height: 46px;
  align-items: center;
}
.sx-v {
  flex: none;
  display: grid;
  justify-items: center;
  padding: 3px 8px;
  border-radius: 9px;
  border: 1px solid var(--b-line);
  background: transparent;
  line-height: 1.05;
  min-width: 46px;
}
.sx-v b {
  font: 800 17px/1 'Big Shoulders Display', sans-serif;
}
.sx-v small {
  font-size: 10.5px;
  color: var(--b-faint);
  font-weight: 700;
}
.sx-v.bust b {
  color: var(--b-red);
}
.sx-v.co {
  border-color: var(--b-green);
}
.sx-v.co b {
  color: var(--b-green);
}
.sx-v.big b {
  color: var(--b-gold);
}
.sx-sheet .sx-none {
  color: var(--b-faint);
  font-size: 13px;
}
.sx-in {
  display: grid;
  gap: 6px;
  padding: 8px;
  border-top: 1px solid var(--b-line);
  background: color-mix(in srgb, var(--b-s1) 70%, var(--b-bg));
}
.sx-disp {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 0 12px;
  border-radius: 12px;
  background: var(--b-bg);
  border: 1px solid var(--b-line2);
}
.sx-disp .who {
  font-weight: 800;
  font-size: 14px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sx-disp .val {
  margin-left: auto;
  font: 850 34px/1 'Big Shoulders Display', sans-serif;
  font-variant-numeric: tabular-nums;
}
.sx-disp .val.ph {
  color: var(--b-faint);
}
.sx-disp .prev {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--b-muted);
  white-space: nowrap;
}
.sx-disp.shake {
  animation: b-shake 0.3s;
  border-color: var(--b-red);
}
@keyframes b-shake {
  25% {
    transform: translateX(-6px);
  }
  75% {
    transform: translateX(6px);
  }
}
.sx-quick {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
}
.sx-quick button {
  height: clamp(36px, 5.6vh, 50px);
  border-radius: 10px;
  border: 1px solid var(--b-line2);
  background: var(--b-s2);
  font: 800 21px/1 'Big Shoulders Display', sans-serif;
  font-variant-numeric: tabular-nums;
}
.sx-quick button.hi {
  color: var(--b-gold);
}
.sx-pad {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-rows: clamp(44px, 7.4vh, 66px);
  gap: 6px;
}
.sx-pad button {
  border-radius: 12px;
  border: 1px solid var(--b-line);
  background: var(--b-s1);
  font: 800 28px/1 'Big Shoulders Display', sans-serif;
  display: grid;
  place-items: center;
  touch-action: manipulation;
  user-select: none;
}
.sx-pad button:active,
.sx-quick button:active {
  background: var(--b-s3);
}
.sx-pad .fn {
  font: 800 14px/1.1 'Plus Jakarta Sans', sans-serif;
  color: var(--b-muted);
}
.sx-pad .fn svg {
  width: 22px;
  height: 22px;
}
.sx-pad .bust {
  color: var(--b-red);
  border-color: color-mix(in srgb, var(--b-red) 45%, var(--b-line));
}
.sx-pad .co {
  color: var(--b-gold);
  border-color: color-mix(in srgb, var(--b-gold) 45%, var(--b-line));
}
.sx-pad .enter {
  grid-row: span 2;
  background: var(--b-green);
  border-color: var(--b-green);
  color: var(--b-green-ink);
  font: 900 clamp(17px, 4.6vw, 26px) / 1 'Big Shoulders Display', sans-serif;
  letter-spacing: 0.04em;
}
.sx-pad button:disabled,
.sx-quick button:disabled {
  opacity: 0.4;
}
.sx-botcard {
  display: grid;
  place-items: center;
  gap: 8px;
  min-height: 160px;
  text-align: center;
}
.sx-botcard .darts {
  display: flex;
  gap: 8px;
}
.sx-botcard .darts span {
  min-width: 64px;
  padding: 8px 10px;
  border-radius: 12px;
  background: var(--b-s2);
  font: 800 24px/1 'Big Shoulders Display', sans-serif;
  animation: b-in 0.2s ease-out;
}
/* Yatay / geniş ekran: sol skor, sağ tuş takımı */
@media (min-width: 900px), (orientation: landscape) and (max-height: 560px) {
  .sx {
    grid-template-rows: auto minmax(0, 1fr);
  }
  .sx-wrap {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(330px, 0.9fr);
    min-height: 0;
  }
  .sx-in {
    border-top: 0;
    border-left: 1px solid var(--b-line);
    align-content: end;
  }
  .sx-pad {
    grid-auto-rows: clamp(44px, 10.5vh, 78px);
  }
  .sx-quick button {
    height: clamp(36px, 7.5vh, 56px);
  }
}
@media (orientation: landscape) and (max-height: 560px) {
  .sx-sheet {
    display: none;
  }
  .sx-rem {
    font-size: clamp(48px, 20vh, 120px);
  }
  .sx-pad {
    grid-auto-rows: clamp(36px, 11vh, 60px);
  }
  .sx-quick button {
    height: clamp(30px, 8vh, 44px);
  }
}
@media (max-height: 640px) and (orientation: portrait) {
  .sx-sheet {
    display: none;
  }
}

/* ---------------- Skor ekranı (Kriket / Karambol) ---------------- */
.sc-board {
  display: grid;
  min-height: 0;
  overflow: auto;
  padding: 6px;
  gap: 4px;
  align-content: stretch;
}
.sc-head,
.sc-row {
  display: grid;
  gap: 4px;
}
.sc-head > div {
  position: relative;
  padding: 8px 6px 6px;
  border-radius: 12px;
  text-align: center;
  min-width: 0;
}
.sc-head .on {
  background: color-mix(in srgb, var(--b-gold) 16%, transparent);
  box-shadow: inset 0 3px 0 var(--b-gold);
}
.sc-head .nm {
  font-weight: 800;
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sc-head .pt {
  font: 850 clamp(30px, 6vh, 54px) / 1 'Big Shoulders Display', sans-serif;
}
.sc-head .sub {
  font-size: 12px;
  color: var(--b-muted);
  font-weight: 650;
}
.sc-t {
  display: grid;
  place-items: center;
  font: 850 clamp(20px, 3.6vh, 30px) / 1 'Big Shoulders Display', sans-serif;
  border-radius: 10px;
  background: var(--b-s2);
  color: var(--b-ink);
}
.sc-t small {
  display: none;
}
.sc-cell {
  display: grid;
  place-items: center;
  min-height: clamp(34px, 5.4vh, 60px);
  border-radius: 10px;
  border: 1px solid var(--b-line);
  background: var(--b-s1);
  padding: 0;
  touch-action: manipulation;
  user-select: none;
}
.sc-cell:active {
  background: var(--b-s3);
}
.sc-cell svg {
  width: clamp(24px, 4vh, 40px);
  height: clamp(24px, 4vh, 40px);
  color: var(--b-chalk);
}
.sc-cell.c3 svg {
  color: var(--b-green);
}
.sc-cell.on {
  border-color: color-mix(in srgb, var(--b-gold) 45%, var(--b-line));
}
.sc-row.dead .sc-cell,
.sc-row.dead .sc-t {
  opacity: 0.35;
}
.sc-row.dead .sc-t {
  text-decoration: line-through;
}
.sc-acts {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px;
  padding: 8px;
  border-top: 1px solid var(--b-line);
}
.sc-acts .b-btn {
  min-height: 54px;
  font-size: 16px;
}
.sc-legend {
  padding: 6px 10px 0;
  font-size: 12.5px;
  color: var(--b-muted);
}
.sc-legend summary {
  cursor: pointer;
  font-weight: 700;
}
.sc-legend p {
  margin: 6px 0 0;
  color: var(--b-faint);
}
.sc-flash {
  position: absolute;
  inset: auto 0 6px 0;
  font: 850 18px/1 'Big Shoulders Display', sans-serif;
  color: var(--b-green);
  animation: b-rise 0.8s ease-out forwards;
}
@keyframes b-rise {
  to {
    opacity: 0;
    transform: translateY(-14px);
  }
}

/* ---------------- Maç sonu, leg sonu ---------------- */
.b-legban {
  position: fixed;
  left: 50%;
  top: 38%;
  transform: translate(-50%, -50%);
  z-index: 70;
  padding: 18px 30px;
  border-radius: 20px;
  background: var(--b-ink);
  color: var(--b-bg);
  text-align: center;
  box-shadow: var(--b-shadow);
  animation: b-pop 0.25s ease-out;
  pointer-events: none;
}
.b-legban b {
  display: block;
  font: 900 44px/1 'Big Shoulders Display', sans-serif;
}
@keyframes b-pop {
  from {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.85);
  }
}
.b-res {
  display: grid;
  gap: 14px;
}
.b-res-top {
  text-align: center;
  padding: 6px 0 2px;
}
.b-res-top b {
  display: block;
  font: 900 30px/1.05 'Big Shoulders Display', sans-serif;
}
.b-res-score {
  font: 900 56px/1 'Big Shoulders Display', sans-serif;
  letter-spacing: 0.04em;
}
.b-stat {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.b-stat th,
.b-stat td {
  padding: 7px 6px;
  border-bottom: 1px solid var(--b-line);
  text-align: center;
}
.b-stat th:first-child,
.b-stat td:first-child {
  text-align: left;
  color: var(--b-muted);
  font-weight: 650;
}
.b-stat td {
  font: 800 17px/1 'Big Shoulders Display', sans-serif;
  font-variant-numeric: tabular-nums;
}
.b-stat thead th {
  font-size: 13px;
  font-weight: 800;
  color: var(--b-ink);
}

/* ---------------- Turnuva ---------------- */
.b-steps {
  display: flex;
  gap: 6px;
  margin: 14px 0 18px;
  overflow-x: auto;
}
.b-steps span {
  flex: none;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 750;
  color: var(--b-faint);
  background: var(--b-s1);
  border: 1px solid var(--b-line);
}
.b-steps span.on {
  color: var(--b-bg);
  background: var(--b-ink);
  border-color: var(--b-ink);
}
.b-steps span.ok {
  color: var(--b-green);
}
.b-wiz-foot {
  position: sticky;
  bottom: 0;
  display: flex;
  gap: 8px;
  justify-content: space-between;
  padding: 12px 0;
  background: linear-gradient(transparent, var(--b-bg) 30%);
}
.b-entries {
  display: grid;
  gap: 6px;
}
.b-entry {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 8px 10px;
  border-radius: 12px;
  border: 1px solid var(--b-line);
  background: var(--b-s1);
}
.b-entry .no {
  font: 800 16px/1 'Big Shoulders Display', sans-serif;
  color: var(--b-faint);
  text-align: center;
}
.b-entry .b-input {
  min-height: 36px;
  padding: 6px 10px;
}
.b-entry .tools {
  display: flex;
  gap: 2px;
}
.b-entry .tools .b-iconbtn {
  width: 34px;
  height: 34px;
}
.b-entry .seed[aria-pressed='true'] {
  color: var(--b-gold);
}
.b-entry .mems {
  grid-column: 2 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.b-fix {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.b-fix span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 10px;
  border-radius: 10px;
  background: var(--b-s2);
  font-weight: 750;
  font-size: 13.5px;
}
.b-evhead {
  display: grid;
  gap: 10px;
}
.b-evhead .b-row.wrap {
  gap: 6px;
}
.b-tabs {
  display: flex;
  gap: 4px;
  margin: 16px 0;
  border-bottom: 1px solid var(--b-line);
  overflow-x: auto;
  scrollbar-width: none;
}
.b-tabs button {
  flex: none;
  padding: 10px 14px;
  border: 0;
  background: none;
  color: var(--b-muted);
  font-weight: 750;
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
}
.b-tabs button[aria-selected='true'] {
  color: var(--b-ink);
  border-bottom-color: var(--b-gold);
}
.b-champ {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 14px;
  align-items: center;
  padding: 16px 18px;
  border-radius: 18px;
  background: linear-gradient(120deg, color-mix(in srgb, var(--b-gold) 22%, var(--b-s1)), var(--b-s1) 60%);
  border: 1px solid color-mix(in srgb, var(--b-gold) 45%, var(--b-line));
}
.b-champ svg {
  grid-row: span 2;
  width: 46px;
  height: 46px;
  color: var(--b-gold);
}
.b-champ b {
  font: 900 30px/1 'Big Shoulders Display', sans-serif;
}
/* Maç kartı (fikstür, ağaç) */
.b-m {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  border-radius: 12px;
  border: 1px solid var(--b-line);
  background: var(--b-s1);
  overflow: hidden;
  text-align: left;
  padding: 0;
  width: 100%;
  font-size: 14px;
}
.b-m.live {
  border-color: color-mix(in srgb, var(--b-red) 55%, var(--b-line));
}
.b-m.ready {
  border-color: color-mix(in srgb, var(--b-gold) 45%, var(--b-line));
}
.b-m-sides {
  display: grid;
  min-width: 0;
}
.b-m-s {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 6px 10px;
  min-height: 32px;
}
.b-m-s + .b-m-s {
  border-top: 1px solid var(--b-line);
}
.b-m-s .nm {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 650;
}
.b-m-s.w .nm {
  font-weight: 850;
}
.b-m-s.l .nm {
  color: var(--b-faint);
}
.b-m-s.tbd .nm {
  color: var(--b-faint);
  font-style: italic;
}
.b-m-s .sc {
  font: 850 18px/1 'Big Shoulders Display', sans-serif;
  min-width: 18px;
  text-align: right;
}
.b-m-s.w .sc {
  color: var(--b-gold);
}
.b-m-side {
  display: grid;
  align-content: center;
  justify-items: center;
  gap: 3px;
  padding: 0 8px;
  border-left: 1px solid var(--b-line);
  min-width: 52px;
  font-size: 11.5px;
  font-weight: 750;
  color: var(--b-muted);
}
.b-m-side .b-chip {
  font-size: 11px;
  padding: 2px 7px;
}
.b-fixture {
  display: grid;
  gap: 18px;
}
.b-round h3 {
  font-size: 13px;
  font-weight: 800;
  color: var(--b-muted);
  margin-bottom: 8px;
}
.b-round .b-grid {
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
}
.b-bracket {
  position: relative;
  overflow-x: auto;

<body>
<noscript>B01 için JavaScript'i etkinleştir.</noscript>

<script>
/* ---- engine.js ---- */
/* =====================================================================
   B01 — dart skor motorları (tarayıcıda ve node'da çalışır, yan etkisiz)
   X01 (301/501/701/1001/serbest), Kriket (puanlı / kapatma), Karambol Kriket.
   Durum yalnız olaylardan oluşur (atışlar, işaretler); her şey bunlardan yeniden hesaplanır.
   Böylece geri alma, düzeltme ve izleyici ekranı her zaman aynı sonucu verir.
   ===================================================================== */
(function (root) {
  'use strict';
  const E = {};
  const clone = (o) => JSON.parse(JSON.stringify(o));
  E.clone = clone;

  /* ---------------- Dart tahtası ---------------- */
  const RING = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
  E.RING = RING;
  const BAD3 = [163, 166, 169, 172, 173, 175, 176, 178, 179];
  /** Üç okla atılabilecek bir toplam mı? */
  E.validVisit = (s) => Number.isInteger(s) && s >= 0 && s <= 180 && BAD3.indexOf(s) < 0;

  // Tüm tek ok sonuçları
  const DARTS = [];
  for (let n = 20; n >= 1; n--) {
    DARTS.push({ n, m: 3, v: 3 * n, c: 'T' + n });
    DARTS.push({ n, m: 2, v: 2 * n, c: 'D' + n });
    DARTS.push({ n, m: 1, v: n, c: String(n) });
  }
  DARTS.push({ n: 25, m: 1, v: 25, c: '25' });
  DARTS.push({ n: 25, m: 2, v: 50, c: 'BULL' });
  const DBY = {};
  DARTS.forEach((d) => (DBY[d.c] = d));
  E.dart = (code) => DBY[code] || null;

  // Bitiş tercihleri (standart bitiş tablolarına yakın sonuç verir)
  const D_PREF = [20, 16, 18, 12, 10, 8, 14, 4, 6, 2, 9, 11, 13, 15, 17, 19, 5, 7, 3, 1];
  function finishCost(d) {
    if (d.n === 25) return 11;
    if (d.m === 2) return d.n === 16 ? 0.5 : D_PREF.indexOf(d.n);
    if (d.m === 3) return 4 + (20 - d.n) * 0.6; // master bitiş
    return 6 + (20 - d.n) * 0.3; // düz bitiş
  }
  const T_PREF = [20, 19, 18, 17, 16, 15, 10, 14, 13, 12, 11, 9, 8, 7, 6, 5, 4, 3, 2, 1];
  function setupCost(d) {
    if (d.c === 'BULL') return 7;
    if (d.c === '25') return 6.5;
    if (d.m === 3) return T_PREF.indexOf(d.n) * 0.9;
    if (d.m === 1) return 2.6 + (20 - d.n) * 0.25;
    return 14 + (20 - d.n) * 0.2; // çift hazırlık oku nadiren
  }
  const canFinishWith = (rule, d) => (rule === 'straight' ? true : rule === 'master' ? d.m >= 2 : d.m === 2);

  const ROUTES = {};
  function routesFor(rule) {
    if (ROUTES[rule]) return ROUTES[rule];
    const MAX = 180;
    const c1 = new Array(MAX + 1).fill(null);
    const c2 = new Array(MAX + 1).fill(null);
    const c3 = new Array(MAX + 1).fill(null);
    DARTS.forEach((d) => {
      if (!canFinishWith(rule, d)) return;
      const c = finishCost(d);
      if (!c1[d.v] || c < c1[d.v].cost) c1[d.v] = { cost: c, r: [d.c] };
    });
    for (let R = 2; R <= MAX; R++) {
      DARTS.forEach((x) => {
        const L = R - x.v;
        if (L < 1 || !c1[L]) return;
        const c = setupCost(x) + c1[L].cost;
        if (!c2[R] || c < c2[R].cost) c2[R] = { cost: c, r: [x.c].concat(c1[L].r) };
      });
    }
    for (let R = 3; R <= MAX; R++) {
      DARTS.forEach((x) => {
        const L = R - x.v;
        if (L < 2 || !c2[L]) return;
        const c = setupCost(x) + c2[L].cost + (setupCost(x) > setupCost(DBY[c2[L].r[0]]) ? 0.05 : 0);
        if (!c3[R] || c < c3[R].cost) {
          // Yüksek değerli hazırlık oku önce yazılsın
          const r = [x.c].concat(c2[L].r);
          if (setupCost(DBY[r[1]]) < setupCost(DBY[r[0]])) r.splice(0, 2, r[1], r[0]);
          c3[R] = { cost: c, r };
        }
      });
    }
    return (ROUTES[rule] = { c1, c2, c3 });
  }
  /** Kalan sayıyı `darts` okla bitirme yolu (yoksa null). Örn. 170 → ['T20','T20','BULL'] */
  E.route = function (R, darts, rule) {
    rule = rule || 'double';
    if (!Number.isInteger(R) || R < 1 || R > 180) return null;
    const t = routesFor(rule);
    if (t.c1[R] && darts >= 1) return t.c1[R].r.slice();
    if (t.c2[R] && darts >= 2) return t.c2[R].r.slice();
    if (t.c3[R] && darts >= 3) return t.c3[R].r.slice();
    return null;
  };
  /** En az kaç okla bitebilir (bitemezse 0) */
  E.minDarts = function (R, rule) {
    const t = routesFor(rule || 'double');
    if (!Number.isInteger(R) || R < 1 || R > 180) return 0;
    return t.c1[R] ? 1 : t.c2[R] ? 2 : t.c3[R] ? 3 : 0;
  };
  E.routeText = (r) => (r ? r.map((c) => (c === 'BULL' ? 'Bull' : c)).join(' ') : '');

  /* ---------------- Ortak maç ayarları ---------------- */
  const KARAMBOL_T = ['20', '19', '18', '17', '16', '15', '14', '13', '12', 'D', 'T', 'B', 'H'];
  const CRICKET_T = ['20', '19', '18', '17', '16', '15', 'B'];
  E.KARAMBOL_T = KARAMBOL_T;
  E.CRICKET_T = CRICKET_T;
  const tval = (t) => (t === 'B' ? 25 : parseInt(t, 10) || 0);

  /** Maç ayarlarını doğrular ve eksikleri doldurur */
  E.normalize = function (cfg) {
    const c = clone(cfg || {});
    c.type = ['x01', 'cricket', 'karambol'].indexOf(c.type) >= 0 ? c.type : 'x01';
    if (c.type === 'x01') {
      c.start = Math.max(101, Math.min(9999, parseInt(c.start, 10) || 501));
      c.inRule = ['straight', 'double', 'master'].indexOf(c.inRule) >= 0 ? c.inRule : 'straight';
      c.outRule = ['straight', 'double', 'master'].indexOf(c.outRule) >= 0 ? c.outRule : 'double';
      c.roundLimit = Math.max(0, Math.min(99, parseInt(c.roundLimit, 10) || 0));
      c.askDD = !!c.askDD;
    } else {
      c.variant = c.type === 'karambol' ? 'close' : c.variant === 'close' ? 'close' : 'points';
      c.targets = c.type === 'karambol' ? KARAMBOL_T.slice() : CRICKET_T.slice();
    }
    c.legMode = c.legMode === 'total' ? 'total' : 'first';
    c.legs = Math.max(1, Math.min(c.legMode === 'total' ? 30 : 15, parseInt(c.legs, 10) || 1));
    c.sets = c.legMode === 'total' ? 0 : Math.max(0, Math.min(9, parseInt(c.sets, 10) || 0));
    if (c.sets === 1) c.sets = 0;
    const sides = Array.isArray(c.sides) ? c.sides : [];
    c.sides = sides.slice(0, 4).map((s, i) => {
      const members = (Array.isArray(s.members) && s.members.length ? s.members : [{ n: s.name || 'Oyuncu ' + (i + 1) }])
        .slice(0, 6)
        .map((m) => ({ n: String(m.n || '').trim().slice(0, 28) || 'Oyuncu', u: m.u || null, bot: m.bot ? Math.max(1, Math.min(11, m.bot | 0)) : 0 }));
      const o = { name: String(s.name || members.map((m) => m.n).join(' & ')).trim().slice(0, 40), members };
      if (c.type === 'x01' && s.start) o.start = Math.max(101, Math.min(9999, parseInt(s.start, 10) || c.start));
      return o;
    });
    while (c.sides.length < 2) c.sides.push({ name: 'Oyuncu ' + (c.sides.length + 1), members: [{ n: 'Oyuncu ' + (c.sides.length + 1), u: null, bot: 0 }] });
    c.starter = Math.max(0, Math.min(c.sides.length - 1, parseInt(c.starter, 10) || 0));
    return c;
  };

  E.create = function (cfg) {
    const c = E.normalize(cfg);
    const st = { v: 1, cfg: c, legs: [], done: false, winner: null, draw: false, t0: Date.now(), t1: null };
    st.legs.push(newLeg(st, 0, 0));
    return st;
  };
  function newLeg(st, setIdx, legInSet) {
    const n = st.cfg.sides.length;
    const setStarter = (st.cfg.starter + setIdx) % n;
    const legNo = st.legs.length;
    const starter = st.cfg.sets ? (setStarter + legInSet) % n : (st.cfg.starter + legNo) % n;
    const mStart = st.cfg.sides.map((s) => legNo % s.members.length);
    return st.cfg.type === 'x01' ? { set: setIdx, starter, mStart, v: [], w: null } : { set: setIdx, starter, mStart, a: [], w: null };
  }

  /** Bitmiş leg'lerden set/leg sayıları */
  function tally(st) {
    const n = st.cfg.sides.length;
    const sets = new Array(n).fill(0);
    let legs = new Array(n).fill(0);
    const legsTotal = new Array(n).fill(0);
    let curSet = 0;
    st.legs.forEach((L) => {
      if (L.w == null) return;
      legsTotal[L.w]++;
      if (st.cfg.sets) {
        if (L.set !== curSet) {
          curSet = L.set;
          legs = new Array(n).fill(0);
        }
        legs[L.w]++;
        if (legs[L.w] >= st.cfg.legs) {
          sets[L.w]++;
          curSet = L.set + 1;
          legs = new Array(n).fill(0);
        }
      } else legs[L.w]++;
    });
    return { sets, legs, legsTotal, curSet };
  }
  E.tally = tally;

  /** Leg bitince sıradaki leg'i ya da maç sonucunu belirler */
  function afterLeg(st) {
    const n = st.cfg.sides.length;
    const t = tally(st);
    const c = st.cfg;
    const played = st.legs.filter((L) => L.w != null).length;
    let done = false;
    if (c.legMode === 'total') {
      done = played >= c.legs;
      if (done) {
        const mx = Math.max.apply(null, t.legsTotal);
        const top = t.legsTotal.map((v, i) => (v === mx ? i : -1)).filter((i) => i >= 0);
        st.draw = top.length > 1;
        st.winner = st.draw ? null : top[0];
      }
    } else if (c.sets) {
      for (let i = 0; i < n; i++) if (t.sets[i] >= c.sets) (done = true), (st.winner = i);
    } else {
      for (let i = 0; i < n; i++) if (t.legs[i] >= c.legs) (done = true), (st.winner = i);
    }
    if (done) {
      st.done = true;
      st.t1 = Date.now();
      return;
    }
    const legInSet = c.sets ? t.legs.reduce((a, b) => a + b, 0) : 0;
    st.legs.push(newLeg(st, c.sets ? t.curSet : 0, legInSet));
  }
  function clearDone(st) {
    const was = st.done;
    st.done = false;
    st.winner = null;
    st.draw = false;
    st.t1 = null;
    return was;
  }

  /* =====================================================================
     X01
     ===================================================================== */
  function x01Leg(st, L) {
    const c = st.cfg;
    const n = c.sides.length;
    const rem = c.sides.map((s) => s.start || c.start);
    const cnt = new Array(n).fill(0); // taraf başına el sayısı
    const rows = [];
    let turn = L.starter;
    L.v.forEach((v) => {
      const before = rem[v.s];
      if (!v.b) rem[v.s] -= v.p;
      rows.push({ s: v.s, m: v.m, p: v.p, d: v.d, b: !!v.b, c: !!v.c, dd: v.dd, x: v.x, before, after: rem[v.s], no: cnt[v.s] + 1 });
      cnt[v.s]++;
      turn = (v.s + 1) % n;
    });
    const member = (s) => (L.mStart[s] + cnt[s]) % c.sides[s].members.length;
    return { rem, cnt, rows, turn, member: member(turn), memberOf: member };
  }

  /** Bir elin geçerliliği: {ok, bust, checkout, msg} */
  function judge(c, before, score) {
    if (!E.validVisit(score)) return { ok: false, msg: score > 180 ? 'Bir elde en fazla 180 atılabilir.' : score + ' üç okla atılamaz.' };
    const after = before - score;
    const rule = c.outRule;
    if (after < 0) return { ok: true, bust: true };
    if (after === 0) {
      const md = E.minDarts(before, rule);
      if (!md) return { ok: true, bust: true, msg: before + ' bu kuralla tek elde bitmez.' };
      return { ok: true, checkout: true, minDarts: md };
    }
    if (after === 1 && rule === 'double') return { ok: true, bust: true };
    return { ok: true };
  }
  E.x01Judge = (st, side, score) => {
    const L = st.legs[st.legs.length - 1];
    const info = x01Leg(st, L);
    return judge(st.cfg, info.rem[side], score);
  };

  function x01Visit(st, a) {
    const L = st.legs[st.legs.length - 1];
    if (st.done) return 'Maç bitti.';
    if (L.w != null) return 'Leg bitti.';
    if (L.pending) return 'Önce tur sınırı kararı verilmeli.';
    const info = x01Leg(st, L);
    const s = info.turn;
    const score = parseInt(a.p, 10);
    if (a.bust) {
      // "Bust" düğmesi ya da botun kuraldışı bitişi: el sıfır sayılır
      const v = { s, m: info.member, p: 0, d: 3, b: 1, fb: 1 };
      if (E.validVisit(score)) v.x = score;
      if (st.cfg.askDD && a.dd != null) v.dd = Math.max(0, Math.min(3, parseInt(a.dd, 10) || 0));
      L.v.push(v);
      checkLimit(st, L);
      return null;
    }
    const j = judge(st.cfg, info.rem[s], score);
    if (!j.ok) return j.msg;
    const v = { s, m: info.member, p: score, d: 3 };
    if (j.bust) {
      v.b = 1;
      v.x = score;
      v.p = 0;
    }
    if (j.checkout) {
      const d = parseInt(a.d, 10) || j.minDarts;
      if (d < j.minDarts || d > 3) return 'Bu bitiş en az ' + j.minDarts + ' ok ister.';
      v.c = 1;
      v.d = d;
    }
    if (st.cfg.askDD && a.dd != null) v.dd = Math.max(0, Math.min(v.c ? v.d : 3, parseInt(a.dd, 10) || 0));
    if (v.c && st.cfg.askDD && v.dd == null) v.dd = 1;
    L.v.push(v);
    if (v.c) {
      L.w = s;
      afterLeg(st);
      return null;
    }
    checkLimit(st, L);
    return null;
  }
  // Tur sınırı: herkes sınır kadar el attıysa bull atışıyla karar verilir
  function checkLimit(st, L) {
    const lim = st.cfg.roundLimit;
    if (lim && x01Leg(st, L).cnt.every((k) => k >= lim)) L.pending = 'rl';
  }
  function x01Undo(st) {
    const wasDone = clearDone(st);
    let L = st.legs[st.legs.length - 1];
    if (!wasDone && L.w == null && !L.pending && !L.v.length) {
      if (st.legs.length === 1) return 'Geri alınacak atış yok.';
      st.legs.pop();
      L = st.legs[st.legs.length - 1];
    }
    if (L.w != null) {
      if (L.rl) {
        delete L.rl;
        L.w = null;
        L.pending = 'rl';
        return null;
      }
      L.w = null;
      L.v.pop();
      return null;
    }
    if (L.pending) delete L.pending;
    L.v.pop();
    return null;
  }
  function x01Edit(st, a) {
    const L = st.legs[st.legs.length - 1];
    if (st.done || L.w != null) return 'Bitmiş leg düzeltilemez; önce geri al.';
    const i = a.i | 0;
    if (i < 0 || i >= L.v.length) return 'Atış bulunamadı.';
    if (L.v[i].c) return 'Bitiş atışı düzeltilemez; geri al.';
    const score = parseInt(a.p, 10);
    const test = clone(L);
    const rows = x01Leg(st, L).rows;
    const before = rows[i].before;
    const j = judge(st.cfg, before, score);
    if (!j.ok) return j.msg;
    if (j.checkout) return 'Bu değer leg’i bitirir. Bitişse sonraki atışları geri alıp yeniden gir.';
    test.v[i] = Object.assign({}, test.v[i], { p: j.bust ? 0 : score, b: j.bust ? 1 : 0, x: j.bust ? score : undefined });
    if (!test.v[i].b) delete test.v[i].b;
    if (test.v[i].x === undefined) delete test.v[i].x;
    // Sonraki atışlar hâlâ geçerli mi?
    const rem = st.cfg.sides.map((s) => s.start || st.cfg.start);
    for (let k = 0; k < test.v.length; k++) {
      const v = test.v[k];
      const raw = v.b ? v.x : v.p;
      const jj = judge(st.cfg, rem[v.s], raw);
      if (k > i && !v.fb) {
        if (!!jj.bust !== !!v.b || !!jj.checkout !== !!v.c) return 'Bu düzeltme sonraki atışları geçersiz kılar. Önce onları geri al.';
      }
      if (!v.b) rem[v.s] -= v.p;
    }
    L.v = test.v;
    return null;
  }
  function x01Decide(st, a) {
    const L = st.legs[st.legs.length - 1];
    if (L.pending !== 'rl') return 'Karar bekleyen leg yok.';
    const w = a.w | 0;
    if (w < 0 || w >= st.cfg.sides.length) return 'Geçersiz taraf.';
    delete L.pending;
    L.w = w;
    L.rl = 1;
    afterLeg(st);
    return null;
  }

  /* =====================================================================
     KRİKET / KARAMBOL — hücreye dokunma = 1 işaret
     ===================================================================== */
  function crLeg(st, L) {
    const c = st.cfg;
    const n = c.sides.length;
    const T = c.targets.length;
    const marks = c.sides.map(() => new Array(T).fill(0));
    const pts = new Array(n).fill(0);
    const eff = new Array(n).fill(0); // sayılan işaret
    const rounds = new Array(n).fill(0);
    const turnsBy = new Array(n).fill(0);
    let turn = L.starter;
    let turnTaps = 0;
    let turnMarks = 0;
    const hist = [];
    const mr = c.sides.map((s) => new Array(s.members.length).fill(0));
    const mm = c.sides.map((s) => new Array(s.members.length).fill(0));
    const endTurn = (next) => {
      const who = (L.mStart[turn] + turnsBy[turn]) % c.sides[turn].members.length;
      mr[turn][who]++;
      mm[turn][who] += turnMarks;
      rounds[turn]++;
      turnsBy[turn]++;
      hist.push({ s: turn, m: who, k: turnMarks });
      turnTaps = 0;
      turnMarks = 0;
      turn = next;
    };
    L.a.forEach((a) => {
      if (a.e) {
        endTurn((turn + 1) % n);
        return;
      }
      if (a.s !== turn) {
        if (turnTaps) endTurn(a.s);
        else turn = a.s;
      }
      turnTaps++;
      const t = a.t;
      for (let k = 0; k < (a.n || 1); k++) {
        if (marks[a.s][t] < 3) {
          marks[a.s][t]++;
          eff[a.s]++;
          turnMarks++;
        } else if (c.variant === 'points' && marks.some((m, i) => i !== a.s && m[t] < 3)) {
          pts[a.s] += tval(c.targets[t]);
          eff[a.s]++;
          turnMarks++;
        }
      }
    });
    const member = (s) => (L.mStart[s] + turnsBy[s]) % c.sides[s].members.length;
    if (turnTaps) {
      mr[turn][member(turn)]++;
      mm[turn][member(turn)] += turnMarks;
    }
    return { marks, pts, eff, rounds, turn, turnTaps, turnMarks, member: member(turn), memberOf: member, hist, mr, mm };
  }
  function crWinner(st, info) {
    const c = st.cfg;
    for (let s = 0; s < c.sides.length; s++) {
      if (!info.marks[s].every((m) => m >= 3)) continue;
      if (c.variant === 'points' && info.pts.some((p, i) => i !== s && p > info.pts[s])) continue;
      return s;
    }
    return null;
  }
  function crTap(st, a) {
    const L = st.legs[st.legs.length - 1];
    if (st.done) return 'Maç bitti.';
    const s = a.s | 0;
    const t = a.t | 0;
    if (s < 0 || s >= st.cfg.sides.length || t < 0 || t >= st.cfg.targets.length) return 'Geçersiz hücre.';
    const info = crLeg(st, L);
    // kapalı hücreye boşuna dokunma (puanlı kriketteki puan hariç) kayda geçmez
    const dead = info.marks[s][t] >= 3 && !(st.cfg.variant === 'points' && info.marks.some((m, i) => i !== s && m[t] < 3));
    if (dead) return 'Bu hedef kapalı.';
    const rec = { s, t, m: s === info.turn ? info.member : info.memberOf(s) };
    if (a.n > 1) rec.n = Math.min(3, a.n | 0);
    L.a.push(rec);
    const w = crWinner(st, crLeg(st, L));
    if (w != null) {
      L.w = w;
      afterLeg(st);
    }
    return null;
  }
  function crEnd(st) {
    const L = st.legs[st.legs.length - 1];
    if (st.done || L.w != null) return 'Leg bitti.';
    L.a.push({ e: 1 });
    return null;
  }
  function crUndo(st) {
    const wasDone = clearDone(st);
    let L = st.legs[st.legs.length - 1];
    if (!wasDone && L.w == null && !L.a.length) {
      if (st.legs.length === 1) return 'Geri alınacak işaret yok.';
      st.legs.pop();
      L = st.legs[st.legs.length - 1];
    }
    if (L.w != null) L.w = null;
    L.a.pop();
    return null;
  }

  /* ---------------- Ortak eylem girişi ---------------- */
  /** Durumun kopyasına eylemi uygular. Döner: {st, err} */
  E.act = function (state, a) {
    const st = clone(state);
    let err = null;
    const x = st.cfg.type === 'x01';
    switch (a && a.k) {
      case 'visit':
        err = x ? x01Visit(st, a) : 'Bu oyunda sayı girilmez.';
        break;
      case 'edit':
        err = x ? x01Edit(st, a) : 'Düzeltilemez.';
        break;
      case 'rl':
        err = x ? x01Decide(st, a) : 'Geçersiz.';
        break;
      case 'tap':
        err = x ? 'Bu oyunda hücre işaretlenmez.' : crTap(st, a);
        break;
      case 'end':
        err = x ? null : crEnd(st);
        break;
      case 'undo':
        err = x ? x01Undo(st) : crUndo(st);
        break;
      case 'starter': {
        const L = st.legs[0];
        if (st.legs.length > 1 || (x ? L.v.length : L.a.length)) err = 'Maç başladı; başlayan değiştirilemez.';
        else {
          st.cfg.starter = Math.max(0, Math.min(st.cfg.sides.length - 1, a.s | 0));
          st.legs = [newLeg(st, 0, 0)];
        }
        break;
      }
      default:
        err = 'Bilinmeyen işlem.';
    }
    return { st: err ? state : st, err };
  };

  /* ---------------- Görünüm modeli ---------------- */
  E.view = function (st) {
    const c = st.cfg;
    const n = c.sides.length;
    const L = st.legs[st.legs.length - 1];
    const t = tally(st);
    const legNo = st.legs.length;
    const setNo = (L.set || 0) + 1;
    const base = { type: c.type, n, done: st.done, winner: st.winner, draw: st.draw, sets: t.sets, legs: t.legs, legsTotal: t.legsTotal, legNo, setNo, starter: L.starter };
    if (c.type === 'x01') {
      const info = x01Leg(st, L);
      const stats = E.stats(st);
      base.turn = st.done ? null : info.turn;
      base.member = info.member;
      base.pending = L.pending || null;
      base.rows = info.rows;
      base.sides = c.sides.map((s, i) => {
        const r = info.rem[i];
        const last = info.rows.filter((x) => x.s === i).pop();
        return {
          name: s.name,
          members: s.members,
          rem: r,
          route: E.route(r, 3, c.outRule),
          avg: stats.sides[i].avg,
          last: last ? (last.b ? 'BUST' : last.p) : null,
          lastBust: !!(last && last.b),
          darts: info.rows.filter((x) => x.s === i).reduce((a, x) => a + x.d, 0),
          member: info.memberOf(i),
        };
      });
      return base;
    }
    const info = crLeg(st, L);
    base.turn = st.done ? null : info.turn;
    base.member = info.member;
    base.targets = c.targets;
    base.variant = c.variant;
    base.turnMarks = info.turnMarks;
    base.turnTaps = info.turnTaps;
    const stats = E.stats(st);
    base.sides = c.sides.map((s, i) => ({
      name: s.name,
      members: s.members,
      marks: info.marks[i],
      pts: info.pts[i],
      closed: info.marks[i].filter((m) => m >= 3).length,
      mpr: stats.sides[i].mpr,
      member: info.memberOf(i),
    }));
    // Hedefin durumu: herkes kapattıysa ölü
    base.dead = c.targets.map((_, ti) => info.marks.every((m) => m[ti] >= 3));
    return base;
  };

  /* ---------------- İstatistik ---------------- */
  function blankStat() {
    return { darts: 0, points: 0, visits: 0, f9p: 0, f9d: 0, c100: 0, c140: 0, c180: 0, hiOut: 0, bestLeg: 0, legsWon: 0, legsPlayed: 0, coHit: 0, coDarts: 0, busts: 0, marks: 0, rounds: 0, hiVisit: 0 };
  }
  function finishStat(o) {
    o.avg = o.darts ? Math.round((o.points / o.darts) * 300) / 100 : 0;
    o.f9 = o.f9d ? Math.round((o.f9p / o.f9d) * 300) / 100 : 0;
    o.mpr = o.rounds ? Math.round((o.marks / o.rounds) * 100) / 100 : 0;
    o.coPct = o.coDarts ? Math.round((o.coHit / o.coDarts) * 1000) / 10 : null;
    return o;
  }
  /** Taraf ve oyuncu bazında istatistik */
  E.stats = function (st) {
    const c = st.cfg;
    const sides = c.sides.map(() => blankStat());
    const mem = c.sides.map((s) => s.members.map(() => blankStat()));
    st.legs.forEach((L) => {
      const ended = L.w != null;
      if (c.type === 'x01') {
        if (!L.v.length && !ended) return;
        const per = c.sides.map(() => ({ d: 0, k: 0 }));
        L.v.forEach((v) => {
          [sides[v.s], mem[v.s][v.m] || blankStat()].forEach((o) => {
            o.darts += v.d;
            o.points += v.p;
            o.visits++;
            if (per[v.s].k < 3) {
              o.f9p += v.p;
              o.f9d += v.d;
            }
            if (v.p >= 180) o.c180++;
            else if (v.p >= 140) o.c140++;
            else if (v.p >= 100) o.c100++;
            if (v.p > o.hiVisit) o.hiVisit = v.p;
            if (v.b) o.busts++;
            if (v.c && v.p > o.hiOut) o.hiOut = v.p;
            if (c.askDD && v.dd != null) {
              o.coDarts += v.dd;
              if (v.c) o.coHit++;
            }
          });
          per[v.s].d += v.d;
          per[v.s].k++;
        });
        if (ended) {
          c.sides.forEach((_, i) => {
            if (per[i].k || L.w === i) sides[i].legsPlayed++;
          });
          const w = sides[L.w];
          w.legsWon++;
          if (!L.rl && (!w.bestLeg || per[L.w].d < w.bestLeg)) w.bestLeg = per[L.w].d;
          const lastV = L.v.filter((v) => v.s === L.w).pop();
          if (lastV) {
            const mo = mem[L.w][lastV.m];
            if (mo) {
              mo.legsWon++;
              if (!L.rl && (!mo.bestLeg || per[L.w].d < mo.bestLeg)) mo.bestLeg = per[L.w].d;
            }
          }
        }
      } else {
        const info = crLeg(st, L);
        c.sides.forEach((sd, i) => {
          sides[i].marks += info.eff[i];
          sides[i].rounds += info.rounds[i] + (info.turn === i && info.turnTaps ? 1 : 0);
          sd.members.forEach((_, j) => {
            mem[i][j].marks += info.mm[i][j];
            mem[i][j].rounds += info.mr[i][j];
          });
        });
        if (ended) {
          c.sides.forEach((_, i) => sides[i].legsPlayed++);
          sides[L.w].legsWon++;
          mem[L.w].forEach((o) => o.legsWon++);
        }
      }
    });
    return { sides: sides.map(finishStat), members: mem.map((a) => a.map(finishStat)) };
  };

  /** Maç sonucu (sunucuya gider) */
  E.result = function (st) {
    const t = tally(st);
    const stats = E.stats(st);
    const c = st.cfg;
    const score = c.sets ? t.sets : t.legsTotal;
    return {
      winner: st.winner,
      draw: !!st.draw,
      score,
      legs: t.legsTotal,
      sets: c.sets ? t.sets : null,
      stats: stats.sides.map((s, i) => ({ side: i, avg: s.avg, darts: s.darts, points: s.points, c180: s.c180, c140: s.c140, c100: s.c100, hiOut: s.hiOut, bestLeg: s.bestLeg, legsWon: s.legsWon, mpr: s.mpr, marks: s.marks, rounds: s.rounds, coHit: s.coHit, coDarts: s.coDarts })),
      players: [].concat.apply(
        [],
        c.sides.map((s, i) =>
          s.members.map((m, j) => {
            const o = stats.members[i][j];
            return { side: i, n: m.n, u: m.u || null, darts: o.darts, points: o.points, c180: o.c180, c140: o.c140, c100: o.c100, hiOut: o.hiOut, bestLeg: o.bestLeg, legsWon: o.legsWon, legsPlayed: stats.sides[i].legsPlayed, marks: o.marks, rounds: o.rounds, coHit: o.coHit, coDarts: o.coDarts };
          })
        )
      ),
    };
  };

  /** Listeler ve ağaç için kısa özet */
  E.summary = function (st) {
    const v = E.view(st);
    const o = { t: v.type, sc: st.cfg.sets ? v.sets : v.legsTotal, turn: v.turn, done: v.done, w: v.winner };
    if (st.cfg.sets) o.ls = v.legs;
    if (v.type === 'x01') o.r = v.sides.map((s) => s.rem);
    else o.r = v.sides.map((s) => (v.variant === 'points' ? s.pts : s.closed + '/' + v.targets.length));
    return o;
  };

  /** Sıradaki leg/set bilgisi: "2. Set · 3. Leg" */
  E.label = function (st) {
    const v = E.view(st);
    if (st.cfg.type === 'x01') return (st.cfg.sets ? v.setNo + '. Set · ' : '') + v.legNo + '. Leg';

      return { kind: st.done ? 'match' : v.c ? 'leg' : v.p === 180 ? '180' : 'visit', side: v.s, value: v.b ? 'BUST' : v.p, bust: !!v.b, n: countX(st) };

    let leg = L;
    if (!L.a.length && legs.length > 1) leg = legs[legs.length - 2];

  const countX = (st) => st.legs.reduce((a, L) => a + L.v.length, 0);

    // olay animasyonu
    if (st && opts.burst !== false) {
      const ev = lastEvent(st);
      const n = ev ? ev.n : 0;
      if (prev && prev.n != null && n > prev.n && ev) {
        const sideName = st.cfg.sides[ev.side] ? st.cfg.sides[ev.side].name : '';
        if (ev.kind === '180') burst(el, '180', '');
        else if (ev.kind === 'leg') burst(el, st.cfg.type === 'x01' ? String(ev.value) : 'SET', st.cfg.type === 'x01' ? 'BİTİRDİ · ' + sideName : sideName);
        else if (ev.kind === 'match') burst(el, 'MAÇ', (st.winner != null ? st.cfg.sides[st.winner].name : 'Berabere'));

  function crCard(st, model) {

  }

  function waitingCard(model) {
    const nm = names(model);
    return `<div class="tvb-sb">${top(model, null)}<div class="tvb-wait"><h2>${esc(nm[0] || '—')} – ${esc(nm[1] || '—')}</h2>

      ${o.next && o.next.length ? `<div class="tvb-list">${o.next.map(li).join('')}</div>` : `<p>${esc(o.empty || 'Şu an oynanan maç yok.')}</p>`}
      ${o.recent && o.recent.length ? `<p style="margin-top:.6em">Son sonuçlar</p><div class="tvb-list">${o.recent.map(li).join('')}</div>` : ''}
      ${o.qr ? `<div class="tvb-qr">${o.qr}<span>Telefonundan canlı takip etmek için okut</span></div>` : ''}
      </div><div class="tvb-foot"><span>${esc(o.foot || '')}</span><span class="mid">B01</span></div></div></div>`;
  };
})(typeof window !== 'undefined' ? window : this);

  /** Kriket işareti: 1 "/", 2 "X", 3 halkalı X */

  /* ---------------- bildirim, pencere ---------------- */
  let toasts;
  A.toast = function (text, type, ms) {

      document.body.appendChild(toasts);
    }
    const t = A.frag(`<div class="b-toast ${type || ''}">${A.esc(text)}</div>`);

    setTimeout(() => t.remove(), ms || (type === 'err' ? 5200 : 2800));
  };
  A.modal = function (o) {
    const prevFocus = document.activeElement;
    const wrap = A.frag(`<div class="b-modal" role="dialog" aria-modal="true" aria-label="${A.esc(o.title || '')}">
      <div class="b-dialog ${o.wide ? 'wide' : ''}">
        <header><h2>${A.esc(o.title || '')}</h2><button class="b-iconbtn" type="button" data-x aria-label="Kapat">${A.ic.close}</button></header>
        <div class="b-dbody"></div>
        <footer></footer>
      </div></div>`);
    const body = wrap.querySelector('.b-dbody');
    if (typeof o.body === 'string') body.innerHTML = o.body;
    else if (o.body) body.appendChild(o.body);
    const foot = wrap.querySelector('footer');
    const acts = o.actions || [];
    if (!acts.length) foot.remove();
    let closed = false;
    const m = {
      el: wrap,
      body,
      close(v) {
        if (closed) return;
        closed = true;
        wrap.remove();
        document.removeEventListener('keydown', onKey, true);
        if (prevFocus && prevFocus.focus) prevFocus.focus();
        if (o.onClose) o.onClose(v);
      },
    };
    acts.forEach((a) => {
      const b = A.frag(`<button class="b-btn ${a.kind || ''}" type="button">${a.label}</button>`);
      b.addEventListener('click', async () => {
        if (a.onClick) {
          b.disabled = true;
          try {
            const r = await a.onClick(m);
            if (r !== false) m.close(a.value);
          } catch (e) {
            A.toast(A.errText(e), 'err');
          } finally {
            b.disabled = false;
          }
        } else m.close(a.value);
      });
      foot.appendChild(b);
    });
    const onKey = (e) => {
      if (e.key === 'Escape' && !o.sticky) {
        e.stopPropagation();
        m.close();
      }
    };
    document.addEventListener('keydown', onKey, true);
    wrap.querySelector('[data-x]').addEventListener('click', () => m.close());
    wrap.addEventListener('click', (e) => {
      if (e.target === wrap && !o.sticky) m.close();
    });
    document.body.appendChild(wrap);
    setTimeout(() => {
      const f = wrap.querySelector('[autofocus], input, select, textarea, footer .b-btn:last-child');
      if (f) f.focus();
    }, 30);
    return m;
  };
  A.confirm = (title, text, ok, kind) =>
    new Promise((res) => {
      A.modal({
        title,
        body: `<p>${A.esc(text)}</p>`,
        onClose: (v) => res(v === true),
        actions: [
          { label: 'Vazgeç', kind: 'ghost', value: false },
          { label: ok || 'Tamam', kind: kind || 'gold', value: true },

  A.prompt = (title, value) =>
    new Promise((res) => {
      const m = A.modal({
        title,
        body: `<input class="b-input" value="${A.esc(value || '')}" autofocus>`,

          { label: 'Vazgeç', kind: 'ghost', value: null },

      const me = A.me();
      const list = (o.self && me ? [{ user_id: me.id, username: me.username, full_name: (me.full_name || me.username) + ' (sen)', avatar_url: me.avatar_url, self: true }] : []).concat(A.friends());

      const body = A.frag(`<div><input class="b-input" placeholder="Ara" style="margin-bottom:10px"><div class="b-friends"></div>

      const box = body.querySelector('.b-friends');
      const paint = (q) => {
        box.innerHTML = '';
        list
          .filter((f) => !q || (f.full_name + ' ' + f.username).toLocaleLowerCase('tr').includes(q))
          .forEach((f) => {
            const b = A.frag(`<button type="button" class="b-friend" aria-pressed="${sel.has(f.user_id)}" ${off.has(f.user_id) ? 'disabled' : ''}>
              ${A.avatar(f)}<span class="b-sp"><b>${A.esc(f.full_name || f.username)}</b><br><small class="b-muted">@${A.esc(f.username)}</small></span>${sel.has(f.user_id) ? A.ic.check : ''}</button>`);
            b.addEventListener('click', () => {
              if (!o.multi) {
                m.close([f]);
                return;
              }
              if (sel.has(f.user_id)) sel.delete(f.user_id);
              else {
                if (o.max && sel.size >= o.max) return A.toast('En fazla ' + o.max + ' kişi seçebilirsin.');
                sel.add(f.user_id);
              }
              paint(input.value.trim().toLocaleLowerCase('tr'));
            });

          });
      };
      const input = body.querySelector('input');
      input.addEventListener('input', () => paint(input.value.trim().toLocaleLowerCase('tr')));

          ? [
              { label: 'Vazgeç', kind: 'ghost' },

            ]
          : [],
      });
    }).then((r) => (r ? r.map((f) => ({ u: f.user_id, n: String(f.full_name || f.username).replace(/ \(sen\)$/, ''), username: f.username, avatar_url: f.avatar_url })) : null));
  };

  /* ---------------- yönlendirme ---------------- */
  const routes = [];
  A.route = (pattern, fn, opts) => routes.push({ re: new RegExp('^' + pattern.replace(/:(\w+)/g, '([^/]+)') + '$'), keys: (pattern.match(/:(\w+)/g) || []).map((k) => k.slice(1)), fn, opts: opts || {} });
  A.go = (path, replace) => {
    const h = '#' + path;

    }
    if (replace) history.replaceState(null, '', h);
    else if (location.hash !== h) history.pushState(null, '', h);
    render();
  };
  A.parse = () => {
    const h = location.hash.replace(/^#/, '') || '/';
    const [p, q] = h.split('?');
    return { path: p || '/', query: Object.fromEntries(new URLSearchParams(q || '')) };
  };
  let cleanup = null;
  let current = null;
  function render() {
    const { path, query } = A.parse();

    if (key === current) return;
    current = key;

      try {
        cleanup();
      } catch (e) {

      }
      cleanup = null;
    }
    const main = A.$('#main');
    main.scrollTop = 0;
    main.innerHTML = '';

    const view = document.createElement('div');
    view.className = 'b-view';
    main.appendChild(view);
    const app = A.$('.b-app');
    for (const r of routes) {
      const m = path.match(r.re);
      if (!m) continue;
      const params = {};
      r.keys.forEach((k, i) => (params[k] = decodeURIComponent(m[i + 1])));
      app.classList.toggle('is-full', !!r.opts.full);
      document.body.classList.toggle('b-full', !!r.opts.full); // skor ekranında bildirimler üstte çıkar (tuşları örtmez)
      A.$$('.b-nav a').forEach((a) => a.setAttribute('aria-current', a.dataset.nav === (r.opts.nav || '') ? 'page' : 'false'));
      try {
        cleanup = r.fn(view, params, query) || null;
      } catch (e) {
        console.error(e);
        view.innerHTML = `<div class="b-page"><p class="b-empty">${A.esc(A.errText(e))}</p></div>`;
      }
      return;
    }
    A.go('/', true);
  }
  A.refresh = () => {
    current = null;
    render();
  };
  A.leaveGuard = null; // skor ekranı: kaydedilmemiş sonuç varken uyarır
  const onNav = () => {
    if (location.hash === current) return;
    if (A.leaveGuard && !A.leaveGuard()) {
      history.pushState(null, '', current);
      if (A.onBlockedLeave) A.onBlockedLeave();
      return;
    }
    render();
  };
  window.addEventListener('popstate', onNav);
  window.addEventListener('hashchange', onNav);

  /* ---------------- tema ---------------- */
  function applyTheme() {
    let t = 'gece';
    try {
      t = JSON.parse(localStorage.getItem('bg.theme')) || 'gece';
    } catch (e) {}
    document.documentElement.setAttribute('data-bg-theme', t);
  }
  applyTheme();
  window.addEventListener('storage', (e) => {
    if (e.key === 'bg.theme') applyTheme();
  });

  /* ---------------- başlangıç ---------------- */
  A.start = function () {
    // Site dışında açıldıysa siteye yönlendir (giriş ve arkadaşlar site üzerinden gelir)
    if (window.top === window && !/[?&]yalniz=1/.test(location.search)) {
      const q = new URLSearchParams(location.search);
      const keep = new URLSearchParams();
      ['masa', 'izle', 'etkinlik'].forEach((k) => q.get(k) && keep.set(k, q.get(k)));
      location.replace('./#/oyun/b01' + (keep.toString() ? '?' + keep : ''));
      return;
    }
    const q = new URLSearchParams(location.search);
    if (!location.hash || location.hash === '#' || location.hash === '#/') {
      const GIT = { yeni: '/yeni', turnuvalar: '/turnuvalar', ligler: '/ligler', canli: '/canli', istatistik: '/istatistik', turnuva: '/olustur/tournament', lig: '/olustur/league' };
      if (q.get('masa')) history.replaceState(null, '', '#/izle/' + encodeURIComponent(q.get('masa')));
      else if (q.get('etkinlik')) history.replaceState(null, '', '#/e/' + encodeURIComponent(q.get('etkinlik')));
      else if (GIT[q.get('git')]) history.replaceState(null, '', '#' + GIT[q.get('git')]);
    }
    const app = A.frag(`<div class="b-app">
      <header class="b-top">
        <a class="b-brand" href="#/" aria-label="B01 ana sayfa">${A.ic.board}<b>B01</b></a>
        <nav class="b-nav" aria-label="B01">
          <a href="#/" data-nav="home">Merkez</a>
          <a href="#/yeni" data-nav="new">Hızlı maç</a>
          <a href="#/turnuvalar" data-nav="t">Turnuvalar</a>

          <a href="#/canli" data-nav="live">Canlı</a>
          <a href="#/istatistik" data-nav="stats">İstatistik</a>
        </nav>
      </header>
      <main class="b-main" id="main"></main>
    </div>`);
    document.body.appendChild(app);
    // Kullanıcı bilgisi gelince (giriş/çıkış) açık sayfayı tazele
    const B = A.site();
    if (B && B.bus) {
      let last = A.myId();
      const onMe = () => {

          last = now;

        }
      };
      B.bus.on('me', onMe);
      B.bus.on('auth', onMe);
    }
    render();
  };

  A.route(
    '/yeni',
    function (root, p, q) {
      const last = A.ls.get('lastSetup', null);

      const fresh = () => ({
        type: 'x01',
        start: 501,
        inRule: 'straight',
        outRule: 'double',
        variant: 'points',
        legMode: 'first',

        sets: 0,

      function paint() {
