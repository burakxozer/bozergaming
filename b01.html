      if (d.up != null) {
        const i = +d.up;
        if (i > 0) [w.entries[i - 1], w.entries[i]] = [w.entries[i], w.entries[i - 1]];
        return repaint();
      }
      if (d.seed != null) {
        const en = w.entries[+d.seed];
        en.seed = en.seed ? 0 : 1;
        return repaint();
      }
      if (d.mrm) {
        const [i, j] = d.mrm.split(':').map(Number);
        w.entries[i].members.splice(j, 1);
        return repaint();
      }
      if (d.madd != null) {
        const n = await A.prompt('Oyuncu adı', '');
        if (n && n.trim()) {
          const en = w.entries[+d.madd];
          en.members.push({ n: n.trim().slice(0, 28) });
          repaint();
        }
        return;
      }
      if (d.mfr != null) {
        const r = await A.pickFriends({ self: true, multi: true, max: 6, disabled: used() });
        if (r) {
          r.forEach((f) => w.entries[+d.mfr].members.push({ n: f.n, u: f.u }));
          repaint();
        }
        return;
      }
      switch (d.a) {
        case 'addMe': {
          const me = A.me();
          if (!me) return;
          if (used().indexOf(me.id) >= 0) return A.toast('Zaten listedesin.');
          w.entries.push({ name: A.myName(), members: [{ n: A.myName(), u: me.id }] });
          return repaint();
        }
        case 'addFriends': {
          const r = await A.pickFriends({ self: true, multi: true, max: team() ? 6 : 64, disabled: used(), title: team() ? 'Takım oyuncuları' : 'Katılımcı seç' });
          if (!r || !r.length) return;
          if (team()) w.entries.push({ name: r.map((f) => f.n).join(' & '), members: r.map((f) => ({ n: f.n, u: f.u })) });
          else r.forEach((f) => w.entries.push({ name: f.n, members: [{ n: f.n, u: f.u }] }));
          return repaint();
        }
        case 'addName': {
          const n = await A.prompt(team() ? 'Takım adı (oyuncuları sonra ekle)' : 'Katılımcı adı', '');
          if (!n || !n.trim()) return;
          w.entries.push({ name: n.trim().slice(0, 60), members: team() ? [] : [{ n: n.trim().slice(0, 28) }] });
          return repaint();
        }
        case 'bulk': {
          const body = A.frag(`<div><p class="b-muted" style="margin-top:0">Her satıra bir ${team() ? 'takım yaz; oyuncuları “/” ile ayır (Ali / Veli)' : 'isim yaz'}.</p><textarea class="b-textarea" rows="8" autofocus></textarea></div>`);
          A.modal({
            title: 'Toplu ekle',
            body,
            actions: [
              { label: 'Vazgeç', kind: 'ghost' },
              {
                label: 'Ekle',
                kind: 'gold',
                onClick: () => {
                  body
                    .querySelector('textarea')
                    .value.split('\n')
                    .map((l) => l.trim())
                    .filter(Boolean)
                    .slice(0, 256)
                    .forEach((l) => {
                      const parts = l.split('/').map((s) => s.trim()).filter(Boolean);
                      if (team() || parts.length > 1) w.entries.push({ name: parts.join(' & ').slice(0, 60), members: parts.map((n) => ({ n: n.slice(0, 28) })) });
                      else w.entries.push({ name: l.slice(0, 60), members: [{ n: l.slice(0, 28) }] });
                    });
                  repaint();
                },
              },
            ],
          });
          return;
        }
        case 'drawTeams':
          return drawTeams(w, repaint);
      }
    });
    root.addEventListener('change', (e) => {
      if (e.target.dataset.hc != null) {
        const v = parseInt(e.target.value, 10);
        if (e.target.value && !(v >= 101 && v <= 9999)) A.toast('Handikap 101–9999 arası bir başlangıç sayısı olmalı.', 'err');
      }
    });
  };
  /** Oyunculardan kura ile takım (eski Karambol turnuvasındaki gibi seribaşları ayrı takımlara) */
  function drawTeams(w, repaint) {
    const players = [];
    const body = A.frag(`<div><p class="b-muted" style="margin-top:0">Oyuncuları ekle, seribaşlarını ${ic.star.replace('<svg', '<svg style="width:14px;height:14px;vertical-align:-2px"')} ile işaretle. Seribaşları farklı takımlara dağılır.</p>
      <div class="b-row wrap" style="margin-bottom:10px"><span class="b-label">Takımda</span><span class="b-stepper" data-ts><button type="button" data-d="-1">−</button><output>2</output><button type="button" data-d="1">+</button></span><span class="b-label">oyuncu</span></div>
      <div class="b-row wrap" style="margin-bottom:10px">${A.authed() ? `<button class="b-btn sm" type="button" data-x="fr">${ic.users}Arkadaşlardan</button>` : ''}<button class="b-btn sm" type="button" data-x="nm">${ic.plus}İsim</button><button class="b-btn sm ghost" type="button" data-x="bulk">${ic.list}Toplu</button></div>
      <div class="b-mems" data-pl></div><p class="b-hint" data-info style="margin-top:10px"></p></div>`);
    let size = 2;
    const paint = () => {
      A.$('[data-pl]', body).innerHTML = players.length
        ? players.map((p, i) => `<span class="b-mem"><button type="button" data-sd="${i}" aria-label="Seribaşı" style="color:${p.seed ? 'var(--b-gold)' : 'inherit'}">${p.seed ? '★' : '☆'}</button>${esc(p.n)}<button type="button" data-rp="${i}" aria-label="Çıkar">×</button></span>`).join('')
        : '<span class="b-muted">Henüz oyuncu yok.</span>';
      A.$('[data-ts] output', body).textContent = size;
      const T = Math.floor(players.length / size);
      const extra = players.length - T * size;
      A.$('[data-info]', body).textContent = T >= 2 ? `${T} takım kurulacak${extra ? `; ${extra} takım ${size + 1} kişi olacak` : ''}.` : `En az ${size * 2} oyuncu gerekli.`;
    };
    body.addEventListener('click', async (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.d) {
        size = Math.max(2, Math.min(4, size + +b.dataset.d));
        return paint();
      }
      if (b.dataset.sd != null) {
        players[+b.dataset.sd].seed = !players[+b.dataset.sd].seed;
        return paint();
      }
      if (b.dataset.rp != null) {
        players.splice(+b.dataset.rp, 1);
        return paint();
      }
      if (b.dataset.x === 'fr') {
        const r = await A.pickFriends({ self: true, multi: true, max: 64, disabled: players.map((p) => p.u).filter(Boolean) });
        if (r) r.forEach((f) => players.push({ n: f.n, u: f.u }));
        return paint();
      }
      if (b.dataset.x === 'nm') {
        const n = await A.prompt('Oyuncu adı', '');
        if (n && n.trim()) players.push({ n: n.trim().slice(0, 28) });
        return paint();
      }
      if (b.dataset.x === 'bulk') {
        const v = await A.prompt('İsimleri virgülle ayırarak yaz', '');
        if (v) v.split(/[,\n]/).map((s) => s.trim()).filter(Boolean).forEach((n) => players.push({ n: n.slice(0, 28) }));
        return paint();
      }
    });
    paint();
    A.modal({
      title: 'Kura ile takım kur',
      body,
      actions: [
        { label: 'Vazgeç', kind: 'ghost' },
        {
          label: 'Kurayı çek',
          kind: 'gold',
          onClick: () => {
            const teams = BR.drawTeams(players, size);
            w.entries = teams;
            repaint();
            A.toast(teams.length + ' takım kuruldu.', 'ok');
          },
        },
      ],
    });
  }

  function sw(key, title, sub, on, scope) {
    return `<label class="b-switch"><input type="checkbox" data-${scope || 's'}sw="${key}" ${on ? 'checked' : ''}><span>${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}</span></label>`;
  }
  function step(k, label, val, min, max) {
    return `<div class="b-field" style="margin:0"><span class="b-label">${esc(label)}</span><span class="b-stepper" data-st="${k}" data-min="${min}" data-max="${max}"><button type="button" data-d="-1" aria-label="Azalt">−</button><output>${val}</output><button type="button" data-d="1" aria-label="Artır">+</button></span></div>`;
  }

  /** Biçim/oyun/takım bölümlerinin olayları (sihirbaz ve taslak düzenleme ortak) */
  A.wiz.bindSettings = function (root, w, repaint) {
    root.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      const ws = b.closest('[data-w]');
      if (ws && b.dataset.v != null) {
        const k = ws.dataset.w;
        if (k === 'double') w.settings.double = b.dataset.v === '1';
        else {
          w[k] = b.dataset.v;
          if (k === 'format' && ['se', 'de'].includes(w.format) && w.game.legMode === 'total') w.game.legMode = 'first';
          if (k === 'format' && w.format === 'swiss') w.settings.points = Object.assign({}, w.settings.points, { w: 1, d: 0.5, l: 0, bye: 1 });
        }
        return repaint();
      }
      const gs = b.closest('[data-g]');
      if (gs && b.dataset.v != null) {
        const k = gs.dataset.g;
        const v = b.dataset.v;
        const g = w.game;
        if (k === 'start') g.start = +v;
        else if (k === 'legMode') {
          if (v === 'sets') {
            g.legMode = 'first';
            g.sets = g.sets > 1 ? g.sets : 2;
            g.legs = Math.min(g.legs, 9);
          } else {
            g.legMode = v;
            g.sets = 0;
          }
        } else g[k] = v;
        if (k === 'type' && v === 'karambol' && g.sets > 1) g.sets = 0;
        return repaint();
      }
      const stp = b.closest('[data-st]');
      if (stp) {
        const k = stp.dataset.st;
        const min = +stp.dataset.min;
        const max = +stp.dataset.max;
        const d = +b.dataset.d;
        const clamp = (v) => Math.max(min, Math.min(max, v));
        const s = w.settings;
        if (k === 'glegs') w.game.legs = clamp(w.game.legs + d);
        else if (k === 'gsets') w.game.sets = clamp(w.game.sets + d);
        else if (k === 'pw' || k === 'pd' || k === 'pl' || k === 'pb') {
          const key = { pw: 'w', pd: 'd', pl: 'l', pb: 'bye' }[k];
          s.points[key] = clamp((s.points[key] || 0) + d);
        } else if (k === 'rfe1' || k === 'rfe2') {
          const r = k === 'rfe1' ? '1' : '2';
          s.rfe = s.rfe || {};
          const cur = (s.rfe[r] && (w.game.sets > 1 ? s.rfe[r].sets : s.rfe[r].legs)) || 0;
          const nv = clamp(cur + d);
          if (!nv) delete s.rfe[r];
          else s.rfe[r] = w.game.sets > 1 ? { sets: nv, legs: w.game.legs } : { legs: nv };
        } else s[k] = clamp((s[k] || 0) + d);
        return repaint();
      }
      if (b.dataset.a === 'addRule') {
        w.settings.points.rules = (w.settings.points.rules || []).concat([{ a: w.game.legs, b: 0, pa: 3, pb: 0 }]);
        return repaint();
      }
      if (b.dataset.rmrule != null) {
        w.settings.points.rules.splice(+b.dataset.rmrule, 1);
        return repaint();
      }
      if (b.dataset.a === 'addFix') {
        w.settings.fixture.push({ k: 's' });
        return repaint();
      }
      if (b.dataset.fk != null) {
        const f = w.settings.fixture[+b.dataset.fk];
        f.k = f.k === 'd' ? 's' : 'd';
        return repaint();
      }
      if (b.dataset.fx != null) {
        w.settings.fixture.splice(+b.dataset.fx, 1);
        return repaint();
      }
      if (b.dataset.preset) {
        w.settings.fixture = b.dataset.preset.split('').map((k) => ({ k }));
        return repaint();
      }
    });
    root.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset.ssw) {
        w.settings[t.dataset.ssw] = t.checked;
        repaint();
      } else if (t.dataset.gsw) {
        w.game[t.dataset.gsw] = t.checked;
        repaint();
      } else if (t.dataset.gstart != null) {
        const n = parseInt(t.value, 10);
        if (n >= 101 && n <= 9999) w.game.start = n;
        else if (t.value) A.toast('Başlangıç 101–9999 arası olmalı.', 'err');
        repaint();
      } else if (t.dataset.r) {
        const row = t.closest('[data-rule]');
        const r = w.settings.points.rules[+row.dataset.rule];
        r[t.dataset.r] = Math.max(0, Math.min(99, parseInt(t.value, 10) || 0));
      }
    });
  };
  /** Sunucuya gidecek ayarlar */
  A.wiz.payload = function (w) {
    const s = JSON.parse(JSON.stringify(w.settings));
    if (w.team_mode !== 'fixture') delete s.fixture;
    s.points.rules = (s.points.rules || []).filter((r) => Number.isInteger(r.a) && Number.isInteger(r.b) && r.a !== r.b);
    return {
      kind: w.kind,
      name: w.name.trim(),
      format: w.format,
      team_mode: w.team_mode,
      visibility: w.visibility,
      game: E.normalize(Object.assign({}, w.game, { sides: [] })) && pickGame(w.game),
      settings: s,
      entries: w.entries.map((e, i) => ({ name: (e.name || '').trim() || (e.members || []).map((m) => m.n).join(' & '), members: e.members || [], seed: e.seed ? seedNo(w, i) : null, handicap: e.handicap || null })),
      managers: (w.managers || []).map((m) => m.u),
    };
  };
  function seedNo(w, i) {
    let k = 0;
    for (let j = 0; j <= i; j++) if (w.entries[j].seed) k++;
    return k;
  }
  function pickGame(g) {
    const o = { type: g.type, legs: g.legs, sets: g.legMode === 'total' ? 0 : g.sets || 0, legMode: g.legMode };
    if (g.type === 'x01') Object.assign(o, { start: g.start, inRule: g.inRule, outRule: g.outRule, askDD: !!g.askDD, roundLimit: g.roundLimit || 0 });
    if (g.type === 'cricket') o.variant = g.variant;
    return o;
  }
  A.wiz.validate = function (w, step) {
    if (step >= 0 && w.name.trim().length < 2) return 'Bir ad yaz (en az 2 harf).';
    if (step >= 2) {
      if (w.entries.length < 2) return 'En az 2 katılımcı ekle.';
      if (w.team_mode !== 'single' && w.entries.some((e) => !(e.members || []).length)) return 'Her takımda en az bir oyuncu olmalı.';
      if (w.team_mode === 'fixture') {
        const n = (w.settings.fixture || []).length;
        if (!n) return 'Karşılaşmaya en az bir maç ekle.';
        if (isKO(w) && n % 2 === 0) return 'Elemede karşılaşmadaki maç sayısı tek olmalı.';
        if (w.settings.fixture.some((f) => f.k === 'd') && w.entries.some((e) => (e.members || []).length < 2)) return 'Çiftler maçı için her takımda en az iki oyuncu olmalı.';
      }
      if (w.format === 'groups' && w.entries.length < w.settings.groups * 2) return `${w.settings.groups} grup için en az ${w.settings.groups * 2} katılımcı gerekli.`;
      if (w.format === 'groups' && w.settings.advance * w.settings.groups < 2) return 'Gruptan en az bir kişi çıkmalı.';
      if (w.format === 'groups' && w.entries.length / w.settings.groups < w.settings.advance) return 'Gruptan çıkan sayısı grup büyüklüğünden fazla olamaz.';
      if (w.format === 'de' && w.entries.length < 3) return 'Çift eleme için en az 3 katılımcı gerekli.';
    }
    return null;
  };

  /* ---------------- sihirbaz ekranı ---------------- */
  A.route('/olustur/:kind', function (root, params) {
    if (!A.authed()) {
      root.innerHTML = `<div class="b-page"><div class="b-empty">Turnuva ve lig kurmak için giriş yap.<br><button class="b-btn gold" data-login>Giriş yap</button></div></div>`;
      A.$('[data-login]', root).addEventListener('click', A.login);
      return;
    }
    if (!A.canCreate()) {
      root.innerHTML = `<div class="b-page"><div class="b-empty">Turnuva ve lig açma şu an yalnız site yöneticisine açık.</div></div>`;
      return;
    }
    const kind = params.kind === 'league' ? 'league' : 'tournament';
    const w = A.defaultWizard(kind);
    let stepNo = 0;
    const STEPS = ['Tür ve biçim', 'Oyun', kind === 'league' ? 'Takımlar / oyuncular' : 'Katılımcılar', 'Yöneticiler ve yayın'];
    const paint = () => {
      const sc = root.querySelector('.b-main') || root;
      const body =
        stepNo === 0
          ? `<div class="b-field"><label>${kind === 'league' ? 'Lig adı' : 'Turnuva adı'}</label><input class="b-input" data-name maxlength="60" value="${esc(w.name)}" placeholder="${kind === 'league' ? 'Perşembe Ligi 2026 Bahar' : 'Bahar Kupası'}" autofocus></div>${A.wiz.formatHtml(w)}`
          : stepNo === 1
          ? A.wiz.gameHtml(w)
          : stepNo === 2
          ? A.wiz.teamHtml(w) + A.wiz.entriesHtml(w)
          : managersHtml();
      root.innerHTML = `<div class="b-page" style="max-width:820px"><h1 class="b-h1">${kind === 'league' ? 'Lig kur' : 'Turnuva kur'}</h1>
        <div class="b-steps">${STEPS.map((s, i) => `<span class="${i === stepNo ? 'on' : i < stepNo ? 'ok' : ''}">${i + 1}. ${esc(s)}</span>`).join('')}</div>
        <div data-body>${body}</div>
        <div class="b-wiz-foot">${stepNo ? `<button class="b-btn ghost" type="button" data-nav="-1">${ic.back}Geri</button>` : '<a class="b-btn ghost" href="#/">Vazgeç</a>'}
          ${stepNo < 3 ? `<button class="b-btn gold" type="button" data-nav="1">Devam${ic.next}</button>` : `<button class="b-btn gold" type="button" data-a="create">${ic.check}${kind === 'league' ? 'Ligi oluştur' : 'Turnuvayı oluştur'}</button>`}</div></div>`;
      void sc;
    };
    function managersHtml() {
      return `<div class="b-field"><label>Yöneticiler</label><p class="b-hint">Seçtiğin arkadaşlar maçlara girip skor tutabilir, sonuç girebilir. Seçilenlere bildirim gider.</p>
        <div class="b-mems" style="margin:8px 0">${w.managers.map((m, i) => `<span class="b-mem">${esc(m.n)}<button type="button" data-mgrm="${i}" aria-label="Çıkar">×</button></span>`).join('') || '<span class="b-muted">Yalnız sen yöneteceksin.</span>'}</div>
        <button class="b-btn sm" type="button" data-a="pickMgr">${ic.users}Arkadaşlardan seç</button></div>
        <div class="b-field"><label>İzleme</label><div class="b-seg" data-w="visibility"><button type="button" data-v="public" aria-pressed="${w.visibility === 'public'}">Herkese açık</button><button type="button" data-v="link" aria-pressed="${w.visibility === 'link'}">Gizli (yalnız bağlantıyla)</button></div>
          <p class="b-hint">${w.visibility === 'public' ? 'Turnuva listesinde görünür; herkes canlı izleyebilir.' : 'Listelerde görünmez; bağlantıyı ya da kodu bilen izler.'}</p></div>
        <div class="b-field"><label>Tahtalar (isteğe bağlı)</label><div class="b-row wrap" style="gap:16px">${step('bn', 'Tahta sayısı (0: yok)', w.settings.boards.n, 0, 32)}</div>
          ${w.settings.boards.n ? sw('autoBoards', 'Maçları boş tahtalara kendiliğinden dağıt', 'Bir tahtadaki maç bitince sıradaki hazır maç o tahtaya atanır ve oyunculara bildirim gider.', w.settings.boards.auto) : ''}</div>
        <div class="b-card b-pad"><b>Özet</b><p class="b-muted" style="margin:6px 0 0">${esc(w.kind === 'league' ? 'Lig' : A.FORMAT_INFO[w.format][0])} · ${esc(E.gameText(w.game))} · ${esc(E.formatText(w.game))} · ${w.entries.length} ${w.team_mode === 'single' ? 'katılımcı' : 'takım'}${w.team_mode === 'fixture' ? ' · karşılaşmada ' + w.settings.fixture.length + ' maç' : ''}</p>
          <p class="b-hint" style="margin-top:6px">Oluşturduktan sonra turnuva sayfasında kurayı çekip başlatırsın. Başlamadan önce katılımcıları ve ayarları değiştirebilirsin.</p></div>`;
    }
    root.addEventListener('input', (e) => {
      if (e.target.dataset.name != null) w.name = e.target.value;
    });
    A.wiz.bindSettings(root, w, paint);
    A.wiz.bindEntries(root, w, paint);
    root.addEventListener('click', async (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.nav) {
        const d = +b.dataset.nav;
        if (d > 0) {
          const err = A.wiz.validate(w, stepNo);
          if (err) return A.toast(err, 'err');
        }
        stepNo = Math.max(0, Math.min(3, stepNo + d));
        paint();
        A.$('#main').scrollTop = 0;
        return;
      }
      if (b.dataset.mgrm != null) {
        w.managers.splice(+b.dataset.mgrm, 1);
        return paint();
      }
      const stp = b.closest('[data-st="bn"]');
      if (stp) {
        w.settings.boards.n = Math.max(0, Math.min(32, w.settings.boards.n + +b.dataset.d));
        return paint();
      }
      if (b.dataset.a === 'pickMgr') {
        const r = await A.pickFriends({ multi: true, max: 20, selected: w.managers.map((m) => m.u), title: 'Yönetici seç' });
        if (r) {
          w.managers = r;
          paint();
        }
        return;
      }
      if (b.dataset.a === 'create') {
        const err = A.wiz.validate(w, 2);
        if (err) return A.toast(err, 'err');
        b.disabled = true;
        try {
          const r = await A.rpc('bg_b01_event_create', { p: A.wiz.payload(w) });
          A.toast(kind === 'league' ? 'Lig oluşturuldu.' : 'Turnuva oluşturuldu.', 'ok');
          A.go('/e/' + r.id, true);
        } catch (er) {
          A.toast(A.errText(er), 'err');
          b.disabled = false;
        }
      }
    });
    root.addEventListener('change', (e) => {
      if (e.target.dataset.ssw === 'autoBoards') {
        w.settings.boards.auto = e.target.checked;
        delete w.settings.autoBoards;
        paint();
      }
    });
    paint();
  });
})();

/* ---- events.js ---- */
/* =====================================================================
   B01 — turnuva/lig sayfaları: liste, genel bakış, ağaç, puan durumu, fikstür, katılımcılar,
   yönetim, kura ve otomatik ilerleme (gruplardan eleme, İsviçre turu, lig sonu, tahta dağıtımı)
   ===================================================================== */
(function () {
  'use strict';
  const A = window.B01;
  const E = A.E;
  const BR = A.BR;
  const { esc, ic } = A;
  const KO = ['main', 'third', 'wb', 'lb', 'gf', 'gf2'];
  const OPEN = ['pending', 'ready', 'live'];

  /* ---------------- listeler ---------------- */
  function listPage(kind) {
    return function (root) {
      const lbl = kind === 'league' ? 'Ligler' : 'Turnuvalar';
      root.innerHTML = `<div class="b-page"><div class="b-sec-h"><h1 class="b-h1">${lbl}</h1>${A.canCreate() ? `<a class="b-btn gold" href="#/olustur/${kind}">${ic.plus}${kind === 'league' ? 'Lig kur' : 'Turnuva kur'}</a>` : ''}</div>
        <p class="b-muted" style="margin-top:-4px">${kind === 'league' ? 'Hafta hafta oynanan, puan durumlu ligler.' : 'Tek eleme, çift eleme, gruplar, herkes herkesle ve İsviçre sistemi turnuvalar.'}</p>
        ${A.authed() ? `<section class="b-sec"><h2 class="b-h2" style="margin-bottom:10px">Benim ${kind === 'league' ? 'liglerim' : 'turnuvalarım'}</h2><div class="b-evs" data-mine><p class="b-muted">Yükleniyor…</p></div></section>` : ''}
        <section class="b-sec"><h2 class="b-h2" style="margin-bottom:10px">Herkese açık</h2><div class="b-evs" data-pub><p class="b-muted">Yükleniyor…</p></div></section>
        <section class="b-sec"><h2 class="b-h2" style="margin-bottom:10px">Kodla aç</h2><div class="b-row"><input class="b-input" style="max-width:200px;text-transform:uppercase" maxlength="6" placeholder="Ör. K7Q2MX" data-code><button class="b-btn" type="button" data-a="code">Aç</button></div></section></div>`;
      const fill = (sel, rows, empty) => (A.$(sel, root).innerHTML = rows.length ? rows.map(A.eventRow).join('') : `<p class="b-empty">${empty}</p>`);
      A.rpc('bg_b01_events_list', { p_scope: 'public' })
        .then((r) => fill('[data-pub]', (r || []).filter((e) => e.kind === kind), 'Şu an herkese açık ' + lbl.toLocaleLowerCase('tr') + ' yok.'))
        .catch((e) => (A.$('[data-pub]', root).innerHTML = `<p class="b-empty">${esc(A.errText(e))}</p>`));
      if (A.authed())
        A.rpc('bg_b01_events_list', { p_scope: 'mine' })
          .then((r) => fill('[data-mine]', (r || []).filter((e) => e.kind === kind), 'Henüz yok.'))
          .catch(() => {});
      root.addEventListener('click', async (e) => {
        if (!e.target.closest('[data-a="code"]')) return;
        const code = A.$('[data-code]', root).value.trim();
        if (code.length < 4) return;
        try {
          const d = await A.rpc('bg_b01_event_get', { p_code: code });
          A.go('/e/' + d.event.id);
        } catch (er) {
          A.toast(A.errText(er), 'err');
        }
      });
    };
  }
  A.route('/turnuvalar', listPage('tournament'), { nav: 't' });
  A.route('/ligler', listPage('league'), { nav: 'l' });

  /* ---------------- veri yardımcıları ---------------- */
  function prep(d) {
    d.byId = {};
    d.entries.forEach((t) => (d.byId[t.id] = t));
    d.mById = {};
    d.matches.forEach((m) => (d.mById[m.id] = m));
    d.top = d.matches.filter((m) => !m.parent_id);
    d.kids = {};
    d.matches.filter((m) => m.parent_id).forEach((m) => (d.kids[m.parent_id] = d.kids[m.parent_id] || []).push(m));
    Object.values(d.kids).forEach((l) => l.sort((a, b) => a.slot - b.slot));
    d.manager = !!d.role;
    d.ev = d.event;
    d.rules = rules(d.ev);
    return d;
  }
  function rules(ev) {
    const p = (ev.settings && ev.settings.points) || {};
    if (ev.format === 'swiss') return { w: 1, d: 0.5, l: 0, bye: 1 };
    return { w: p.w == null ? 3 : +p.w, d: p.d == null ? 1 : +p.d, l: +p.l || 0, bye: +p.bye || 0, rules: p.rules || [] };
  }
  const nameOf = (d, id) => (id && d.byId[id] ? d.byId[id].name : '');
  function forStand(d, ms) {
    return ms.map((m) => ({ a: m.a, b: m.b, status: m.status, sa: m.sa, sb: m.sb, la: m.la, lb: m.lb, winner: m.winner, wo: m.wo, round: m.round }));
  }
  A.standingsOf = function (d, filter) {
    const ms = d.top.filter(filter || (() => true));
    const ids = new Set();
    ms.forEach((m) => [m.a, m.b].forEach((x) => x && ids.add(x)));
    const ents = d.entries.filter((t) => ids.has(t.id) || (!filter && t.status === 'active')).map((t) => ({ id: t.id, name: t.name, seed: t.seed }));
    return BR.standings(ents, forStand(d, ms), d.rules, { swiss: d.ev.format === 'swiss' });
  };
  function groupTables(d) {
    const G = {};
    d.top.filter((m) => m.stage === 'group').forEach((m) => (G[m.grp] = true));
    return Object.keys(G)
      .map(Number)
      .sort((a, b) => a - b)
      .map((g) => ({ g, rows: A.standingsOf(d, (m) => m.stage === 'group' && m.grp === g) }));
  }
  function swissRounds(d) {
    const n = d.entries.filter((t) => t.status === 'active').length;
    return d.ev.settings.rounds > 0 ? d.ev.settings.rounds : Math.max(1, Math.ceil(Math.log2(Math.max(2, n))));
  }

  /* ---------------- otomatik ilerleme ---------------- */
  /** Yöneticinin cihazında: sıradaki aşamayı kurar, ligi bitirir, boş tahtalara maç atar. Döner: yeni veri */
  A.autoAdvance = async function (id, d0, opts) {
    opts = opts || {};
    let d = prep(d0 || (await A.rpc('bg_b01_event_get', { p_id: id })));
    if (!d.manager || d.ev.status !== 'live') return d;
    const ev = d.ev;
    const open = d.top.some((m) => OPEN.indexOf(m.status) >= 0);
    const again = async () => prep(await A.rpc('bg_b01_event_get', { p_id: id }));
    const quiet = (p) => p.catch((e) => console.warn('[b01]', e.message));
    if (!open) {
      if (ev.format === 'groups' && ev.phase === 'groups') {
        const tables = groupTables(d).map((x) => x.rows.map((r) => r.id));
        const adv = Math.max(1, ev.settings.advance || 2);
        const seeds = tables.reduce((a, t) => a + Math.min(adv, t.length), 0);
        if (seeds >= 2) {
          const ms = BR.groupKO(tables, adv, { third: !!ev.settings.third }).map((m) => withGame(m, ev));
          await quiet(A.rpc('bg_b01_stage_add', { p_id: id, p_matches: ms, p_phase: 'ko' }));
          A.toast('Gruplar bitti; eleme ağacı kuruldu.', 'ok');
          d = await again();
        }
      } else if (ev.format === 'swiss') {
        const maxR = d.top.reduce((a, m) => Math.max(a, m.round), 0);
        if (maxR < swissRounds(d)) {
          const ents = d.entries.filter((t) => t.status === 'active').map((t) => ({ id: t.id, name: t.name, seed: t.seed }));
          const ms = BR.swissRound(ents, forStand(d, d.top), maxR + 1, d.rules);
          await quiet(A.rpc('bg_b01_stage_add', { p_id: id, p_matches: ms, p_round: maxR + 1 }));
          A.toast(maxR + 1 + '. tur eşleştirildi.', 'ok');
          d = await again();
        } else {
          const st = A.standingsOf(d);
          await quiet(A.rpc('bg_b01_event_finish', { p_id: id, p_winner: st[0] ? st[0].id : null }));
          d = await again();
        }
      } else if (ev.format === 'league' || ev.format === 'rr') {
        const st = A.standingsOf(d);
        await quiet(A.rpc('bg_b01_event_finish', { p_id: id, p_winner: st[0] ? st[0].id : null }));
        d = await again();
      }
    }
    // tahtalar: boş tahtaya sıradaki hazır maç
    const bd = ev.settings.boards || {};
    if (bd.auto && bd.n > 0 && d.ev.status === 'live' && (opts.boards || d.role === 'owner')) {
      const busy = new Set(d.top.filter((m) => m.board && (m.status === 'live' || m.status === 'ready')).map((m) => String(m.board)));
      const waiting = d.top.filter((m) => m.status === 'ready' && !m.board).sort((a, b) => a.round - b.round || a.slot - b.slot);
      let changed = false;
      for (let b = 1; b <= bd.n && waiting.length; b++) {
        if (busy.has(String(b))) continue;
        const m = waiting.shift();
        await quiet(A.rpc('bg_b01_match_board', { p_id: m.id, p_board: String(b) }));
        changed = true;
      }
      if (changed) d = await again();
    }
    return d;
  };
  function withGame(m, ev) {
    const g = BR.gameFor({}, ev.settings.rfe, m);
    if (Object.keys(g).length) m.game = g;
    return m;
  }

  /* ---------------- maç kartı ---------------- */
  A.matchCard = function (d, m) {
    const sm = m.summary || {};
    const live = m.status === 'live';
    const done = m.status === 'done' || m.status === 'bye';
    const side = (id, bye, k) => {
      const nm = id ? nameOf(d, id) : bye ? 'Bay' : 'Belli değil';
      const won = done && m.winner === k;
      const lost = done && m.winner != null && m.winner !== k;
      let sc = '';
      if (m.status === 'done') sc = m.wo ? (won ? 'H' : '–') : (k ? m.sb : m.sa) ?? '';
      else if (live && sm.sc) sc = sm.sc[k] != null ? sm.sc[k] : '';
      return `<span class="b-m-s${won ? ' w' : ''}${lost ? ' l' : ''}${!id ? ' tbd' : ''}"><span class="nm">${esc(nm)}</span><span class="sc">${esc(sc)}</span></span>`;
    };
    const kids = d.kids[m.id];
    const info = live ? '<span class="b-chip live">Canlı</span>' : m.status === 'ready' ? '<span class="b-chip gold">Hazır</span>' : m.status === 'bye' ? 'Bay' : m.status === 'void' ? 'Oynanmadı' : done ? (m.wo ? 'Hükmen' : 'Bitti') : '';
    return `<button type="button" class="b-m ${m.status}" data-m="${esc(m.id)}">
      <span class="b-m-sides">${side(m.a, m.ab, 0)}${side(m.b, m.bb, 1)}</span>
      <span class="b-m-side">${info}${m.board ? `<span>Tahta ${esc(m.board)}</span>` : ''}${kids ? `<span>${kids.filter((k) => k.status === 'done').length}/${kids.filter((k) => k.status !== 'void').length} maç</span>` : ''}</span></button>`;
  };

  /* ---------------- ağaç ---------------- */
  function bracketPart(d, stageList, title) {
    const ms = d.top.filter((m) => stageList.indexOf(m.stage) >= 0);
    if (!ms.length) return '';
    const rounds = {};
    ms.forEach((m) => {
      const key = m.stage === 'third' ? 'third' : m.stage + ':' + m.round;
      (rounds[key] = rounds[key] || []).push(m);
    });
    const keys = Object.keys(rounds).filter((k) => k !== 'third');
    keys.sort((a, b) => {
      const [sa, ra] = a.split(':');
      const [sb, rb] = b.split(':');
      return stageList.indexOf(sa) - stageList.indexOf(sb) || +ra - +rb;
    });
    const cols = keys
      .map((k) => {
        const list = rounds[k].sort((a, b) => a.slot - b.slot);
        const lbl = list[0].label || '';
        return `<div class="b-br-col"><h4>${esc(lbl)}</h4><div class="b-br-ms">${list.map((m) => A.matchCard(d, m)).join('')}</div></div>`;
      })
      .join('');
    const third = rounds.third ? `<div style="margin-top:14px;max-width:230px"><h4 class="b-muted" style="font-size:12.5px;margin:0 0 8px">3.lük Maçı</h4>${A.matchCard(d, rounds.third[0])}</div>` : '';
    return `<div class="b-br-part">${title ? `<h3>${esc(title)}</h3>` : ''}<div class="b-bracket"><div class="b-br-cols">${cols}<svg class="b-br-svg"></svg></div></div>${third}</div>`;
  }
  function drawLines(root, d) {
    A.$$('.b-br-cols', root).forEach((wrap) => {
      const svg = wrap.querySelector('.b-br-svg');
      if (!svg) return;
      const box = wrap.getBoundingClientRect();
      svg.setAttribute('width', wrap.scrollWidth);
      svg.setAttribute('height', wrap.scrollHeight);
      let p = '';
      A.$$('.b-m', wrap).forEach((el) => {
        const m = d.mById[el.dataset.m];
        if (!m || !m.wto) return;
        const t = wrap.querySelector(`.b-m[data-m="${m.wto}"]`);
        if (!t) return;
        const a = el.getBoundingClientRect();
        const b = t.getBoundingClientRect();
        const x1 = a.right - box.left;
        const y1 = a.top + a.height / 2 - box.top;
        const x2 = b.left - box.left;
        const y2 = b.top + (m.ws ? (b.height * 3) / 4 : b.height / 4) - box.top;
        const mx = x1 + (x2 - x1) / 2;
        p += `M${x1},${y1}H${mx}V${y2}H${x2}`;
      });
      svg.innerHTML = p ? `<path d="${p}"/>` : '';
    });
  }

  function standTable(rows, opts) {
    opts = opts || {};
    const bye = rows.some((r) => r.byes);
    const sg = (x) => (x > 0 ? '+' : '') + x;
    return `<div class="b-tablewrap"><table class="b-table"><thead><tr><th>#</th><th class="nm">Ad</th><th title="Oynadığı">O</th><th title="Galibiyet">G</th><th title="Beraberlik">B</th><th title="Mağlubiyet">M</th><th title="Aldığı ${opts.unit || 'leg'}">A</th><th title="Verdiği ${opts.unit || 'leg'}">Y</th><th title="Averaj">Av</th>${opts.legs ? '<th title="Leg farkı">L±</th>' : ''}${opts.swiss ? '<th title="Rakiplerin puan toplamı (Buchholz)">BH</th>' : ''}${bye ? '<th>Bay</th>' : ''}<th>P</th></tr></thead>
      <tbody>${rows
        .map(
          (r, i) => `<tr class="${opts.up && i < opts.up ? 'up' : ''}"><td>${r.rank}</td><td class="nm">${esc(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.f}</td><td>${r.a}</td><td>${sg(r.diff)}</td>${opts.legs ? `<td>${sg(r.ldiff)}</td>` : ''}${opts.swiss ? `<td>${r.bh}</td>` : ''}${bye ? `<td>${r.byes}</td>` : ''}<td class="pt">${r.pts}</td></tr>`
        )
        .join('')}</tbody></table></div><p class="b-hint" style="margin-top:6px">${esc(opts.swiss ? 'Sıralama: puan, Buchholz, averaj, leg farkı.' : BR.TIEBREAK_TEXT)} A/Y: aldığı ve verdiği ${opts.unit || 'leg'}.</p>`;
  }
  function tableOpts(d) {
    const g = d.ev.game || {};
    const fx = d.ev.team_mode === 'fixture';
    const unit = fx ? 'maç' : g.sets > 1 ? 'set' : g.type === 'x01' || g.variant === 'points' ? 'leg' : 'set';
    return { legs: g.sets > 1 || fx, swiss: d.ev.format === 'swiss', unit };
  }
  function fixtureHtml(d, list) {
    const groups = [];
    const idx = {};
    list
      .slice()
      .sort((a, b) => KO.indexOf(a.stage) - KO.indexOf(b.stage) || a.round - b.round || (a.grp || 0) - (b.grp || 0) || a.slot - b.slot)
      .forEach((m) => {
        const k = m.label || m.stage + m.round;
        if (idx[k] == null) {
          idx[k] = groups.length;
          groups.push({ k, items: [] });
        }
        groups[idx[k]].items.push(m);
      });
    return `<div class="b-fixture">${groups.map((g) => `<div class="b-round"><h3>${esc(g.k)}</h3><div class="b-grid">${g.items.map((m) => A.matchCard(d, m)).join('')}</div></div>`).join('')}</div>`;
  }

  /* ---------------- turnuva sayfası ---------------- */
  A.route('/e/:id', function (root, params, query) {
    let d = null;
    let tab = query.t || null;
    let ch = null;
    let destroyed = false;
    let lastRt = Date.now();
    root.innerHTML = '<div class="b-page"><p class="b-muted">Yükleniyor…</p></div>';
    const load = async (auto) => {
      try {
        let raw = await A.rpc('bg_b01_event_get', { p_id: params.id });
        if (destroyed) return;
        d = prep(raw);
        if (auto && d.manager && d.ev.status === 'live') {
          d = await A.autoAdvance(params.id, raw, {});
          if (destroyed) return;
        }
        paint();
      } catch (e) {
        if (!d) root.innerHTML = `<div class="b-page"><div class="b-empty">${esc(A.errText(e))}<br><a class="b-btn" href="#/">Merkeze dön</a></div></div>`;
      }
    };
    const reload = A.debounce(() => load(true), 900);
    function tabsFor() {
      const f = d.ev.format;
      const t = [['genel', 'Genel']];
      if (f === 'se' || f === 'de') t.push(['agac', 'Ağaç']);
      if (f === 'groups') t.push(['gruplar', 'Gruplar'], ['agac', 'Eleme']);
      if (f === 'league' || f === 'rr' || f === 'swiss') t.push(['tablo', 'Puan durumu']);
      t.push(['fikstur', 'Fikstür'], ['kat', d.ev.team_mode === 'single' ? 'Katılımcılar' : 'Takımlar']);
      if (d.manager) t.push(['yonetim', 'Yönetim']);
      return t;
    }
    function paint() {
      const ev = d.ev;
      const tabs = tabsFor();
      if (!tab || !tabs.some((x) => x[0] === tab)) tab = ev.status === 'draft' ? (d.manager ? 'kat' : 'genel') : 'genel';
      const total = d.top.filter((m) => m.status !== 'void' && m.status !== 'bye').length;
      const doneN = d.top.filter((m) => m.status === 'done').length;
      const joined = A.myId() && d.entries.some((t) => (t.members || []).some((m) => m.u === A.myId()));
      const canJoin = ev.status === 'draft' && ev.settings.selfJoin && ev.team_mode === 'single' && A.authed();
      root.innerHTML = `<div class="b-page">
        <header class="b-evhead">
          <div class="b-row wrap"><span class="b-chip">${ev.kind === 'league' ? 'Lig' : esc(A.FMT[ev.format])}</span><span class="b-chip">${esc(E.gameText(ev.game))}</span><span class="b-chip">${esc(E.formatText(ev.game))}</span>
            ${ev.status === 'live' ? `<span class="b-chip ok">Sürüyor · ${doneN}/${total} maç</span>` : ev.status === 'done' ? '<span class="b-chip">Bitti</span>' : '<span class="b-chip gold">Hazırlanıyor</span>'}
            ${ev.visibility === 'link' ? '<span class="b-chip">Gizli</span>' : ''}</div>
          <h1 class="b-h1">${esc(ev.name)}</h1>
          <div class="b-row wrap"><span class="b-muted" style="font-size:13.5px">Kuran: ${esc(ev.owner ? ev.owner.name : '')} · Kod <b class="b-num" style="font-size:17px;letter-spacing:.08em">${esc(ev.code)}</b></span><span class="b-sp"></span>
            ${canJoin ? (joined ? '<button class="b-btn sm ghost" type="button" data-a="leave">Ayrıl</button>' : '<button class="b-btn sm gold" type="button" data-a="join">Katıl</button>') : ''}
            ${ev.status === 'draft' && d.manager ? `<button class="b-btn sm gold" type="button" data-a="start">${ic.shuffle}Kurayı çek ve başlat</button>` : ''}
            <button class="b-btn sm" type="button" data-a="tv">${ic.tv}TV</button>
            <button class="b-btn sm ghost" type="button" data-a="share">${ic.share}Paylaş</button></div>
        </header>
        <nav class="b-tabs" role="tablist">${tabs.map(([k, t]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${esc(t)}</button>`).join('')}</nav>
        <div data-pane></div></div>`;
      const pane = A.$('[data-pane]', root);
      pane.innerHTML = paneHtml();
      if (tab === 'agac') requestAnimationFrame(() => drawLines(pane, d));
      if (tab === 'kat' && d.manager && ev.status === 'draft') bindDraftEntries(pane);
      if (tab === 'yonetim') bindManage(pane);
    }
    function paneHtml() {
      const ev = d.ev;
      if (tab === 'genel') {
        let h = '';
        if (ev.status === 'done') {
          const w = d.byId[ev.winner];
          h += `<div class="b-champ">${ic.trophy}<span class="b-muted" style="font-weight:700">Şampiyon</span><b>${esc(w ? w.name : '—')}</b></div>`;
        }
        if (ev.status === 'draft') {
          h += `<div class="b-empty">${d.manager ? `Katılımcıları ekle, sonra <b>Kurayı çek ve başlat</b>. ${d.entries.length} ${ev.team_mode === 'single' ? 'katılımcı' : 'takım'} var.` : 'Turnuva henüz başlamadı.'}</div>`;
          if (ev.settings.selfJoin && !A.authed()) h += '<p class="b-hint" style="margin-top:8px">Katılmak için giriş yap.</p>';
        }
        const live = d.top.filter((m) => m.status === 'live');
        const ready = d.top.filter((m) => m.status === 'ready');
        const recent = d.top.filter((m) => m.status === 'done').sort((a, b) => String(b.finished_at).localeCompare(String(a.finished_at))).slice(0, 6);
        if (live.length) h += `<section class="b-sec"><h2 class="b-h2" style="margin-bottom:10px">Oynanıyor</h2><div class="b-grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${live.map((m) => A.matchCard(d, m)).join('')}</div></section>`;
        if (ready.length) h += `<section class="b-sec"><h2 class="b-h2" style="margin-bottom:10px">Sıradaki maçlar</h2><div class="b-grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${ready.slice(0, 12).map((m) => A.matchCard(d, m)).join('')}</div>${d.manager ? '<p class="b-hint" style="margin-top:8px">Maça dokun: skoru tut, sonucu gir ya da tahta ata.</p>' : ''}</section>`;
        if (recent.length) h += `<section class="b-sec"><h2 class="b-h2" style="margin-bottom:10px">Son sonuçlar</h2><div class="b-grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${recent.map((m) => A.matchCard(d, m)).join('')}</div></section>`;
        if (ev.status === 'live' && (ev.format === 'league' || ev.format === 'rr' || ev.format === 'swiss')) h += `<section class="b-sec"><h2 class="b-h2" style="margin-bottom:10px">Puan durumu</h2>${standTable(A.standingsOf(d).slice(0, 8), tableOpts(d))}</section>`;
        if (ev.status === 'live' && !live.length && !ready.length && d.top.every((m) => OPEN.indexOf(m.status) < 0)) h += `<p class="b-empty">Bütün maçlar bitti. ${d.manager ? 'Sıradaki aşama birkaç saniye içinde kurulur.' : ''}</p>`;
        return h || '<p class="b-empty">Henüz maç yok.</p>';
      }
      if (tab === 'agac') {
        if (ev.format === 'de') return bracketPart(d, ['wb'], 'Kazananlar tarafı') + bracketPart(d, ['lb'], 'Kaybedenler tarafı') + bracketPart(d, ['gf', 'gf2'], 'Büyük final');
        const h = bracketPart(d, ['main', 'third'], '');
        return h || '<p class="b-empty">Eleme ağacı gruplar bitince kurulur.</p>';
      }
      if (tab === 'gruplar') {
        const t = groupTables(d);
        if (!t.length) return '<p class="b-empty">Gruplar kura çekilince oluşur.</p>';
        return t
          .map((x) => `<section class="b-sec"><h2 class="b-h2" style="margin-bottom:10px">Grup ${BR.groupLetter(x.g)}</h2>${standTable(x.rows, Object.assign(tableOpts(d), { up: ev.settings.advance || 2 }))}
            <details style="margin-top:10px"><summary class="b-label" style="cursor:pointer">Grup maçları</summary><div style="margin-top:10px">${fixtureHtml(d, d.top.filter((m) => m.stage === 'group' && m.grp === x.g))}</div></details></section>`)
          .join('');
      }
      if (tab === 'tablo') return standTable(A.standingsOf(d), tableOpts(d));
      if (tab === 'fikstur') return d.top.length ? fixtureHtml(d, d.top.filter((m) => m.status !== 'bye' || true)) : '<p class="b-empty">Fikstür kura çekilince oluşur.</p>';
      if (tab === 'kat') {
        if (d.manager && ev.status === 'draft') return '<div data-ed></div>';
        return `<div class="b-entries">${d.entries
          .map((t, i) => `<div class="b-entry" style="grid-template-columns:28px minmax(0,1fr) auto"><span class="no">${i + 1}</span><span><b>${esc(t.name)}</b>${t.seed ? ' <span class="b-chip gold">Seribaşı</span>' : ''}${t.status === 'withdrawn' ? ' <span class="b-chip">Çekildi</span>' : ''}
            ${(t.members || []).length > 1 || (t.members || []).some((m) => m.u) ? `<br><span class="b-muted" style="font-size:13px">${t.members.map((m) => esc(m.n) + (m.u ? ' · üye' : '')).join(', ')}</span>` : ''}</span>
            <span class="tools">${t.handicap ? `<span class="b-chip">Başlangıç ${t.handicap}</span>` : ''}${d.manager && ev.status === 'live' && t.status === 'active' ? `<button class="b-btn sm ghost" type="button" data-ren="${esc(t.id)}">Ad</button><button class="b-btn sm danger" type="button" data-wd="${esc(t.id)}">Çekildi</button>` : ''}</span></div>`)
          .join('')}</div>`;
      }
      if (tab === 'yonetim') return manageHtml();
      return '';
    }

    /* ----- taslak: katılımcı ve ayar düzenleme ----- */
    let draft = null;
    function bindDraftEntries(pane) {
      const ev = d.ev;
      if (!draft) {
        draft = A.defaultWizard(ev.kind);
        Object.assign(draft, { name: ev.name, format: ev.format, team_mode: ev.team_mode, visibility: ev.visibility });
        draft.game = Object.assign(draft.game, ev.game);
        draft.settings = Object.assign(draft.settings, JSON.parse(JSON.stringify(ev.settings || {})));
        draft.settings.points = Object.assign({ w: 3, d: 1, l: 0, bye: 0, rules: [] }, draft.settings.points || {});
        draft.settings.boards = draft.settings.boards || { n: 0, auto: false };
        draft.entries = d.entries.map((t) => ({ name: t.name, members: t.members || [], seed: t.seed || 0, handicap: t.handicap || '' }));
      }
      const ed = A.$('[data-ed]', pane);
      const paintEd = (dirty) => {
        if (dirty !== false) draft.dirty = true;
        ed.innerHTML = `${A.wiz.entriesHtml(draft)}
          <details class="b-sec"><summary class="b-h3" style="cursor:pointer">Biçim ve oyun ayarları</summary><div style="margin-top:14px">${A.wiz.formatHtml(draft)}${A.wiz.gameHtml(draft)}${A.wiz.teamHtml(draft)}</div></details>
          <div class="b-wiz-foot"><span class="b-muted" style="align-self:center">${draft.dirty ? 'Kaydedilmemiş değişiklik var.' : ''}</span><button class="b-btn gold" type="button" data-a="saveDraft" ${draft.dirty ? '' : 'disabled'}>${ic.check}Kaydet</button></div>`;
      };
      if (!ed._bound) {
        ed._bound = true;
        A.wiz.bindEntries(ed, draft, paintEd);
        A.wiz.bindSettings(ed, draft, paintEd);
        ed.addEventListener('click', async (e) => {
          const b = e.target.closest('[data-a="saveDraft"]');
          if (!b) return;
          await saveDraft(b);
        });
      }
      paintEd(false);
      ed.addEventListener('input', () => {
        if (!draft.dirty) {
          draft.dirty = true;
          const sb = ed.querySelector('[data-a="saveDraft"]');
          if (sb) sb.disabled = false;
        }
      });
    }
    async function saveDraft(b) {
      const err = A.wiz.validate(draft, 0);
      if (err) return A.toast(err, 'err');
      if (draft.team_mode === 'fixture' && ['se', 'de', 'groups'].includes(draft.format) && draft.settings.fixture.length % 2 === 0) return A.toast('Elemede karşılaşmadaki maç sayısı tek olmalı.', 'err');
      if (b) b.disabled = true;
      try {
        const p = A.wiz.payload(draft);
        await A.rpc('bg_b01_event_update', { p_id: params.id, p: { format: p.format, team_mode: p.team_mode, game: p.game, settings: p.settings } });
        await A.rpc('bg_b01_entries_save', { p_id: params.id, p_entries: p.entries });
        A.toast('Kaydedildi.', 'ok');
        draft = null;
        await load(false);
        return true;
      } catch (e) {
        A.toast(A.errText(e), 'err');
        return false;
      } finally {
        if (b) b.disabled = false;
      }
    }

    /* ----- yönetim ----- */
    function manageHtml() {
      const ev = d.ev;
      const owner = d.role === 'owner' || d.role === 'admin';
      const bd = ev.settings.boards || { n: 0, auto: false };
      const live = d.top.filter((m) => m.status === 'live' || m.status === 'ready');
      return `<section><h2 class="b-h2" style="margin-bottom:10px">Yöneticiler</h2>
          <div class="b-evs">${d.managers.length ? d.managers.map((m) => `<div class="b-ev" style="grid-template-columns:auto 1fr">${A.avatar(m)}<span><h3>${esc(m.name)}</h3><p>@${esc(m.username)}</p></span></div>`).join('') : '<p class="b-muted">Yalnız kurucu yönetiyor.</p>'}</div>
          ${owner ? `<button class="b-btn sm" type="button" data-a="mgr" style="margin-top:10px">${ic.users}Yöneticileri seç</button>` : ''}
          <p class="b-hint" style="margin-top:6px">Yöneticiler maçlarda skor tutar, sonuç girer, tahta atar.</p></section>
        <section class="b-sec"><h2 class="b-h2" style="margin-bottom:10px">Ad ve izleme</h2>
          <div class="b-row wrap"><input class="b-input" style="max-width:360px" data-ename value="${esc(ev.name)}" maxlength="60"><button class="b-btn sm" type="button" data-a="rename">Kaydet</button></div>
          <div class="b-seg" style="margin-top:10px" data-vis><button type="button" data-v="public" aria-pressed="${ev.visibility === 'public'}">Herkese açık</button><button type="button" data-v="link" aria-pressed="${ev.visibility === 'link'}">Gizli (bağlantıyla)</button></div></section>
        <section class="b-sec"><h2 class="b-h2" style="margin-bottom:10px">Tahtalar</h2>
          <div class="b-row wrap" style="gap:12px"><span class="b-label">Tahta sayısı</span><span class="b-stepper" data-bn><button type="button" data-d="-1">−</button><output>${bd.n || 0}</output><button type="button" data-d="1">+</button></span>
          <label class="b-switch" style="padding:0"><input type="checkbox" data-bauto ${bd.auto ? 'checked' : ''}><span>Boş tahtalara kendiliğinden dağıt</span></label></div></section>
        <section class="b-sec"><h2 class="b-h2" style="margin-bottom:10px">TV ekranı</h2>
          <div class="b-share"><p class="b-muted" style="margin:0">TV’de, tablette ya da yayında (OBS) skor tabelasını açar. Giriş gerekmez.</p>
            <div class="b-row wrap"><button class="b-btn sm" type="button" data-a="tv">${ic.tv}Turnuvayı aç</button>
            ${bd.n ? Array.from({ length: bd.n }, (_, i) => `<button class="b-btn sm ghost" type="button" data-tvb="${i + 1}">Tahta ${i + 1}</button>`).join('') : ''}
            <button class="b-btn sm ghost" type="button" data-a="tvlower">Alt bant (OBS)</button><button class="b-btn sm ghost" type="button" data-a="tvcopy">${ic.copy}Bağlantıyı kopyala</button></div>
            ${live.length ? `<div class="b-field" style="margin:6px 0 0"><label>TV’de öne çıkan maç</label><select class="b-select" data-feat><option value="">Kendiliğinden (en son oynanan)</option>${live.map((m) => `<option value="${esc(m.id)}" ${ev.featured === m.id ? 'selected' : ''}>${esc(nameOf(d, m.a) + ' – ' + nameOf(d, m.b))}${m.board ? ' · Tahta ' + esc(m.board) : ''}</option>`).join('')}</select></div>` : ''}</div></section>
        ${ev.status === 'live' && d.top.every((m) => OPEN.indexOf(m.status) < 0) && !(ev.format === 'groups' && ev.phase === 'groups') && !(ev.format === 'swiss' && d.top.reduce((a, m) => Math.max(a, m.round), 0) < swissRounds(d)) ? `<section class="b-sec"><button class="b-btn gold" type="button" data-a="finish">${ic.trophy}Bitir ve şampiyonu ilan et</button></section>` : ''}
        ${owner ? `<section class="b-sec"><h2 class="b-h2" style="margin-bottom:10px">Sil</h2><p class="b-muted">${ev.kind === 'league' ? 'Lig' : 'Turnuva'} ve bütün maçları silinir. Geri alınamaz.</p><button class="b-btn danger" type="button" data-a="delete">${ic.trash}Sil</button></section>` : ''}`;
    }
    function bindManage(pane) {
      pane.addEventListener('change', async (e) => {
        const t = e.target;
        try {
          if (t.dataset.bauto != null) {
            const bd = Object.assign({ n: 0 }, d.ev.settings.boards || {}, { auto: t.checked });
            await A.rpc('bg_b01_event_update', { p_id: params.id, p: { settings: Object.assign({}, d.ev.settings, { boards: bd }) } });
            await load(true);
          } else if (t.dataset.feat != null) {
            await A.rpc('bg_b01_featured', { p_id: params.id, p_match: t.value || null });
            A.toast('TV ekranı bu maçı gösterecek.', 'ok');
          }
        } catch (er) {
          A.toast(A.errText(er), 'err');
        }
      });
    }

    /* ----- maç penceresi ----- */
    function openMatch(id) {
      const m = d.mById[id];
      if (!m) return;
      const ev = d.ev;
      const kids = d.kids[m.id];
      const nm = (x, bye) => (x ? nameOf(d, x) : bye ? 'Bay' : 'Belli değil');
      const g = Object.assign({}, ev.game, m.game);
      const body = A.frag(`<div class="b-grid">
        <div class="b-row wrap"><span class="b-chip">${esc(m.label || '')}</span><span class="b-chip">${esc(E.formatText(g))}</span>${m.board ? `<span class="b-chip">Tahta ${esc(m.board)}</span>` : ''}${m.scorer ? `<span class="b-chip live">Skoru ${esc(m.scorer)} tutuyor</span>` : ''}</div>
        <div class="b-res-top" style="text-align:left"><b>${esc(nm(m.a, m.ab))} – ${esc(nm(m.b, m.bb))}</b>${m.status === 'done' ? `<span class="b-res-score" style="font-size:40px">${m.wo ? 'Hükmen' : m.sa + ' – ' + m.sb}</span>` : ''}</div>
        ${kids ? `<div class="b-grid" style="gap:6px">${kids.map((k) => `<div class="b-row wrap b-card" style="padding:8px 10px"><span class="b-sp"><b>${esc(k.label)}</b> <span class="b-muted">${k.status === 'done' ? (k.winner === 0 ? nm(m.a) : k.winner === 1 ? nm(m.b) : 'Berabere') + ' · ' + k.sa + '-' + k.sb : k.status === 'live' ? 'Oynanıyor' : k.status === 'void' ? 'Oynanmadı' : k.status === 'ready' ? 'Hazır' : 'Bekliyor'}</span></span>
            ${k.status === 'live' || k.status === 'done' ? `<a class="b-btn sm ghost" href="#/izle/${esc(k.id)}">İzle</a>` : ''}${d.manager && (k.status === 'ready' || k.status === 'live') ? `<a class="b-btn sm gold" href="#/skor/${esc(k.id)}">Skor</a>` : ''}${d.manager && k.status === 'done' ? `<button class="b-btn sm ghost" type="button" data-reset="${esc(k.id)}">Geri al</button>` : ''}</div>`).join('')}</div>` : ''}
      </div>`);
      const acts = [];
      if (!kids && (m.status === 'live' || m.status === 'done')) acts.push({ label: 'İzle', kind: 'ghost', onClick: () => A.go('/izle/' + m.id) });
      if (d.manager) {
        if (!kids && (m.status === 'ready' || m.status === 'live')) acts.push({ label: m.status === 'live' ? 'Skora devam et' : 'Skoru tut', kind: 'gold', onClick: () => A.go('/skor/' + m.id) });
        if (m.status === 'ready' || m.status === 'live') {
          acts.unshift({ label: 'Tahta', kind: 'ghost', onClick: () => setBoard(m) });
          acts.unshift({ label: 'Sonucu gir', kind: 'ghost', onClick: () => manualResult(m, g) });
        }
        if (m.status === 'done' && (!kids || m.wo || (m.result && m.result.manual))) acts.unshift({ label: 'Sonucu geri al', kind: 'danger', onClick: () => resetMatch(m) });
      }
      if (!acts.length) acts.push({ label: 'Kapat', kind: 'ghost' });
      const md = A.modal({ title: kids ? 'Takım karşılaşması' : 'Maç', body, actions: acts });
      body.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-reset]');
        if (b) {
          md.close();
          resetMatch(d.mById[b.dataset.reset]);
        }
        if (e.target.closest('a')) md.close();
      });
    }
    async function setBoard(m) {
      const v = await A.prompt('Tahta (boş bırakırsan kaldırılır)', m.board || '');
      if (v == null) return;
      await A.rpc('bg_b01_match_board', { p_id: m.id, p_board: v.trim() });
      A.toast(v.trim() ? 'Tahta atandı; oyunculara bildirim gitti.' : 'Tahta kaldırıldı.', 'ok');
      load(false);
    }
    function manualResult(m, g) {
      const ko = KO.indexOf(m.stage) >= 0;
      const kids = d.kids[m.id];
      const total = g.legMode === 'total';
      const need = kids ? Math.ceil(kids.length / 2) : g.sets > 1 ? g.sets : g.legs;
      const unit = kids ? 'maç' : g.sets > 1 ? 'set' : g.type === 'x01' || g.variant === 'points' ? 'leg' : 'set';
      const body = A.frag(`<div class="b-grid"><p class="b-muted" style="margin:0">${kids ? 'Karşılaşmada kazanılan maç sayılarını yaz.' : total ? `Toplam ${g.legs} ${unit} oynanır.` : `İlk ${need} ${unit} alan kazanır.`}</p>
        <div class="b-row"><span class="b-sp b-ell"><b>${esc(nameOf(d, m.a))}</b></span><input class="b-input" style="width:80px" inputmode="numeric" data-sa value="${total ? '' : ''}"></div>
        <div class="b-row"><span class="b-sp b-ell"><b>${esc(nameOf(d, m.b))}</b></span><input class="b-input" style="width:80px" inputmode="numeric" data-sb></div>
        <div class="b-sec" style="margin-top:6px"><span class="b-label">Ya da hükmen galibiyet</span><div class="b-row wrap" style="margin-top:6px"><button class="b-btn sm ghost" type="button" data-wo="0">${esc(nameOf(d, m.a))} hükmen</button><button class="b-btn sm ghost" type="button" data-wo="1">${esc(nameOf(d, m.b))} hükmen</button></div></div></div>`);
      const send = async (r) => {
        if (m.scorer) r.force = true;
        await A.rpc('bg_b01_match_result', { p_id: m.id, p_result: r });
        A.toast('Sonuç kaydedildi.', 'ok');
        await load(true);
      };
      const md = A.modal({
        title: 'Sonucu gir',
        body,
        actions: [
          { label: 'Vazgeç', kind: 'ghost' },
          {
            label: 'Kaydet',
            kind: 'gold',
            onClick: async () => {
              const sa = parseInt(A.$('[data-sa]', body).value, 10);
              const sb = parseInt(A.$('[data-sb]', body).value, 10);
              if (!Number.isInteger(sa) || !Number.isInteger(sb) || sa < 0 || sb < 0) throw new Error('İki skoru da yaz.');
              if (sa === sb && ko) throw new Error('Eleme maçı berabere bitemez.');
              if (!kids && !total && Math.max(sa, sb) !== need) {
                if (!(await A.confirm('Skor biçime uymuyor', `Bu maçta kazanan ${need} ${unit} almalı. Yine de kaydedilsin mi?`, 'Kaydet'))) return false;
              }
              await send({ winner: sa === sb ? null : sa > sb ? 0 : 1, score: [sa, sb], legs: [sa, sb] });
            },
          },
        ],
      });
      body.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-wo]');
        if (!b) return;
        if (!(await A.confirm('Hükmen', b.textContent.trim() + ' kazanacak. Emin misin?', 'Kaydet'))) return;
        try {
          await send({ wo: true, winner: +b.dataset.wo });
          md.close();
        } catch (er) {
          A.toast(A.errText(er), 'err');
        }
      });
    }
    async function resetMatch(m) {
      if (!(await A.confirm('Sonucu geri al', 'Sonuç silinecek ve maç yeniden oynanabilir olacak. Skorla bittiyse kaldığı yerden açılır.', 'Geri al', 'danger'))) return;
      try {
        await A.rpc('bg_b01_match_reset', { p_id: m.id });
        A.toast('Sonuç geri alındı.', 'ok');
        load(false);
      } catch (e) {
        A.toast(A.errText(e), 'err');
      }
    }

    /* ----- kura ve başlatma ----- */
    async function startFlow() {
      // kaydedilmemiş taslak değişiklikleri önce kaydet
      if (draft && draft.dirty) {
        const ok = await saveDraft(null);
        if (!ok) return;
      }
      const ev = d.ev;
      const act = d.entries.filter((t) => t.status === 'active');
      if (act.length < 2) return A.toast('En az 2 katılımcı gerekli.', 'err');
      if (ev.format === 'groups' && act.length < (ev.settings.groups || 2) * 2) return A.toast(`${ev.settings.groups} grup için en az ${ev.settings.groups * 2} katılımcı gerekli.`, 'err');
      if (ev.team_mode === 'fixture' && (ev.settings.fixture || []).some((f) => f.k === 'd') && act.some((t) => (t.members || []).length < 2)) return A.toast('Çiftler maçı için her takımda en az iki oyuncu olmalı.', 'err');
      let plan;
      const draw = () => {
        const seeded = act.filter((t) => t.seed).sort((a, b) => a.seed - b.seed);
        const rest = BR.shuffle(act.filter((t) => !t.seed));
        const order = seeded.concat(rest).map((t) => t.id);
        const s = ev.settings;
        let ms;
        let groups = null;
        if (ev.format === 'se') ms = BR.single(order, { third: !!s.third });
        else if (ev.format === 'de') ms = BR.double(order, { reset: s.reset !== false });
        else if (ev.format === 'rr') ms = BR.roundRobin(order, { double: !!s.double, stage: 'rr' });
        else if (ev.format === 'league') ms = BR.roundRobin(order, { double: !!s.double, stage: 'league', byeRows: (d.rules.bye || 0) > 0, label: (r) => r + '. Hafta' });
        else if (ev.format === 'groups') {
          const gs = BR.groupStage(order, { groups: s.groups || 2, double: !!s.double });
          ms = gs.matches;
          groups = {};
          gs.groups.forEach((g, gi) => g.forEach((id) => (groups[id] = gi)));
        } else ms = BR.swissRound(act.map((t) => ({ id: t.id, name: t.name, seed: t.seed })), [], 1, d.rules);
        ms = ms.map((m) => withGame(m, ev));
        return { ms, groups, order };
      };
      const previewHtml = (p) => {
        const n = (id) => esc(nameOf(d, id) || 'Bay');
        if (ev.format === 'groups') {
          const G = {};
          Object.keys(p.groups).forEach((id) => (G[p.groups[id]] = G[p.groups[id]] || []).push(id));
          return Object.keys(G).map((g) => `<div class="b-card b-pad"><b>Grup ${BR.groupLetter(+g)}</b><p class="b-muted" style="margin:4px 0 0">${G[g].map(n).join(', ')}</p></div>`).join('');
        }
        const first = p.ms.filter((m) => m.round === 1 && (m.stage === 'main' || m.stage === 'wb' || m.stage === 'rr' || m.stage === 'league' || m.stage === 'swiss'));
        return `<div class="b-grid" style="gap:6px">${first.map((m) => `<div class="b-row b-card" style="padding:8px 12px"><span class="b-sp b-ell">${n(m.a)}</span><b class="b-faint">–</b><span class="b-sp b-ell" style="text-align:right">${m.b ? n(m.b) : '<span class="b-muted">Bay geçer</span>'}</span></div>`).join('')}</div>`;
      };
      plan = draw();
      const body = A.frag(`<div><p class="b-muted" style="margin-top:0">${ev.format === 'groups' ? 'Gruplar' : '1. tur eşleşmeleri'} — beğenmezsen yeniden çek. ${act.some((t) => t.seed) ? 'Seribaşları ayrı tutuldu.' : ''}</p><div data-pv></div></div>`);
      A.$('[data-pv]', body).innerHTML = previewHtml(plan);
      A.modal({
        title: 'Kura',
        body,
        wide: true,
        actions: [
          {
            label: 'Yeniden çek',
            kind: 'ghost',
            onClick: () => {
              plan = draw();
              A.$('[data-pv]', body).innerHTML = previewHtml(plan);
              return false;
            },
          },
          {
            label: 'Başlat',
            kind: 'gold',
            onClick: async () => {
              await A.rpc('bg_b01_start', { p_id: params.id, p_matches: plan.ms, p_groups: plan.groups });
              A.toast(ev.kind === 'league' ? 'Lig başladı.' : 'Turnuva başladı.', 'ok');
              tab = 'genel';
              await load(true);
            },
          },
        ],
      });
    }

    /* ----- olaylar ----- */
    root.addEventListener('click', async (e) => {
      const b = e.target.closest('button, a');
      if (!b) return;
      if (b.dataset.tab) {
        tab = b.dataset.tab;
        history.replaceState(null, '', '#/e/' + params.id + '?t=' + tab);
        return paint();
      }
      if (b.dataset.m) return openMatch(b.dataset.m);
      try {
        if (b.dataset.ren) {
          const t = d.byId[b.dataset.ren];
          const v = await A.prompt('Yeni ad', t.name);
          if (v && v.trim()) {
            await A.rpc('bg_b01_entries_save', { p_id: params.id, p_entries: [{ id: t.id, name: v.trim() }] });
            load(false);
          }
          return;
        }
        if (b.dataset.wd) {
          const t = d.byId[b.dataset.wd];
          if (!(await A.confirm('Turnuvadan çekildi', `${t.name} kalan maçlarını hükmen kaybedecek.`, 'Onayla', 'danger'))) return;
          const r = await A.rpc('bg_b01_withdraw', { p_entry: t.id });
          A.toast(r.walkovers + ' maç hükmen işlendi.', 'ok');
          return load(true);
        }
        if (b.dataset.tvb) return window.open(A.tvUrl('etkinlik=' + params.id + '&tahta=' + b.dataset.tvb), '_blank', 'noopener');
        const pv = b.closest('[data-vis]');
        if (pv && b.dataset.v) {
          await A.rpc('bg_b01_event_update', { p_id: params.id, p: { visibility: b.dataset.v } });
          return load(false);
        }
        const bn = b.closest('[data-bn]');
        if (bn && b.dataset.d) {
          const cur = (d.ev.settings.boards || {}).n || 0;
          const n = Math.max(0, Math.min(32, cur + +b.dataset.d));
          await A.rpc('bg_b01_event_update', { p_id: params.id, p: { settings: Object.assign({}, d.ev.settings, { boards: Object.assign({ auto: false }, d.ev.settings.boards || {}, { n }) }) } });
          return load(true);
        }
        switch (b.dataset.a) {
          case 'start':
            return startFlow();
          case 'join':
          case 'leave':
            if (!A.authed()) return A.login();
            await A.rpc('bg_b01_join', { p_id: params.id, p_join: b.dataset.a === 'join' });
            A.toast(b.dataset.a === 'join' ? 'Katıldın.' : 'Ayrıldın.', 'ok');
            return load(false);
          case 'tv':
            return window.open(A.tvUrl('etkinlik=' + params.id), '_blank', 'noopener');
          case 'tvlower':
            return window.open(A.tvUrl('etkinlik=' + params.id + '&mod=alt'), '_blank', 'noopener');
          case 'tvcopy':
            return A.copy(A.tvUrl('etkinlik=' + params.id));
          case 'share':
            return A.shareModal({ title: d.ev.name, code: d.ev.code, siteUrl: A.siteUrl('etkinlik=' + params.id), tvUrl: A.tvUrl('etkinlik=' + params.id) });
          case 'mgr': {
            const r = await A.pickFriends({ multi: true, max: 20, selected: d.managers.map((m) => m.id), title: 'Yönetici seç' });
            if (!r) return;
            const res = await A.rpc('bg_b01_managers_set', { p_id: params.id, p_users: r.map((x) => x.u) });
            A.toast(res.added ? res.added + ' yöneticiye bildirim gitti.' : 'Yöneticiler güncellendi.', 'ok');
            return load(false);
          }
          case 'rename': {
            const v = A.$('[data-ename]', root).value.trim();
            await A.rpc('bg_b01_event_update', { p_id: params.id, p: { name: v } });
            A.toast('Kaydedildi.', 'ok');
            return load(false);
          }
          case 'finish': {
            const st = A.standingsOf(d);
            let win = null;
            if (d.ev.format === 'se' || d.ev.format === 'de' || d.ev.format === 'groups') {
              const fin = d.top.filter((m) => m.stage === 'main' || m.stage === 'gf' || m.stage === 'gf2').sort((a, b) => b.round - a.round)[0];
              win = fin && fin.winner != null ? (fin.winner ? fin.b : fin.a) : null;
            } else win = st[0] ? st[0].id : null;
            if (!(await A.confirm('Bitir', 'Şampiyon: ' + (nameOf(d, win) || '—'), 'Bitir'))) return;
            await A.rpc('bg_b01_event_finish', { p_id: params.id, p_winner: win });
            return load(false);
          }
          case 'delete':
            if (!(await A.confirm('Sil', d.ev.name + ' silinecek. Geri alınamaz.', 'Sil', 'danger'))) return;
            await A.rpc('bg_b01_event_delete', { p_id: params.id });
            A.toast('Silindi.', 'ok');
            return A.go('/', true);
        }
      } catch (er) {
        A.toast(A.errText(er), 'err');
      }
    });
    window.addEventListener('resize', onResize);
    function onResize() {
      if (tab === 'agac') drawLines(root, d);
    }
    load(true);
    // canlı: turnuvadaki maçlarda değişiklik olunca yenile
    try {
      ch = A.channel('b01e-' + params.id.slice(0, 8) + '-' + Math.random().toString(36).slice(2, 7));
      if (ch)
        ch.on('postgres_changes', { event: '*', schema: 'public', table: 'b01_matches', filter: 'event_id=eq.' + params.id }, () => {
          lastRt = Date.now();
          if (!document.querySelector('.b-modal')) reload();
          else pendingReload = true;
        }).subscribe();
    } catch (e) {}
    // pencere açıkken gelen değişiklik, pencere kapanınca işlenir
    let pendingReload = false;
    const pend = setInterval(() => {
      if (pendingReload && !document.querySelector('.b-modal')) {
        pendingReload = false;
        reload();
      }
    }, 1200);
    const poll = setInterval(() => {
      if (document.visibilityState === 'visible' && Date.now() - lastRt > 20000 && !document.querySelector('.b-modal') && !(draft && draft.dirty && tab === 'kat')) load(true);
    }, 20000);
    return () => {
      destroyed = true;
      clearInterval(poll);
      clearInterval(pend);
      window.removeEventListener('resize', onResize);
      A.unchannel(ch);
    };
  });
})();

window.B01.start();
</script>
</body>
</html>
